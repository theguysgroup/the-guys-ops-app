<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Guys Service Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --ink: #18140f; --ink-soft: #5c534b; --ink-faint: #948a7e;
  --paper: #f2f0eb; --surface: #ffffff; --surface-2: #ece9e2; --surface-3: #ddd8cf;
  --line: #d6d1c6; --line-soft: #e7e3da;
  --primary: #c31f2b; --primary-strong: #8c1620; --primary-soft: #fbe4e2; --primary-teal: #1c1917;
  --accent: #2f5b6e; --accent-soft: #e2edf0;
  --on-primary: #fff8f6;
  --good: #237a52; --good-soft: #dcf0e4; --warn: #96690f; --warn-soft: #f5e8cc; --bad: #b23a22; --bad-soft: #f8ddd2;
  --guy: #c1652e; --dolev: #7a5ca0; --noam: #2f7d6e; --ofek: #3f7f8f;
  --shadow-sm: 0 1px 0 rgba(24,20,15,.06);
  --shadow: 0 1px 0 rgba(24,20,15,.08), 0 1px 2px rgba(24,20,15,.05);
  --shadow-lg: 0 2px 0 rgba(24,20,15,.1), 0 14px 28px rgba(24,20,15,.14);
  --radius: 6px; --radius-sm: 4px; --radius-lg: 10px;
  --focus-ring: 0 0 0 3px rgba(195,31,43,.4);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-7: 32px; --space-8: 40px;
  /* fixed dark chrome for the sidebar — stays constant across light/dark theme, matching the brand mark's own crimson-on-black */
  --sidebar-bg: #17130f; --sidebar-bg-active: #3c1015; --sidebar-bg-hover: #241d19;
  --sidebar-ink: #ece9e2; --sidebar-ink-soft: #a49b8f; --sidebar-ink-faint: #6d655b;
  --sidebar-line: #2c2621; --sidebar-accent: #e2454f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #ece9e2; --ink-soft: #b0a89c; --ink-faint: #756c60;
    --paper: #121010; --surface: #1a1716; --surface-2: #221e1c; --surface-3: #2c2724;
    --line: #363028; --line-soft: #262220;
    --primary: #e2555f; --primary-strong: #f0838a; --primary-soft: #3a1518; --primary-teal: #f3f0ee;
    --accent: #6fa2b8; --accent-soft: #1c2f37;
    --on-primary: #1c0c0d;
    --good: #5fbf8e; --good-soft: #123321; --warn: #d9a94c; --warn-soft: #2e2410; --bad: #e2755a; --bad-soft: #331c14;
    --guy: #e0834a; --dolev: #b092d6; --noam: #5fbfa8; --ofek: #74c3d4;
    --shadow-sm: 0 1px 0 rgba(0,0,0,.35);
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
    --shadow-lg: 0 2px 0 rgba(0,0,0,.45), 0 18px 36px rgba(0,0,0,.5);
    --focus-ring: 0 0 0 3px rgba(226,85,95,.5);
  }
}
::root[data-theme="dark"] {
  --ink: #ece9e2; --ink-soft: #b0a89c; --ink-faint: #756c60;
  --paper: #121010; --surface: #1a1716; --surface-2: #221e1c; --surface-3: #2c2724;
  --line: #363028; --line-soft: #262220;
  --primary: #e2555f; --primary-strong: #f0838a; --primary-soft: #3a1518; --primary-teal: #f3f0ee;
  --accent: #6fa2b8; --accent-soft: #1c2f37;
  --on-primary: #1c0c0d;
  --good: #5fbf8e; --good-soft: #123321; --warn: #d9a94c; --warn-soft: #2e2410; --bad: #e2755a; --bad-soft: #331c14;
  --guy: #e0834a; --dolev: #b092d6; --noam: #5fbfa8; --ofek: #74c3d4;
  --shadow-sm: 0 1px 0 rgba(0,0,0,.35);
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
  --shadow-lg: 0 2px 0 rgba(0,0,0,.45), 0 18px 36px rgba(0,0,0,.5);
  --focus-ring: 0 0 0 3px rgba(226,85,95,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: 'Figtree', system-ui, -apple-system, sans-serif;
  font-size: 14.5px; line-height: 1.5; min-height: 100vh; direction: ltr;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .display { font-family: 'Figtree', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.01em; }
.mono, .num { font-family: 'Figtree', sans-serif; font-variant-numeric: tabular-nums; }
button { font-family: inherit; cursor: pointer; }
a { color: var(--primary-strong); }
::selection { background: var(--primary-soft); }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-5) var(--space-5); box-shadow: var(--shadow); transition: box-shadow .15s, border-color .15s; }
.card.tight { padding: var(--space-4) var(--space-4); }
.card.flat { box-shadow: none; }
.stat-label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; font-family: 'Figtree', sans-serif; }
.stat-value { font-size: 28px; font-weight: 700; margin-top: var(--space-2); font-family: 'Figtree', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; animation: statPop .5s cubic-bezier(.26,1.35,.4,1) .08s both; }
.stat-sub { font-size: 12px; color: var(--ink-soft); margin-top: var(--space-1); }
.stat-card { position: relative; overflow: hidden; padding-inline-start: 22px; transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease; animation: statCardIn .38s cubic-bezier(.2,.85,.25,1) both; }
.stat-card::before { content:''; position:absolute; inset-inline-start:0; top:9px; bottom:9px; width:3px; border-radius: 99px; background: var(--stat-accent, var(--primary-teal)); }
.stat-card::after { content:''; position:absolute; top:-40%; inset-inline-end:-15%; width:110px; height:110px; border-radius:99px; background: var(--stat-accent, var(--primary-teal)); opacity:.05; pointer-events:none; }
.stat-card:hover { border-color: color-mix(in srgb, var(--stat-accent, var(--primary-teal)) 40%, var(--line)); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
@keyframes statCardIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
@keyframes statPop { from { opacity:0; transform: scale(.85); } to { opacity:1; transform: scale(1); } }
.grid-2 > .stat-card:nth-child(2), .grid-3 > .stat-card:nth-child(2), .grid-4 > .stat-card:nth-child(2) { animation-delay: .05s; }
.grid-2 > .stat-card:nth-child(2) .stat-value, .grid-3 > .stat-card:nth-child(2) .stat-value, .grid-4 > .stat-card:nth-child(2) .stat-value { animation-delay: .13s; }
.grid-3 > .stat-card:nth-child(3), .grid-4 > .stat-card:nth-child(3) { animation-delay: .1s; }
.grid-3 > .stat-card:nth-child(3) .stat-value, .grid-4 > .stat-card:nth-child(3) .stat-value { animation-delay: .18s; }
.grid-4 > .stat-card:nth-child(4) { animation-delay: .15s; }
.grid-4 > .stat-card:nth-child(4) .stat-value { animation-delay: .23s; }

.page-head { display:flex; align-items:center; justify-content:space-between; gap: var(--space-4); margin-bottom: var(--space-6); flex-wrap: wrap; }
.page-title { font-size: 28px; margin: 0; font-weight: 700; font-family: 'Oswald', 'Figtree', sans-serif; text-wrap: balance; letter-spacing: -0.005em; text-transform: uppercase; }
.page-sub { color: var(--ink-soft); font-size: 13px; margin-top: var(--space-1); }

.section-title { font-size: 15px; font-weight: 700; margin: var(--space-7) 0 var(--space-3); display: flex; align-items: center; gap: var(--space-2); font-family: 'Figtree', sans-serif; color: var(--ink); text-transform: uppercase; letter-spacing: .03em; }
.section-title .tag { font-size: 11px; font-family: 'Figtree', sans-serif; font-weight: 600; text-transform: none; letter-spacing: normal; color: var(--ink-soft); background: var(--surface-2); padding: 2px 9px; border-radius: 99px; }

table { width: 100%; border-collapse: collapse; font-size: 13.3px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
th { text-align: start; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); padding: 12px 13px; border-bottom: 1px solid var(--line); white-space: nowrap; font-weight: 700; background: var(--surface-2); font-family: 'Figtree', sans-serif; position: sticky; top: 0; z-index: 1; }
td { padding: 11px 13px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background .1s; }
tbody tr:hover { background: var(--surface-2); }
.table-row-avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--avatar-color, var(--primary)); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex: none; }
td.wrap, th.wrap { white-space: normal; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 11.3px; font-weight: 700; white-space: nowrap; border: none; }
.pill::before { content:''; width:6px; height:6px; border-radius:99px; background: currentColor; flex: none; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--surface-3); color: var(--ink-soft); }
.pill.neutral::before { display:none; }
.tech-tag { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 12.6px; }
.tech-dot { width: 21px; height: 21px; border-radius: 99px; flex: none; display: inline-flex; align-items:center; justify-content:center; background: color-mix(in srgb, currentColor 16%, var(--surface)); color: currentColor; font-family:'Figtree',sans-serif; font-size: 9.5px; font-weight: 700; }

select, input, textarea {
  font-family: inherit; font-size: 13px; padding: 8px 11px; border-radius: var(--radius-sm); border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); width: 100%; transition: border-color .12s, box-shadow .12s;
}
select:focus, input:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: var(--focus-ring); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 11.3px; color: var(--ink-soft); font-weight: 600; }
.field .hint { font-size: 11px; color: var(--ink-faint); }
.checkline { display:flex; align-items:center; gap:6px; font-size:12.6px; }
.checkline input[type=checkbox] { width:auto; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600; transition: background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .12s cubic-bezier(.34,1.56,.64,1); white-space: nowrap; }
.btn:hover { background: var(--surface-2); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.96); transition-duration: .07s; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-sm); }
.btn.primary:hover { background: var(--primary-strong); border-color: var(--primary-strong); box-shadow: var(--shadow); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-soft); padding: 6px 9px; }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); transform: translateY(-1px); }
.btn.danger { color: var(--bad); }
.btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-solid:hover { filter: brightness(.92); box-shadow: var(--shadow); }
.btn.small { padding: 5px 11px; font-size: 12px; }

.empty { padding: 44px 20px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
.empty .ic { font-size: 26px; margin-bottom: 9px; opacity: .7; }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 5px; font-family: 'Figtree', sans-serif; font-weight: 700; }

.modal-back { position: fixed; inset: 0; background: rgba(8,18,23,.55); backdrop-filter: blur(2px); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; z-index: 100; overflow-y: auto; animation: fadeIn .12s ease; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-6) var(--space-7); width: 100%; max-width: 680px; box-shadow: var(--shadow-lg); animation: modalIn .28s cubic-bezier(.2,.85,.25,1) both; }
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
@keyframes modalIn { from { opacity:0; transform: translateY(14px) scale(.97);} to { opacity:1; transform:none; } }
.confirm-back { position: fixed; inset: 0; background: rgba(8,18,23,.55); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 300; animation: fadeIn .15s ease; transition: opacity .15s ease; }
.confirm-back.closing { opacity: 0; }
.confirm-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 28px 24px 22px; width: 100%; max-width: 360px; text-align: center; animation: confirmIn .32s cubic-bezier(.2,.9,.2,1.15) both; transition: opacity .12s ease, transform .12s ease; }
.confirm-back.closing .confirm-card { opacity: 0; transform: scale(.94) translateY(4px); }
@keyframes confirmIn { from { opacity:0; transform: scale(.9) translateY(10px); } to { opacity:1; transform: none; } }
.confirm-ic { width: 46px; height: 46px; border-radius: 99px; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 20px; background: var(--bad-soft); color: var(--bad); animation: confirmIcIn .4s cubic-bezier(.34,1.56,.64,1) .05s both; }
.confirm-ic.info { background: var(--accent-soft); color: var(--accent); }
@keyframes confirmIcIn { from { opacity:0; transform: scale(.4); } to { opacity:1; transform: scale(1); } }
.confirm-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; font-family: 'Figtree', sans-serif; }
.confirm-msg { color: var(--ink-soft); font-size: 13px; line-height: 1.5; margin-bottom: 22px; }
.confirm-actions { display: flex; gap: 8px; }
.confirm-actions .btn { flex: 1; }
.modal h2 { margin: 0 0 4px; font-size: 18px; font-family: 'Figtree', sans-serif; }
.modal .modal-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 16px; }
.modal-section { font-size: 11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color: var(--ink-soft); margin: 18px 0 9px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-family: 'Figtree', sans-serif; }
.modal-section:first-of-type { border-top:none; padding-top:0; margin-top:6px; }

.week-chip { flex: none; min-height: 34px; padding: 7px 15px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; transition: background .1s, color .1s, border-color .1s; }
.week-chip.active { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.kv:last-child { border-bottom: none; }
.kv .v { font-family: 'Figtree', sans-serif; font-variant-numeric: tabular-nums; font-weight: 500; }
.kv.total { font-weight: 700; padding-top: 11px; margin-top: 4px; border-top: 1px solid var(--line); border-bottom: none; }
.jobtype-chip { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: var(--radius-sm); background: var(--surface-2); margin-bottom: 6px; font-size: 12.5px; }

.reminder-item { display: flex; gap: 13px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line-soft); transition: max-height .22s ease, opacity .18s ease, transform .18s ease, padding .22s ease, margin .22s ease; }
.reminder-item:last-child { border-bottom: none; }
.reminder-item.row-removing { opacity: 0; transform: translateX(10px); border-color: transparent; }
.reminder-ic { width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex: none; font-size: 14px; }

.grid-2 { display: grid; gap: var(--space-4); grid-template-columns: repeat(2, 1fr); }
.grid-3 { display: grid; gap: var(--space-4); grid-template-columns: repeat(3, 1fr); }
.grid-4 { display: grid; gap: var(--space-4); grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; } .app-grid { grid-template-columns: minmax(0, 1fr) !important; } .sidebar { flex-direction: row !important; overflow-x: auto; border-inline-end:none !important; border-bottom:1px solid var(--line); min-width: 0; } .sidebar nav { display:flex; gap:2px; } .sidebar nav > div { display:flex; align-items:center; } }
@media (max-width: 560px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }
.mobile-nav-toggle { display: none; }
/* Desktop (Ofek 3/10): the sidebar stays in place and scrolls on its own; the page scrolls without dragging it along. */
@media (min-width: 901px) {
  .app-grid { align-items: start; }
  .sidebar { position: sticky !important; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
}
/* true phone widths — collapse the sidebar into a slim top bar with a hamburger toggle instead of the
   cramped horizontal-scrolling nav strip used at tablet widths (900px rule above). */
@media (max-width: 640px) {
  .sidebar { flex-direction: column !important; overflow-x: visible !important; padding: 12px 14px !important; gap: 0 !important; min-width: 0; width: 100%; box-sizing: border-box; }
  .sidebar-topbar { display: flex; align-items: center; gap: 10px; }
  .sidebar-topbar .workspace-card { flex: 1; min-width: 0; margin-bottom: 0; }
  .mobile-nav-toggle { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: var(--radius-sm); border: 1px solid var(--sidebar-line); background: var(--sidebar-bg-hover); color: var(--sidebar-ink); font-size: 16px; flex: none; cursor: pointer; }
  .sidebar-collapsible { display: none; }
  .sidebar.mobile-nav-open .sidebar-collapsible { display: block; margin-top: 12px; }
  .sidebar nav { display: block; }
  .sidebar nav > div { display: block; }
  .app-grid > div:last-child { padding: 16px 14px 40px !important; }
}

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 11px 20px 11px 16px; border-radius: 99px; font-size: 13px; font-weight: 600; z-index: 200; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 9px; animation: toastIn .38s cubic-bezier(.2,.9,.25,1.3) both; transition: opacity .18s ease, transform .18s ease; }
.toast.leaving { opacity: 0; transform: translateX(-50%) translateY(8px) scale(.96); }
.toast::before { content:'✓'; display:flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:99px; background: var(--primary); color: var(--on-primary); font-size:11px; font-weight:800; flex:none; }
@keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(14px) scale(.94); } to { opacity:1; transform: translateX(-50%) translateY(0) scale(1); } }
.banner { background: var(--primary-soft); color: var(--primary-strong); border: 1px solid color-mix(in srgb, var(--primary) 35%, var(--primary-soft)); border-radius: var(--radius-sm); padding: 11px 15px; font-size: 12.5px; margin-bottom: 18px; line-height:1.5; }
.banner.slim { padding: 6px 13px; font-size: 11.3px; margin-bottom: 14px; }

.brand-mark { border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; background: var(--surface); box-shadow: var(--shadow-sm); }
.brand-mark img { width: 100%; height: 100%; object-fit: contain; display:block; }
.login-logo { max-width: 220px; width: 100%; height: auto; display: block; margin: 0 auto 8px; }
@keyframes login-card-in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.login-card { animation: login-card-in .5s cubic-bezier(.2,.7,.2,1) both; }

.subtask-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:13px; }
.subtask-row:last-child { border-bottom:none; }
.subtask-row label { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.subtask-row label input[type=checkbox] { width:auto; flex:none; }
.subtask-row span { overflow-wrap:anywhere; }
.file-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.file-chip { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color: var(--primary-strong); text-decoration:none; background: var(--primary-soft); padding:5px 10px; border-radius: 99px; }
.file-hint { font-size:11px; color: var(--ink-faint); }
.svc-grid { display:grid; grid-template-columns: repeat(2,1fr); gap:6px 14px; }

.cal-grid { display:grid; grid-template-columns: repeat(7,1fr); }

.pipe-body { padding: 11px; display: flex; flex-direction: column; gap: 9px; min-height: 90px; max-height: calc(100vh - 230px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }  /* each column scrolls on its own (Ofek 3/10) */
.pipe-empty { font-size: 11.5px; color: var(--ink-faint); text-align: center; padding: 14px 0; }
.lead-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 7px; transition: border-color .15s ease, box-shadow .15s ease, transform .15s cubic-bezier(.2,.85,.25,1); animation: leadCardIn .3s ease both; }
.lead-card:hover, .lead-card:focus-visible { border-color: var(--primary); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.lead-card.just-moved { animation: leadCardMoved .7s ease; }
@keyframes leadCardIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes leadCardMoved { 0% { box-shadow: 0 0 0 3px var(--primary-soft), var(--shadow-lg); } 100% { box-shadow: var(--shadow); } }
.lead-card-top { display: flex; align-items: center; gap: 8px; }
.lead-card-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-strong); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10.5px; flex: none; }
.lead-name { font-weight: 700; font-size: 13px; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.lead-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.lead-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; white-space: nowrap; color: var(--tag); background: color-mix(in srgb, var(--tag) 15%, var(--surface)); }
.lead-meta { font-size: 11.5px; color: var(--ink-soft); }
.lead-sales-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--good); background: var(--good-soft); border-radius: 99px; padding: 2px 9px; align-self: flex-start; }

.lead-due.overdue { color: var(--bad); background: var(--bad-soft); }

.myday-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.myday-stat { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: start; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-family: inherit; color: var(--ink); }
.myday-stat:hover, .myday-stat:focus-visible { border-color: var(--primary); }

.conv-menu-item:hover:not(:disabled) { background:var(--surface-2); }

/* CRM conversation thread */
.chat-thread { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; padding: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); }

.crm-inbox { display: grid; grid-template-columns: 280px minmax(0,1fr) 280px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; height: 660px; background: var(--surface); box-shadow: var(--shadow); }

.crm-inbox-row-top { display: flex; justify-content: space-between; gap: 6px; }

.crm-inbox-row-time { font-size: 10.5px; color: var(--ink-faint); flex: none; }

.crm-inbox-thread-body { flex: 1; overflow-y: auto; padding: 14px; border-radius: 0; border: none; max-height: none; }
.crm-inbox-composer { border-top: 1px solid var(--line); padding: 10px 14px; flex: none; }
.crm-inbox-details { overflow-y: auto; padding: 14px; background: var(--surface-2); min-width: 0; }
.crm-inbox-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--ink-faint); font-size: 13px; text-align: center; padding: 20px; }
.followup-context-banner { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12.5px; font-weight: 600; margin: 0 0 10px; flex: none; }
@media (max-width: 1100px) { .crm-inbox { grid-template-columns: 240px minmax(0,1fr); height: auto; } .crm-inbox-details { display: none; } }
.crm-inbox-back-btn { display: none; }
.crm-inbox-details-btn { display: none; }
@media (max-width: 1100px) {
  .crm-inbox-details-btn { display: inline-flex; }
  .crm-inbox.show-details .crm-inbox-details { display: block; grid-column: 1 / -1; border-top: 1px solid var(--line); }

/* Below 760px there's only room for one pane at a time — like a phone's messaging app, the list and
   the open conversation are two separate screens, not two columns squeezed together. Default shows the
   list; picking a contact swaps to a full-height thread view with a Back button, via the .has-selection
   class renderCrmInbox toggles based on whether a contact is selected. */
@media (max-width: 760px) {
  .crm-inbox { grid-template-columns: minmax(0,1fr); height: auto; }

  .crm-inbox-back-btn { display: inline-flex; }
}

<script>
'use strict';

/* ── calc engine (ported 1:1 from src/lib/calc.ts — math/logic untouched, only display labels are English) ─ */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function pad2(n){ return String(n).padStart(2,'0'); }
function parseLocalDate(s){ const [y,m,d]=s.slice(0,10).split('-').map(Number); return new Date(y,m-1,d); }
function fmtLocal(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayStr(now){ return fmtLocal(now||new Date()); }
// contacts.created_at is a full UTC timestamp ("2026-09-22T03:15:00+00:00"). Comparing it as a string with a
// plain date drops every lead from the last day of a range and uses the UTC day, not Sydney's —
// so turn it into the local calendar day first. Plain dates (seed data) pass through unchanged.
function localDay(ts){ if (!ts) return ''; const s = String(ts); return s.length<=10 ? s : fmtLocal(new Date(s)); }
function daysBetween(a,b){ return Math.round((b.getTime()-a.getTime())/86400000); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
// Weeks run Sunday → Saturday everywhere in the app — the same weeks Payroll pays by — so a week in
// Financial Summary, Jobs, the Dashboard and Payroll always covers the same seven days.
function weekOf(dateStr){
  const d = parseLocalDate(dateStr);
  const start = new Date(d); start.setDate(d.getDate() - d.getDay());
  const end = new Date(start); end.setDate(start.getDate() + 6);
  const key = fmtLocal(start);
  const label = `${start.getDate()} ${MONTHS[start.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]}`;
  return { key, label, start, end };
}
function monthOf(dateStr){
  const d = parseLocalDate(dateStr);
  const key = `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  const label = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return { key, label };
}
function currentWeekKey(now){ return weekOf(todayStr(now)).key; }
// One rule for money customers owe: amounts include GST, and a job is "late" once more days have passed
// since the job than the payment term in Settings.
function paymentTermDays(data){ const v = (data || (typeof STATE!=='undefined' ? STATE.data : null))?.settings?.unpaidReminderDays; return Number(v ?? 7); }
function jobDaysWaiting(j, today){ return daysBetween(parseLocalDate(j.date), parseLocalDate(today || todayStr())); }
function jobIsLate(j, data, today){ return j.paymentStatus!=='Paid' && jobDaysWaiting(j, today) > paymentTermDays(data); }
function jobGst(job){ return job.includesGST ? round2(job.amount*(STATE.data.settings.gstRatePercent/100)) : 0; }
function jobTotalCollected(job){ return round2(job.amount + jobGst(job)); }
// Pay model (Ofek, Sep 2026): commission = (amount ex-GST − the job's expenses/parts) × %. The one
// exception is an Independent Contractor (Alessandro), who covers his own expenses — his % is taken on
// the full ex-GST amount. job.amount is already ex-GST everywhere in this app (GST sits on top, see jobGst).
function employeeByName(name){ return ((STATE.data && STATE.data.employees) || []).find(e => e.name===name) || null; }
function commissionDeductsParts(techName){ const e = employeeByName(techName); return !(e && e.employmentType==='Independent Contractor'); }
function jobCommissionBase(job){
  const parts = commissionDeductsParts(job.technician) ? (Number(job.partsCost)||0) : 0;
  return Math.max(0, (Number(job.amount)||0) - parts);
}

function technicianNames(data){ return data.employees.filter(e=>e.roles.includes('Technician')).map(e=>e.name); }

/* ── payroll (the Payroll board) ──────────────────────────────────────────
   Weeks run Sunday → Saturday. A technician's commission lands in the week the job was PAID (not the
   week it was done), so a late-paid job shows up in the week its money arrived, flagged as late.
   Hourly staff (Ron) are paid hours × rate + a daily bonus tier on that day's total bookings. */
const PAYROLL_HOURLY_RATE = 10; // AUD per reported hour
const PAYROLL_REMINDERS_FROM = '2026-09-20'; // first week paid through the Payroll board — earlier weeks were paid outside the app
const PAYROLL_BOOKING_BONUS = [ { min:12, bonus:25 }, { min:8, bonus:15 }, { min:5, bonus:10 } ]; // checked top-down
const PAYROLL_HEBREW_NAMES = { Guy:'גיא', Dolev:'דולב', Omri:'עומרי' }; // these people get their pay message in Hebrew; everyone else in English
function bookingBonus(bookings){ const t = PAYROLL_BOOKING_BONUS.find(t => (Number(bookings)||0) >= t.min); return t ? t.bonus : 0; }
function nextBookingTier(bookings){ const n = Number(bookings)||0; const t = PAYROLL_BOOKING_BONUS.slice().reverse().find(t => n < t.min); return t ? { needed: t.min - n, bonus: t.bonus } : null; }

// Money shown in presentation mode is scaled everywhere, including Ron's hourly rate and bonus amounts.
function presentAmt(n){ return (typeof PRESENT!=='undefined' && PRESENT) ? n * PRESENT_FACTOR : n; }
function salesLogPay(l){ return round2(((Number(l.hours)||0) * PAYROLL_HOURLY_RATE + bookingBonus(salesLogBookings(l))) * (typeof PRESENT!=='undefined' && PRESENT ? PRESENT_FACTOR : 1)); }
function payrollWeekOf(dateStr){

}
function shiftPayrollWeek(weekKey, deltaWeeks){ const d = parseLocalDate(weekKey); d.setDate(d.getDate() + 7*deltaWeeks); return fmtLocal(d); }
// "23-29/8", or "30/8-5/9" across a month boundary — the format Ofek's pay messages use.
function payrollRangeText(startStr, endStr){
  const a = parseLocalDate(startStr), b = parseLocalDate(endStr);
  return a.getMonth()===b.getMonth() ? `${a.getDate()}-${b.getDate()}/${b.getMonth()+1}` : `${a.getDate()}/${a.getMonth()+1}-${b.getDate()}/${b.getMonth()+1}`;

function payMoney(n){ return '$' + round2(n).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
function jobPaidDate(j){ return j.datePaid || j.date; }
// Commission-paid people (not owners — they're on a fixed salary) and hourly staff, as payroll rows.
function payrollCommissionPeople(data){ return data.employees.filter(e => e.status==='Active' && e.roles.includes('Technician') && !e.roles.includes('Owner')).map(e=>e.name); }
function payrollHourlyPeople(data){ return data.employees.filter(e => e.status==='Active' && e.employmentType==='Hourly').map(e=>e.name); }
function payrollStatus(data, weekKey, person){
  return (data.payrollWeeks||[]).find(r => r.weekKey===weekKey && r.person===person) || { weekKey, person, cashCollected:false, salaryPaid:false };
}
function computePayrollCommission(data, person, weekKey){
  const wk = payrollWeekOf(weekKey);
  const prevWeekStart = shiftPayrollWeek(wk.start, -1);
  const mine = data.jobs.filter(j => j.technician===person);
  const paid = mine.filter(j => j.paymentStatus==='Paid' && jobPaidDate(j)>=wk.start && jobPaidDate(j)<=wk.end)
    .sort((a,b) => a.date.localeCompare(b.date) || String(a.invoiceNumber||'').localeCompare(String(b.invoiceNumber||'')));
  // A job put on hold ("Stuck") stays out of the week's pay until it is released; it's listed separately.
  const toLine = j => ({ job:j, commission: jobCommissionAmount(j), late: j.date < wk.start, fromLastWeek: j.date < wk.start && j.date >= prevWeekStart });
  const lines = paid.filter(j => j.paidToTechnician!=='Stuck').map(toLine);
  const onHold = paid.filter(j => j.paidToTechnician==='Stuck').map(toLine);
  // "Not paid yet" = this person's jobs done by the end of this week that are still unpaid today — their
  // commission joins whichever week they eventually get paid in.
  const unpaid = mine.filter(j => j.paymentStatus!=='Paid' && j.date <= wk.end).sort((a,b)=>a.date.localeCompare(b.date));
  const cashJobs = paid.filter(j => j.paymentMethod==='Cash');
  // The message header's "(30%)" describes this week's paid jobs; fall back to the unpaid ones only if none were paid.
  const pctSource = lines.length ? lines.map(l => l.job) : unpaid;
  const pcts = Array.from(new Set(pctSource.map(j => Number(j.commissionPercent)||0)));
  return {
    person, week: wk, lines, unpaid,
    total: round2(lines.reduce((s,l)=>s+l.commission,0)),
    onHold, onHoldTotal: round2(onHold.reduce((s,l)=>s+l.commission,0)),
    expected: round2(unpaid.reduce((s,j)=>s+jobCommissionAmount(j),0)),
    cash: round2(cashJobs.reduce((s,j)=>s+jobTotalCollected(j),0)),
    cashJobs, percent: pcts.length===1 ? pcts[0] : null,
  };
}
function computePayrollHourly(data, person, weekKey){
  const wk = payrollWeekOf(weekKey);
  const logs = (data.salesLogs||[]).filter(l => l.person===person && l.date>=wk.start && l.date<=wk.end);
  const days = [];
  for (let i=0; i<7; i++) {
    const d = parseLocalDate(wk.start); d.setDate(d.getDate()+i); const date = fmtLocal(d);
    const l = logs.find(x => x.date===date) || null;
    const bookings = l ? salesLogBookings(l) : 0;
    days.push({ date, log:l, hours: l ? (Number(l.hours)||0) : 0, bookings, bonus: l ? bookingBonus(bookings) : 0, pay: l ? salesLogPay(l) : 0,
      aircon: l ? (Number(l.bookingsAircon)||0) : 0, chimney: l ? (Number(l.bookingsChimney)||0) : 0, pw: l ? (Number(l.bookingsPw)||0) : 0 });
  }
  const worked = days.filter(d => d.hours>0 || d.bookings>0);
  return {
    person, week: wk, days,
    hours: round2(days.reduce((s,d)=>s+d.hours,0)),
    bookings: days.reduce((s,d)=>s+d.bookings,0),
    byDivision: { Aircon: days.reduce((s,d)=>s+d.aircon,0), Chimney: days.reduce((s,d)=>s+d.chimney,0), 'Pressure Washing': days.reduce((s,d)=>s+d.pw,0) },
    bonuses: days.reduce((s,d)=>s+d.bonus,0),

}

    else if (p.unpaid.length>1) out.push(`⚠️ ${p.unpaid.length} jobs are still unpaid - they will be added in the week they're paid (expected commission: ${payMoney(p.expected)})`);

function buildHourlyPayMessage(h){

function shiftDays(dateStr, n){ const d = parseLocalDate(dateStr); d.setDate(d.getDate()+n); return fmtLocal(d); }
// Net profit for any date range = revenue ex-GST − technician commissions − job expenses (parts) −
// marketing (ad_spend) − hourly staff pay (Ron) − owners' fixed weekly salaries
// (prorated per day). The range is capped at today, so "this month" doesn't charge salaries for days
// that haven't happened yet while revenue only runs to date.
function computeNetProfit(data, startDateStr, endDateStr, now){
  const today = todayStr(now);
  const end = endDateStr > today ? today : endDateStr;
  if (end < startDateStr) return { revenue:0, commission:0, parts:0, marketing:0, hourlyStaff:0, owners:0, net:0, days:0, start:startDateStr, end };
  const inRange = d => d>=startDateStr && d<=end;
  const jobs = data.jobs.filter(j => inRange(j.date));
  const revenue = round2(jobs.reduce((s,j)=>s+(Number(j.amount)||0),0));
  const commission = round2(jobs.reduce((s,j)=>s+jobCommissionAmount(j),0));
  const parts = round2(jobs.reduce((s,j)=>s+(Number(j.partsCost)||0),0));
  const marketing = round2((data.adSpend||[]).filter(a=>inRange(a.date)).reduce((s,a)=>s+(Number(a.spend)||0),0));
  const hourlyStaff = round2((data.salesLogs||[]).filter(l=>inRange(l.date)).reduce((s,l)=>s+salesLogPay(l),0));
  const days = daysBetween(parseLocalDate(startDateStr), parseLocalDate(end)) + 1;

/* ── phone calls (Google Ads call reporting, synced daily into ad_calls) ─────────────────────────
   Only calls made through Google's forwarding numbers on the ads are visible today — Google Maps
   listings and people who type the 1300 number off the website aren't tracked until the Twilio stage. */
const GOOGLE_ADS_AIRCON_ACCOUNT = '6569440597';
function callDivision(c){
  if (c.account===GOOGLE_ADS_AIRCON_ACCOUNT) return 'Aircon';
  const name = (c.campaign||'').toLowerCase();
  if (/chimney|fireplace/.test(name)) return 'Chimney';
  if (/air ?con|aircon|duct|split/.test(name)) return 'Aircon';
  return 'Pressure Washing'; // the other account's remaining campaigns are pressure washing / solar
}
function summarizeCalls(calls){

  calls.forEach(c => {
    out.total++;

}
// Dashboard periods. Weeks are Sunday → Saturday, the same as Payroll. The comparison period is the
// same length right before it (for "this month": the same days of last month), capped at today so a
// half-finished period is never compared against a full one.
const DASH_RANGES = [['week','This week'],['lastWeek','Last week'],['month','This month'],['lastMonth','Last month'],['30d','Last 30 days'],['90d','Last 90 days'],['custom','Custom']];
function resolveDashboardRange(ui, now){
  const today = todayStr(now);
  const d = parseLocalDate(today);
  let start, end, unit = null;
  if (ui.range==='week') { const w = payrollWeekOf(today); start = w.start; end = w.end; unit = 'week'; }
  else if (ui.range==='lastWeek') { const w = payrollWeekOf(shiftDays(payrollWeekOf(today).start, -1)); start = w.start; end = w.end; unit = 'week'; }
  else if (ui.range==='lastMonth') { start = fmtLocal(new Date(d.getFullYear(), d.getMonth()-1, 1)); end = fmtLocal(new Date(d.getFullYear(), d.getMonth(), 0)); unit = 'month'; }
  else if (ui.range==='30d' || ui.range==='90d') { const n = ui.range==='30d' ? 30 : 90; start = shiftDays(today, -(n-1)); end = today; }
  else if (ui.range==='custom') { const a = ui.customFrom || today, b = ui.customTo || today; start = a<=b?a:b; end = a<=b?b:a; }
  else { start = fmtLocal(new Date(d.getFullYear(), d.getMonth(), 1)); end = fmtLocal(new Date(d.getFullYear(), d.getMonth()+1, 0)); unit = 'month'; }
  const effEnd = end > today ? today : end;
  const spanDays = Math.max(1, daysBetween(parseLocalDate(start), parseLocalDate(effEnd)) + 1);
  let prevStart;
  if (unit==='week') prevStart = shiftDays(start, -7);
  else if (unit==='month') { const s0 = parseLocalDate(start); prevStart = fmtLocal(new Date(s0.getFullYear(), s0.getMonth()-1, 1)); }
  else prevStart = shiftDays(start, -spanDays);
  let prevEnd = shiftDays(prevStart, spanDays - 1);
  if (prevEnd >= start) prevEnd = shiftDays(start, -1);
  return { start, end, effEnd, prevStart, prevEnd, spanDays };
}

function computeWeek(data, weekKey, technicianFilter){
  const jobs = data.jobs.filter(j => weekOf(j.date).key === weekKey);
  const equip = data.equipmentSpend.filter(e => weekOf(e.date).key === weekKey);
  const overview = { cash:0, bankTransfer:0, creditCard:0, gstCash:0, gstOther:0, paidCount:0, unpaidCount:0, paidTotal:0, unpaidTotal:0, partsTotal:0, equipmentTotal:0, commissionOwedTotal:0, paidToTechTotal:0 };
  jobs.forEach(j => {
    const total = jobTotalCollected(j); const gst = jobGst(j);
    // Money in and GST collected count PAID jobs only — an unpaid job hasn't brought in cash or GST yet.
    if (j.paymentStatus==='Paid') {
      if (j.paymentMethod==='Cash') { overview.cash += total; overview.gstCash += gst; }
      else if (j.paymentMethod==='Bank Transfer') { overview.bankTransfer += total; overview.gstOther += gst; }
      else if (j.paymentMethod==='Credit Card') { overview.creditCard += total; overview.gstOther += gst; }
      overview.paidCount++; overview.paidTotal += j.amount;
    } else { overview.unpaidCount++; overview.unpaidTotal += j.amount; }
    overview.partsTotal += Number(j.partsCost)||0;
    overview.commissionOwedTotal += jobCommissionAmount(j);
  });
  equip.forEach(e => { overview.equipmentTotal += Number(e.cost)||0; });
  const names = technicianFilter ? [technicianFilter] : commissionEligibleTechnicianNames(data);
  const perTech = {};
  names.forEach(t => {
    const tJobs = jobs.filter(j => j.technician===t);
    const tEquip = equip.filter(e => e.technician===t);
    let paidCount=0, unpaidCount=0, netIncome=0;
    const jobTypeBreak = { Aircon:{count:0,total:0}, Chimney:{count:0,total:0}, 'Pressure Washing':{count:0,total:0}, Other:{count:0,total:0} };
    const distinctDays = new Set();
    tJobs.forEach(j => {
      if (j.paymentStatus==='Paid') paidCount++; else unpaidCount++;
      (jobTypeBreak[j.jobType] ||= {count:0,total:0}).count++; jobTypeBreak[j.jobType].total += j.amount;
      distinctDays.add(j.date);
      netIncome += (Number(j.amount)||0) - (Number(j.partsCost)||0);
    });
    // What a technician is owed follows the Payroll rule: commission belongs to the week the job was PAID,
    // so a late-paid job counts once — in the week its money arrived — and "paid" is what Payroll says.
    const pc = computePayrollCommission(data, t, weekKey);
    const st = payrollStatus(data, weekKey, t);
    const commissionPaid = st.salaryPaid ? (st.salaryPaidAmount!=null ? Number(st.salaryPaidAmount)||0 : pc.total) : 0;
    const equipOwed = round2(tEquip.reduce((s,e)=>s+(Number(e.cost)||0),0));
    const equipPaid = round2(tEquip.filter(e=>e.reimbursed==='Reimbursed').reduce((s,e)=>s+(Number(e.cost)||0),0));
    const lateLines = pc.lines.filter(l => l.late);
    const owed = round2(pc.total + equipOwed), paidThisWeek = round2(commissionPaid + equipPaid);
    perTech[t] = {
      owed, paidThisWeek, balanceDue: round2(owed-paidThisWeek),
      commission: pc.total, paidJobs: pc.lines.map(l=>l.job), unpaidJobs: pc.unpaid, expected: pc.expected, unpaidJobsCount: pc.unpaid.length, salaryPaid: !!st.salaryPaid, equipOwed,
      jobTypeBreak, paidCount, unpaidCount, totalJobs: tJobs.length,
      dailyAvg: distinctDays.size ? round2(netIncome/distinctDays.size) : null,
      daysWorked: distinctDays.size, latePaymentTotal: round2(lateLines.reduce((s,l)=>s+l.commission,0)), lateJobs: lateLines.map(l=>l.job),
    };
    overview.paidToTechTotal += perTech[t].paidThisWeek;
  });
  const remainingAfterTech = jobs.reduce((s,j)=>s+(Number(j.amount)||0),0) - overview.commissionOwedTotal - overview.partsTotal - overview.equipmentTotal;
  return { weekKey, jobs, equip, overview, perTech, remainingAfterTech };
}

function computeMonth(data, monthKey, technicianFilter){
  const jobs = data.jobs.filter(j => monthOf(j.date).key===monthKey);
  const equip = data.equipmentSpend.filter(e => monthOf(e.date).key===monthKey);
  let revenue=0, commission=0, parts=0, equipment=0, paidTotal=0, unpaidTotal=0, paidCount=0, unpaidCount=0;
  const names = technicianFilter ? [technicianFilter] : commissionEligibleTechnicianNames(data);
  const perTech = {}; names.forEach(t => perTech[t] = { jobs:0, commission:0 });
  // Additive revenue breakdown, layered on top of `revenue` above rather than replacing it — see
  // jobAttributionTags(): only jobs whose linked lead carries a known Split/Duct or Facebook/Instagram
  // tag land here, everything else still counts once toward the plain `revenue` total, unsplit.
  const airconTypeRevenue = {}; AIRCON_TYPE_TAGS.forEach(t=>airconTypeRevenue[t]=0);
  const metaPlatformRevenue = {}; META_PLATFORM_TAGS.forEach(t=>metaPlatformRevenue[t]=0);
  jobs.forEach(j => {
    revenue += Number(j.amount)||0; commission += jobCommissionAmount(j); parts += Number(j.partsCost)||0;
    if (j.paymentStatus==='Paid') { paidTotal += j.amount; paidCount++; } else { unpaidTotal += j.amount; unpaidCount++; }
    if (perTech[j.technician]) { perTech[j.technician].jobs++; perTech[j.technician].commission += jobCommissionAmount(j); }
    const attr = jobAttributionTags(j);
    if (attr.airconType) airconTypeRevenue[attr.airconType] += Number(j.amount)||0;
    if (attr.metaPlatform) metaPlatformRevenue[attr.metaPlatform] += Number(j.amount)||0;
  });
  equip.forEach(e => equipment += Number(e.cost)||0);
  Object.keys(airconTypeRevenue).forEach(t=>airconTypeRevenue[t]=round2(airconTypeRevenue[t]));
  Object.keys(metaPlatformRevenue).forEach(t=>metaPlatformRevenue[t]=round2(metaPlatformRevenue[t]));
  return { monthKey, jobs, revenue: round2(revenue), commission: round2(commission), parts: round2(parts), equipment: round2(equipment), paidTotal: round2(paidTotal), unpaidTotal: round2(unpaidTotal), paidCount, unpaidCount, perTech, net: round2(revenue-commission-parts-equipment), airconTypeRevenue, metaPlatformRevenue };
}

function computeReminders(data, now){
  const items = []; const today = parseLocalDate(todayStr(now));
  const unpaidReminderDays = data.settings?.unpaidReminderDays ?? 7;
  const dismissed = new Set(data.dismissedReminders||[]);
  data.jobs.forEach(j => {
    if (j.paymentStatus !== 'Paid') {
      const age = daysBetween(parseLocalDate(j.date), today);
      const key = `unpaid:${j.id}`;
      if (age > unpaidReminderDays && !dismissed.has(key)) items.push({ key, readKey:key, type:'unpaid', severity: age>=14?'bad':'warn', date:j.date, contactId:contactForJob(j)?.id||'', title:`${j.customerName} — invoice #${j.invoiceNumber||'—'} still unpaid`, meta:`${j.technician} · ${fmtMoney(jobTotalCollected(j))} incl. GST · ${age} days since the job (the term is ${unpaidReminderDays} days)` });
    }
    const refundKey = `refund:${j.id}`;
    if (j.partsCost > 0 && j.partsRefundStatus === 'Pending Refund' && !dismissed.has(refundKey)) items.push({ key:refundKey, readKey:refundKey, type:'refund', severity:'warn', date:j.date, title:`Parts refund pending for ${j.partsPaidBy||j.technician}`, meta:j.customerName });
  });
  // Technician pay comes from Payroll: one reminder per person for each finished week whose pay isn't
  // marked paid yet (not one per job). Weeks before the Payroll board existed were paid outside the app.
  const payNow = payrollWeekOf(todayStr(now)).start;
  for (let wk = PAYROLL_REMINDERS_FROM; wk < payNow; wk = shiftPayrollWeek(wk, 1)) {
    const range = payrollRangeText(wk, shiftDays(wk, 6));
    payrollCommissionPeople(data).forEach(p => {
      const c = computePayrollCommission(data, p, wk); const key = `payroll:${wk}:${p}`;
      if (c.total > 0 && !payrollStatus(data, wk, p).salaryPaid && !dismissed.has(key)) items.push({ key, readKey:key, type:'commission', weekKey:wk, severity:'warn', date:c.week.end, title:`Pay ${p} for ${range}`, meta:`${fmtMoney(c.total)} commission · not marked paid in Payroll yet` });
    });
    payrollHourlyPeople(data).forEach(p => {
      const h = computePayrollHourly(data, p, wk); const key = `payroll:${wk}:${p}`;
      if (h.total > 0 && !payrollStatus(data, wk, p).salaryPaid && !dismissed.has(key)) items.push({ key, readKey:key, type:'commission', weekKey:wk, severity:'warn', date:h.week.end, title:`Pay ${p} for ${range}`, meta:`${fmtMoney(h.total)} (hours + bonuses) · not marked paid in Payroll yet` });
    });
  }
  data.equipmentSpend.forEach(e => { const key = `equipment:${e.id}`; if (e.reimbursed==='Pending' && !dismissed.has(key)) items.push({ key, readKey:key, type:'equipment', severity:'warn', date:e.date, title:`Equipment reimbursement pending for ${e.technician}`, meta:e.item }); });
  // Repeat-service reminder: fires exactly once, 358 days after a job (365 minus a 7-day lead time),
  // so Ron can call ahead of the 1-year mark to re-offer the service. Computed fresh every render off
  // today's date rather than stored/expired — the day after, the same job's age is 359 and it simply
  // stops matching, giving the "shows for 24h then disappears on its own" behaviour Ofek asked for.
  data.jobs.forEach(j => {
    const jobAge = daysBetween(parseLocalDate(j.date), today);
    const key = `repeat-service:${j.id}`;
    if (jobAge === 358 && !dismissed.has(key)) {
      items.push({ key, readKey:key, type:'repeat-service', contactId: contactForJob(j)?.id || '', severity:'warn', date:todayStr(now), title:`${j.customerName} — re-offer ${j.jobType} service`, meta:`1 year ago this week: ${j.jobType} job done on ${fmtDateShort(j.date)} · call to check if it's time again` });
    }
  });
  // Manually-created reminders (from the CRM follow-up flow) sit alongside the derived ones, so Ron sees
  // one reminder list rather than two competing ones.
  (data.manualReminders||[]).forEach(r => {
    if (r.done) return;
    const age = daysBetween(parseLocalDate(r.date), today);
    if (age < 0) return;   // a reminder shows (and counts) from its day, not before
    items.push({ id:r.id, contactId:r.contactId, manual:true, readKey:`manual:${r.id}`, type:'followup', severity: age>=0?'bad':'warn', date:r.date, title:r.title, meta:`${r.contactName||''}${age>0?` · ${age} days overdue`:(age===0?' · due today':` · due ${fmtDateShort(r.date)}`)}${r.note?` · "${r.note}"`:''}` });
  });
  // A lead's own "Next follow-up" date (set directly on the Details tab or the CRM Inbox panel, not
  // through the "Create follow-up" form) needs to show up here too — otherwise picking a date there
  // silently goes nowhere, which is exactly the kind of dead-end Ofek asked to be caught. Skipped when
  // an explicit reminder or task already tracks that same lead + date, so the two paths never double up.
  (data.contacts||[]).forEach(c => {
    if (!followupDue(c, todayStr(now))) return;
    const hasReminder = (data.manualReminders||[]).some(r => r.contactId===c.id && !r.done && r.date===c.nextFollowUp);
    const hasTask = (data.tasks||[]).some(t => t.client===c.fullName && t.due===c.nextFollowUp && t.status!=='Done');
    if (hasReminder || hasTask) return;
    const age = daysBetween(parseLocalDate(c.nextFollowUp), today);
    items.push({ contactId:c.id, type:'followup', readKey:`followup:${c.id}`, severity: age>=0?'bad':'warn', date:c.nextFollowUp, title:`Follow up with ${c.fullName}`, meta:`${c.division}${age>0?` · ${age} days overdue`:(age===0?' · due today':` · due ${fmtDateShort(c.nextFollowUp)}`)}` });
  });
  // Sales automations (28 Sep): 21+ days in Chasing → decide; a quote untouched for 14+ days → call or move on.
  // The key carries the date the clock started, so "Keep chasing" or a new quote gives a fresh reminder later.
  (data.contacts||[]).forEach(c => {
    if (chaseTooLong(c, now)) {
      const key = `chase-long:${c.id}:${localDay(c.chasingSince)}`;
      if (!dismissed.has(key)) items.push({ key, readKey:key, contactId:c.id, type:'chase-long', severity:'bad', date:localDay(c.chasingSince), title:`${c.fullName} — 21+ days in Chasing, decide`, meta:`${c.division} · chasing since ${fmtDateShort(localDay(c.chasingSince))} · keep chasing or mark Lost (no answer)` });
    }
    // (The "booked, no job yet" reminder was removed on 3 Oct, at Ofek's request.)
    if (quoteStale(c, now)) {
      const key = `stale-quote:${c.id}:${localDay(c.stageChangedAt)}`;
      if (!dismissed.has(key)) items.push({ key, readKey:key, contactId:c.id, type:'stale-quote', severity:'bad', date:localDay(c.stageChangedAt), title:`${c.fullName} — quote idle 14+ days`, meta:`${c.division} · quoted ${fmtDateShort(localDay(c.stageChangedAt))}${c.estimatedValue?` · est. ${fmtMoney(c.estimatedValue)}`:''}` });
    }
  });
  const read = new Set(data.readReminders||[]);
  items.forEach(it => { it.isRead = read.has(it.readKey); });
  items.sort((a,b) => Number(b.severity==='bad') - Number(a.severity==='bad') || a.date.localeCompare(b.date));
  return items;
}

/* ── permissions / types (ported from src/lib/types.ts + permissions.ts) ── */
const ALL_SECTIONS = ['crm','crmOverview','adsGoogle','jobs','finance','payroll','outstanding','reminders','openItems','tasks','reference','closings','settings'];
const SECTION_ORDER = ['myDay','crm','dashboard','crmOverview','adsGoogle','closings','jobs','finance','payroll','outstanding','reminders','openItems','tasks','reference'];
const SECTION_LABEL = { myDay:'My Day', dashboard:'Dashboard', adsGoogle:'Google Ads board', crm:'CRM', crmOverview:'Leads & Marketing', jobs:'Jobs & Commissions', finance:'Financial Summary', payroll:'Payroll', outstanding:'Outstanding', reminders:'Reminders', openItems:'Open Tasks', tasks:'Tasks', reference:'Resources (equipment, employees, suppliers)', closings:'Closings', settings:'Permissions & Settings' };
const ROLE_LABEL = { owner:'Owner', manager:'Manager', technician:'Technician', va:'Virtual Assistant' };
function roleLabel(role){ return ROLE_LABEL[role] || role; }
function defaultPermissionsFor(role){
  const none = { crm:false, crmOverview:false, overview:false, jobs:false, finance:false, payroll:false, outstanding:false, reminders:false, openItems:false, tasks:false, reference:false, closings:false, settings:false };
  if (role==='owner') return { ...none, crm:true, crmOverview:true, overview:true, jobs:true, finance:true, payroll:true, outstanding:true, reminders:true, openItems:true, tasks:true, reference:true, closings:true, settings:true };
  // Manager: everything an owner sees except Settings (permissions/system administration stays owner-only).
  if (role==='manager') return { ...none, crm:true, crmOverview:true, overview:true, jobs:true, finance:true, payroll:true, outstanding:true, reminders:true, openItems:true, tasks:true, reference:true, closings:true, settings:false };
  // Technician: Closings stays OFF by default — posting closings is office-staff/owner work, not something
  // a technician gets automatically (owner can still grant it manually in Settings). CRM is off too:
  // leads/sales are not a technician's job.
  // Payroll: a technician/VA sees only their OWN pay page (renderPayroll routes non-owners to it; RLS
  // limits payroll_weeks/sales_daily_log to their own rows anyway).
  if (role==='technician') return { ...none, overview:true, jobs:true, finance:true, payroll:true, reminders:true, tasks:true };
  // VA (Ron), per Ofek 29 Sep: everything except the owners' dashboards and their personal task boards. So CRM,
  // Closings, Jobs & Commissions (a closing creates/updates a job, which needs Jobs access), Outstanding, Open Tasks,
  // Resources, his own pay, tasks and reminders are ON. Off: Leads & Marketing / Google Ads (dashboards) and the
  // Financial Summary (the business's revenue and profit).
  if (role==='va') return { ...none, crm:true, closings:true, payroll:true, tasks:true, reminders:true, jobs:true, outstanding:true, openItems:true, reference:true };
  return none;
}
function canViewSection(profile, section){
  if (section==='settings') return profile.role==='owner';
  // Employee Views: only the owners (Ofek, Noam) can look at what each worker sees.
  // Dashboard: the whole-business summary (money, marketing, team) — owners/managers only, not grantable.
  if (section==='dashboard') return profile.role==='owner' || profile.role==='manager';
  // My Day: Ron's daily work list, built from the CRM — anyone who works the CRM gets it, nobody else.
  if (section==='myDay') return profile.role==='owner' || profile.role==='manager' || (profile.role==='va' && !!profile.permissions.crm);
  if (profile.role==='owner' || profile.role==='manager') return true;
  return !!profile.permissions[section];
}
function firstAccessibleTab(profile){ return SECTION_ORDER.find(s => canViewSection(profile,s)) || null; }
// Where each person lands: owners/managers on the Dashboard, technicians on their own pay page (My Pay),
// Ron on My Day (his list for today); anyone else on the first section they can open.
function homeTabFor(profile){
  const pref = (profile.role==='owner' || profile.role==='manager') ? 'dashboard' : profile.role==='technician' ? 'payroll' : profile.role==='va' ? 'myDay' : null;
  return (pref && canViewSection(profile, pref)) ? pref : firstAccessibleTab(profile);
}

// Local id for things that live only on screen until saved (list rows, update entries).
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
// Loads everything this person may see from Supabase and reshapes the rows into the objects the screens use
// (job.activityLog, contact.tags, …). All writes go through the db layer below.
async function loadFromSupabase(){
  const uid = AUTH.session?.user?.id;
  if (!uid) throw new Error('No signed-in user');

  // Owner/manager RLS lets this return every team member's row (needed for the Settings page's
  // permission editor, which lists everyone) — a technician/VA's own policy naturally narrows
  // this to just their own row, so this one query is correct for every role without branching.
  const { data: profileRows, error: profileErr } = await sb.from('profiles').select('*');
  if (profileErr) throw profileErr;
  const mine = (profileRows||[]).find(p => p.id === uid);
  if (!mine) { STATE.profiles = []; STATE.currentProfileId = null; STATE.data = null; STATE.noProfile = true; return; }
  STATE.noProfile = false;
  STATE.profiles = (profileRows||[]).map(p => ({ id:p.id, fullName:p.full_name, role:p.role, technicianName:p.technician_name, permissions:p.permissions||{}, onDuty:!!p.on_duty, onDutyDate:p.on_duty_date||null, onDutyChangedAt:p.on_duty_changed_at||null, onBreak:!!p.on_break, onBreakSince:p.on_break_since||null, lastLogoutAt:p.last_logout_at||null, sessionStartedAt:p.session_started_at||null, forgotLogoutOn:p.forgot_logout_on||null }));
  STATE.currentProfileId = mine.id;

  // Every list table is read page by page (fetchAllRows): one request returns at most 1,000 rows, and
  // anything past that used to disappear without a trace. Single-row tables stay as one request.
  const LOAD_NAMES = ['leads','jobs','equipment purchases','equipment catalogue','suppliers','tasks','closings',
    'reminders','tags','deleted reminders','cash status','settings','employees','commission rates',
    'activity history','ad spend','payroll','daily sales log','Google Ads calls','read reminders'];
  const loadResults = await Promise.all([
    fetchAllRows('contacts', 'id'),
    fetchAllRows('jobs', 'id'),
    fetchAllRows('equipment_spend', 'id'),
    fetchAllRows('equipment_catalog', 'id'),
    fetchAllRows('suppliers', 'id'),
    fetchAllRows('tasks', 'id'),
    fetchAllRows('closings', 'id'),
    fetchAllRows('manual_reminders', 'id'),
    fetchAllRows('tag_catalog', 'tag'),
    fetchAllRows('dismissed_reminders', 'key'),
    sb.from('cash_status').select('*').eq('id', 1).maybeSingle(),
    sb.from('settings').select('*').eq('id', 1).maybeSingle(),
    fetchAllRows('employees', 'id'),
    fetchAllRows('commission_rates', 'technician_name'),
    fetchAllRows('activity_log', 'id'),
    // Fed by the ingest-ad-spend Edge Function (Google Ads + Meta Ads daily spend).
    fetchAllRows('ad_spend', 'id'),
    fetchAllRows('payroll_weeks', 'id'),
    fetchAllRows('sales_daily_log', 'id'),
    // Google Ads phone calls (owners/managers only via RLS — everyone else just gets []).
    fetchAllRows('ad_calls', 'id'),
    // Which reminders THIS person has already opened (RLS returns only their own rows).
    fetchAllRows('reminder_reads', 'key'),
  ]);
  const [
    { data: contacts }, { data: jobs }, { data: equipmentSpend }, { data: equipmentCatalog },
    { data: suppliers }, { data: tasks }, { data: closings },
    { data: manualReminders }, { data: tagCatalog }, { data: dismissedReminders },
    { data: cashStatusRow }, { data: settingsRow }, { data: employees }, { data: commissionRateRows },
    { data: activityRows }, { data: adSpendRows }, { data: payrollRows }, { data: salesLogRows }, { data: adCallRows },
    { data: readReminderRows },
  ] = loadResults;
  // A table that failed to load used to look exactly like an empty one. Remember which ones failed so
  // every screen shows a red warning instead of quietly showing partial data.
  STATE.loadErrors = loadResults.map((r, i) => (r && r.error) ? LOAD_NAMES[i] : null).filter(Boolean);
  if (STATE.loadErrors.length) console.error('Load failed for:', loadResults.filter(r => r && r.error).map(r => r.error));

  // Group the shared activity_log table back into each record's own .activityLog[],
  // exactly like the old inline arrays — findRecordByKind()'s kind strings, unchanged.
  const activityByKind = {};
  (activityRows||[]).forEach(a => {
    (activityByKind[a.record_kind] ??= {});
    (activityByKind[a.record_kind][a.record_id] ??= []).push({ id:a.id, at:a.at, actor:a.actor, text:a.text, manual:a.manual });
  });
  const logsFor = (kind, id) => (activityByKind[kind]?.[id]) || [];

  const data = {
    contacts: (contacts||[]).map(c => ({
      id:c.id, fullName:c.full_name, phone:c.phone||'', email:c.email||'', postcode:c.postcode||'',
      division:c.division, source:c.source, status:c.status, createdAt:c.created_at,
      nextFollowUp:c.next_follow_up||'', followupNote:c.followup_note||'', notes:c.notes||'',
      estimatedValue:c.estimated_value||0, salesValue:c.sales_value||0, jobDescription:c.job_description||'',
      linkedJobId:c.linked_job_id, starred:c.starred, lastReadAt:c.last_read_at,
      tags:c.tags||[], messages:c.messages||[], activityLog: logsFor('contact', c.id),
      utmSource:c.utm_source||'', utmMedium:c.utm_medium||'', utmCampaign:c.utm_campaign||'',
      utmTerm:c.utm_term||'', utmContent:c.utm_content||'', landingPage:c.landing_page||'',
      referrerDomain:c.referrer_domain||'', gclid:c.gclid||'', fbclid:c.fbclid||'',
      submissionPage:c.submission_page||'',
      lostReason:c.lost_reason||'', stageChangedAt:c.stage_changed_at||null, chasingSince:c.chasing_since||null,
      chaseCalls:Array.isArray(c.chase_calls)?c.chase_calls:[], chaseRound:Number(c.chase_round)||1, chaseAlertDone:!!c.chase_alert_done, reopenedAt:c.reopened_at||null, contactedAt:c.contacted_at||null, bookedFor:c.booked_for||'',
    })),
    jobs: (jobs||[]).map(j => ({ ...mapJobRow(j), activityLog: logsFor('job', j.id) })),
    equipmentSpend: (equipmentSpend||[]).map(e => ({ ...mapEquipSpendRow(e), activityLog: logsFor('equipment', e.id) })),
    equipmentCatalog: (equipmentCatalog||[]).map(x => ({
      id:x.id, name:x.name, supplierId:x.supplier_id, otherSource:x.other_source||'', price:x.price||0,
      category:x.category||'', description:x.description||'', purchaseDate:x.purchase_date,
    })),
    suppliers: (suppliers||[]).map(s => ({
      id:s.id, name:s.name, supplyType:s.supply_type||'', contactPerson:s.contact_person||'', phone:s.phone||'',
      email:s.email||'', addressWebsite:s.address_website||'', paymentTerms:s.payment_terms||'',
    })),
    tasks: (tasks||[]).map(t => ({ ...mapTaskRow(t), activityLog: logsFor('task', t.id) })),
    closings: (closings||[]).map(mapClosingRow),
    manualReminders: (manualReminders||[]).map(mapManualReminderRow),
    tagCatalog: (tagCatalog||[]).map(t => t.tag),
    dismissedReminders: (dismissedReminders||[]).map(d => d.key),
    readReminders: (readReminderRows||[]).map(r => r.key),
    cashStatus: { amount: cashStatusRow?.amount||0, activityLog: logsFor('cashStatus','main') },
    settings: settingsRow ? mapSettingsRow(settingsRow) : { unpaidReminderDays:7, quoteStaleDays:5, gstRatePercent:10, companyName:'The Guys Service Group', abn:'', defaultPaymentTerms:'', ownerSalaries:{} },
    settingsActivityLog: logsFor('settings','global'),
    employees: (employees||[]).map(e => ({
      id:e.id, name:e.name, roles:e.roles||[], status:e.status, employmentType:e.employment_type||'',
      phone:e.phone||'', email:e.email||'', address:e.address||'', commissionNotes:e.commission_notes||'',
      bankDetails:e.bank_details||'', abn:e.abn||'', startDate:e.start_date, endDate:e.end_date,
      department:e.department||'', contractFile:e.contract_file, passportPhotoFile:e.passport_photo_file,
      licensePhotoFile:e.license_photo_file, localLicenseFile:e.local_license_file,
      activityLog: logsFor('employee', e.id),
    })),
    commissionRates: {},
    adSpend: (adSpendRows||[]).map(a => ({ date:a.date, channel:a.channel, spend:a.spend||0, leadsReported:a.leads_reported })),
    payrollWeeks: (payrollRows||[]).map(mapPayrollRow),
    salesLogs: (salesLogRows||[]).map(mapSalesLogRow),
    adCalls: (adCallRows||[]).map(c => ({ id:c.id, callId:c.call_id, source:c.source, date:c.date, startedAt:c.started_at_local, durationSeconds:Number(c.duration_seconds)||0, status:c.status||'', callType:c.call_type||'', campaign:c.campaign||'', account:c.account||'' })),
  };
  (commissionRateRows||[]).forEach(r => { data.commissionRates[r.technician_name] = r.rates || {}; });

  if (PRESENT) presentScaleData(data);
  STATE.data = data;
}

/* ── db: the write layer (Stage 3, part 2) ───────────────────────────────
   First slice: CRM/contacts + the shared activity_log + the tag catalog +
   dismissed-reminders tables — the rest (jobs, tasks, quotes, closings,
   employees, reference data) are still in-memory-only and come next.
   Every method does an OPTIMISTIC local patch to STATE.data first (so the
   UI feels exactly as instant as it always has), then fires the real
   Supabase write in the background; a failed write shows a toast rather
   than silently losing the change, but does NOT roll back the optimistic
   UI update — simplest correct behavior for a single-user-at-a-time save,
   revisited if this turns out to matter once everyone's really on it. */
function contactPatchToRow(patch){
  const map = {
    fullName:'full_name', phone:'phone', email:'email', postcode:'postcode', division:'division',
    source:'source', status:'status', createdAt:'created_at', nextFollowUp:'next_follow_up',
    followupNote:'followup_note', notes:'notes', estimatedValue:'estimated_value', salesValue:'sales_value',
    jobDescription:'job_description', linkedJobId:'linked_job_id', starred:'starred',
    lastReadAt:'last_read_at', tags:'tags', messages:'messages',
    lostReason:'lost_reason', stageChangedAt:'stage_changed_at', chasingSince:'chasing_since', chaseCalls:'chase_calls', chaseRound:'chase_round', chaseAlertDone:'chase_alert_done',
    reopenedAt:'reopened_at', contactedAt:'contacted_at', bookedFor:'booked_for',
  };
  // date/timestamptz/uuid columns reject '' outright ("invalid input syntax for type date")
  // where the in-memory shape has always used '' to mean "unset" — null is the real "unset".
  const nullIfEmpty = new Set(['created_at','next_follow_up','last_read_at','linked_job_id','stage_changed_at','chasing_since','booked_for']);
  const row = {};
  for (const k in patch) {
    if (!map[k]) continue;
    const col = map[k];
    row[col] = (nullIfEmpty.has(col) && patch[k]==='') ? null : patch[k];
  }
  return row;
}
function jobPatchToRow(patch){
  const map = {
    customerName:'customer_name', invoiceNumber:'invoice_number', date:'date', technician:'technician',
    jobType:'job_type', commissionPercent:'commission_percent', amount:'amount', includesGST:'includes_gst',
    paymentStatus:'payment_status', paymentMethod:'payment_method', partsCost:'parts_cost',
    partsPaidBy:'parts_paid_by', partsRefundStatus:'parts_refund_status', notes:'notes',
    datePaid:'date_paid', paidToTechnician:'paid_to_technician', enteredBy:'entered_by',
    cashConfirmed:'cash_confirmed', invoiceFile:'invoice_file', transferReceiptFile:'transfer_receipt_file',
    equipmentRentalFile:'equipment_rental_file', reviewTaken:'review_taken', reviewDoNotAsk:'review_do_not_ask', contactId:'contact_id',
  };
  const nullIfEmpty = new Set(['date_paid','contact_id']);
  const row = {};
  for (const k in patch) {
    if (!map[k]) continue;
    const col = map[k];
    let v = patch[k];
    if (col==='date' && !v) v = todayStr();   // jobs.date is NOT NULL — the form should always fill it, but never send '' if it somehow doesn't
    if (nullIfEmpty.has(col) && v==='') v = null;
    row[col] = v;
  }
  return row;
}
function taskPatchToRow(patch){
  const map = {
    board:'board', title:'title', status:'status', due:'due', notes:'notes', client:'client', contactId:'contact_id',
    priority:'priority', assignees:'assignees', assignedTo:'assigned_to', headsUp:'heads_up',
    createdBy:'created_by', createdAt:'created_at', technician:'technician', category:'category',
    subtasks:'subtasks', updates:'updates',
  };
  const nullIfEmpty = new Set(['due']);
  const row = {};
  for (const k in patch) {
    if (!map[k]) continue;
    const col = map[k];
    row[col] = (nullIfEmpty.has(col) && patch[k]==='') ? null : patch[k];
  }
  return row;
}
function closingPatchToRow(patch){
  const map = {
    technicianName:'technician_name', date:'date', customerName:'customer_name', invoiceNumber:'invoice_number',
    jobType:'job_type', amount:'amount', includesGST:'includes_gst', paymentStatus:'payment_status',
    paymentMethod:'payment_method', partsCost:'parts_cost', partsPaidBy:'parts_paid_by', notes:'notes',
    invoiceFileUrl:'invoice_file_url', postedBy:'posted_by', createdAt:'created_at', reviewTaken:'review_taken', reviewDoNotAsk:'review_do_not_ask',
    linkedJobId: isRealId(patch.linkedJobId) ? 'linked_job_id' : null,   // see isRealId()'s comment — a still-fake job id from the old client uid() must never reach a uuid column
  };
  const row = {};
  for (const k in patch) { if (map[k]) row[map[k]] = patch[k]; }

// One request returns at most 1,000 rows, so read list tables page by page (ordered by the primary key so
// pages never overlap or skip). A failure returns the error instead of a short list that looks complete.
async function fetchAllRows(table, orderCol){
  const out = []; const size = 1000;
  for (let from = 0; ; from += size) {
    const { data, error } = await sb.from(table).select('*').order(orderCol, { ascending:true }).range(from, from + size - 1);
    if (error) return { data: out, error };
    out.push(...(data||[]));
    if (!data || data.length < size) return { data: out, error: null };
  }
}
// A failed save must never look like it worked: reload the row as it really is in the database, put it
// back on screen, and say clearly that the change was not saved. (Presentation mode blocks every write on
// purpose and its figures are scaled, so there the change just stays on screen with the warning.)
async function restoreAfterFailedSave(listKey, table, id, mapRow, what, error){
  showToast(`Not saved (${what}): ${error.message}. The screen now shows what is really saved.`);
  if (PRESENT || !STATE.data) return;
  const { data: row, error: readErr } = await sb.from(table).select('*').eq('id', id).maybeSingle();
  if (readErr) { showToast(`Not saved (${what}). Reload the page before you continue.`); return; }
  const list = STATE.data[listKey] || (STATE.data[listKey] = []);
  const idx = list.findIndex(x => x.id === id);
  if (!row) { if (idx !== -1) list.splice(idx, 1); render(); return; }
  const fresh = mapRow(row);
  if (idx === -1) list.push({ ...fresh, activityLog: [] });
  else list[idx] = { ...fresh, activityLog: list[idx].activityLog || [] };
  render();
}
// A failed delete puts the item back where it was.
function restoreAfterFailedDelete(listKey, item, what, error){
  showToast(`Not deleted (${what}): ${error.message}`);
  if (item && STATE.data && !(STATE.data[listKey]||[]).some(x => x.id === item.id)) { (STATE.data[listKey] ||= []).push(item); render(); }
}

// Wraps logActivity() for each entity: keeps the exact same in-memory behavior
// (so every existing call site's UI feedback is unchanged) and ALSO persists
// the entry to the shared activity_log table. cashStatus and settings-level
// changes (settings has its own logSettingsActivity) still call plain
// logActivity() and stay in-memory-only until their own write layer lands.
function logContactActivity(c, actor, text){
  logActivity(c, actor, text);
  if (c?.id) db.activityLog.insert('contact', c.id, actor, text);
  if (!/^(Lead created|Linked to job)/.test(text)) markLeadContacted(c);
}
// The first time anyone on the team acts on a lead after it came in (or came back): a reply, a logged call, a note,
// a stage / tag / follow-up change, "called today". Saved on the lead, so the red "new lead waiting" alert disappears
// for everyone at once (Ofek, 29 Sep). Just opening the lead doesn't count.
function markLeadContacted(c){
  if (!c || !c.id) return;
  const at = leadArrivedAt(c);
  if (c.contactedAt && (!at || new Date(c.contactedAt).getTime() >= new Date(at).getTime())) return;
  c.contactedAt = new Date().toISOString();
  db.contacts.update(c.id, { contactedAt: c.contactedAt });
}
function logJobActivity(job, actor, text){
  logActivity(job, actor, text);
  if (job?.id) db.activityLog.insert('job', job.id, actor, text);
}
function logTaskActivity(task, actor, text){
  logActivity(task, actor, text);
  if (task?.id) db.activityLog.insert('task', task.id, actor, text);
}
function logEmployeeActivity(emp, actor, text){
  logActivity(emp, actor, text);
  if (emp?.id) db.activityLog.insert('employee', emp.id, actor, text);

function filterForProfile(data, profile){
  if (profile.role==='owner' || profile.role==='manager') return data;
  const canSeeJobs = profile.permissions.jobs || profile.permissions.finance;
  // equipmentSpend also feeds the Equipment & Suppliers quick-entry feed on the Closings page (item 7),
  // so it needs to be visible under the `closings` permission too, not just jobs/finance.
  const canSeeEquipmentSpend = canSeeJobs || profile.permissions.closings;
  const jobVisible = (name) => { if (!canSeeJobs) return false; if (profile.role==='technician') return name===profile.technicianName; return true; };
  const equipVisible = (name) => { if (!canSeeEquipmentSpend) return false; if (profile.role==='technician') return name===profile.technicianName; return true; };
  return {
    ...data,
    jobs: data.jobs.filter(j => jobVisible(j.technician)),
    equipmentSpend: data.equipmentSpend.filter(e => equipVisible(e.technician)),
    // Both the "Ron's Tasks" and "My Tasks" boards are gated by the same `tasks` permission flag —
    // which board is showing, and whether it's filtered to just this person, is a rendering concern
    // (see UI.tasks.board / UI.tasks.filterMode), not a data-visibility one.
    tasks: !profile.permissions.tasks ? [] : profile.role==='va' ? data.tasks.filter(t => t.board!=='mine') : data.tasks,
    contacts: (profile.permissions.crm || profile.permissions.crmOverview) ? data.contacts : [],
    equipmentCatalog: profile.permissions.reference ? data.equipmentCatalog : [],
    suppliers: profile.permissions.reference ? data.suppliers : [],
    closings: profile.permissions.closings ? data.closings : [],
  };
}

   There's no real backend yet (that's Stage 3) — this just keeps a browser tab's edits alive across
   a refresh instead of silently reseeding, by mirroring STATE.data into localStorage. It's still

/* ── Supabase (Stage 3 real backend) ─────────────────────────────────────
   The anon/publishable key below is meant to be public — it identifies the
   project, not a secret. Row Level Security on the database side (see

    else if (e.kind==='break_start' && inShift && !inBreak) { inBreak = true; bStart = t; }
    else if (e.kind==='break_end' && inBreak) { inBreak = false; breakMs += t - bStart; breaks.push({ from: new Date(bStart).toISOString(), to: e.at }); }
    else if (e.kind==='shift_end' && inShift) { if (inBreak) { inBreak = false; breakMs += t - bStart; breaks.push({ from: new Date(bStart).toISOString(), to: e.at }); } inShift = false; shiftMs += t - segStart; end = e.at; }
  });
  const until = isToday ? nowMs : last;
  if (inBreak) { breakMs += until - bStart; breaks.push({ from: new Date(bStart).toISOString(), to: null }); }
  if (inShift) shiftMs += until - segStart;
  const workedMins = Math.max(0, Math.round(shiftMs / 60000));
  return { start, end, breaks, breakMins: Math.round(breakMs / 60000), workedMins, open: inShift, onBreak: inBreak, hours: Math.round(workedMins / 15) / 4 };
}

/* ── generic table pagination — shared by any long list (Jobs, CRM table, Outstanding, …) so a growing
   table never becomes an unbounded scroll. `ns` is the UI.<namespace> object holding {page, pageSize}
   for that one table; clamps page back into range itself (e.g. after a filter shrinks the result set),
   so callers never need to reset it by hand. */
const PAGE_SIZE_OPTIONS = [25, 50, 100, 250];
function paginateRows(rows, ns, defaultPageSize){
  const pageSize = ns.pageSize || defaultPageSize || 25;
  const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  const page = Math.min(Math.max(1, ns.page || 1), totalPages);
  ns.page = page;
  const startIdx = (page - 1) * pageSize;
  return { pageItems: rows.slice(startIdx, startIdx + pageSize), page, totalPages, pageSize, total: rows.length };
}
// setPageFn/setPageSizeFn are the names of single-argument global functions the caller defines for its
// own table (e.g. "setJobsPage"/"setJobsPageSize") — keeps each table's page state update going through
// whatever refresh path that table already uses (a full render(), or a fast partial-DOM refresh like
// Jobs' refreshJobsTable(), which column-filter typing also relies on).
function renderPager(page, totalPages, total, pageSize, setPageFn, setPageSizeFn){
  if (!total) return '';

    <div style="display:flex;align-items:center;gap:6px">
      <select style="width:auto" onchange="${setPageSizeFn}(this.value)">${PAGE_SIZE_OPTIONS.map(n=>`<option value="${n}" ${pageSize===n?'selected':''}>${n} / page</option>`).join('')}</select>
      <button class="btn ghost small" ${page<=1?'disabled':''} onclick="${setPageFn}(${page-1})">Prev</button>
      <button class="btn ghost small" ${page>=totalPages?'disabled':''} onclick="${setPageFn}(${page+1})">Next</button>
    </div>

}

function renderDatePickerPopup(anchorEl, year, month, currentValue, onSelect){
