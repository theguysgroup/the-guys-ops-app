async function saveTaskModal(taskId, createdBy, createdAt){
  const title = document.getElementById('tm-title').value.trim();
  if (!title) { modalError('Please enter a title'); return; }
  const currentProfile = getCurrentProfile();
  const actor = currentProfile?.fullName || 'Unknown';
  const oldTask = taskId ? STATE.data.tasks.find(t=>t.id===taskId) : null;
  const oldSnapshot = oldTask ? { status:oldTask.status, priority:oldTask.priority, due:oldTask.due, assignees: assigneeNames(oldTask), subtasks: (oldTask.subtasks||[]).map(s=>({id:s.id, status:s.status||(s.done?'Done':'Not Started')})) } : null;
  const assignees = Array.from(document.querySelectorAll('.tm-assignee-cb:checked')).map(cb=>cb.value);
  const newSubtasks = MODAL_SUBTASKS.map(s=>({...s}));
  const values = {
    board: UI.tasks.board, title, status: document.getElementById('tm-status').value, due: document.getElementById('tm-due').value,
    headsUp: document.getElementById('tm-headsup').value,
    notes: document.getElementById('tm-notes').value, client: document.getElementById('tm-client').value.trim(),
    contactId: (document.getElementById('tm-contact-id')||{}).value || null,
    priority: document.getElementById('tm-priority').value, assignees,
    technician: document.getElementById('tm-technician').value, category: document.getElementById('tm-category').value,
    createdBy, createdAt, subtasks: newSubtasks, updates: MODAL_UPDATES.map(u=>({...u})),
  };
  let task;
  if (taskId) { task = oldTask; const { updates, ...fields } = values; db.tasks.update(task.id, fields); }
  else {
    try { task = await db.tasks.create({ activityLog:[], ...values }); }
    catch (err) { return; }   // db.tasks.create() already showed an error toast; leave the modal open so the user can retry
  }
  // Auto-generated activity log — mirrors Monday's Activity Log: every tracked field change gets its
  // own timestamped, attributed entry, independent of the manual Updates thread above.
  if (oldSnapshot) {
    if (oldSnapshot.status !== values.status) logTaskActivity(task, actor, `Status changed from "${oldSnapshot.status}" to "${values.status}"`);
    if ((oldSnapshot.priority||'') !== (values.priority||'')) logTaskActivity(task, actor, `Priority changed from "${oldSnapshot.priority||'—'}" to "${values.priority||'—'}"`);
    if ((oldSnapshot.due||'') !== (values.due||'')) logTaskActivity(task, actor, `Due date changed from "${oldSnapshot.due||'—'}" to "${values.due||'—'}"`);
    const addedPeople = assignees.filter(a=>!oldSnapshot.assignees.includes(a));
    const removedPeople = oldSnapshot.assignees.filter(a=>!assignees.includes(a));
    addedPeople.forEach(p=>logTaskActivity(task, actor, `${p} was assigned`));
    removedPeople.forEach(p=>logTaskActivity(task, actor, `${p} was unassigned`));
    newSubtasks.forEach(s => {
      const before = oldSnapshot.subtasks.find(b=>b.id===s.id);
      if (before && before.status !== s.status) logTaskActivity(task, actor, `Subtask "${s.text}" status changed to "${s.status}"`);
      else if (!before) logTaskActivity(task, actor, `Subtask "${s.text}" added`);
    });
  } else {
    logTaskActivity(task, actor, 'Task created');
  }
  closeModal(); showToast(taskId?'Task updated':'Task added'); render();
}

async function commitCashAmountEdit(rawValue){
  if (!STATE.data.cashStatus) STATE.data.cashStatus = { amount:0, activityLog:[] };
  const old = STATE.data.cashStatus.amount;
  const newVal = Number(rawValue)||0;
  if (old === newVal) { render(); return; }
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const text = `Cash status changed from ${fmtMoney(old)} to ${fmtMoney(newVal)}`;
  STATE.data.cashStatus.amount = newVal;
  logActivity(STATE.data.cashStatus, actor, text);
  render();
  const { error } = await sb.from('cash_status').upsert({ id:1, amount:newVal });
  if (error) {
    showToast('Cash status not saved: '+error.message);
    if (!PRESENT) { STATE.data.cashStatus.amount = old; STATE.data.cashStatus.activityLog.pop(); render(); }

let EMP_RENAME_OK = false;
async function saveEmployeeModal(empId){
  const name = document.getElementById('em-name').value.trim();
  if (!name) { modalError('Please enter a name'); return; }
  // A new name has to follow the person everywhere they appear by name (jobs, payroll, daily log, closings,
  // equipment, tasks, their login) — otherwise their history "disconnects". Ask first, then rename it all at once.
  const renaming = empId && (STATE.data.employees.find(e=>e.id===empId)?.name || name) !== name;
  if (renaming && !EMP_RENAME_OK) {
    const oldN = STATE.data.employees.find(e=>e.id===empId).name;
    confirmAction(`Rename ${oldN} to ${name}? Their jobs, payroll, daily log, closings, equipment, tasks and login all move to the new name, so no history is lost.`,
      () => { EMP_RENAME_OK = true; saveEmployeeModal(empId); }, { danger:false, title:'Rename team member', confirmLabel:'Rename everywhere' });
    return;
  }
  EMP_RENAME_OK = false;
  const isOwner = document.getElementById('em-owner').checked, isManager = document.getElementById('em-manager').checked, isTech = document.getElementById('em-tech').checked, isVA = document.getElementById('em-va').checked;
  const roles = [...(isOwner?['Owner']:[]), ...(isManager?['Manager']:[]), ...(isTech?['Technician']:[]), ...(isVA?['VA']:[])];
  const prev = empId ? STATE.data.employees.find(e=>e.id===empId) : null;
  const oldName = prev?.name;
  const oldRates = oldName ? STATE.data.commissionRates[oldName] : null;
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const values = {
    name, roles, status: document.getElementById('em-status').value, employmentType: document.getElementById('em-emptype').value,
    phone: document.getElementById('em-phone').value.trim(), email: document.getElementById('em-email').value.trim(),
    address: document.getElementById('em-address').value.trim(), abn: document.getElementById('em-abn').value.trim(),
    startDate: document.getElementById('em-startdate').value, endDate: document.getElementById('em-enddate').value,
    bankDetails: document.getElementById('em-bank').value.trim(), commissionNotes: document.getElementById('em-commissionnotes').value,
    contractFile: MODAL_FILES['em-contractFile'] ?? job_or_null(prev,'contractFile'),
    passportPhotoFile: MODAL_FILES['em-passportPhotoFile'] ?? job_or_null(prev,'passportPhotoFile'),
    licensePhotoFile: MODAL_FILES['em-licensePhotoFile'] ?? job_or_null(prev,'licensePhotoFile'),
    localLicenseFile: MODAL_FILES['em-localLicenseFile'] ?? job_or_null(prev,'localLicenseFile'),
  };
  let emp;
  if (prev && oldName && oldName!==name) {
    if (readOnlyReason()) { showToast(readOnlyReason()); return; }
    const { data: moved, error: renameErr } = await sb.rpc('rename_team_member', { p_old: oldName, p_new: name });
    if (renameErr) { modalError('Could not rename: '+renameErr.message); return; }
    logEmployeeActivity(prev, actor, `Renamed from "${oldName}" to "${name}" everywhere (${Object.entries(moved||{}).filter(([,n])=>n).map(([k,n])=>`${n} ${k.replace('_',' ')}`).join(', ') || 'no linked records'})`);
  }
  if (prev) { emp = prev; await db.employees.update(emp.id, values); }
  else {
    try { emp = await db.employees.create({ activityLog:[], ...values }); }
    catch (err) { return; }   // db.employees.create() already showed an error toast; leave the modal open so the user can retry
  }
  if (isTech) {
    const rates = { Aircon: document.getElementById('em-aircon').value===''?null:Number(document.getElementById('em-aircon').value), Chimney: document.getElementById('em-chimney').value===''?null:Number(document.getElementById('em-chimney').value), 'Pressure Washing': document.getElementById('em-pw').value===''?null:Number(document.getElementById('em-pw').value), Other: document.getElementById('em-other').value===''?null:Number(document.getElementById('em-other').value) };
    if (oldName && oldName!==name && STATE.data.commissionRates[oldName]) await db.commissionRates.remove(oldName);
    await db.commissionRates.set(name, rates);
    if (prev && oldRates) {
      ['Aircon','Chimney','Pressure Washing','Other'].forEach(jt => {
        const before = oldRates[jt] ?? null, after = rates[jt] ?? null;
        if (before !== after) logEmployeeActivity(emp, actor, `${jt} commission rate changed from ${before===null?'—':before+'%'} to ${after===null?'—':after+'%'}`);
      });
    }
  }
  if (!prev) logEmployeeActivity(emp, actor, 'Employee added');
  closeModal(); showToast(empId?'Employee updated':'Employee added');
  if (prev && oldName && oldName!==name) { await loadFromSupabase(); }   // every screen now shows the new name
  render();
}

  const techs = STATE.data.employees.filter(e=>e.roles.includes('Technician') && !e.roles.includes('Owner'));
  const techCards = techs.length ? techs.map(renderTechnicianSettingsCard).join('') : emptyState('No technicians yet');
  const s = STATE.data.settings;
  return `
    <div class="page-head">
      <div><h1 class="page-title">Permissions &amp; Settings</h1><div class="page-sub">Decide exactly what each person sees — including Ron, whenever you choose. A change reaches that person the next time they open or refresh the app.</div></div>
      <span style="display:flex;gap:8px">
        <button class="btn ghost small" onclick="exportDataAsJson()">⬇️ Export all data (JSON)</button>
        <button class="btn ghost small" onclick="openSettingsActivityModal()">💬 Settings activity</button>
      </span>
    </div>
    <div class="banner">Manager accounts automatically see everything an owner sees except this Settings page, so they aren't listed below.</div>

    <div class="section-title">Access permissions</div>
    ${cards}

    <div class="section-title">Phone</div>
    ${renderPhoneSettings(s)}
    ${renderChatSettings(s)}

    <div class="section-title">CRM Settings</div>
    <div class="card">
      <div style="font-family:'Figtree',sans-serif;font-weight:700;font-size:15.5px;margin-bottom:4px">Tags</div>
      <div class="hint" style="margin-bottom:12px">Every tag used across CRM leads — add one before assigning it, or delete one to remove it everywhere and from the tag filter.</div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <input id="new-tag-input" placeholder="New tag name…" onkeydown="if(event.key==='Enter'){event.preventDefault();addCatalogTag();}">
        <button type="button" class="btn" onclick="addCatalogTag()">Add</button>
      </div>
      <div id="manage-tags-list" style="max-height:280px;overflow-y:auto">${renderManageTagsList()}</div>
    </div>

    <div class="section-title">Technician commission rates &amp; working days</div>
    ${techCards}

    <div class="section-title">Owner salaries</div>
    <div class="hint" style="margin-bottom:10px">Fixed weekly wage, not commission — visible only here, to owners.</div>
    <div class="card" style="margin-bottom:14px">
      <div class="grid-3">
        ${owners.map(o => `<div class="field"><label>${esc(o.fullName)} — weekly ($)</label><input type="number" min="0" value="${(s.ownerSalaries||{})[o.fullName]||0}" onchange="setOwnerSalary('${jsStr(o.fullName)}', this.value)"></div>`).join('')}
      </div>
    </div>

    <div class="section-title">Business rules</div>
    <div class="card" style="margin-bottom:14px">
      <div class="grid-3">
        <div class="field"><label>Unpaid reminder threshold (days)</label><input type="number" min="1" value="${s.unpaidReminderDays}" onchange="updateBusinessSetting('unpaidReminderDays', this.value, 'Unpaid reminder threshold')"></div>
        <div class="field"><label>GST rate (%)</label><input type="number" min="0" max="100" value="${s.gstRatePercent}" onchange="updateBusinessSetting('gstRatePercent', this.value, 'GST rate')"></div>
      </div>
    </div>

    <div class="section-title">Business profile</div>
    <div class="card">
      <div class="grid-3">
        <div class="field"><label>Company name</label><input value="${esc(s.companyName)}" onchange="updateBusinessProfileField('companyName', this.value.trim(), 'Company name')"></div>
        <div class="field"><label>ABN</label><input value="${esc(s.abn)}" onchange="updateBusinessProfileField('abn', this.value.trim(), 'ABN')"></div>
        <div class="field"><label>Default payment terms</label><input value="${esc(s.defaultPaymentTerms)}" placeholder="e.g. 7 days" onchange="updateBusinessProfileField('defaultPaymentTerms', this.value.trim(), 'Default payment terms')"></div>
      </div>
    </div>
  `;
}

/* ── Settings → Phone (Ofek, 2 Oct): who answers the business number, and when ──
   Stored in settings.phone_routing and read by the `voice` function on every call:
   Ron on shift → his browser phone (20 s) → the owner(s) for that service during the backup hours → voicemail + text. */
const PHONE_DIVISIONS = [['Aircon','Air conditioning'],['Chimney','Chimney'],['Pressure Washing','Pressure washing'],['Other','New caller who didn\'t choose']];
const PHONE_DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function sydneyToday(){ return new Intl.DateTimeFormat('en-CA', { timeZone:'Australia/Sydney' }).format(new Date()); }
function onShiftToday(p){ return !!(p && p.onDuty && p.onDutyDate === sydneyToday()); }
function phoneRoutingCopy(){ return JSON.parse(JSON.stringify((STATE.data.settings && STATE.data.settings.phoneRouting) || {})); }
function savePhoneRouting(R, logText){
  db.settings.update({ phoneRouting: R });
  logSettingsActivity(getCurrentProfile()?.fullName || 'Unknown', logText);
  showToast('Phone setting saved'); render();
}
function setPhonePerson(key, field, value){
  const R = phoneRoutingCopy(); R.people = R.people || {}; R.people[key] = R.people[key] || { name:key };
  R.people[key][field] = value;
  savePhoneRouting(R, field==='available' ? `${R.people[key].name||key} is now ${value ? 'available' : 'away'} for phone backup` : `${R.people[key].name||key}'s mobile changed`);
}
function setPhoneDivision(div, value){
  const R = phoneRoutingCopy(); R.divisions = R.divisions || {};
  R.divisions[div] = value==='all' ? Object.keys(R.people||{}) : [value];
  savePhoneRouting(R, `Calls for ${div} now go to ${value==='all' ? 'everyone' : ((R.people||{})[value]||{}).name||value} when the office doesn't answer`);
}
function setPhoneHours(field, value){
  const R = phoneRoutingCopy(); R.backupHours = R.backupHours || { from:'08:00', to:'20:00', days:[0,1,2,3,4,5,6] };
  if (field==='day') { const d = Number(value.day); const set = new Set(R.backupHours.days||[]); value.on ? set.add(d) : set.delete(d); R.backupHours.days = [...set].sort(); }
  else R.backupHours[field] = value;
  savePhoneRouting(R, `Phone backup hours changed`);
}
function setPhoneCallerId(value){ const R = phoneRoutingCopy(); R.callerId = value.trim(); savePhoneRouting(R, `Number shown on outgoing calls changed to ${R.callerId}`); }
function setPhoneEnabled(on){
  db.settings.update({ phoneEnabled: on });
  logSettingsActivity(getCurrentProfile()?.fullName || 'Unknown', `Business phone in the app switched ${on ? 'on' : 'off'}`);
  render(); phoneSync();
}
function renderPhoneSettings(s){
  const R = s.phoneRouting || {}, people = R.people || {}, divs = R.divisions || {};
  const hrs = R.backupHours || { from:'08:00', to:'20:00', days:[0,1,2,3,4,5,6] };
  const keys = Object.keys(people);
  const vas = STATE.profiles.filter(p => p.role==='va');
  const shiftLine = vas.length ? vas.map(p => `<div class="kv"><span>${esc(p.fullName)}</span><span class="v">${onShiftToday(p) && p.onBreak ? pill('warn', 'On a break since ' + new Date(p.onBreakSince).toLocaleTimeString('en-AU', { timeZone:'Australia/Sydney', hour:'numeric', minute:'2-digit' })) : onShiftToday(p) ? pill('good', 'On shift' + (p.onDutyChangedAt ? ' since ' + new Date(p.onDutyChangedAt).toLocaleTimeString('en-AU', { timeZone:'Australia/Sydney', hour:'numeric', minute:'2-digit' }) : '')) : pill('neutral', 'Off shift')}</span></div>`).join('') : '<div class="hint">No office assistant yet.</div>';
  const divRows = PHONE_DIVISIONS.map(([key, label]) => {
    const cur = divs[key] || [];
    const val = cur.length > 1 || !cur.length ? 'all' : cur[0];
    return `<div class="field"><label>${esc(label)}</label><select onchange="setPhoneDivision('${jsStr(key)}', this.value)">${keys.map(k => `<option value="${esc(k)}" ${val===k?'selected':''}>${esc(people[k].name||k)}</option>`).join('')}<option value="all" ${val==='all'?'selected':''}>Everyone together</option></select></div>`;
  }).join('');
  const personRows = keys.map(k => { const pp = people[k]; return `<div class="grid-3" style="align-items:end;margin-bottom:8px">
      <div class="field"><label>${esc(pp.name||k)} — mobile</label><input value="${esc(pp.mobile||'')}" onchange="setPhonePerson('${jsStr(k)}','mobile',this.value.trim())"></div>
      <label class="checkline" style="padding-bottom:10px"><input type="checkbox" ${pp.available!==false?'checked':''} onchange="setPhonePerson('${jsStr(k)}','available',this.checked)"> Available <span class="hint" style="font-weight:400">(untick on holiday: their calls go to the other)</span></label>
    </div>`; }).join('');
  return `<div class="card" style="margin-bottom:14px">
    <label class="checkline" style="font-weight:700;font-size:14.5px"><input type="checkbox" ${s.phoneEnabled?'checked':''} onchange="setPhoneEnabled(this.checked)"> Business phone in the app</label>
    <div class="hint" style="margin:6px 0 14px">Who answers 1300 380 090 and the old mobile. While Ron is on shift (his Start shift button on My Day) his browser phone rings first for ${R.officeRingSeconds||20} seconds. If he doesn't answer, or he's off shift, the call goes to the person set for that service below, during the backup hours. Outside them, or if nobody answers, the caller leaves a voicemail and gets a text, and it waits in Ron's My Day. A known customer goes by their service; a new caller picks one from a short menu.</div>
    <div style="font-weight:600;margin-bottom:6px">Office shift today</div>
    <div style="margin-bottom:14px">${shiftLine}</div>
    <div style="font-weight:600;margin-bottom:6px">When the office doesn't answer, the call goes to</div>
    <div class="grid-3" style="margin-bottom:14px">${divRows}</div>
    <div style="font-weight:600;margin-bottom:6px">Backup phones</div>
    ${personRows}
    <div style="font-weight:600;margin:10px 0 6px">Backup hours (Sydney time)</div>
    <div class="grid-3" style="align-items:end">
      <div class="field"><label>From</label><input type="time" value="${esc(hrs.from)}" onchange="setPhoneHours('from', this.value)"></div>
      <div class="field"><label>To</label><input type="time" value="${esc(hrs.to)}" onchange="setPhoneHours('to', this.value)"></div>
      <div class="field"><label>Outgoing calls show</label><input value="${esc(R.callerId||'')}" onchange="setPhoneCallerId(this.value)"></div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">${PHONE_DAYS.map((d,i) => `<label class="checkline"><input type="checkbox" ${(hrs.days||[]).includes(i)?'checked':''} onchange="setPhoneHours('day', { day:${i}, on:this.checked })"> ${d}</label>`).join('')}</div>
  </div>`;
}
// Ron's shift (My Day): while on shift, the business number rings his browser phone first. A shift ends by itself at midnight.
async function setMyShift(on){
  const me = getCurrentProfile(); if (!me) return;
  if (readOnlyReason()) { showToast(readOnlyReason()); return; }
  const { error } = await sb.rpc('set_phone_duty', { p_on: on });
  if (error) { showToast('Not saved: ' + error.message); return; }
  me.onDuty = on; me.onDutyDate = sydneyToday(); me.onDutyChangedAt = new Date().toISOString(); if (!on) { me.onBreak = false; me.onBreakSince = null; }
  loadShiftEvents();
  showToast(on ? 'Shift started: calls to the business number ring here first' : 'Shift ended: calls go to Ofek and Noam');
  render(); phoneSync();
}
function myShiftButton(profile){
  if (profile.role!=='va') return '';
  const on = onShiftToday(profile), brk = on && profile.onBreak;
  const t = iso => iso ? new Date(iso).toLocaleTimeString('en-AU', { timeZone:'Australia/Sydney', hour:'numeric', minute:'2-digit' }) : '';
  const status = brk ? pill('warn', `On a break since ${t(profile.onBreakSince)}`) : on ? pill('good', 'On shift') : pill('neutral', 'Off shift');
  // Break (Ofek 3/10): only recorded (times on Payroll) and the owners get a WhatsApp. Calls and pay don't change.
  const breakBtn = !on ? '' : brk ? `<button class="btn primary" onclick="setMyBreak(false)">Back from break</button>` : `<button class="btn" onclick="setMyBreak(true)">☕ Start break</button>`;
  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${status}${breakBtn}<button class="btn ${on?'':'primary'}" onclick="setMyShift(${on?'false':'true'})">${on ? 'End shift' : 'Start shift'}</button></div>`;
}
/* ── settings activity log — permission/business-rule/working-day changes (no single record to attach to) ── */
function logSettingsActivity(actor, text){
  if (!STATE.data.settingsActivityLog) STATE.data.settingsActivityLog = [];
  STATE.data.settingsActivityLog.push({ id: uid(), at: new Date().toISOString(), actor, text });
  db.activityLog.insert('settings', 'global', actor, text);
}
function openSettingsActivityModal(){
  openRecordActivityModal('settings', 'global', 'Settings Activity', 'Permission and business-rule changes, plus your own notes');
}
function togglePermission(profileId, section, value){
  const p = STATE.profiles.find(x=>x.id===profileId);
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const permissions = { ...p.permissions, [section]: value };
  db.profiles.update(profileId, { permissions });
  logSettingsActivity(actor, `${value?'Granted':'Revoked'} "${SECTION_LABEL[section]}" access for ${p.fullName}`);
  showToast('Permission updated');
}
function updateBusinessSetting(key, rawValue, label){
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const old = STATE.data.settings[key];
  const value = Number(rawValue);
  if (isNaN(value) || value===old) return;
  db.settings.update({ [key]: value });
  logSettingsActivity(actor, `${label} changed from ${old} to ${value}`);
  render();
}
function updateBusinessProfileField(key, value, label){
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const old = STATE.data.settings[key];
  if (old === value) return;
  db.settings.update({ [key]: value });
  logSettingsActivity(actor, `${label} updated`);
}
// Owner-only (this whole page already is): each owner's fixed weekly salary — they're on a flat
// wage, not commission, so this lives in Settings rather than the per-technician commission table.
function setOwnerSalary(name, rawValue){
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  if (!STATE.data.settings.ownerSalaries) STATE.data.settings.ownerSalaries = {};
  const old = STATE.data.settings.ownerSalaries[name] || 0;
  const value = Number(rawValue)||0;
  if (old===value) return;
  const ownerSalaries = { ...STATE.data.settings.ownerSalaries, [name]: value };
  db.settings.update({ ownerSalaries });
  logSettingsActivity(actor, `${name}'s weekly salary changed from ${fmtMoney(old)} to ${fmtMoney(value)}`);
  render();
}
function updateCommissionRateFromSettings(techName, jobType, rawValue){
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  if (!STATE.data.commissionRates[techName]) STATE.data.commissionRates[techName] = { Aircon:null, Chimney:null, 'Pressure Washing':null, Other:null };
  const rates = { ...STATE.data.commissionRates[techName] };
  const before = rates[jobType] ?? null;
  const after = rawValue===''? null : Number(rawValue);
  if (before === after) return;
  rates[jobType] = after;
  db.commissionRates.set(techName, rates);
  const emp = STATE.data.employees.find(e=>e.name===techName);
  if (emp) logEmployeeActivity(emp, actor, `${jobType} commission rate changed from ${before===null?'—':before+'%'} to ${after===null?'—':after+'%'} (via Settings)`);
}

function renderNoAccess(profile){
  return `<div class="card" style="max-width:480px;margin:60px auto;padding:30px;text-align:center">
    <div style="font-size:34px;margin-bottom:10px">🔒</div>
    <h1 style="font-family:'Figtree',sans-serif;font-size:20px;font-weight:700;margin-bottom:8px">You don't have access to any section yet</h1>
    <p style="color:var(--ink-soft);font-size:14px;line-height:1.7">Hi ${esc(profile.fullName)}, Noam needs to open at least one section for you (Jobs, Finance, Tasks, etc.) on his Settings screen. Once he does, that section will automatically appear in your sidebar.</p>
  </div>`;
}

/* ── main render loop ───────────────────────────────────────────────── */
function render(){ JOB_CACHE.index = null; DRILL = []; try { setTimeout(renderChaseBubbles, 0); setTimeout(mdTick, 0); } catch(e) {}
  const app = document.getElementById('app');
  if (AUTH.status === 'loading') { app.innerHTML = renderAuthLoading(); return; }
  if (AUTH.status === 'signedOut') { app.innerHTML = renderLogin(); return; }
  if (AUTH.status === 'needsPassword') { app.innerHTML = renderSetPassword(); return; }
  // AUTH.status === 'ready' from here — a real Supabase session exists.
  if (!STATE.dataLoaded) {
    app.innerHTML = renderAuthLoading('Loading your data…');
    if (!AUTH_DATA_LOADING) {
      AUTH_DATA_LOADING = true;
      loadFromSupabase()
        .then(() => { STATE.dataLoaded = true; AUTH_DATA_LOADING = false; setupRealtimeSubscriptions(); render(); phoneSync(); convLoad(); mdLoad(); loadShiftEvents(); vaSessionStart(); })
        .catch(err => { AUTH_DATA_LOADING = false; AUTH.error = err.message; AUTH.status = 'signedOut'; render(); });
    }
    return;
  }
  if (STATE.noProfile) { app.innerHTML = renderAuthLoading("Your account isn't set up in the system yet — ask Ofek or Noam to finish setting up your access, then reload this page."); return; }
  const profile = getCurrentProfile();
  if (!profile) { app.innerHTML = renderAuthLoading('No profile found.'); return; }

  // route guard — mirrors src/lib/permissions.ts + the (app)/layout.tsx guard:
  // never render a section the current profile isn't permitted to view.
  if (!UI.tab || !canViewSection(profile, UI.tab)) UI.tab = homeTabFor(profile);
  // board guard — a technician may only ever be looking at their OWN personal task board, regardless of
  // what UI.tasks.board was last set to (e.g. left over from another profile in this same browser tab).
  if (profile.role==='technician' && profile.technicianName) UI.tasks.board = profile.technicianName;
  if (profile.role==='va' && UI.tasks.board==='mine') UI.tasks.board = 'ron';

  const data = filterForProfile(STATE.data, profile);
  app.innerHTML = renderShell(profile, data);
  const content = document.getElementById('content');
  if (!UI.tab) { content.innerHTML = renderNoAccess(profile); return; }
  if (UI.tab==='crm') content.innerHTML = renderCrm(profile, data);
  else if (UI.tab==='crmOverview') content.innerHTML = renderCrmOverview(profile, data);
  else if (UI.tab==='closings') content.innerHTML = renderClosings(profile, data);
  else if (UI.tab==='jobs') content.innerHTML = renderJobs(profile, data);
  else if (UI.tab==='finance') content.innerHTML = renderFinance(profile, data);
  else if (UI.tab==='adsGoogle') { if (!ADS_STATS.rows && !ADS_STATS.loading && !ADS_STATS.tried) setTimeout(loadAdsStats, 0); content.innerHTML = renderDashGoogle(profile, data, true); }
  else if (UI.tab==='dashboard') { if ((UI.dashboard.view==='google' || UI.dashboard.view==='meta') && !ADS_STATS.rows && !ADS_STATS.loading && !ADS_STATS.tried) setTimeout(loadAdsStats, 0); content.innerHTML = UI.dashboard.view==='google' ? renderDashGoogle(profile, data) : UI.dashboard.view==='meta' ? renderDashMeta(profile, data) : UI.dashboard.view==='leads' ? renderCrmOverview(profile, data) : renderDashboard(profile, data); }
  else if (UI.tab==='payroll') content.innerHTML = renderPayroll(profile, data);
  else if (UI.tab==='outstanding') content.innerHTML = renderOutstanding(profile, data);
  else if (UI.tab==='myDay') content.innerHTML = renderMyDay(profile, data);
  else if (UI.tab==='reminders') content.innerHTML = renderReminders(profile, data);
  else if (UI.tab==='openItems') content.innerHTML = renderOpenItems(profile, data);
  else if (UI.tab==='tasks') content.innerHTML = renderTasks(profile, data);
  else if (UI.tab==='reference') content.innerHTML = renderReference(profile, data);
  else if (UI.tab==='settings') content.innerHTML = renderSettings(profile);
  if (STATE.loadErrors && STATE.loadErrors.length) content.insertAdjacentHTML('afterbegin', `<div class="card" style="border:1px solid var(--bad);background:var(--bad-soft);margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><b>Some data did not load: ${esc(STATE.loadErrors.join(', '))}.</b> What you see may be incomplete. Don't re-enter anything that looks missing.</div><button class="btn small" onclick="location.reload()">Reload</button></div>`);
}

document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase()==='k') {
    e.preventDefault();
    if (STATE.currentProfileId) openSearchModal();
    return;
  }
  if (e.key==='Escape') {
    const root = document.getElementById('modal-root');
    if (root && root.innerHTML.trim()) closeModal();
  }
});

render();
</script>

</body></html>
