/* ── settings ────────────────────────────────────────────────────────── */
function renderSettings(profile){
  const others = STATE.profiles.filter(p => p.role==='technician' || p.role==='va');
  const grantable = ALL_SECTIONS.filter(s => s!=='settings');
  const cards = others.length ? others.map(p => `
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-family:'Figtree',sans-serif;font-weight:700;font-size:15.5px">${esc(p.fullName)}</div>
        <span class="pill neutral">${roleLabel(p.role)}</span>
      </div>
      ${p.role==='technician' ? `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px">A technician always sees only their own jobs/commissions — never anyone else's, even if "Jobs &amp; Commissions" is checked.</div>` : ''}
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${grantable.map(s => `<label class="checkline" style="padding:6px 4px"><input type="checkbox" ${p.permissions[s]?'checked':''} onchange="togglePermission('${p.id}','${s}',this.checked)"> ${SECTION_LABEL[s]}</label>`).join('')}
      </div>
    </div>`).join('') : emptyState('No additional users yet', 'Once Guy, Dolev or Ron sign in, they will appear here.');
  return `
    <div class="page-head"><div><h1 class="page-title">Permissions &amp; Settings</h1><div class="page-sub">Decide exactly what each person sees — including Ron, whenever you choose. Changes apply immediately.</div></div></div>
    <div class="banner">Manager accounts (like Ofek) automatically see everything an owner sees except this Settings page, so they aren't listed below.</div>
    ${cards}
  `;
}
function togglePermission(profileId, section, value){
  const p = STATE.profiles.find(x=>x.id===profileId);
  p.permissions[section] = value;
  showToast('Permission updated');
}

function renderNoAccess(profile){
  return `<div class="card" style="max-width:480px;margin:60px auto;padding:30px;text-align:center">
    <div style="font-size:34px;margin-bottom:10px">🔒</div>
    <h1 style="font-family:'Figtree',sans-serif;font-size:20px;font-weight:700;margin-bottom:8px">You don't have access to any section yet</h1>
    <p style="color:var(--ink-soft);font-size:14px;line-height:1.7">Hi ${esc(profile.fullName)}, Noam needs to open at least one section for you (Jobs, Finance, Tasks, Quotes, etc.) on his Settings screen. Once he does, that section will automatically appear in your sidebar.</p>
  </div>`;
}

/* ── main render loop ───────────────────────────────────────────────── */
function render(){
  const app = document.getElementById('app');
  if (!STATE.currentProfileId) { app.innerHTML = renderLogin(); return; }
  const profile = getCurrentProfile();
  if (!profile) { STATE.currentProfileId = null; app.innerHTML = renderLogin(); return; }

  // route guard — mirrors src/lib/permissions.ts + the (app)/layout.tsx guard:
  // never render a section the current profile isn't permitted to view.
  if (!UI.tab || !canViewSection(profile, UI.tab)) UI.tab = firstAccessibleTab(profile);
  // board guard — a technician may only ever be looking at their OWN personal task board, regardless of
  // what UI.tasks.board was last set to (e.g. left over from another profile in this same browser tab).
  if (profile.role==='technician' && profile.technicianName) UI.tasks.board = profile.technicianName;

  const data = filterForProfile(STATE.data, profile);
  app.innerHTML = renderShell(profile, data);
  const content = document.getElementById('content');
  if (!UI.tab) { content.innerHTML = renderNoAccess(profile); return; }
  if (UI.tab==='overview') content.innerHTML = renderOverview(profile, data);
  else if (UI.tab==='closings') content.innerHTML = renderClosings(profile, data);
  else if (UI.tab==='jobs') content.innerHTML = renderJobs(profile, data);
  else if (UI.tab==='finance') content.innerHTML = renderFinance(profile, data);
  else if (UI.tab==='outstanding') content.innerHTML = renderOutstanding(profile, data);
  else if (UI.tab==='reminders') content.innerHTML = renderReminders(profile, data);
  else if (UI.tab==='openItems') content.innerHTML = renderOpenItems(profile, data);
  else if (UI.tab==='tasks') content.innerHTML = renderTasks(profile, data);
  else if (UI.tab==='quotes') content.innerHTML = renderQuotes(profile, data);
  else if (UI.tab==='reference') content.innerHTML = renderReference(profile, data);
  else if (UI.tab==='settings') content.innerHTML = renderSettings(profile);
}

render();
</script>
