/* ── overview: arbitrary date-range aggregation (business-wide, not per-week) ─
   Independent of computeWeek/computeMonth — those stay untouched since Finance
   relies on their week-specific "late payment" semantics, which don't generalize
   to an arbitrary range. This is a simpler, direct range aggregate. */
function dateSpanDays(startDateStr, endDateStr){ return daysBetween(parseLocalDate(startDateStr), parseLocalDate(endDateStr)) + 1; }
function resolveOverviewRange(ui, now){
  const today = todayStr(now);
  const mode = ui.range;
  if (mode==='month') {
    const d = parseLocalDate(today);
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const last = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return { start: fmtLocal(first), end: fmtLocal(last), label: `${monthOf(today).label} (month to date)` };
  }
  if (mode==='7d') {
    const end = parseLocalDate(today); const start = new Date(end); start.setDate(end.getDate()-6);
    return { start: fmtLocal(start), end: fmtLocal(end), label: 'Last 7 days' };
  }
  if (mode==='30d') {
    const end = parseLocalDate(today); const start = new Date(end); start.setDate(end.getDate()-29);
    return { start: fmtLocal(start), end: fmtLocal(end), label: 'Last 30 days' };
  }
  if (mode==='custom') {
    const start = ui.customFrom || today, end = ui.customTo || today;
    return { start: start<=end?start:end, end: start<=end?end:start, label: 'Custom range' };
  }
  const w = weekOf(today);
  return { start: fmtLocal(w.monday), end: fmtLocal(w.sunday), label: `Week of ${w.label}` };
}
function setOverviewRange(mode){ UI.overview.range = mode; render(); }
function computeRange(data, startDateStr, endDateStr, technicianFilter){
  let jobs = data.jobs.filter(j => j.date>=startDateStr && j.date<=endDateStr);
  let equip = data.equipmentSpend.filter(e => e.date>=startDateStr && e.date<=endDateStr);
  if (technicianFilter) { jobs = jobs.filter(j=>j.technician===technicianFilter); equip = equip.filter(e=>e.technician===technicianFilter); }
  const overview = { cash:0, bankTransfer:0, creditCard:0, paidTotal:0, unpaidTotal:0, paidCount:0, unpaidCount:0, partsTotal:0, equipmentTotal:0, commissionOwedTotal:0, paidToTechTotal:0, gstTotal:0 };
  const jobTypeStats = { Aircon:{revenue:0,count:0}, Chimney:{revenue:0,count:0}, 'Pressure Washing':{revenue:0,count:0}, Other:{revenue:0,count:0} };
  const unpaidByTech = {};
  const commissionByTech = {};
  jobs.forEach(j => {
    const totalIncGst = jobTotalCollected(j);
    if (j.paymentMethod==='Cash') overview.cash += totalIncGst;
    else if (j.paymentMethod==='Bank Transfer') overview.bankTransfer += totalIncGst;
    else if (j.paymentMethod==='Credit Card') overview.creditCard += totalIncGst;
    overview.gstTotal += jobGst(j);
    if (j.paymentStatus==='Paid') { overview.paidCount++; overview.paidTotal += j.amount; }
    else { overview.unpaidCount++; overview.unpaidTotal += j.amount; unpaidByTech[j.technician] = (unpaidByTech[j.technician]||0) + 1; }
    overview.partsTotal += Number(j.partsCost)||0;
    const commission = jobCommissionAmount(j);
    overview.commissionOwedTotal += commission;
    commissionByTech[j.technician] = round2((commissionByTech[j.technician]||0) + commission);
    if (j.paidToTechnician==='Paid') overview.paidToTechTotal += commission;
    if (jobTypeStats[j.jobType]===undefined) jobTypeStats[j.jobType] = {revenue:0,count:0};
    jobTypeStats[j.jobType].revenue += Number(j.amount)||0;
    jobTypeStats[j.jobType].count += 1;
  });
  equip.forEach(e => { overview.equipmentTotal += Number(e.cost)||0; });
  Object.keys(overview).forEach(k => overview[k]=round2(overview[k]));
  Object.keys(jobTypeStats).forEach(k => jobTypeStats[k].revenue = round2(jobTypeStats[k].revenue));
  const revenueExGst = round2(jobs.reduce((s,j)=>s+(Number(j.amount)||0),0));
  const revenue = round2(jobs.reduce((s,j)=>s+jobTotalCollected(j),0)); // headline "Total Revenue" — incl. GST, paid + unpaid
  const remainingAfterTech = round2(revenueExGst - overview.commissionOwedTotal - overview.partsTotal - overview.equipmentTotal);
  // Money collected in THIS period for jobs whose original service date falls in an earlier period.
  let latePayments = data.jobs.filter(j => j.paymentStatus==='Paid' && j.datePaid && j.datePaid>=startDateStr && j.datePaid<=endDateStr && j.date<startDateStr);
  if (technicianFilter) latePayments = latePayments.filter(j=>j.technician===technicianFilter);
  const latePaymentsTotal = round2(latePayments.reduce((s,j)=>s+jobTotalCollected(j),0));
  return { startDateStr, endDateStr, jobs, equip, overview, jobTypeStats, unpaidByTech, commissionByTech, revenue, revenueExGst, remainingAfterTech, latePayments, latePaymentsTotal };
}
function computeRevenueByWeekday(jobs){
  const labels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const totals = [0,0,0,0,0,0,0];
  jobs.forEach(j => { const dow = parseLocalDate(j.date).getDay(); totals[dow===0?6:dow-1] += Number(j.amount)||0; });
  return labels.map((label,i)=>({label, revenue: round2(totals[i])}));
}
function computeRevenueByWeekInRange(data, startDateStr, endDateStr, technicianFilter){
  const keys = []; const seen = new Set();
  let d = parseLocalDate(startDateStr);
  const endKey = weekOf(endDateStr).key;
  for (let guard=0; guard<60; guard++) {
    const wk = weekOf(fmtLocal(d)).key;
    if (!seen.has(wk)) { seen.add(wk); keys.push(wk); }
    if (wk===endKey) break;
    d.setDate(d.getDate()+7);
  }
  return keys.map(k => ({ label: weekOf(k).label, revenue: round2(computeWeek(data, k, technicianFilter).jobs.reduce((s,j)=>s+j.amount,0)) }));
}
const WEEKDAY_LABEL_TO_DOW = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
function worksOnDay(emp, dow){
  if (!emp || !Array.isArray(emp.workingDays)) return true; // no restriction configured = assume every day
  return emp.workingDays.includes(dow);
}
function computeInsights(data, range, rangeData, technicianFilter){
  const insights = []; const jobs = rangeData.jobs;
  if (!jobs.length) return insights;
  let byDay = computeRevenueByWeekday(jobs).filter(d=>d.revenue>0);
  if (technicianFilter) {
    const emp = data.employees.find(e=>e.name===technicianFilter);
    byDay = byDay.filter(d => worksOnDay(emp, WEEKDAY_LABEL_TO_DOW[d.label]));
  }
  if (byDay.length>1) {
    const best = byDay.reduce((a,b)=>b.revenue>a.revenue?b:a);
    const worst = byDay.reduce((a,b)=>b.revenue<a.revenue?b:a);
    insights.push({ title:`${best.label} is your strongest day`, detail:`${fmtMoney(best.revenue)} in revenue this period — consider concentrating scheduling or marketing around ${best.label}s.` });
    if (worst.label!==best.label) insights.push({ title:`${worst.label} is your slowest day`, detail:`Only ${fmtMoney(worst.revenue)} — worth checking if that's by design or a missed opportunity.` });
  }
  const unpaidEntries = Object.entries(rangeData.unpaidByTech).sort((a,b)=>b[1]-a[1]);
  if (unpaidEntries.length) {
    const [tech,count] = unpaidEntries[0];
    insights.push({ title:`${tech} has the most unpaid invoices`, detail:`${count} unpaid job${count>1?'s':''} this period — worth a follow-up call.` });
  }
  const spanDays = dateSpanDays(range.start, range.end);
  const prevEnd = fmtLocal(new Date(parseLocalDate(range.start).getTime() - 86400000));
  const prevStartDate = parseLocalDate(range.start); prevStartDate.setDate(prevStartDate.getDate()-spanDays);
  const prevRange = computeRange(data, fmtLocal(prevStartDate), prevEnd, technicianFilter);
  if (prevRange.revenue > 0) {
    const pct = round2(((rangeData.revenue - prevRange.revenue)/prevRange.revenue)*100);
    if (Math.abs(pct) >= 5) insights.push({ title: pct>0 ? `Revenue is up ${pct}% vs. the previous period` : `Revenue is down ${Math.abs(pct)}% vs. the previous period`, detail:`${fmtMoney(rangeData.revenue)} vs ${fmtMoney(prevRange.revenue)} in the prior ${spanDays}-day period.` });
  }
  const typeStats = {};
  jobs.forEach(j => { const t=j.jobType; if(!typeStats[t]) typeStats[t]={count:0, profit:0}; typeStats[t].count++; typeStats[t].profit += (Number(j.amount)||0) - jobCommissionAmount(j); });
  const typeEntries = Object.entries(typeStats).map(([t,v])=>[t, v.profit/v.count]);
  if (typeEntries.length>1) {
    const [bestType, bestAvg] = typeEntries.reduce((a,b)=>b[1]>a[1]?b:a);
    insights.push({ title:`${bestType} jobs are your most profitable per job`, detail:`Averaging ${fmtMoney(bestAvg)} profit after commission per job this period.` });
  }
  const unconfirmedCash = jobs.filter(j=>j.paymentMethod==='Cash' && !j.cashConfirmed).reduce((s,j)=>s+jobTotalCollected(j),0);
  if (unconfirmedCash > 0) insights.push({ title:`${fmtMoney(unconfirmedCash)} in unconfirmed cash`, detail:`Cash payments marked unconfirmed this period — worth double-checking they were actually collected.` });
  return insights.slice(0,5);
}
function renderInsights(insights){
  if (!insights.length) return emptyState('Not enough data yet', 'Insights will appear here once there are a few jobs in this period.');
  return insights.map(i => `<div style="display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)">
    <span style="width:6px;height:6px;border-radius:99px;background:var(--primary);margin-top:6px;flex:none"></span>
    <div><div style="font-weight:600;font-size:13px">${esc(i.title)}</div><div style="color:var(--ink-soft);font-size:12px;margin-top:2px">${esc(i.detail)}</div></div>
  </div>`).join('');
}
function renderBarGroup(items, opts){
  // opts.fmt lets a caller render plain counts instead of money (the CRM channel chart) — defaults to
  // money so the existing Overview call sites keep working unchanged.
  const fmt = (opts && opts.fmt) || fmtMoney;
  const max = Math.max(...items.map(i=>i.value), 0.0001);
  const bars = items.map(it => {
    const pct = it.value>0 ? Math.max(4, Math.round((it.value/max)*100)) : 2;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0">
      <div class="mono" style="font-size:12px;font-weight:600;white-space:nowrap">${fmt(it.value)}</div>

    </div>`;
  }).join('');
  return `<div style="display:flex;gap:10px;align-items:flex-end;margin-top:6px">${bars}</div>`;
}
/* ── lightweight inline charts (no dependency; dependency-free SVG/CSS) ─ */
function renderSparkline(series, opts){
  opts = opts || {};
  const values = series.map(s=>s.revenue);
  const w = 240, h = 46, pad = 3;
  const max = Math.max(...values, 0.0001);
  const n = values.length;
  if (n < 2) return '';
  const stepX = (w - pad*2) / (n-1);
  const pts = values.map((v,i) => [pad + i*stepX, h - pad - (v/max)*(h-pad*2)]);
  const line = pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[n-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const color = opts.color || 'var(--primary)';
  const summary = series.map(s => `${s.label}: ${fmtMoney(s.revenue)}`).join(', ');
  const labelsRow = series.map(s => `<span style="flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.label)}</span>`).join('');
  return `<div style="margin-top:10px">
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Revenue trend — ${esc(summary)}">
      <path d="${area}" fill="${color}" opacity=".14"></path>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div style="display:flex;gap:2px;margin-top:3px;font-size:9.5px;color:var(--ink-faint)">${labelsRow}</div>
  </div>`;
}
function renderProgressBar(value, target, opts){
  opts = opts || {};
  const pct = target > 0 ? Math.max(0, Math.min(100, Math.round((value/target)*100))) : 0;
  const color = opts.color || 'var(--good)';
  const label = opts.ariaLabel || `${pct}% of target`;
  return `<div style="margin-top:10px" role="img" aria-label="${esc(label)}">
    <div style="height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${color};border-radius:99px;transition:width .2s"></div>
    </div>
    <div style="font-size:10.5px;color:var(--ink-faint);margin-top:4px">${pct}% of amount owed paid out</div>
  </div>`;
}

/* ── CRM: leads & customers ──────────────────────────────────────────────
   The main sales board. A lead moves New → Follow-up → Won/Lost, and the three
   tag families (source / division / status) are kept as separate fields rather
   than one free-form tag pile, which is what makes the per-channel and per-
   division counts in the stat row actually countable. ── */
const LEAD_SOURCES = ['Google Ads','Meta Ads','Google Maps','Organic','Phone Call'];
const LEAD_DIVISIONS = ['Aircon','Chimney','Pressure Washing'];
const LEAD_STATUSES = ['New','Follow-up','Booked','Not Relevant'];
const LEAD_STATUS_COLOR = { New:'var(--primary)', 'Follow-up':'var(--warn)', Booked:'var(--good)', 'Not Relevant':'var(--ink-faint)' };
const LEAD_STATUS_TONE = { New:'neutral', 'Follow-up':'warn', Booked:'good', 'Not Relevant':'neutral' };
const LEAD_SOURCE_COLOR = { 'Google Ads':'var(--primary)', 'Meta Ads':'var(--accent)', 'Google Maps':'var(--ink-faint)', Organic:'var(--good)', 'Phone Call':'var(--warn)' };
// Finer-grained breakdown tags, layered on top of the division/source rollups above rather than
// replacing them — a lead still counts once toward "Aircon" / "Meta Ads" in every existing report,
// and *additionally* carries one of these (when known) via the existing free-form tags array, so
// "how many were Instagram vs Facebook" is answerable without splitting the totals Ofek budgets
// against. Auto-applied by the intake-lead Edge Function from UTM/landing-page/message-text
// signals; always just a normal tag from here on, editable/removable like any other.
const AIRCON_TYPE_TAGS = ['Split System','Duct System'];
const META_PLATFORM_TAGS = ['Facebook','Instagram'];
// Read-only — populated once, at creation, by the intake-lead Edge Function (or blank for every
// lead entered directly in the app). Shared between the CRM Inbox details panel and the lead
// modal's Details tab so the two never drift. Renders nothing at all if there's no data, which is
// the common case for anything not created via the website form.
function renderMarketingSourceBlock(c){

  if (!rows.length) return '';
  return `<div class="field" style="margin-top:9px">
    <label>Marketing source</label>
    <div style="font-size:12px;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px;padding-top:2px">
      ${rows.map(([label,v])=>`<div><b style="color:var(--ink)">${esc(label)}:</b> ${esc(v)}</div>`).join('')}
    </div>
  </div>`;
}
// Preset follow-up actions Ron reaches for constantly — one tap instead of typing the same text again.
const FOLLOWUP_PRESETS = [
  { label:'Follow up', text:'Follow up call', kind:'reminder' },
  { label:'Send quote', text:'Send quote', kind:'task' },
  { label:'Send report', text:'Send report', kind:'task' },
];
// The conversation thread — NOT a live connection to real SMS/Facebook/Instagram. Regardless of which
// channel the customer actually used, it all lands in the same one thread here, so there's nothing to pick
// per message. The composer default action is a reply (always outgoing, like a normal messaging app);
// logging something the customer said elsewhere is a deliberate, separate secondary action so it never
// feels like "pretending to be the customer". Wiring this to real channels is a Stage-3+/telephony task
// (needs a server + provider APIs) — see the roadmap.

function setCrmView(v){ UI.crm.view = v; render(); }
function setCrmRange(r){ UI.crmOverview.range = r; render(); }
function resolveCrmRange(){ return resolveOverviewRange(UI.crmOverview); }
function contactById(id){ return STATE.data.contacts.find(c=>c.id===id) || null; }
function lastContactedAt(c){
  // Seed data uses naive local-time strings for `at`, while live-logged messages use full UTC
  // ISO strings (new Date().toISOString()) — comparing those as raw strings can misorder them,
  // so always compare via Date.parse, never string `>`/localeCompare.
  const msgs = c.messages||[];
  if (!msgs.length) return c.createdAt;
  return msgs.reduce((max,m)=> new Date(m.at).getTime()>new Date(max).getTime()?m.at:max, msgs[0].at);
}
function unreadCountFor(c){
  const sinceMs = c.lastReadAt ? new Date(c.lastReadAt).getTime() : 0;
  return (c.messages||[]).filter(m => m.kind==='message' && m.direction==='in' && new Date(m.at).getTime() > sinceMs).length;
}
function unreadBadge(c){
  const n = unreadCountFor(c);
  return n>0 ? `<span class="unread-badge">${n}</span>` : '';
}
function markLeadRead(contactId){
  const c = contactById(contactId); if (!c) return;
  if (unreadCountFor(c)===0) return;
  c.lastReadAt = new Date().toISOString();
  db.contacts.update(c.id, { lastReadAt: c.lastReadAt });
}
// The explicit "Mark as read" action — opening/selecting a conversation no longer marks it read on its
// own (Ofek's call: unread should mean "still needs my action," not "haven't glanced at it").
function markLeadReadManually(contactId, scope){
  markLeadRead(contactId);
  refreshLeadUnreadUI(contactId, scope);
  if (scope==='inbox') refreshCrmInboxList();
}
function refreshLeadUnreadUI(contactId, scope){
  const btn = document.getElementById(scope+'-mark-read-btn');
  if (btn) btn.style.display = unreadCountFor(contactById(contactId))>0 ? '' : 'none';
}
function logLeadEvent(contact, text){
  if (!contact.messages) contact.messages = [];
  contact.messages.push({ id:uid(), kind:'event', text, at:new Date().toISOString() });
  if (contact.id) db.contacts.update(contact.id, { messages: contact.messages });
}
function renderLeadConversation(contactId){
  const c = contactById(contactId); if (!c) return '';
  const msgs = (c.messages||[]).slice().sort((a,b)=>new Date(a.at).getTime()-new Date(b.at).getTime());
  if (!msgs.length) return `<div class="empty" style="padding:26px 10px"><b>No conversation yet</b><div>Log what the customer said and what you replied — it all stays in one thread here, like GHL.</div></div>`;
  return msgs.map(m => {
    if (m.kind==='event') return `<div class="chat-event">${esc(m.text)} <span class="chat-event-time">${new Date(m.at).toLocaleString('en-AU')}</span></div>`;
    const out = m.direction==='out';
    return `<div class="chat-row ${out?'out':'in'}">
      <div class="chat-bubble ${out?'out':'in'}">
        <div class="chat-bubble-meta">${esc(m.author || (out?'You':'Customer'))}</div>
        <div class="chat-bubble-text">${esc(m.text)}</div>
        <div class="chat-bubble-time">${new Date(m.at).toLocaleString('en-AU')}</div>
      </div>
    </div>`;
  }).join('');
}
// The same composer markup/logic backs both the lead modal ("modal" scope) and the CRM Inbox's
// inline thread pane ("inbox" scope) — each scope gets its own element ids so the two can never
// collide if both happen to be in the DOM at once.
function renderLeadComposer(contactId, scope){
  return `
    <div style="display:flex;gap:8px;margin-top:10px;align-items:flex-start">
      <textarea rows="2" id="${scope}-msg-out-text" placeholder="Reply… (Enter to send, Shift+Enter for a new line)" style="flex:1" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendLeadReply('${contactId}','${scope}');}"></textarea>
      <button type="button" class="btn primary small" onclick="sendLeadReply('${contactId}','${scope}')">Send</button>
    </div>
    <div style="margin-top:6px">
      <button type="button" class="btn ghost small" onclick="toggleLogIncoming('${scope}')">📥 Log what they said</button>
      <div id="${scope}-log-incoming-box" style="display:none;margin-top:6px">
        <div style="display:flex;gap:8px;align-items:flex-start">
          <textarea rows="2" id="${scope}-msg-in-text" placeholder="What did they say, and where? (Enter to log, Shift+Enter for a new line)" style="flex:1" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();logIncomingMessage('${contactId}','${scope}');}"></textarea>
          <button type="button" class="btn small" onclick="logIncomingMessage('${contactId}','${scope}')">Log</button>
        </div>
      </div>

}
function refreshLeadThread(contactId, scope){
  const thread = document.getElementById(scope+'-conversation-thread');
  if (thread) { thread.innerHTML = renderLeadConversation(contactId); thread.scrollTop = thread.scrollHeight; }
}
function refreshCrmInboxList(){
  const host = document.getElementById('crm-inbox-list');
  if (!host) return;
  const data = filterForProfile(STATE.data, getCurrentProfile());
  host.innerHTML = renderCrmInboxList(crmInboxSortedContacts(data));
}
function sendLeadReply(contactId, scope){
  scope = scope || 'modal';
  const c = contactById(contactId); if (!c) return;
  const textEl = document.getElementById(scope+'-msg-out-text');
  const text = textEl.value.trim(); if (!text) return;
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  if (!c.messages) c.messages = [];
  c.messages.push({ id:uid(), kind:'message', direction:'out', text, author:actor, at:new Date().toISOString() });
  db.contacts.update(c.id, { messages: c.messages });
  markLeadRead(contactId); // replying is itself proof the thread was handled — the newest message is now ours
  textEl.value = '';
  refreshLeadThread(contactId, scope);
  refreshLeadUnreadUI(contactId, scope);
  if (scope==='inbox') refreshCrmInboxList();
}
function toggleLogIncoming(scope){
  scope = scope || 'modal';
  const box = document.getElementById(scope+'-log-incoming-box'); if (!box) return;
  const hidden = box.style.display==='none';
  box.style.display = hidden ? '' : 'none';

}
function logIncomingMessage(contactId, scope){
  scope = scope || 'modal';
  const c = contactById(contactId); if (!c) return;
  const textEl = document.getElementById(scope+'-msg-in-text');
  const text = textEl.value.trim(); if (!text) return;
  if (!c.messages) c.messages = [];
  c.messages.push({ id:uid(), kind:'message', direction:'in', text, author:c.fullName, at:new Date().toISOString() });
  db.contacts.update(c.id, { messages: c.messages });
  textEl.value = '';
  const box = document.getElementById(scope+'-log-incoming-box'); if (box) box.style.display = 'none';
  refreshLeadThread(contactId, scope);
  if (scope==='inbox') refreshCrmInboxList();

function computeCrmStats(contacts){
  const stats = { total:contacts.length, byStatus:{New:0,'Follow-up':0,Booked:0,'Not Relevant':0}, bySource:{}, byDivision:{}, byAirconType:{}, byMetaPlatform:{}, wonValue:0 };
  LEAD_SOURCES.forEach(s=>stats.bySource[s]=0);
  LEAD_DIVISIONS.forEach(d=>stats.byDivision[d]={total:0,won:0});
  AIRCON_TYPE_TAGS.forEach(t=>stats.byAirconType[t]=0);
  META_PLATFORM_TAGS.forEach(t=>stats.byMetaPlatform[t]=0);
  contacts.forEach(c => {
    if (stats.byStatus[c.status]!==undefined) stats.byStatus[c.status]++;
    if (stats.bySource[c.source]!==undefined) stats.bySource[c.source]++;
    if (stats.byDivision[c.division]) {
      stats.byDivision[c.division].total++;
      if (c.status==='Booked') stats.byDivision[c.division].won++;
    }
    // Sub-tags only ever refine their parent bucket, never replace it — an Aircon lead tagged
    // "Duct System" still counts under Aircon above; this just additionally answers "which kind".
    if (c.division==='Aircon') (c.tags||[]).forEach(t => { if (stats.byAirconType[t]!==undefined) stats.byAirconType[t]++; });
    if (c.source==='Meta Ads') (c.tags||[]).forEach(t => { if (stats.byMetaPlatform[t]!==undefined) stats.byMetaPlatform[t]++; });
    if (c.status==='Booked') stats.wonValue += Number(c.estimatedValue)||0;
  });
  const decided = stats.byStatus.Booked + stats.byStatus['Not Relevant'];
  stats.closeRate = decided ? Math.round((stats.byStatus.Booked/decided)*100) : null;
  return stats;
}
function filteredContacts(data){
  const range = resolveCrmRange();
  let list = data.contacts.filter(c => c.createdAt >= range.start && c.createdAt <= range.end);
  if (UI.crmOverview.source!=='all') list = list.filter(c=>c.source===UI.crmOverview.source);
  if (UI.crmOverview.division!=='all') list = list.filter(c=>c.division===UI.crmOverview.division);
  return list;
}
function crmFilteredContactsUnsorted(data){
  let list = data.contacts.slice();
  if (UI.crm.source!=='all') list = list.filter(c=>c.source===UI.crm.source);
  if (UI.crm.division!=='all') list = list.filter(c=>c.division===UI.crm.division);
  if (UI.crm.status!=='all') list = list.filter(c=>c.status===UI.crm.status);
  if (UI.crm.tag && UI.crm.tag!=='all') list = list.filter(c=>(c.tags||[]).includes(UI.crm.tag));
  const q = (UI.crm.search||'').trim().toLowerCase();
  if (q) list = list.filter(c => [c.fullName,c.phone,c.email,c.postcode,c.jobDescription].some(v => (v||'').toLowerCase().indexOf(q)!==-1));
  return list;
}
// Inbox is a message-style screen — it always orders by whoever had the last interaction (either
// direction), like WhatsApp/SMS, regardless of any filter that's active. Table/Pipeline use the
// user-selectable sort (Stage/Newest/Oldest/Last contacted) via opsFilteredContacts below instead.
function crmInboxSortedContacts(data){
  return crmFilteredContactsUnsorted(data).sort((a,b)=>new Date(lastContactedAt(b)).getTime()-new Date(lastContactedAt(a)).getTime());
}
function opsFilteredContacts(data){
  let list = crmFilteredContactsUnsorted(data);
  const sortBy = UI.crm.sortBy || 'stage';
  if (sortBy==='oldest') list.sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  else if (sortBy==='lastContacted') list.sort((a,b)=>new Date(lastContactedAt(b)).getTime()-new Date(lastContactedAt(a)).getTime());
  else if (sortBy==='newest') list.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  else list.sort((a,b) => (LEAD_STATUSES.indexOf(a.status)-LEAD_STATUSES.indexOf(b.status)) || (new Date(lastContactedAt(b)).getTime()-new Date(lastContactedAt(a)).getTime()));
  return list;
}
function updateCrmSearch(v){
  UI.crm.search = v;
  const host = document.getElementById('crm-body');
  if (host) host.innerHTML = renderCrmBody(filterForProfile(STATE.data, getCurrentProfile()));
}

function leadTagChip(text, color){

}
/* ── free-form contact tags (like GHL's tags) — add via typing + a suggestion dropdown of every tag
   already used across contacts, remove with a click. Unlike Division/Source/Stage this is multi-value
   and open-vocabulary, so it doesn't fit the statusSelect single-value pattern. ── */
function jsStr(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function allKnownTags(){
  const set = new Set(STATE.data.tagCatalog||[]);
  (STATE.data.contacts||[]).forEach(c => (c.tags||[]).forEach(t=>set.add(t))); // defensive: a tag on a contact always stays selectable even if the catalog somehow drifted
  return [...set].sort();
}
function registerTag(tag){
  if (!STATE.data.tagCatalog) STATE.data.tagCatalog = [];
  if (!STATE.data.tagCatalog.includes(tag)) { STATE.data.tagCatalog.push(tag); db.tagCatalog.add(tag); }
}
function addLeadTag(contactId, rawTag){
  const c = contactById(contactId); if (!c) return;
  const tag = (rawTag||'').trim().toLowerCase(); if (!tag) return;
  if (!c.tags) c.tags = [];
  registerTag(tag);
  if (c.tags.includes(tag)) { refreshLeadTagsUI(contactId); return; }
  c.tags.push(tag);
  db.contacts.update(c.id, { tags: c.tags });
  logContactActivity(c, getCurrentProfile()?.fullName||'Unknown', `Tag added: "${tag}"`);
  refreshLeadTagsUI(contactId);
  render(); // the CRM page's "All tags" filter (and any other tags-block open elsewhere) only
            // rebuilds on a full render — without this it silently goes stale until something
            // else happens to trigger one, even though the tag is really saved.
}
function removeLeadTag(contactId, tag){
  const c = contactById(contactId); if (!c) return;
  c.tags = (c.tags||[]).filter(t=>t!==tag);
  db.contacts.update(c.id, { tags: c.tags });
  logContactActivity(c, getCurrentProfile()?.fullName||'Unknown', `Tag removed: "${tag}"`);
  refreshLeadTagsUI(contactId);
  render();
}
function refreshLeadTagsUI(contactId){
  document.querySelectorAll(`.lead-tags-block[data-contact="${contactId}"]`).forEach(host => { host.outerHTML = renderLeadTags(contactId, host.dataset.scope); });
}
function renderLeadTags(contactId, scope){
  const c = contactById(contactId); if (!c) return '';

    <div class="lead-tags-chips">

    </div>
    <form class="lead-tags-add" onsubmit="event.preventDefault(); addLeadTag('${contactId}', document.getElementById('${inputId}').value); closeTagSuggestions();">

  </div>`;
}
function goToCrmSettings(){ UI.tab = 'settings'; render(); }
/* ── custom tag-suggestion popup — deliberately NOT a native <datalist>: Chrome's own datalist
   dropdown intercepts the Enter keystroke for itself, so "type a tag and press Enter" silently did
   nothing (confirmed live) even though the Add button worked. This dropdown is plain DOM/JS, so
   nothing but our own code ever sees the keystroke — same reasoning as the date-picker popup. ── */
let OPEN_TAG_SUGGEST = null;
function closeTagSuggestions(){
  const el = document.getElementById('tag-suggest-popup');
  if (el) el.remove();
  document.removeEventListener('click', tagSuggestOutsideClick, true);
  OPEN_TAG_SUGGEST = null;

function tagSuggestOutsideClick(e){
  const popup = document.getElementById('tag-suggest-popup');
  const input = OPEN_TAG_SUGGEST && document.getElementById(OPEN_TAG_SUGGEST.inputId);
  if (popup && !popup.contains(e.target) && e.target!==input) closeTagSuggestions();
}
function updateTagSuggestions(inputId, contactId){
  const input = document.getElementById(inputId); if (!input) return;
  const q = input.value.trim().toLowerCase();
  const c = contactById(contactId);
  const existing = (c && c.tags) || [];
  const matches = allKnownTags().filter(t => !existing.includes(t) && (!q || t.includes(q))).slice(0,8);
  if (!matches.length) { closeTagSuggestions(); return; }
  let popup = document.getElementById('tag-suggest-popup');
  if (!popup) {
    popup = document.createElement('div');
    popup.id = 'tag-suggest-popup';
    popup.className = 'tag-suggest-popup';
    document.body.appendChild(popup);
    setTimeout(()=>document.addEventListener('click', tagSuggestOutsideClick, true), 0);
  }
  const rect = input.getBoundingClientRect();
  popup.style.top = (rect.bottom+window.scrollY+2)+'px';
  popup.style.left = (rect.left+window.scrollX)+'px';
  popup.style.width = rect.width+'px';
  popup.innerHTML = matches.map(t=>`<div class="tag-suggest-item" onclick="pickTagSuggestion('${contactId}','${jsStr(t)}')">${esc(t)}</div>`).join('');
  OPEN_TAG_SUGGEST = { inputId, contactId };
}
function pickTagSuggestion(contactId, tag){
  addLeadTag(contactId, tag);
  closeTagSuggestions();
}
/* ── manage-tags modal: pre-create a tag with nobody on it yet (so it appears in filters/autocomplete
   right away), or delete one entirely — which strips it off every lead that has it, so a deleted tag
   can never be filtered by again. ── */
function addCatalogTag(){
  const input = document.getElementById('new-tag-input'); if (!input) return;
  const tag = input.value.trim().toLowerCase(); if (!tag) return;
  registerTag(tag);
  input.value = '';
  refreshManageTagsModal();
  render();
}
function deleteTagGlobally(tag){
  const affected = (STATE.data.contacts||[]).filter(c => (c.tags||[]).includes(tag)).length;
  confirmAction(`Delete the tag "${tag}"?${affected?` It will be removed from ${affected} lead${affected===1?'':'s'}.`:''}`, ()=>{
    STATE.data.tagCatalog = (STATE.data.tagCatalog||[]).filter(t=>t!==tag);
    db.tagCatalog.remove(tag);
    (STATE.data.contacts||[]).forEach(c => {
      if (c.tags && c.tags.includes(tag)) { c.tags = c.tags.filter(t=>t!==tag); db.contacts.update(c.id, { tags: c.tags }); }
    });
    if (UI.crm.tag===tag) UI.crm.tag = 'all';
    showToast(`Tag "${tag}" deleted`);
    refreshManageTagsModal();
    render();
  });
}
function refreshManageTagsModal(){
  const host = document.getElementById('manage-tags-list');
  if (host) host.innerHTML = renderManageTagsList();
}
function renderManageTagsList(){
  const tags = allKnownTags();
  if (!tags.length) return emptyState('No tags yet', 'Add one below.');
  return tags.map(t => {
    const count = (STATE.data.contacts||[]).filter(c=>(c.tags||[]).includes(t)).length;
    return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft)">
      <span class="lead-tag-chip">${esc(t)}</span>
      <span style="font-size:11.5px;color:var(--ink-soft);flex:1">${count} lead${count===1?'':'s'}</span>
      <button type="button" class="btn ghost small danger" onclick="deleteTagGlobally('${jsStr(t)}')">Delete</button>
    </div>`;
  }).join('');
}
function renderLeadCard(c){

  const overdue = c.nextFollowUp && c.nextFollowUp < today;
  const dueToday = c.nextFollowUp === today;
  return `<div class="lead-card" data-lead-id="${c.id}" draggable="true" ondragstart="onLeadDragStart(event,'${c.id}')" onclick="goToLeadConversation('${c.id}')" tabindex="0" onkeydown="if(event.key==='Enter'){goToLeadConversation('${c.id}')}">
    <div class="lead-card-top">

      <div class="lead-name">${esc(c.fullName)}${unreadBadge(c)}</div>
    </div>
    <div class="lead-tags">
      ${leadTagChip(c.division, LEAD_STATUS_COLOR[c.status])}
      ${leadTagChip(c.source, LEAD_SOURCE_COLOR[c.source]||'var(--ink-faint)')}
    </div>
    <div class="lead-meta mono">${esc(c.phone||'—')}</div>

    ${c.nextFollowUp ? `<div class="lead-due ${overdue?'overdue':(dueToday?'today':'')}">${overdue?'⚠ Overdue':(dueToday?'● Due today':'○ Follow up')} · ${fmtDateShort(c.nextFollowUp)}</div>` : ''}
    <select class="lead-move" onclick="event.stopPropagation()" onchange="moveLead('${c.id}',this.value)" aria-label="Move ${esc(c.fullName)} to another stage">

    </select>

let DRAGGED_LEAD_ID = null;
function onLeadDragStart(e, id){ DRAGGED_LEAD_ID = id; try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', id); }catch(err){} }
function onLeadDragOver(e, colEl){ e.preventDefault(); try{ e.dataTransfer.dropEffect='move'; }catch(err){} if (colEl) colEl.classList.add('drag-over'); }
function onLeadDragLeave(colEl){ if (colEl) colEl.classList.remove('drag-over'); }
function onLeadDrop(e, status, colEl){
  e.preventDefault();
  if (colEl) colEl.classList.remove('drag-over');
  let id = DRAGGED_LEAD_ID;
  try { id = e.dataTransfer.getData('text/plain') || id; } catch(err){}
  DRAGGED_LEAD_ID = null;
  if (id) moveLead(id, status);
}
function moveLead(id, status){
  const c = contactById(id); if (!c || c.status===status) return;
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const old = c.status;
  c.status = status;
  if (status==='Booked' || status==='Not Relevant') c.nextFollowUp = '';
  db.contacts.update(c.id, { status: c.status, nextFollowUp: c.nextFollowUp });
  logContactActivity(c, actor, `Stage changed from "${old}" to "${status}"`);
  logLeadEvent(c, `Stage changed from "${old}" to "${status}"`);
  showToast(`${c.fullName} → ${status}`);
  render();
  const moved = document.querySelector(`.lead-card[data-lead-id="${id}"]`);
  if (moved) { moved.classList.add('just-moved'); setTimeout(()=>moved.classList.remove('just-moved'), 700); }
}

   unified-inbox layout Ofek uses day to day (screenshots he sent), since this screen is where
   Ron spends most of his time and needs to live entirely in conversations, not a modal per lead. */
function setCrmInboxFilter(f){ UI.crm.inboxFilter = f; render(); }
function selectCrmContact(id){ UI.crm.selectedContactId = id; render(); }
// Clicking a lead's name anywhere (Pipeline card, Table row, the Reminders follow-up banner) jumps
// straight into the live conversation, instead of opening the full edit modal. Explicit action buttons
// ("Follow-up / edit", "Full profile", "Open") still open the modal — only the plain name-click changes.
function goToLeadConversation(contactId){
  UI.tab = 'crm';
  UI.crm.view = 'inbox';
  UI.crm.selectedContactId = contactId;
  render();
}
// What a lead's active follow-up is actually about — shown next to the name in "Needs a follow-up
// today" and above the conversation, so a click-through doesn't leave Ofek guessing why he's there.
function leadFollowupContextFor(c){
  if (c.followupNote) return c.followupNote;
  const r = (STATE.data.manualReminders||[]).find(x => x.contactId===c.id && !x.done && x.date===c.nextFollowUp);
  if (!r) return '';
  const suffix = ' — '+c.fullName;
  const title = r.title.endsWith(suffix) ? r.title.slice(0, -suffix.length) : r.title;
  return r.note ? title+' — '+r.note : title;
}
function setLeadFollowupNote(id, value){ const c = contactById(id); if (c) { c.followupNote = value; db.contacts.update(id, { followupNote: value }); } }
function toggleLeadStar(id, event){
  if (event) event.stopPropagation();
  const c = contactById(id); if (!c) return;
  c.starred = !c.starred;
  db.contacts.update(id, { starred: c.starred });
  render();
}
function setLeadFollowupDate(id, value){
  const c = contactById(id); if (!c) return;
  const old = c.nextFollowUp||''; c.nextFollowUp = value;
  db.contacts.update(id, { nextFollowUp: value });
  if (old!==value) logContactActivity(c, getCurrentProfile()?.fullName||'Unknown', `Follow-up date changed from "${old||'—'}" to "${value||'—'}"`);
}
function setLeadEstimatedValue(id, value){
  const c = contactById(id); if (!c) return;
  const num = Number(value)||0;
  if ((c.estimatedValue||0)!==num) { logContactActivity(c, getCurrentProfile()?.fullName||'Unknown', `Estimated value changed from ${fmtMoney(c.estimatedValue||0)} to ${fmtMoney(num)}`); c.estimatedValue = num; db.contacts.update(id, { estimatedValue: num }); }
}
function setLeadSalesValue(id, value){
  const c = contactById(id); if (!c) return;
  const num = Number(value)||0;
  if ((c.salesValue||0)!==num) { logContactActivity(c, getCurrentProfile()?.fullName||'Unknown', `Sales value changed from ${fmtMoney(c.salesValue||0)} to ${fmtMoney(num)}`); c.salesValue = num; db.contacts.update(id, { salesValue: num }); }
}
function setLeadJobDescription(id, value){ const c = contactById(id); if (c) { c.jobDescription = value; db.contacts.update(id, { jobDescription: value }); } }
function initials(name){
  return (name||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).filter(Boolean).join('').toUpperCase() || '?';
}
function crmInboxRowPreview(c){
  const msgs = (c.messages||[]).filter(m=>m.kind==='message');
  if (!msgs.length) return c.jobDescription || 'No messages yet';
  const last = msgs.slice().sort((a,b)=>new Date(a.at).getTime()-new Date(b.at).getTime()).pop();
  return (last.direction==='out' ? 'You: ' : '') + last.text;
}
function relativeShortTime(iso){
  const d = new Date(iso), now = new Date();
  if (d.toDateString()===now.toDateString()) return d.toLocaleTimeString('en-AU', {hour:'numeric', minute:'2-digit'});
  const diffDays = Math.round((now-d)/86400000);
  if (diffDays===1) return 'Yesterday';
  if (diffDays>=0 && diffDays<7) return d.toLocaleDateString('en-AU', {weekday:'short'});
  return fmtDateShort(String(iso).slice(0,10));
}
function crmInboxFilterList(contacts){
  const f = UI.crm.inboxFilter || 'all';
  if (f==='unread') return contacts.filter(c=>unreadCountFor(c)>0);
  if (f==='starred') return contacts.filter(c=>c.starred);
  if (f==='recent') { const cutoff = Date.now()-7*86400000; return contacts.filter(c=>new Date(lastContactedAt(c)).getTime()>=cutoff); }
  return contacts;
}

function renderCrmOverview(profile, data){
  const range = resolveCrmRange();
  const contacts = filteredContacts(data);
  const stats = computeCrmStats(contacts);

  const rangeChips = [['week','This week'],['month','This month'],['7d','Last 7 days'],['30d','Last 30 days'],['custom','Custom']]
    .map(([k,l]) => `<button class="week-chip ${UI.crmOverview.range===k?'active':''}" onclick="setCrmRange('${k}')">${l}</button>`).join('');
  const customInputs = UI.crmOverview.range==='custom' ? `
    <input type="date" style="width:auto" value="${UI.crmOverview.customFrom||''}" onchange="UI.crmOverview.customFrom=this.value;render()">
    <span style="color:var(--ink-faint);font-size:12px;align-self:center">to</span>
    <input type="date" style="width:auto" value="${UI.crmOverview.customTo||''}" onchange="UI.crmOverview.customTo=this.value;render()">` : '';

  const sourceBars = renderBarGroup(LEAD_SOURCES.map(s => ({ label:s, value:stats.bySource[s], color:LEAD_SOURCE_COLOR[s] })), { fmt:(n)=>String(n) });
  const divisionRows = LEAD_DIVISIONS.map(d => {
    const v = stats.byDivision[d];
    const rate = (v.won+0)>0 || v.total>0 ? (v.total ? Math.round((v.won/v.total)*100) : 0) : 0;
    return `<div class="kv"><span>${d}</span><span class="v">${v.total} · ${rate}% won</span></div>`;
  }).join('');
  // Drill-down bars for the two sub-tag families — only rendered when the parent bucket actually
  // has leads this period, so an account with no Aircon/Meta activity yet doesn't show empty charts.
  const airconTypeTotal = AIRCON_TYPE_TAGS.reduce((s,t)=>s+stats.byAirconType[t],0);
  const metaPlatformTotal = META_PLATFORM_TAGS.reduce((s,t)=>s+stats.byMetaPlatform[t],0);
  const airconTypeBars = airconTypeTotal ? renderBarGroup(AIRCON_TYPE_TAGS.map(t => ({ label:t, value:stats.byAirconType[t], color:'var(--primary)' })), { fmt:(n)=>String(n) }) : '';
  const metaPlatformBars = metaPlatformTotal ? renderBarGroup(META_PLATFORM_TAGS.map(t => ({ label:t, value:stats.byMetaPlatform[t], color:'var(--accent)' })), { fmt:(n)=>String(n) }) : '';

  // Sales Value (what was actually agreed on the phone, distinct from the Estimated Value) attributed
  // to whichever technician the lead's linked job belongs to — leads not yet linked to a job land in
  // "Unassigned" rather than being silently dropped. Manual today; once a job's own completion updates
  // Sales Value automatically (internal, not a ServiceM8 API integration — we're replacing ServiceM8,
  // not connecting to it), this becomes a real per-technician sales total.
  const salesByTech = {};
  contacts.forEach(c => {
    if (!c.salesValue) return;
    const job = c.linkedJobId ? STATE.data.jobs.find(j=>j.id===c.linkedJobId) : null;
    const tech = job ? job.technician : 'Unassigned';
    salesByTech[tech] = round2((salesByTech[tech]||0) + Number(c.salesValue));
  });
  const salesByTechEntries = Object.entries(salesByTech).sort((a,b)=>b[1]-a[1]);
  const salesByTechTotal = round2(salesByTechEntries.reduce((s,[,v])=>s+v,0));

  return `
    <div class="page-head">
      <div><h1 class="page-title">Leads &amp; Marketing</h1><div class="page-sub">${esc(range.label)} · ${contacts.length} lead${contacts.length===1?'':'s'} · reporting, not day-to-day work</div></div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      ${rangeChips}${customInputs}
      <select style="width:auto" onchange="UI.crmOverview.source=this.value;render()"><option value="all">All sources</option>${LEAD_SOURCES.map(s=>`<option value="${s}" ${UI.crmOverview.source===s?'selected':''}>${s}</option>`).join('')}</select>
      <select style="width:auto" onchange="UI.crmOverview.division=this.value;render()"><option value="all">All divisions</option>${LEAD_DIVISIONS.map(d=>`<option value="${d}" ${UI.crmOverview.division===d?'selected':''}>${d}</option>`).join('')}</select>
    </div>

    <div class="grid-4">
      <div class="card stat-card" style="--stat-accent:var(--primary)"><div class="stat-label">Total leads</div><div class="stat-value">${stats.total}</div><div class="stat-sub">in this period</div></div>
      <div class="card stat-card" style="--stat-accent:var(--warn)"><div class="stat-label">In follow-up</div><div class="stat-value">${stats.byStatus['Follow-up']}</div><div class="stat-sub">${stats.byStatus.New} still new</div></div>
      <div class="card stat-card" style="--stat-accent:var(--good)"><div class="stat-label">Booked</div><div class="stat-value">${stats.byStatus.Booked}</div><div class="stat-sub">${stats.closeRate===null?'no closed leads yet':stats.closeRate+'% close rate'}</div></div>
      <div class="card stat-card" style="--stat-accent:var(--bad)"><div class="stat-label">Not Relevant</div><div class="stat-value">${stats.byStatus['Not Relevant']}</div><div class="stat-sub">${fmtMoney(stats.wonValue)} booked value</div></div>
    </div>

    <div class="section-title">Where leads come from</div>
    <div class="grid-2">
      <div class="card stat-card" style="--stat-accent:var(--primary)"><div class="stat-label">By marketing channel</div>${sourceBars}</div>
      <div class="card stat-card" style="--stat-accent:var(--accent)"><div class="stat-label">By division</div><div style="margin-top:6px">${divisionRows}</div></div>
    </div>
    ${(airconTypeBars || metaPlatformBars) ? `<div class="grid-2" style="margin-top:12px">
      ${airconTypeBars ? `<div class="card stat-card" style="--stat-accent:var(--primary)"><div class="stat-label">Aircon — Split vs Duct</div>${airconTypeBars}<div class="hint" style="margin-top:6px">Only counts leads where the type is known from the landing page or the customer's message — the rest still count toward Aircon above, just unsplit.</div></div>` : ''}
      ${metaPlatformBars ? `<div class="card stat-card" style="--stat-accent:var(--accent)"><div class="stat-label">Meta Ads — Facebook vs Instagram</div>${metaPlatformBars}<div class="hint" style="margin-top:6px">Depends on each ad's placement tracking being set up in Ads Manager — leads from ads without it still count toward Meta Ads above, just unsplit.</div></div>` : ''}
    </div>` : ''}

    <div class="section-title">Sales value by technician</div>
    <div class="card stat-card" style="--stat-accent:var(--good)">
      <div class="stat-label">Total sales value this period</div>
      <div class="stat-value" style="font-size:22px">${fmtMoney(salesByTechTotal)}</div>
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft)">
        ${salesByTechEntries.length ? salesByTechEntries.map(([t,v])=>`<div class="kv"><span>${esc(t)}</span><span class="v">${fmtMoney(v)}</span></div>`).join('') : emptyState('No sales value recorded yet')}
      </div>
      <div class="hint" style="margin-top:8px">Attributed via each lead's linked job. Leads not yet linked to a job show under "Unassigned."</div>
    </div>

    <div class="card" style="margin-top:18px;border-inline-start:4px solid var(--ink-faint)">
      <div class="stat-label" style="margin-bottom:4px">Marketing spend &amp; cost-per-lead</div>
      <div class="hint">Coming after the Stage 3 backend — real Google Ads &amp; Meta Ads API connections will feed cost-per-lead, close rate per channel, and net profit per job here automatically. No manual expense entry.</div>
    </div>
  `;
}

function createFollowup(contactId){
  const c = contactById(contactId); if (!c) return;
  const text = document.getElementById('lm-fu-text').value.trim();
  const date = document.getElementById('lm-fu-date').value;
  const kind = document.getElementById('lm-fu-kind').value;
  const note = (document.getElementById('lm-fu-note')?.value||'').trim();
  if (!text) { modalError('Write what needs doing, or pick a preset'); return; }
  if (!date) { modalError('Pick a date for the follow-up'); return; }
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  if (kind==='task') {
    STATE.data.tasks.push({
      id: uid(), board:'ron', title:`${text} — ${c.fullName}`, status:'Not Started', due:date, headsUp:'',
      notes:note||c.jobDescription||'', client:c.fullName, priority:'Medium', assignees:['Ron'], technician:'', category:'',
      createdBy:actor, createdAt:new Date().toISOString(), subtasks:[], updates:[],
      activityLog:[{ id:uid(), at:new Date().toISOString(), actor, text:'Created from a CRM follow-up' }],
    });
  } else {
    db.manualReminders.create({ date, title:`${text} — ${c.fullName}`, note, contactId:c.id, contactName:c.fullName, done:false });
  }
  c.nextFollowUp = date;
  if (c.status==='New') c.status = 'Follow-up';
  db.contacts.update(c.id, { nextFollowUp: c.nextFollowUp, status: c.status });
  logContactActivity(c, actor, `Follow-up set for ${fmtDateShort(date)} — "${text}"${note?` (note: "${note}")`:''} (${kind})`);
  logLeadEvent(c, `Follow-up set for ${fmtDateShort(date)} — "${text}"`);
  closeModal();
  showToast(kind==='task'?'Task created':'Reminder created');
  render();
}
function deleteLead(id){

}
async function saveLeadModal(contactId){
  const fullName = document.getElementById('lm-name').value.trim();
  if (!fullName) { modalError('Please enter a name'); return; }
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const prev = contactId ? contactById(contactId) : null;
  const before = prev ? { status:prev.status, division:prev.division, source:prev.source, nextFollowUp:prev.nextFollowUp, estimatedValue:prev.estimatedValue } : null;
  const values = {
    fullName,
    phone: document.getElementById('lm-phone').value.trim(),
    email: document.getElementById('lm-email').value.trim(),
    postcode: document.getElementById('lm-postcode').value.trim(),
    division: document.getElementById('lm-division').value,
    source: document.getElementById('lm-source').value,
    status: document.getElementById('lm-status').value,
    estimatedValue: Number(document.getElementById('lm-value').value)||0,
    salesValue: Number(document.getElementById('lm-sales').value)||0,
    nextFollowUp: document.getElementById('lm-followup').value,
    jobDescription: document.getElementById('lm-desc').value,
  };
  let c;
  // Update reuses the existing (already-real) id and can fire-and-forget; create has to be
  // awaited first so the real database-assigned id exists before anything below (activity log,
  // "lead created" event) tries to persist against it.
  if (prev) { c = prev; db.contacts.update(c.id, values); }
  else {
    try { c = await db.contacts.create({ createdAt:todayStr(), linkedJobId:null, activityLog:[], messages:[], lastReadAt:null, starred:false, tags:[], ...values }); }
    catch (err) { return; }   // db.contacts.create() already showed an error toast; leave the modal open so the user can retry
  }
  if (before) {
    if (before.status !== values.status) { logContactActivity(c, actor, `Stage changed from "${before.status}" to "${values.status}"`); logLeadEvent(c, `Stage changed from "${before.status}" to "${values.status}"`); }
    if (before.division !== values.division) logContactActivity(c, actor, `Division changed from "${before.division}" to "${values.division}"`);
    if (before.source !== values.source) logContactActivity(c, actor, `Source changed from "${before.source}" to "${values.source}"`);
    if ((before.nextFollowUp||'') !== (values.nextFollowUp||'')) logContactActivity(c, actor, `Follow-up date changed from "${before.nextFollowUp||'—'}" to "${values.nextFollowUp||'—'}"`);
    if (before.estimatedValue !== values.estimatedValue) logContactActivity(c, actor, `Estimated value changed from ${fmtMoney(before.estimatedValue)} to ${fmtMoney(values.estimatedValue)}`);
  } else {
    logContactActivity(c, actor, 'Lead created');
    logLeadEvent(c, values.jobDescription ? `Lead created: ${values.jobDescription}` : 'Lead created');
  }
  closeModal(); showToast(contactId?'Lead updated':'Lead added'); render();
}

/* ── overview ────────────────────────────────────────────────────────── */
function renderOverview(profile, data){
  const isTech = profile.role==='technician';
  const techFilter = isTech ? (profile.technicianName||undefined) : undefined;
  const range = resolveOverviewRange(UI.overview);
  const rangeData = computeRange(data, range.start, range.end, techFilter);
  const spanDays = dateSpanDays(range.start, range.end);
  const chartSeries = spanDays <= 14 ? computeRevenueByWeekday(rangeData.jobs) : computeRevenueByWeekInRange(data, range.start, range.end, techFilter);

  const reminders = computeReminders(data);
  const openTasks = data.tasks.filter(t=>t.status!=='Done').length;
  const openQuotes = data.quotes.filter(q=>['In Discussion','Waiting for Reply'].includes(q.status)).length;

  const rangeChips = [['week','This week'],['month','This month'],['7d','Last 7 days'],['30d','Last 30 days'],['custom','Custom']]
    .map(([key,label]) => `<button class="week-chip ${UI.overview.range===key?'active':''}" onclick="setOverviewRange('${key}')">${label}</button>`).join('');
  const customInputs = UI.overview.range==='custom' ? `
    <input type="date" style="width:auto" value="${UI.overview.customFrom||''}" onchange="UI.overview.customFrom=this.value;render()">
    <span style="color:var(--ink-faint);font-size:12px;align-self:center">to</span>
    <input type="date" style="width:auto" value="${UI.overview.customTo||''}" onchange="UI.overview.customTo=this.value;render()">
  ` : '';

  const shortcuts = [];
  if (canViewSection(profile,'reminders')) shortcuts.push(`<div class="card stat-card" style="--stat-accent:var(--warn);cursor:pointer" onclick="goTab('reminders')"><div class="stat-label">Open Reminders</div><div class="stat-value">${reminders.length}</div><div class="stat-sub">View →</div></div>`);
  if (canViewSection(profile,'tasks')) shortcuts.push(`<div class="card stat-card" style="--stat-accent:var(--primary);cursor:pointer" onclick="goTab('tasks')"><div class="stat-label">Open Tasks</div><div class="stat-value">${openTasks}</div><div class="stat-sub">View →</div></div>`);
  if (canViewSection(profile,'quotes')) shortcuts.push(`<div class="card stat-card" style="--stat-accent:var(--good);cursor:pointer" onclick="goTab('quotes')"><div class="stat-label">Open Quotes</div><div class="stat-value">${openQuotes}</div><div class="stat-sub">View →</div></div>`);

  if (isTech) {

/* ── CSV export (client-side only; nothing leaves the browser) ─────────── */
function csvCell(v){
  const s = v==null ? '' : String(v);
  const needsQuotes = s.indexOf('"')!==-1 || s.indexOf(',')!==-1 || s.indexOf('\n')!==-1;
  return needsQuotes ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCsv(filename, rows){
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
// A full backup of everything in this browser's test data — Ofek asked for this specifically so
// nothing from his CRM testing gets lost when Stage 3 (the real backend) replaces this local-only
// storage. Downloads the exact same object the app itself reads/writes (STATE.data), so it's a
// complete, faithful snapshot, not a partial export of just one section.
function exportDataAsJson(){
  const json = JSON.stringify(STATE.data, null, 2);
  const blob = new Blob([json], {type:'application/json;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `the-guys-data-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast('Data exported');
}
function exportJobsCsv(){
  const profile = getCurrentProfile(); if (!profile) return;
  const data = filterForProfile(STATE.data, profile);
  const jobs = computeFilteredJobs(data);
  const header = ['Technician','Date','Customer','Invoice','Type','Amount','GST Included','Status','Method','GST Amount','Parts Cost','Parts Paid By','Commission %','Commission','Tech Paid','Review','Notes'];
  const rows = jobs.map(j => [j.technician, j.date, j.customerName, j.invoiceNumber||'', j.jobType, j.amount, j.includesGST?'Yes':'No', j.paymentStatus, j.paymentMethod||'', j.includesGST?jobGst(j):'', j.partsCost||'', j.partsPaidBy||'', j.commissionPercent, jobCommissionAmount(j), j.paidToTechnician, j.reviewTaken?'Yes':'No', j.notes||'']);
  downloadCsv(`jobs-${todayStr()}.csv`, [header, ...rows]);
}

/* ── jobs ────────────────────────────────────────────────────────────── */
// Column order is fixed per spec: Technician, Date, Customer Name, Invoice, Job Type, Amount, GST,
// Status, Method, GST Amount, Parts Cost, Parts Paid By, %, Commission, Tech Paid, Review, Notes.
// "GST" is a yes/no indicator; "GST Amount" is the actual computed dollar figure (jobGst(j)).
const JOB_COLUMNS = [
  {key:'technician', label:'Technician'}, {key:'date', label:'Date'}, {key:'customer', label:'Customer'},
  {key:'invoice', label:'Invoice'}, {key:'type', label:'Type'}, {key:'amount', label:'Amount'},
  {key:'gst', label:'GST'}, {key:'status', label:'Status'}, {key:'method', label:'Method'},
  {key:'gstAmount', label:'GST Amount'}, {key:'partsCost', label:'Parts Cost'}, {key:'partsPaidBy', label:'Parts Paid By'},
  {key:'percent', label:'%'}, {key:'commission', label:'Commission'}, {key:'techPaid', label:'Tech Paid'}, {key:'review', label:'Review'}, {key:'notes', label:'Notes'},
];
function jobColumnText(j, key){
  switch(key){
    case 'technician': return j.technician||'';
    case 'date': return fmtDateShort(j.date);
    case 'customer': return j.customerName||'';
    case 'invoice': return j.invoiceNumber||'';
    case 'type': return j.jobType||'';
    case 'amount': return fmtMoney(j.amount);
    case 'gst': return j.includesGST?'Yes':'No';
    case 'status': return j.paymentStatus||'';
    case 'method': return j.paymentMethod||'';
    case 'gstAmount': return j.includesGST?fmtMoney(jobGst(j)):'';
    case 'partsCost': return j.partsCost?fmtMoney(j.partsCost):'';
    case 'partsPaidBy': return j.partsPaidBy||'';
    case 'percent': return String(j.commissionPercent??'');
    case 'commission': return fmtMoney(jobCommissionAmount(j));
    case 'techPaid': return j.paidToTechnician||'';
    case 'review': return j.reviewTaken?'Yes':'No';
    case 'notes': return j.notes||'';
    default: return '';
  }
}
function computeFilteredJobs(data){
  let jobs = [...data.jobs].sort((a,b)=>b.date.localeCompare(a.date));
  if (UI.jobs.tech!=='all') jobs = jobs.filter(j=>j.technician===UI.jobs.tech);
  if (UI.jobs.status!=='all') jobs = jobs.filter(j=>j.paymentStatus===UI.jobs.status);
  if (UI.jobs.week!=='all') jobs = jobs.filter(j=>weekOf(j.date).key===UI.jobs.week);
  const filters = UI.jobsFilters || {};
  Object.keys(filters).forEach(key => {
    const q = (filters[key]||'').trim().toLowerCase();
    if (q) jobs = jobs.filter(j => jobColumnText(j,key).toLowerCase().indexOf(q)!==-1);
  });
  return jobs;
}

function contactEditableCell(contactId, field, displayHtml, inputType){

function startContactCellEdit(el, contactId, field, inputType){
  if (el.querySelector('input')) return;
  const c = contactById(contactId); if (!c) return;
  const input = document.createElement('input');
  input.type = inputType;
  input.value = c[field] ?? '';
  input.className = 'cell-edit-input';
  input.onkeydown = (e) => { if (e.key==='Enter'){ e.preventDefault(); input.blur(); } if (e.key==='Escape'){ e.preventDefault(); render(); } };
  input.onblur = () => commitContactCellEdit(contactId, field, input.value, inputType);
  el.innerHTML = ''; el.appendChild(input); input.focus(); input.select();

function commitContactCellEdit(contactId, field, rawValue, inputType){
  const c = contactById(contactId); if (!c) { render(); return; }
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const oldVal = c[field];
  const newVal = inputType==='number' ? (Number(rawValue)||0) : rawValue.trim();
  if (oldVal !== newVal) {
    c[field] = newVal;
    db.contacts.update(c.id, { [field]: newVal });
    if (field==='salesValue') logContactActivity(c, actor, `Sales value changed from ${fmtMoney(oldVal||0)} to ${fmtMoney(newVal)}`);

function startJobCellEdit(el, jobId, field, inputType){

  input.select();

function commitJobCellEdit(jobId, field, rawValue, inputType){
  const job = STATE.data.jobs.find(j=>j.id===jobId);
  if (!job) { refreshJobsTable(); return; }
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const oldVal = job[field];
  const newVal = inputType==='number' ? (Number(rawValue)||0) : rawValue.trim();
  if (oldVal !== newVal) {
    job[field] = newVal;
    db.jobs.update(job.id, { [field]: newVal });
    const financialFieldLabels = { amount:'Amount', partsCost:'Parts cost' };
    if (financialFieldLabels[field]) {
      logJobActivity(job, actor, `${financialFieldLabels[field]} changed from ${typeof oldVal==='number'?fmtMoney(oldVal):(oldVal||'—')} to ${typeof newVal==='number'?fmtMoney(newVal):(newVal||'—')}`);
    }
  }
  refreshJobsTable();
}

function renderSearchResults(query){

    (j.technician||'').toLowerCase().indexOf(q)!==-1
  ).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);

async function saveJobModal(jobId){

  };
  let job;

  }
  if (oldSnapshot) {
    if (oldSnapshot.amount !== values.amount) logJobActivity(job, actor, `Amount changed from ${fmtMoney(oldSnapshot.amount)} to ${fmtMoney(values.amount)}`);
    if (oldSnapshot.paymentStatus !== values.paymentStatus) logJobActivity(job, actor, `Payment status changed from "${oldSnapshot.paymentStatus}" to "${values.paymentStatus}"`);
    if ((oldSnapshot.paymentMethod||'') !== (values.paymentMethod||'')) logJobActivity(job, actor, `Payment method changed from "${oldSnapshot.paymentMethod||'—'}" to "${values.paymentMethod||'—'}"`);

    if (oldSnapshot.reviewTaken !== values.reviewTaken) logJobActivity(job, actor, `Review ${values.reviewTaken?'marked as taken':'unmarked'}`);
  } else {
    logJobActivity(job, actor, 'Job created');
  }
  await ensureContactForJob(job);
