<style>
:root {
  --ink: #12242c; --ink-soft: #4e6870; --ink-faint: #8398a0;
  --paper: #f2f6f6; --surface: #ffffff; --surface-2: #eaf1f1; --surface-3: #dfe9e9;
  --line: #d5e2e2; --line-soft: #e6eeee;
  --primary: #235469; --primary-strong: #163b4a; --primary-soft: #dfedf0; --primary-teal: #4f93ac;
  --accent: #d97a3f; --accent-soft: #fbe8d9;
  --on-primary: #f5fafb;
  --good: #2c7a52; --good-soft: #dcf0e4; --warn: #a97423; --warn-soft: #f6e8cd; --bad: #b8402c; --bad-soft: #f8ded6;
  --guy: #c1652e; --dolev: #7a5ca0; --noam: #2f7d6e; --ofek: #3f7f8f;
  --shadow-sm: 0 1px 2px rgba(10,28,36,.05);
  --shadow: none;
  --shadow-lg: 0 4px 10px rgba(10,28,36,.08), 0 18px 38px rgba(10,28,36,.14);
  --radius: 8px; --radius-sm: 6px; --radius-lg: 14px;
  --focus-ring: 0 0 0 3px rgba(35,84,105,.2);
  /* fixed dark chrome for the sidebar — stays constant across light/dark theme, like a product's brand rail */
  --sidebar-bg: #142129; --sidebar-bg-active: #23404c; --sidebar-bg-hover: #1c313b;
  --sidebar-ink: #d7e4e7; --sidebar-ink-soft: #8ba0a6; --sidebar-ink-faint: #5d767d;
  --sidebar-line: #24373f; --sidebar-accent: #6fb8cf;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e6eef0; --ink-soft: #9fb4ba; --ink-faint: #62787f;
    --paper: #0b1418; --surface: #121e23; --surface-2: #17272d; --surface-3: #1e3138;
    --line: #24393f; --line-soft: #1a2b31;
    --primary: #6fb3c9; --primary-strong: #93cbdd; --primary-soft: #163038; --primary-teal: #5aa3bc;
    --accent: #e69a5c; --accent-soft: #3a2716;
    --on-primary: #071215;
    --good: #6fc494; --good-soft: #143121; --warn: #dcae54; --warn-soft: #302711; --bad: #e2795f; --bad-soft: #331f18;
    --guy: #e0834a; --dolev: #b092d6; --noam: #5fbfa8; --ofek: #74c3d4;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow: none;
    --shadow-lg: 0 6px 14px rgba(0,0,0,.4), 0 22px 44px rgba(0,0,0,.48);
    --focus-ring: 0 0 0 3px rgba(111,179,201,.3);
  }
}
:root[data-theme="dark"] {
  --ink: #e6eef0; --ink-soft: #9fb4ba; --ink-faint: #62787f;
  --paper: #0b1418; --surface: #121e23; --surface-2: #17272d; --surface-3: #1e3138;
  --line: #24393f; --line-soft: #1a2b31;
  --primary: #6fb3c9; --primary-strong: #93cbdd; --primary-soft: #163038; --primary-teal: #5aa3bc;
  --accent: #e69a5c; --accent-soft: #3a2716;
  --on-primary: #071215;
  --good: #6fc494; --good-soft: #143121; --warn: #dcae54; --warn-soft: #302711; --bad: #e2795f; --bad-soft: #331f18;
  --guy: #e0834a; --dolev: #b092d6; --noam: #5fbfa8; --ofek: #74c3d4;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: none;
  --shadow-lg: 0 6px 14px rgba(0,0,0,.4), 0 22px 44px rgba(0,0,0,.48);
  --focus-ring: 0 0 0 3px rgba(111,179,201,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: 'Karla', system-ui, -apple-system, sans-serif;
  font-size: 14.5px; line-height: 1.5; min-height: 100vh; direction: ltr;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .display { font-family: 'Sora', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.01em; }
.mono, .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
button { font-family: inherit; cursor: pointer; }
a { color: var(--primary-strong); }
::selection { background: var(--primary-soft); }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.card.tight { padding: 14px 16px; }
.card.flat { box-shadow: none; }
.stat-label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; font-family: 'Sora', sans-serif; }
.stat-value { font-size: 26px; font-weight: 600; margin-top: 7px; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.stat-sub { font-size: 12px; color: var(--ink-soft); margin-top: 5px; }
.stat-card { position: relative; overflow: hidden; padding-inline-start: 23px; }
.stat-card::before { content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; background: var(--stat-accent, var(--primary-teal)); }

.page-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap: wrap; }
.page-title { font-size: 30px; margin: 0; font-weight: 700; font-family: 'Sora', sans-serif; text-wrap: balance; letter-spacing: -0.015em; }
.page-sub { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }

.section-title { font-size: 15px; font-weight: 700; margin: 32px 0 13px; display: flex; align-items: center; gap: 8px; font-family: 'Sora', sans-serif; color: var(--ink); text-transform: uppercase; letter-spacing: .03em; }
.section-title .tag { font-size: 11px; font-family: 'Karla', sans-serif; font-weight: 600; text-transform: none; letter-spacing: normal; color: var(--ink-soft); background: var(--surface-2); padding: 2px 9px; border-radius: 99px; }

table { width: 100%; border-collapse: collapse; font-size: 13.3px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
th { text-align: start; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); padding: 12px 13px; border-bottom: 1px solid var(--line); white-space: nowrap; font-weight: 700; background: var(--surface-2); font-family: 'Sora', sans-serif; }
td { padding: 11px 13px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background .1s; }
tbody tr:hover { background: var(--surface-2); }
td.wrap, th.wrap { white-space: normal; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 11.3px; font-weight: 700; white-space: nowrap; border: none; }
.pill::before { content:''; width:6px; height:6px; border-radius:99px; background: currentColor; flex: none; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--surface-3); color: var(--ink-soft); }
.pill.neutral::before { display:none; }
.tech-tag { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 12.6px; }

<script>
'use strict';

/* ── calc engine (ported 1:1 from src/lib/calc.ts — math/logic untouched, only display labels are English) ─ */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function pad2(n){ return String(n).padStart(2,'0'); }
function parseLocalDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtLocal(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayStr(now){ return fmtLocal(now||new Date()); }
function daysBetween(a,b){ return Math.round((b.getTime()-a.getTime())/86400000); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function weekOf(dateStr){
  const d = parseLocalDate(dateStr); const day = d.getDay();
  const diffToMon = day===0 ? -6 : 1-day;
  const monday = new Date(d); monday.setDate(d.getDate()+diffToMon);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const key = fmtLocal(monday);
  const label = `${monday.getDate()} ${MONTHS[monday.getMonth()]} – ${sunday.getDate()} ${MONTHS[sunday.getMonth()]}`;
  return { key, label, monday, sunday };
}
function monthOf(dateStr){
  const d = parseLocalDate(dateStr);
  const key = `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  const label = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return { key, label };
}
function currentWeekKey(now){ return weekOf(todayStr(now)).key; }
function jobGst(job){ return job.includesGST ? round2(job.amount*0.1) : 0; }
function jobTotalCollected(job){ return round2(job.amount + jobGst(job)); }
function jobCommissionAmount(job){ return round2(job.amount * (Number(job.commissionPercent)||0) / 100); }
function commissionRateFor(rates, tech, jobType){
  const t = rates[tech]; if (!t) return null;
  const v = t[jobType]; return (v===null||v===undefined) ? null : v;
}
function technicianNames(data){ return data.employees.filter(e=>e.roles.includes('Technician')).map(e=>e.name); }

function computeWeek(data, weekKey, technicianFilter){
  const jobs = data.jobs.filter(j => weekOf(j.date).key === weekKey);
  const equip = data.equipmentSpend.filter(e => weekOf(e.date).key === weekKey);
  const latePayments = data.jobs.filter(j => j.datePaid && j.paymentStatus==='Paid' && weekOf(j.datePaid).key===weekKey && weekOf(j.date).key!==weekKey);
  const overview = { cash:0, bankTransfer:0, creditCard:0, gstCash:0, gstOther:0, paidCount:0, unpaidCount:0, paidTotal:0, unpaidTotal:0, partsTotal:0, equipmentTotal:0, commissionOwedTotal:0, paidToTechTotal:0 };
  jobs.forEach(j => {
    const total = jobTotalCollected(j); const gst = jobGst(j);
    if (j.paymentMethod==='Cash') { overview.cash += total; overview.gstCash += gst; }
    else if (j.paymentMethod==='Bank Transfer') { overview.bankTransfer += total; overview.gstOther += gst; }
    else if (j.paymentMethod==='Credit Card') { overview.creditCard += total; overview.gstOther += gst; }
    if (j.paymentStatus==='Paid') { overview.paidCount++; overview.paidTotal += j.amount; } else { overview.unpaidCount++; overview.unpaidTotal += j.amount; }
    overview.partsTotal += Number(j.partsCost)||0;
    overview.commissionOwedTotal += jobCommissionAmount(j);
  });
  equip.forEach(e => { overview.equipmentTotal += Number(e.cost)||0; });
  const names = technicianFilter ? [technicianFilter] : technicianNames(data);
  const perTech = {};
  names.forEach(t => {
    const tJobs = jobs.filter(j => j.technician===t);
    const tEquip = equip.filter(e => e.technician===t);
    const tLate = latePayments.filter(j => j.technician===t);
    let owed=0, paidThisWeek=0, paidCount=0, unpaidCount=0, netIncome=0;
    const jobTypeBreak = { Aircon:{count:0,total:0}, Chimney:{count:0,total:0}, 'Pressure Washing':{count:0,total:0}, Other:{count:0,total:0} };
    const distinctDays = new Set();
    tJobs.forEach(j => {
      const comm = jobCommissionAmount(j); owed += comm;
      if (j.paidToTechnician==='Paid') paidThisWeek += comm;
      if (j.paymentStatus==='Paid') paidCount++; else unpaidCount++;
      jobTypeBreak[j.jobType].count++; jobTypeBreak[j.jobType].total += j.amount;
      distinctDays.add(j.date);
      netIncome += (Number(j.amount)||0) - (Number(j.partsCost)||0);
    });
    tEquip.forEach(e => { owed += Number(e.cost)||0; if (e.reimbursed==='Reimbursed') paidThisWeek += Number(e.cost)||0; });
    let latePaymentTotal = 0;
    tLate.forEach(j => { const comm=jobCommissionAmount(j); owed += comm; if (j.paidToTechnician==='Paid') { paidThisWeek += comm; latePaymentTotal += comm; } });
    perTech[t] = {
      owed: round2(owed), paidThisWeek: round2(paidThisWeek), balanceDue: round2(owed-paidThisWeek),
      jobTypeBreak, paidCount, unpaidCount, totalJobs: tJobs.length,
      dailyAvg: distinctDays.size ? round2(netIncome/distinctDays.size) : null,
      daysWorked: distinctDays.size, latePaymentTotal: round2(latePaymentTotal), lateJobs: tLate,
    };
    overview.paidToTechTotal += perTech[t].paidThisWeek;
  });
  const remainingAfterTech = jobs.reduce((s,j)=>s+(Number(j.amount)||0),0) - overview.commissionOwedTotal - overview.partsTotal - overview.equipmentTotal;
  return { weekKey, jobs, equip, overview, perTech, remainingAfterTech };
}

function computeMonth(data, monthKey, technicianFilter){
  const jobs = data.jobs.filter(j => monthOf(j.date).key===monthKey);
  const equip = data.equipmentSpend.filter(e => monthOf(e.date).key===monthKey);
  let revenue=0, commission=0, parts=0, equipment=0, paidTotal=0, unpaidTotal=0, paidCount=0, unpaidCount=0;
  const names = technicianFilter ? [technicianFilter] : technicianNames(data);
  const perTech = {}; names.forEach(t => perTech[t] = { jobs:0, commission:0 });
  jobs.forEach(j => {
    revenue += Number(j.amount)||0; commission += jobCommissionAmount(j); parts += Number(j.partsCost)||0;
    if (j.paymentStatus==='Paid') { paidTotal += j.amount; paidCount++; } else { unpaidTotal += j.amount; unpaidCount++; }
    if (perTech[j.technician]) { perTech[j.technician].jobs++; perTech[j.technician].commission += jobCommissionAmount(j); }
  });
  equip.forEach(e => equipment += Number(e.cost)||0);
  return { monthKey, jobs, revenue: round2(revenue), commission: round2(commission), parts: round2(parts), equipment: round2(equipment), paidTotal: round2(paidTotal), unpaidTotal: round2(unpaidTotal), paidCount, unpaidCount, perTech, net: round2(revenue-commission-parts-equipment) };
}

function allWeekKeys(data, now){
  const keys = new Set();
  data.jobs.forEach(j => keys.add(weekOf(j.date).key));
  data.equipmentSpend.forEach(e => keys.add(weekOf(e.date).key));
  keys.add(currentWeekKey(now));
  return Array.from(keys).sort().reverse();
}
function allMonthKeys(data, now){
  const keys = new Set();
  data.jobs.forEach(j => keys.add(monthOf(j.date).key));
  keys.add(monthOf(todayStr(now)).key);
  return Array.from(keys).sort().reverse();
}

const UNPAID_REMINDER_DAYS = 7, QUOTE_STALE_DAYS = 5;
function computeReminders(data, now){
  const items = []; const today = parseLocalDate(todayStr(now));
  data.jobs.forEach(j => {
    if (j.paymentStatus !== 'Paid') {
      const age = daysBetween(parseLocalDate(j.date), today);
      if (age >= UNPAID_REMINDER_DAYS) items.push({ type:'unpaid', severity: age>=14?'bad':'warn', date:j.date, title:`${j.customerName} — invoice #${j.invoiceNumber||'—'} still unpaid`, meta:`${j.technician} · ${age} days overdue (past the 7-day term)` });
    } else if (j.paidToTechnician !== 'Paid' && j.paidToTechnician !== 'Stuck') {
      const comm = jobCommissionAmount(j);
      if (comm > 0) items.push({ type:'commission', severity:'warn', date:j.date, title:`Commission owed to ${j.technician}`, meta:`${j.customerName} · invoice #${j.invoiceNumber||'—'}` });
    }
    if (j.partsCost > 0 && j.partsRefundStatus === 'Pending Refund') items.push({ type:'refund', severity:'warn', date:j.date, title:`Parts refund pending for ${j.partsPaidBy||j.technician}`, meta:j.customerName });
  });
  data.equipmentSpend.forEach(e => { if (e.reimbursed==='Pending') items.push({ type:'equipment', severity:'warn', date:e.date, title:`Equipment reimbursement pending for ${e.technician}`, meta:e.item }); });
  const activeQuoteStates = ['In Discussion','Waiting for Reply'];
  data.quotes.forEach(q => {
    if (activeQuoteStates.includes(q.status)) {
      const age = daysBetween(parseLocalDate(q.date), today);
      if (age >= QUOTE_STALE_DAYS) items.push({ type:'quote', severity: age>=10?'bad':'warn', date:q.date, title:`Quote for ${q.customer} still open`, meta:`${q.status} · ${age} days` });
    }
  });
  items.sort((a,b) => Number(b.severity==='bad') - Number(a.severity==='bad') || a.date.localeCompare(b.date));
  return items;
}

/* ── permissions / types (ported from src/lib/types.ts + permissions.ts) ── */
const ALL_SECTIONS = ['overview','jobs','finance','outstanding','reminders','openItems','tasks','quotes','reference','closings','settings'];
const SECTION_ORDER = ['overview','closings','jobs','finance','outstanding','reminders','openItems','tasks','quotes','reference'];

const ROLE_LABEL = { owner:'Owner', manager:'Manager', technician:'Technician', va:'Virtual Assistant' };
function roleLabel(role){ return ROLE_LABEL[role] || role; }
function defaultPermissionsFor(role){
  const none = { overview:false, jobs:false, finance:false, outstanding:false, reminders:false, openItems:false, tasks:false, quotes:false, reference:false, closings:false, settings:false };
  if (role==='owner') return { ...none, overview:true, jobs:true, finance:true, outstanding:true, reminders:true, openItems:true, tasks:true, quotes:true, reference:true, closings:true, settings:true };
  // Manager: everything an owner sees except Settings (permissions/system administration stays owner-only).
  if (role==='manager') return { ...none, overview:true, jobs:true, finance:true, outstanding:true, reminders:true, openItems:true, tasks:true, quotes:true, reference:true, closings:true, settings:false };
  // Technician: Closings stays OFF by default — posting closings is office-staff/owner work, not something
  // a technician gets automatically (owner can still grant it manually in Settings).
  if (role==='technician') return { ...none, overview:true, jobs:true, finance:true, reminders:true, tasks:true };
  // VA (Ron): Closings is ON by default — Ron is office staff who posts/edits closings routinely.
  // Everything else stays off until the owner grants it individually in Settings.
  if (role==='va') return { ...none, closings:true };
  return none;
}
function canViewSection(profile, section){
  if (section==='settings') return profile.role==='owner';
  if (profile.role==='owner' || profile.role==='manager') return true;
  return !!profile.permissions[section];
}
function firstAccessibleTab(profile){ return SECTION_ORDER.find(s => canViewSection(profile,s)) || null; }

function filterForProfile(data, profile){
  if (profile.role==='owner' || profile.role==='manager') return data;
  const canSeeJobs = profile.permissions.jobs || profile.permissions.finance;
  // equipmentSpend also feeds the Equipment & Suppliers quick-entry feed on the Closings page (item 7),
  // so it needs to be visible under the `closings` permission too, not just jobs/finance.
  const canSeeEquipmentSpend = canSeeJobs || profile.permissions.closings;
  const jobVisible = (name) => { if (!canSeeJobs) return false; if (profile.role==='technician') return name===profile.technicianName; return true; };
  const equipVisible = (name) => { if (!canSeeEquipmentSpend) return false; if (profile.role==='technician') return name===profile.technicianName; return true; };
  return {
    ...data,
    jobs: data.jobs.filter(j => jobVisible(j.technician)),
    equipmentSpend: data.equipmentSpend.filter(e => equipVisible(e.technician)),
    // Both the "Ron's Tasks" and "My Tasks" boards are gated by the same `tasks` permission flag —
    // which board is showing, and whether it's filtered to just this person, is a rendering concern
    // (see UI.tasks.board / UI.tasks.filterMode), not a data-visibility one.
    tasks: profile.permissions.tasks ? data.tasks : [],
    quotes: profile.permissions.quotes ? data.quotes : [],
    equipmentCatalog: profile.permissions.reference ? data.equipmentCatalog : [],
    suppliers: profile.permissions.reference ? data.suppliers : [],
    closings: profile.permissions.closings ? data.closings : [],
  };
}

/* ── small render helpers ────────────────────────────────────────────── */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtMoney(n){ n = round2(n); const isInt = Math.abs(n-Math.round(n)) < 1e-9; return '$' + n.toLocaleString('en-US', { minimumFractionDigits:isInt?0:2, maximumFractionDigits:2 }); }
function fmtDateShort(s){ if(!s) return '—'; const d = parseLocalDate(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function pill(tone, text){ return `<span class="pill ${tone}">${esc(text)}</span>`; }
function emptyState(title, sub, icon){ return `<div class="empty">${icon?`<div class="ic">${icon}</div>`:''}<b>${esc(title)}</b>${sub?`<div>${esc(sub)}</div>`:''}</div>`; }
const TECH_COLORS = { Noam:'var(--noam)', Guy:'var(--guy)', Dolev:'var(--dolev)', Ofek:'var(--ofek)' };
function techColor(name){
  if (TECH_COLORS[name]) return TECH_COLORS[name];
  let h=0; for (let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return `hsl(${h%360},45%,45%)`;
}
function techTag(name){ return `<span class="tech-tag"><span class="tech-dot" style="color:${techColor(name)}">${esc((name||'?').slice(0,1).toUpperCase())}</span>${esc(name)}</span>`; }
function statusSelect(kind, id, value, options, colorOf, labelOf, disabled){
  if (disabled) return pill(colorOf(value), labelOf(value));
  const opts = options.map(o => `<option value="${esc(o)}" ${o===value?'selected':''}>${esc(labelOf(o))}</option>`).join('');
  return `<select style="min-width:130px" onchange="onStatusChange('${kind}','${id}',this.value)">${opts}</select>`;
}

function closeModal(){ document.getElementById('modal-root').innerHTML = ''; MODAL_FILES = {}; MODAL_SUBTASKS = []; MODAL_UPDATES = []; MODAL_TASK_ID = null; MODAL_QUOTE_UPDATES = []; MODAL_QUOTE_ID = null; }
function modalError(msg){ document.getElementById('modal-error').innerHTML = msg ? pill('bad', msg) : ''; }

/* ── simulated file uploads ──────────────────────────────────────────────
   No backend exists in this preview, so "uploading" a file just reads it
   into memory with FileReader as a data: URI and keeps it on MODAL_FILES
   until Save copies it onto the record. Nothing is written to disk or a
   server, and it is lost on page refresh — that's expected for a preview. */
function fileField(label, fieldId, currentValue){
  MODAL_FILES[fieldId] = currentValue || null;
  return `<div class="field file-field">
    <label>${esc(label)}</label>
    <div class="file-row" id="${fieldId}-row">${fileRowInner(fieldId, currentValue)}</div>
    <input type="file" id="${fieldId}-input" style="display:none" onchange="onFilePicked('${fieldId}', this)">
  </div>`;
}
function fileRowInner(fieldId, value){
  if (value) {
    return `<a href="${value}" target="_blank" rel="noopener" class="file-chip">📄 View file</a><button type="button" class="btn ghost small" onclick="clearFileField('${fieldId}')">Remove</button>`;
  }
  return `<button type="button" class="btn small" onclick="document.getElementById('${fieldId}-input').click()">Choose file…</button><span class="file-hint">Preview only — not saved permanently</span>`;
}
function onFilePicked(fieldId, inputEl){
  const file = inputEl.files && inputEl.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    MODAL_FILES[fieldId] = reader.result;
    const row = document.getElementById(fieldId+'-row'); if (row) row.innerHTML = fileRowInner(fieldId, reader.result);
  };
  reader.readAsDataURL(file);
}
function clearFileField(fieldId){
  MODAL_FILES[fieldId] = null;
  const row = document.getElementById(fieldId+'-row'); if (row) row.innerHTML = fileRowInner(fieldId, null);
}

function onStatusChange(kind, id, value){
  if (kind==='jobStatus') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    j.paymentStatus = value;
    if (value==='Paid' && !j.datePaid) j.datePaid = todayStr();
    if (value!=='Paid') j.datePaid = '';
  } else if (kind==='jobPaidTech') {
    STATE.data.jobs.find(x=>x.id===id).paidToTechnician = value;
  } else if (kind==='equipReimbursed') {
    STATE.data.equipmentSpend.find(x=>x.id===id).reimbursed = value;
  } else if (kind==='taskStatus') {
    STATE.data.tasks.find(x=>x.id===id).status = value;
  } else if (kind==='quoteStatus') {
    STATE.data.quotes.find(x=>x.id===id).status = value;
  }
  render();
}

function doLogin(id){ STATE.currentProfileId = id; resetUI(); render(); }
function doLogout(){ STATE.currentProfileId = null; resetUI(); render(); }

/* ── app shell ───────────────────────────────────────────────────────── */
// NAV is data-driven for plain single-target sections. Two spots need special handling because
// they don't map 1:1 to a single UI.tab value: the Tasks section is split into two sidebar links
// ("Ron's Tasks" / "My Tasks") that both render the *same* Tasks page pre-filtered to a board,
// and Equipment/Employees/Suppliers collapse into one "Resources" group that all point at the
// existing Reference page pre-selected to a tab — see goTasks()/goResources() and the custom
// blocks inside renderShell() below. Both stay gated by their original single permission flag
// (`tasks` / `reference`) so the permission model itself is untouched.
const NAV = [
  { group:'Overview', items:[ {id:'overview', label:'Overview', icon:'◆'}, {id:'reminders', label:'Reminders', icon:'●'}, {id:'openItems', label:'Open Tasks', icon:'▣'} ] },
  { group:'Finance', items:[ {id:'jobs', label:'Jobs & Commissions', icon:'▤'}, {id:'finance', label:'Weekly / Monthly Summary', icon:'▦'}, {id:'outstanding', label:'Outstanding', icon:'▧'} ] },
  { group:'System', items:[ {id:'settings', label:'Permissions & Settings', icon:'⚙'} ] },
];
function goTab(id){ UI.tab = id; render(); }
function goTasks(board){ UI.tab = 'tasks'; UI.tasks.board = board; render(); }
function goResources(tab){ UI.tab = 'reference'; UI.reference.tab = tab; render(); }
function toggleResourcesGroup(){ UI.resourcesOpen = !UI.resourcesOpen; render(); }
function toggleTechTasksGroup(){ UI.techTasksOpen = !UI.techTasksOpen; render(); }
// board model: 'ron' and 'mine' are the two fixed boards; any other string is that technician's
// own personal board (their name, e.g. 'Guy'). This function is the single source of truth for labels.
function taskBoardLabel(board){
  if (board==='ron') return "Ron's Tasks";
  if (board==='mine') return 'My Tasks';
  return `${board}'s Tasks`;
}
function activeTechnicianNames(data){ return data.employees.filter(e=>e.roles.includes('Technician') && e.status==='Active').map(e=>e.name); }

function navButtonHtml(id, label, icon, active, onClick, badge){
  return `<button onclick="${onClick}" onmouseover="if(!${active}) this.style.background='var(--sidebar-bg-hover)'" onmouseout="if(!${active}) this.style.background='none'" style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:6px;color:${active?'#fff':'var(--sidebar-ink-soft)'};font-size:13.3px;font-family:'Karla',sans-serif;font-weight:${active?'700':'500'};border:none;box-shadow:${active?'inset 3px 0 0 var(--sidebar-accent)':'none'};background:${active?'var(--sidebar-bg-active)':'none'};text-align:start;width:100%;transition:background .1s">
    <span style="width:18px;text-align:center;flex:none;font-size:15px;opacity:${active?'1':'.75'};color:${active?'var(--sidebar-accent)':'inherit'}">${icon}</span><span>${esc(label)}</span>${badge||''}
  </button>`;
}

function renderShell(profile, data){
  const reminderCount = computeReminders(data).length;
  // navBlocks: [Overview group, Finance group, System group], in NAV's declared order — Closings and
  // Management (built separately below, since they need custom per-item logic) are spliced in between.
  const navBlocks = NAV.map(g => {
    const visible = g.items.filter(it => canViewSection(profile, it.id));
    if (!visible.length) return '';
    const itemsHtml = visible.map(it => {
      const active = UI.tab===it.id;
      const badge = (it.id==='reminders' && reminderCount>0) ? `<span style="margin-inline-start:auto;background:var(--bad);color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:99px;min-width:16px;text-align:center">${reminderCount}</span>` : '';
      return navButtonHtml(it.id, it.label, it.icon, active, `goTab('${it.id}')`, badge);
    }).join('');
    return `<div><div class="nav-group-label">${esc(g.group)}</div>${itemsHtml}</div>`;
  });

  // "Closings" — inserted right after Overview since it's the frontline feed technicians post to.
  const closingsHtml = canViewSection(profile,'closings')
    ? `<div><div class="nav-group-label">Field</div>${navButtonHtml('closings','Closings','🧾', UI.tab==='closings', "goTab('closings')")}</div>`
    : '';

  // "Management" group: task boards (split from one Tasks link, same `tasks` permission), Quotes, and the
  // collapsible Resources group (Equipment / Employees / Suppliers, same `reference` permission).
  // Task board nav depends on role, not just the `tasks` flag: a technician gets exactly ONE link — their
  // own personal board — never Ron's, never Mine, never another technician's. Owner/Manager/VA instead
  // get Ron's Tasks + My Tasks (the owner's own board) + a collapsible group with every active
  // technician's board listed separately, mirroring the Resources group's pattern.
  const mgmtItems = [];
  if (canViewSection(profile,'tasks')) {
    if (profile.role==='technician') {
      const myBoard = profile.technicianName;
      if (myBoard) mgmtItems.push(navButtonHtml('tasksMineTech', taskBoardLabel(myBoard), '☑', UI.tab==='tasks' && UI.tasks.board===myBoard, `goTasks('${esc(myBoard)}')`));
    } else {
      mgmtItems.push(navButtonHtml('tasksPatrick', "Ron's Tasks", '☐', UI.tab==='tasks' && UI.tasks.board==='ron', "goTasks('ron')"));
      mgmtItems.push(navButtonHtml('tasksMine', 'My Tasks', '☑', UI.tab==='tasks' && UI.tasks.board==='mine', "goTasks('mine')"));
      const techs = activeTechnicianNames(data);
      if (techs.length) {
        const techOpen = !!UI.techTasksOpen;
        const techSubItems = techs.map(t => navButtonHtml('tasks-'+t, taskBoardLabel(t), '☑', UI.tab==='tasks' && UI.tasks.board===t, `goTasks('${esc(t)}')`)).join('');
        mgmtItems.push(`<div>
          <button onclick="toggleTechTasksGroup()" style="display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 10px;border-radius:6px;border:none;background:none;color:var(--sidebar-ink-soft);font-size:13.3px;font-family:'Karla',sans-serif;font-weight:500;text-align:start">
            <span style="display:flex;align-items:center;gap:10px"><span style="width:18px;text-align:center;flex:none;font-size:15px">☑</span><span>Technicians</span></span>
            <span style="font-size:10px;color:var(--sidebar-ink-faint)">${techOpen?'▾':'▸'}</span>
          </button>
          ${techOpen ? `<div style="padding-inline-start:16px">${techSubItems}</div>` : ''}
        </div>`);
      }
    }
  }
  if (canViewSection(profile,'quotes')) mgmtItems.push(navButtonHtml('quotes', 'Quotes', '✎', UI.tab==='quotes', "goTab('quotes')"));
  if (canViewSection(profile,'reference')) {
    const open = !!UI.resourcesOpen;
    const subItems = [['equipment','Equipment'],['employees','Employees'],['suppliers','Suppliers']]
      .map(([key,label]) => navButtonHtml('res-'+key, label, '▥', UI.tab==='reference' && UI.reference.tab===key, `goResources('${key}')`)).join('');
    mgmtItems.push(`<div>
      <button onclick="toggleResourcesGroup()" style="display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 10px;border-radius:6px;border:none;background:none;color:var(--sidebar-ink-soft);font-size:13.3px;font-family:'Karla',sans-serif;font-weight:500;text-align:start">
        <span style="display:flex;align-items:center;gap:10px"><span style="width:18px;text-align:center;flex:none;font-size:15px">▥</span><span>Resources</span></span>
        <span style="font-size:10px;color:var(--sidebar-ink-faint)">${open?'▾':'▸'}</span>
      </button>
      ${open ? `<div style="padding-inline-start:16px">${subItems}</div>` : ''}
    </div>`);
  }
  const mgmtHtml = mgmtItems.length ? `<div><div class="nav-group-label">Management</div>${mgmtItems.join('')}</div>` : '';

  return `
    <div class="app-grid" style="display:grid;grid-template-columns:240px 1fr;min-height:100vh">
      <div class="sidebar" style="display:flex;flex-direction:column;padding:18px 14px;gap:4px">
        <div class="workspace-card">

/* ── overview ────────────────────────────────────────────────────────── */
function renderOverview(profile, data){
  const wk = currentWeekKey();
  const isTech = profile.role==='technician';
  const week = computeWeek(data, wk, isTech ? (profile.technicianName||undefined) : undefined);
  const reminders = computeReminders(data);
  const openTasks = data.tasks.filter(t=>t.status!=='Done').length;
  const openQuotes = data.quotes.filter(q=>['In Discussion','Waiting for Reply'].includes(q.status)).length;
  const allTechs = technicianNames(data);
  const cardTechs = isTech ? (profile.technicianName?[profile.technicianName]:[]) : allTechs;

  const techCards = cardTechs.length ? cardTechs.map(t => {
    const d = week.perTech[t] || { owed:0, paidThisWeek:0, balanceDue:0, totalJobs:0 };
    return `<div class="card tight">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">${techTag(t)}</div>
      <div class="kv"><span>Jobs this week</span><span class="v">${d.totalJobs}</span></div>
      <div class="kv"><span>Commission owed</span><span class="v">${fmtMoney(d.owed)}</span></div>
      <div class="kv"><span>Paid this week</span><span class="v">${fmtMoney(d.paidThisWeek)}</span></div>
      <div class="kv total"><span>Balance due</span><span class="v" style="color:${d.balanceDue>0.01?'var(--bad)':'var(--good)'}">${fmtMoney(Math.max(0,d.balanceDue))}</span></div>
    </div>`;
  }).join('') : emptyState('No technicians set up yet', 'Add technicians on the Employees tab.');

  const shortcuts = [];
  if (canViewSection(profile,'reminders')) shortcuts.push(`<div class="card"><div class="stat-label">Open Reminders</div><div class="stat-value">${reminders.length}</div><div class="stat-sub"><button class="btn ghost small" onclick="goTab('reminders')">View →</button></div></div>`);
  if (canViewSection(profile,'tasks')) shortcuts.push(`<div class="card"><div class="stat-label">Open Tasks</div><div class="stat-value">${openTasks}</div><div class="stat-sub"><button class="btn ghost small" onclick="goTab('tasks')">View →</button></div></div>`);
  if (canViewSection(profile,'quotes')) shortcuts.push(`<div class="card"><div class="stat-label">Open Quotes</div><div class="stat-value">${openQuotes}</div><div class="stat-sub"><button class="btn ghost small" onclick="goTab('quotes')">View →</button></div></div>`);

  return `
    <div class="page-head">
      <div><h1 class="page-title">Overview</h1><div class="page-sub">Current week</div></div>
    </div>
    <div class="grid-4">
      <div class="card stat-card" style="--stat-accent:var(--primary-teal)"><div class="stat-label">Revenue this week</div><div class="stat-value">${fmtMoney(week.jobs.reduce((s,j)=>s+j.amount,0))}</div><div class="stat-sub">${week.jobs.length} jobs</div></div>
      <div class="card stat-card" style="--stat-accent:var(--bad)"><div class="stat-label">Unpaid by customer</div><div class="stat-value" style="color:var(--bad)">${fmtMoney(week.overview.unpaidTotal)}</div><div class="stat-sub">${week.overview.unpaidCount} jobs</div></div>
      <div class="card stat-card" style="--stat-accent:var(--accent)"><div class="stat-label">Commission paid to techs</div><div class="stat-value">${fmtMoney(week.overview.paidToTechTotal)}</div><div class="stat-sub">of ${fmtMoney(week.overview.commissionOwedTotal)} owed</div></div>
      <div class="card stat-card" style="--stat-accent:var(--good)"><div class="stat-label">Remaining for business</div><div class="stat-value">${fmtMoney(week.remainingAfterTech)}</div><div class="stat-sub">after commission, parts &amp; equipment</div></div>
    </div>
    <div class="section-title">${isTech?'Your summary':'Technicians'} — current week</div>
    <div class="grid-3">${techCards}</div>
    ${shortcuts.length ? `<div class="grid-3" style="margin-top:22px">${shortcuts.join('')}</div>` : ''}
  `;
}

/* ── jobs ────────────────────────────────────────────────────────────── */
function renderJobs(profile, data){
  const canEdit = profile.role==='owner' || profile.role==='manager';
  const allTechs = technicianNames(data);
  const weeks = allWeekKeys(data);
  let jobs = [...data.jobs].sort((a,b)=>b.date.localeCompare(a.date));
  if (UI.jobs.tech!=='all') jobs = jobs.filter(j=>j.technician===UI.jobs.tech);
  if (UI.jobs.status!=='all') jobs = jobs.filter(j=>j.paymentStatus===UI.jobs.status);
  if (UI.jobs.week!=='all') jobs = jobs.filter(j=>weekOf(j.date).key===UI.jobs.week);

  // Column order is fixed per spec: Technician, Date, Customer Name, Invoice, Job Type, Amount, GST,
  // Status, Method, GST Amount, Parts Cost, Parts Paid By, %, Commission, Tech Paid, Notes.
  // "GST" is a yes/no indicator; "GST Amount" is the actual computed dollar figure (jobGst(j)).
  const rows = jobs.length ? jobs.map(j => `
    <tr>
      <td>${techTag(j.technician)}</td><td class="mono">${fmtDateShort(j.date)}</td><td>${esc(j.customerName)}</td><td class="mono">${esc(j.invoiceNumber||'—')}</td>
      <td>${j.jobType}</td><td class="num">${fmtMoney(j.amount)}</td>
      <td>${j.includesGST ? pill('good','Yes') : pill('neutral','No')}</td>
      <td>${statusSelect('jobStatus', j.id, j.paymentStatus, ['Unpaid','Paid'], v=>v==='Paid'?'good':'bad', v=>v==='Paid'?'Paid':'Unpaid', !canEdit)}</td>
      <td>${j.paymentMethod || '—'}${j.paymentMethod==='Cash' ? (j.cashConfirmed ? ` ${pill('good','confirmed')}` : ` ${pill('warn','unconfirmed')}`) : ''}</td>
      <td class="num">${j.includesGST ? fmtMoney(jobGst(j)) : '—'}</td>
      <td class="num">${j.partsCost ? fmtMoney(j.partsCost) : '—'}</td>
      <td>${esc(j.partsPaidBy||'—')}</td>
      <td class="num">${j.commissionPercent}%</td>
      <td class="num">${fmtMoney(jobCommissionAmount(j))}</td>
      <td>${statusSelect('jobPaidTech', j.id, j.paidToTechnician, ['Not Paid','Paid','Stuck'], v=>v==='Paid'?'good':v==='Stuck'?'neutral':'bad', v=>v, !canEdit)}</td>
      <td class="wrap">${esc(j.notes||'—')}</td>
      ${canEdit ? `<td style="display:flex;gap:4px"><button class="btn ghost small" onclick="openJobModal('${j.id}')">Edit</button><button class="btn ghost small danger" onclick="deleteJob('${j.id}');render()">Delete</button></td>` : ''}
    </tr>`).join('') : `<tr><td colspan="${canEdit?17:16}">${emptyState('No jobs yet', canEdit ? 'Click "New Job" to get started.' : undefined)}</td></tr>`;

  return `
    <div class="page-head">
      <div><h1 class="page-title">Jobs &amp; Commissions</h1><div class="page-sub">${data.jobs.length} jobs total</div></div>
      ${canEdit ? `<button class="btn primary" onclick="openJobModal(null)">+ New Job</button>` : ''}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <select style="width:auto" onchange="UI.jobs.tech=this.value;render()"><option value="all">All technicians</option>${allTechs.map(t=>`<option value="${esc(t)}" ${UI.jobs.tech===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
      <select style="width:auto" onchange="UI.jobs.status=this.value;render()"><option value="all" ${UI.jobs.status==='all'?'selected':''}>All statuses</option><option value="Paid" ${UI.jobs.status==='Paid'?'selected':''}>Paid</option><option value="Unpaid" ${UI.jobs.status==='Unpaid'?'selected':''}>Unpaid</option></select>
      <select style="width:auto" onchange="UI.jobs.week=this.value;render()"><option value="all">All weeks</option>${weeks.map(w=>`<option value="${w}" ${UI.jobs.week===w?'selected':''}>${weekOf(w).label}</option>`).join('')}</select>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Technician</th><th>Date</th><th>Customer</th><th>Invoice</th><th>Type</th><th>Amount</th><th>GST</th><th>Status</th><th>Method</th><th>GST Amount</th><th>Parts Cost</th><th>Parts Paid By</th><th>%</th><th>Commission</th><th>Tech Paid</th><th class="wrap">Notes</th>${canEdit?'<th></th>':''}</tr></thead><tbody>${rows}</tbody></table></div>
  `;
}

function openJobModal(jobId){
  const data = STATE.data; const job = jobId ? data.jobs.find(j=>j.id===jobId) : null;
  const allTechs = technicianNames(data);
  const tech = job?.technician || allTechs[0] || '';
  const jobType = job?.jobType || 'Aircon';
  const auto = commissionRateFor(data.commissionRates, tech, jobType);
  const currentProfile = getCurrentProfile();
  MODAL_FILES = {};
  openModal(`
    <div class="modal-back" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>${job?'Edit Job':'New Job'}</h2>
        <div class="grid-2">
          <div class="field"><label>Customer</label><input id="jm-customer" value="${esc(job?.customerName||'')}"></div>
          <div class="field"><label>Invoice Number</label><input id="jm-invoice" value="${esc(job?.invoiceNumber||'')}"></div>
          <div class="field"><label>Date</label><input type="date" id="jm-date" value="${job?.date||todayStr()}"></div>
          <div class="field"><label>Technician</label><select id="jm-tech" onchange="updateJobCommissionField()">${allTechs.map(t=>`<option value="${esc(t)}" ${t===tech?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
          <div class="field"><label>Job Type</label><select id="jm-type" onchange="updateJobCommissionField()">${['Aircon','Chimney','Pressure Washing','Other'].map(t=>`<option value="${t}" ${t===jobType?'selected':''}>${t}</option>`).join('')}</select></div>
          <div class="field"><label id="jm-comm-label">${auto!==null?'Commission % (auto-filled — editable)':'Commission % (manual — no automatic rate)'}</label><input type="number" id="jm-comm" value="${auto!==null?auto:(job?.commissionPercent||0)}"></div>
          <div class="field"><label>Amount (pre-GST)</label><input type="number" id="jm-amount" value="${job?.amount||0}"></div>
          <div class="field" style="justify-content:flex-end"><label class="checkline" style="padding-top:8px"><input type="checkbox" id="jm-nogst" ${job && !job.includesGST ? 'checked' : ''}> No GST</label><span class="hint">Off = 10% GST added on top of Amount</span></div>
          <div class="field"><label>Payment Status</label><select id="jm-status" onchange="document.getElementById('jm-cash-row').style.display=(document.getElementById('jm-method').value==='Cash')?'flex':'none'"><option value="Unpaid" ${job?.paymentStatus!=='Paid'?'selected':''}>Unpaid</option><option value="Paid" ${job?.paymentStatus==='Paid'?'selected':''}>Paid</option></select></div>
          <div class="field"><label>Payment Method</label><select id="jm-method" onchange="document.getElementById('jm-cash-row').style.display=(this.value==='Cash')?'flex':'none'"><option value="">—</option><option value="Cash" ${job?.paymentMethod==='Cash'?'selected':''}>Cash</option><option value="Bank Transfer" ${job?.paymentMethod==='Bank Transfer'?'selected':''}>Bank Transfer</option><option value="Credit Card" ${job?.paymentMethod==='Credit Card'?'selected':''}>Credit Card</option></select></div>
          <div class="field"><label>Entered By</label><input id="jm-enteredby" value="${esc(job?.enteredBy || currentProfile?.fullName || '')}"></div>
          <div class="field"><label>Parts Cost</label><input type="number" id="jm-parts" value="${job?.partsCost||0}"></div>
          <div class="field"><label>Parts Paid By</label><select id="jm-partsby"><option value="">—</option>${allTechs.map(t=>`<option value="${esc(t)}" ${job?.partsPaidBy===t?'selected':''}>${esc(t)}</option>`).join('')}<option value="Business" ${job?.partsPaidBy==='Business'?'selected':''}>Business</option></select></div>
          <div class="field"><label>Parts Refund Status</label><select id="jm-refund"><option value="N/A" ${(!job||job.partsRefundStatus==='N/A')?'selected':''}>N/A</option><option value="Pending Refund" ${job?.partsRefundStatus==='Pending Refund'?'selected':''}>Pending Refund</option><option value="Refunded" ${job?.partsRefundStatus==='Refunded'?'selected':''}>Refunded</option></select></div>
        </div>
        <div class="checkline" id="jm-cash-row" style="margin-top:12px;display:${job?.paymentMethod==='Cash'?'flex':'none'}">
          <input type="checkbox" id="jm-cashconfirmed" ${job?.cashConfirmed?'checked':''}>
          <label for="jm-cashconfirmed" style="font-weight:600;font-size:12.6px;color:var(--ink)">Cash physically confirmed received</label>
        </div>
        <div class="field" style="margin-top:11px"><label>Notes</label><textarea rows="2" id="jm-notes">${esc(job?.notes||'')}</textarea></div>
        <div class="modal-section">Attachments (preview only)</div>
        <div class="grid-3">
          ${fileField('Invoice File', 'jm-invoiceFile', job?.invoiceFile)}
          ${fileField('Transfer Receipt', 'jm-transferReceiptFile', job?.transferReceiptFile)}
          ${fileField('Equipment Rental File', 'jm-equipmentRentalFile', job?.equipmentRentalFile)}
        </div>
        <div id="modal-error"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn primary" onclick="saveJobModal(${job?`'${job.id}'`:'null'})">Save</button>
        </div>
      </div>
    </div>`);
}
function updateJobCommissionField(){
  // Auto-fills from the commission-rates table when one exists for this technician/job-type combo, but
  // NEVER locks the field — the owner/manager can always type over it (see item 5: % and Commission $
  // stay plain editable fields, in both the Jobs modal and the Closings flow).
  const tech = document.getElementById('jm-tech').value, type = document.getElementById('jm-type').value;
  const auto = commissionRateFor(STATE.data.commissionRates, tech, type);
  const input = document.getElementById('jm-comm'), label = document.getElementById('jm-comm-label');
  if (auto !== null) { input.value = auto; label.textContent = 'Commission % (auto-filled — editable)'; }
  else { label.textContent = 'Commission % (manual — no automatic rate)'; }
}
function saveJobModal(jobId){
  const customerName = document.getElementById('jm-customer').value.trim();
  if (!customerName) { modalError('Please enter a customer name'); return; }
  const tech = document.getElementById('jm-tech').value, jobType = document.getElementById('jm-type').value;
  const auto = commissionRateFor(STATE.data.commissionRates, tech, jobType);
  const commissionPercent = auto!==null ? auto : (Number(document.getElementById('jm-comm').value)||0);
  const paymentStatus = document.getElementById('jm-status').value;
  const prevJob = jobId ? STATE.data.jobs.find(j=>j.id===jobId) : null;
  let datePaid = prevJob?.datePaid || '';
  if (paymentStatus==='Paid' && !datePaid) datePaid = todayStr();
  if (paymentStatus!=='Paid') datePaid = '';
  const values = {
    customerName, invoiceNumber: document.getElementById('jm-invoice').value.trim(),
    date: document.getElementById('jm-date').value, technician: tech, jobType, commissionPercent,
    amount: Number(document.getElementById('jm-amount').value)||0,
    // "No GST" toggle, default OFF (unpressed) — unpressed means GST applies and is added on top of the
    // pre-GST Amount (includesGST:true); pressing "No GST" means includesGST:false. See jobGst()/
    // jobTotalCollected() above — this only fixes the form's default direction/labeling, not the math.
    includesGST: !document.getElementById('jm-nogst').checked,
    paymentStatus, paymentMethod: document.getElementById('jm-method').value,
    enteredBy: document.getElementById('jm-enteredby').value.trim(),
    // Simplification: Monday's board had 3 separate per-technician "cash received" checkbox
    // columns; since a job here only ever has one technician, a single flag covers the same need.
    cashConfirmed: document.getElementById('jm-cashconfirmed').checked,
    partsCost: Number(document.getElementById('jm-parts').value)||0,
    partsPaidBy: document.getElementById('jm-partsby').value,
    partsRefundStatus: document.getElementById('jm-refund').value,
    notes: document.getElementById('jm-notes').value,
    datePaid, paidToTechnician: prevJob?.paidToTechnician || 'Not Paid',
    invoiceFile: MODAL_FILES['jm-invoiceFile'] ?? job_or_null(prevJob,'invoiceFile'),
    transferReceiptFile: MODAL_FILES['jm-transferReceiptFile'] ?? job_or_null(prevJob,'transferReceiptFile'),
    equipmentRentalFile: MODAL_FILES['jm-equipmentRentalFile'] ?? job_or_null(prevJob,'equipmentRentalFile'),
  };
  if (jobId) Object.assign(prevJob, values); else STATE.data.jobs.push({ id: uid(), ...values });
  closeModal(); showToast(jobId?'Job updated':'Job added'); render();
}
function job_or_null(rec, field){ return rec ? (rec[field] ?? null) : null; }

/* ── finance ─────────────────────────────────────────────────────────── */
const JOB_TYPES = ['Aircon','Chimney','Pressure Washing','Other'];
function renderFinance(profile, data){
  const weeks = allWeekKeys(data), months = allMonthKeys(data), allTechs = technicianNames(data);
  const isTech = profile.role==='technician';
  const techFilter = isTech ? (profile.technicianName||undefined) : undefined;
  const cardTechs = isTech ? (techFilter?[techFilter]:[]) : allTechs;
  const weekKey = UI.finance.week || currentWeekKey();
  const monthKey = UI.finance.month || monthOf(todayStr()).key;
  const canBulk = profile.role==='owner' || profile.role==='manager';

  const body = UI.finance.mode==='weekly' ? renderFinanceWeekly(data, weekKey, weeks, cardTechs, techFilter, canBulk) : renderFinanceMonthly(data, monthKey, months, cardTechs);
  return `
    <div class="page-head">
      <div><h1 class="page-title">Financial Summary</h1><div class="page-sub">Weekly and monthly snapshot${isTech?' — your jobs':' by technician and for the whole business'}</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn ${UI.finance.mode==='weekly'?'primary':''}" onclick="UI.finance.mode='weekly';render()">Weekly</button>
        <button class="btn ${UI.finance.mode==='monthly'?'primary':''}" onclick="UI.finance.mode='monthly';render()">Monthly</button>
      </div>
    </div>
    ${body}
  `;
}
function renderFinanceWeekly(data, weekKey, weeks, allTechs, techFilter, canBulk){
  const w = computeWeek(data, weekKey, techFilter);
  const chips = weeks.map(k => `<button class="week-chip ${k===weekKey?'active':''}" onclick="UI.finance.week='${k}';render()">${weekOf(k).label}</button>`).join('');
  let businessOverview = '';
  if (!techFilter) {
    const typeChips = JOB_TYPES.map(t => {
      const items = w.jobs.filter(j=>j.jobType===t); const total = items.reduce((s,j)=>s+j.amount,0);
      const avg = items.length ? round2(total/items.length) : 0;
      return `<div class="jobtype-chip"><span>${t}</span><span class="n">${items.length} · ${fmtMoney(avg)} avg · ${fmtMoney(total)}</span></div>`;
    }).join('');
    businessOverview = `
      <div class="section-title">Business Overview</div>
      <div class="grid-4">
        <div class="card"><div class="stat-label">Cash</div><div class="stat-value">${fmtMoney(w.overview.cash)}</div><div class="stat-sub">GST: ${fmtMoney(w.overview.gstCash)}</div></div>
        <div class="card"><div class="stat-label">Bank Transfer</div><div class="stat-value">${fmtMoney(w.overview.bankTransfer)}</div></div>
        <div class="card"><div class="stat-label">Credit Card</div><div class="stat-value">${fmtMoney(w.overview.creditCard)}</div><div class="stat-sub">GST (card+transfer): ${fmtMoney(w.overview.gstOther)}</div></div>
        <div class="card"><div class="stat-label">Remaining for business</div><div class="stat-value">${fmtMoney(w.remainingAfterTech)}</div></div>
      </div>
      <div class="grid-3" style="margin-top:12px">
        <div class="card tight"><div class="stat-label">Jobs Paid / Unpaid</div><div class="stat-value" style="font-size:18px">${w.overview.paidCount} <span style="color:var(--ink-soft);font-size:13px">/ ${w.overview.unpaidCount}</span></div></div>
        <div class="card tight"><div class="stat-label">Parts</div><div class="stat-value" style="font-size:18px">${fmtMoney(w.overview.partsTotal)}</div></div>
        <div class="card tight"><div class="stat-label">Equipment Purchases</div><div class="stat-value" style="font-size:18px">${fmtMoney(w.overview.equipmentTotal)}</div></div>
      </div>
      <div class="section-title">Breakdown by Job Type</div>
      <div class="grid-3">${typeChips}</div>
    `;
  }
  const techCards = allTechs.length ? allTechs.map(t => {
    const d = w.perTech[t] || { owed:0,paidThisWeek:0,balanceDue:0, jobTypeBreak:{Aircon:{count:0,total:0},Chimney:{count:0,total:0},'Pressure Washing':{count:0,total:0},Other:{count:0,total:0}}, dailyAvg:null, daysWorked:0, latePaymentTotal:0, paidCount:0, unpaidCount:0, totalJobs:0 };
    const types = JOB_TYPES.map(jt => { const b=d.jobTypeBreak[jt]; const avg=b.count?round2(b.total/b.count):0; return `<div class="jobtype-chip"><span>${jt}</span><span class="n">${b.count} · avg ${fmtMoney(avg)} · ${fmtMoney(b.total)}</span></div>`; }).join('');
    return `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">${techTag(t)}${canBulk?`<button class="btn small" onclick="bulkMarkPaid('${esc(t)}','${weekKey}')">Mark all paid to tech</button>`:''}</div>
      <div class="kv"><span>Jobs (paid / unpaid / total)</span><span class="v">${d.paidCount} / ${d.unpaidCount} / ${d.totalJobs}</span></div>
      <div class="kv"><span>Daily average (${d.daysWorked} days)</span><span class="v">${d.dailyAvg===null?'—':fmtMoney(d.dailyAvg)}</span></div>
      <div class="kv"><span>Late payments received this week</span><span class="v">${fmtMoney(d.latePaymentTotal)}</span></div>
      <div style="margin:10px 0">${types}</div>
      <div class="kv"><span>Total commission owed</span><span class="v">${fmtMoney(d.owed)}</span></div>
      <div class="kv"><span>Paid this week</span><span class="v">${fmtMoney(d.paidThisWeek)}</span></div>
      <div class="kv total"><span>Balance due</span><span class="v" style="color:${d.balanceDue>0.01?'var(--bad)':'var(--good)'}">${fmtMoney(Math.max(0,d.balanceDue))}</span></div>
    </div>`;
  }).join('') : emptyState('No technicians', 'Add technicians on the Employees tab');
  return `
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px">${chips}</div>
    ${businessOverview}
    <div class="section-title">${techFilter?'Your summary':'Technicians'} <span class="tag">${weekOf(weekKey).label}</span></div>
    <div class="grid-2">${techCards}</div>
  `;
}
function renderFinanceMonthly(data, monthKey, months, allTechs){
  const m = computeMonth(data, monthKey, allTechs.length===1 ? allTechs[0] : undefined);
  const chips = months.map(k => { const [y,mo]=k.split('-'); return `<button class="week-chip ${k===monthKey?'active':''}" onclick="UI.finance.month='${k}';render()">${MONTHS_FULL[Number(mo)-1]} ${y}</button>`; }).join('');
  const techCards = allTechs.map(t => { const d = m.perTech[t] || {jobs:0,commission:0}; return `<div class="card tight"><div style="margin-bottom:8px">${techTag(t)}</div><div class="kv"><span>Jobs</span><span class="v">${d.jobs}</span></div><div class="kv total"><span>Commission</span><span class="v">${fmtMoney(d.commission)}</span></div></div>`; }).join('');
  return `
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px">${chips}</div>
    <div class="grid-4">
      <div class="card"><div class="stat-label">Revenue (excl. GST)</div><div class="stat-value">${fmtMoney(m.revenue)}</div><div class="stat-sub">${m.jobs.length} jobs</div></div>
      <div class="card"><div class="stat-label">Technician Commission</div><div class="stat-value">${fmtMoney(m.commission)}</div></div>
      <div class="card"><div class="stat-label">Parts + Equipment</div><div class="stat-value">${fmtMoney(m.parts+m.equipment)}</div></div>
      <div class="card"><div class="stat-label">Net for Business</div><div class="stat-value">${fmtMoney(m.net)}</div></div>
    </div>
    <div class="grid-3" style="margin-top:12px"><div class="card tight"><div class="stat-label">Paid / Unpaid</div><div class="stat-value" style="font-size:18px">${fmtMoney(m.paidTotal)} <span style="color:var(--ink-soft);font-size:13px">/ ${fmtMoney(m.unpaidTotal)}</span></div></div></div>
    <div class="section-title">Commission by Technician</div>
    <div class="grid-3">${techCards}</div>
  `;
}
function bulkMarkPaid(tech, weekKey){
  const jobsToUpdate = STATE.data.jobs.filter(j => j.technician===tech && weekOf(j.date).key===weekKey && j.paymentStatus==='Paid' && j.paidToTechnician!=='Paid' && j.paidToTechnician!=='Stuck');
  jobsToUpdate.forEach(j => j.paidToTechnician='Paid');
  render();
}

/* ── outstanding ─────────────────────────────────────────────────────── */
function renderOutstanding(profile, data){
  const unpaidJobs = [...data.jobs].filter(j=>j.paymentStatus!=='Paid').sort((a,b)=>a.date.localeCompare(b.date));
  const pendingParts = data.jobs.filter(j=>j.partsRefundStatus==='Pending Refund');
  const pendingEquip = data.equipmentSpend.filter(e=>e.reimbursed==='Pending');
  const today = parseLocalDate(todayStr());
  const unpaidRows = unpaidJobs.length ? unpaidJobs.map(j => { const age = daysBetween(parseLocalDate(j.date), today); return `<tr><td class="mono">${fmtDateShort(j.date)}</td><td>${esc(j.customerName)}</td><td class="mono">${esc(j.invoiceNumber||'—')}</td><td>${esc(j.technician)}</td><td class="num">${fmtMoney(j.amount)}</td><td>${pill(age>=7?'bad':'neutral', age+' days')}</td></tr>`; }).join('') : `<tr><td colspan="6">${emptyState('No outstanding balances','All customers have paid ✓')}</td></tr>`;
  const partsRows = pendingParts.length ? pendingParts.map(j=>`<tr><td class="mono">${fmtDateShort(j.date)}</td><td>${esc(j.customerName)}</td><td>${esc(j.partsPaidBy)}</td><td class="num">${fmtMoney(j.partsCost)}</td></tr>`).join('') : `<tr><td colspan="4">${emptyState('No pending parts refunds')}</td></tr>`;
  const equipRows = pendingEquip.length ? pendingEquip.map(e=>`<tr><td class="mono">${fmtDateShort(e.date)}</td><td>${esc(e.item)}</td><td>${esc(e.technician)}</td><td class="num">${fmtMoney(e.cost)}</td></tr>`).join('') : `<tr><td colspan="4">${emptyState('No pending equipment refunds')}</td></tr>`;
  return `
    <div class="page-head"><div><h1 class="page-title">Outstanding</h1><div class="page-sub">Everything still open — customer payments, parts and equipment refunds</div></div></div>

/* ── open items ──────────────────────────────────────────────────────── */
function renderOpenItems(profile, data){
  const today = parseLocalDate(todayStr());
  const rows = [];
  // Aggregates open tasks from EVERY board — Ron's, the owner's Mine, and every individual
  // technician's personal board — since data.tasks already holds all boards together (board-filtering
  // only happens at the Tasks-page render layer, not here), plus quotes-in-progress and unpaid jobs below.
  data.tasks.filter(t=>t.status!=='Done').forEach(t => {
    rows.push({ kind:'Task', date: t.due||null, title: t.title, meta: `${taskBoardLabel(t.board)} · ${t.status}${t.client?' · '+t.client:''}${t.priority?' · '+t.priority+' priority':''}`, tone: t.priority==='Urgent'?'bad':(t.priority==='High'?'warn':'neutral') });
  });
  data.quotes.filter(q=>['In Discussion','Waiting for Reply'].includes(q.status)).forEach(q => {
    rows.push({ kind:'Quote', date: q.date, title: `${q.customer}`, meta: `${q.status}${q.amount?' · '+fmtMoney(q.amount):''}${q.nextAction?' · next: '+q.nextAction:''}`, tone:'warn' });
  });
  data.jobs.filter(j=>j.paymentStatus!=='Paid').forEach(j => {
    const age = daysBetween(parseLocalDate(j.date), today);
    rows.push({ kind:'Unpaid Job', date: j.date, title: `${j.customerName} — invoice #${j.invoiceNumber||'—'}`, meta: `${j.technician} · ${fmtMoney(j.amount)} · ${age} days overdue`, tone: age>=14?'bad':'warn' });
  });
  rows.sort((a,b) => (a.date||'9999-99-99').localeCompare(b.date||'9999-99-99'));
  const body = rows.length ? rows.map(r => `
    <tr>
      <td>${pill('neutral', r.kind)}</td>
      <td class="wrap"><div style="font-weight:600;font-size:13.4px">${esc(r.title)}</div><div style="color:var(--ink-soft);font-size:12px;margin-top:2px">${esc(r.meta)}</div></td>
      <td class="mono">${r.date?fmtDateShort(r.date):'—'}</td>
      <td>${pill(r.tone, r.tone==='bad'?'Overdue':(r.tone==='warn'?'Open':'—'))}</td>
    </tr>`).join('') : `<tr><td colspan="4">${emptyState('Nothing open right now','Every task, quote and job is settled ✓','✓')}</td></tr>`;
  return `
    <div class="page-head"><div><h1 class="page-title">Open Tasks</h1><div class="page-sub">One list of everything still needing action — open tasks from every board (Ron's, Mine, and each technician's), live quotes and unpaid jobs</div></div></div>
    <div class="table-wrap"><table><thead><tr><th>Type</th><th class="wrap">Item</th><th>Date</th><th>Status</th></tr></thead><tbody>${body}</tbody></table></div>
  `;
}

   by invoice number, so Jobs & Commissions never needs manual re-entry.

   Customer Name, Invoice, Job Type, Amount, GST, Status, Method, Parts Cost,
   Parts Paid By, Notes. GST Amount / % commission / Tech Paid are computed or
   Jobs-table-only and are never shown here — EXCEPT that a missing automatic
   commission rate still needs *some* number to run the math, so that one case
   is handled with a one-off popup (see openCommissionPopup below) rather than
   a permanent field. ── */
const CLOSING_PAYMENT_STATUSES = ['Unpaid','Paid'];
const CLOSING_PAYMENT_METHODS = ['','Cash','Bank Transfer','Credit Card'];
let PENDING_CLOSING = null; // gathered closing-form values awaiting a manual commission entry (see item 6)
function closingFormError(msg){ const el = document.getElementById('cf-error'); if (el) el.innerHTML = msg ? pill('bad', msg) : ''; }
function closingFileRow(){
  if (CLOSING_FILE) return `<a href="${CLOSING_FILE}" target="_blank" rel="noopener" class="file-chip">📷 View photo</a><button type="button" class="btn ghost small" onclick="clearClosingFile()">Remove</button>`;

function onClosingFilePicked(inputEl){

function clearClosingFile(){ CLOSING_FILE = null; const row = document.getElementById('cf-photo-row'); if (row) row.innerHTML = closingFileRow(); }
function closingCard(c){

      ${c.invoiceFileUrl ? `<a href="${c.invoiceFileUrl}" target="_blank" rel="noopener"><img src="${c.invoiceFileUrl}" alt="Invoice photo" style="width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none;display:block"></a>` : ''}

        <div style="margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">${techTag(c.technicianName)}<span class="mono" style="font-size:11.5px;color:var(--ink-soft)">${fmtDateShort(c.date)}</span>${pill('neutral', c.jobType||'—')}</div>
        <div style="font-weight:600;font-size:13.5px;margin-bottom:3px">${esc(c.customerName)} <span class="mono" style="color:var(--ink-soft);font-weight:500">— ${esc(c.invoiceNumber||'—')}</span></div>
        <div class="mono" style="font-size:13px;margin-bottom:3px">${fmtMoney(c.amount)} <span style="color:var(--ink-soft);font-family:'Figtree',sans-serif">(${c.includesGST ? 'GST '+fmtMoney(round2(c.amount*0.1))+' added' : 'no GST'})</span></div>
        <div style="margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">${pill(statusTone, c.paymentStatus)}${c.paymentMethod?pill('neutral', c.paymentMethod):''}${linkedJob ? `<span style="font-size:11px;color:var(--ink-soft)">→ linked to Job ${esc(linkedJob.invoiceNumber||'')}</span>` : ''}</div>

        ${c.notes ? `<div style="font-size:12px;color:var(--ink-soft);margin-top:2px">${esc(c.notes)}</div>` : ''}
        <div style="font-size:11px;color:var(--ink-faint);margin-top:4px">Posted by ${esc(c.postedBy)} · ${new Date(c.createdAt).toLocaleString('en-AU')}</div>

function postClosing(){
  const technicianName = document.getElementById('cf-tech').value;
  const date = document.getElementById('cf-date').value || todayStr();
  const customerName = document.getElementById('cf-customer').value.trim();
  const invoiceNumber = document.getElementById('cf-invoice').value.trim();
  if (!customerName) { closingFormError('Please enter a customer name'); return; }
  if (!invoiceNumber) { closingFormError('Please enter an invoice number'); return; }
  closingFormError(null);
  const jobType = document.getElementById('cf-jobtype').value;
  const amount = Number(document.getElementById('cf-amount').value) || 0;
  // "No GST" toggle, default OFF (unpressed) — unpressed means GST applies and is added on top of the
  // pre-GST Amount (includesGST:true); pressing "No GST" means includesGST:false (no GST at all).
  const includesGST = !document.getElementById('cf-nogst').checked;
  const paymentStatus = document.getElementById('cf-status').value;
  const paymentMethod = document.getElementById('cf-method').value;
  const partsCost = Number(document.getElementById('cf-partscost').value) || 0;
  const partsPaidBy = document.getElementById('cf-partsby').value;
  const notes = document.getElementById('cf-notes').value;
  const invoiceFileUrl = CLOSING_FILE;
  const gathered = { technicianName, date, customerName, invoiceNumber, jobType, amount, includesGST, paymentStatus, paymentMethod, partsCost, partsPaidBy, notes, invoiceFileUrl };

  // % commission isn't a field on this form (it's Jobs-table-only) — it's looked up automatically from
  // the commission-rates table. When there's no automatic rate for this technician/job-type combo, don't
  // silently fall back to 0%: interrupt with a one-off popup asking for a percentage or a fixed dollar
  // amount, then finish posting once that's supplied (see openCommissionPopup / confirmManualCommission).
  const auto = commissionRateFor(STATE.data.commissionRates, technicianName, jobType);
  if (auto === null) openCommissionPopup(gathered);
  else finalizeClosing(gathered, auto);
}
function openCommissionPopup(gathered){
  PENDING_CLOSING = gathered;
  openModal(`
    <div class="modal-back" onclick="if(event.target===this) cancelCommissionPopup()">
      <div class="modal" style="max-width:440px">
        <h2>Commission for this job</h2>
        <div class="modal-sub">${esc(gathered.technicianName)} has no automatic commission rate set for "${esc(gathered.jobType)}" jobs. Enter one manually to finish posting this closing.</div>
        <div class="field"><label>Set commission as</label>
          <div style="display:flex;gap:16px;padding-top:6px">
            <label class="checkline"><input type="radio" name="cm-mode" value="percent" checked onchange="onCommissionModeChange()"> Percentage</label>
            <label class="checkline"><input type="radio" name="cm-mode" value="dollar" onchange="onCommissionModeChange()"> Fixed dollar amount</label>
          </div>
        </div>
        <div class="grid-2" style="margin-top:11px">
          <div class="field" id="cm-percent-wrap"><label>Commission %</label><input type="number" id="cm-percent" value="0"></div>
          <div class="field" id="cm-dollar-wrap" style="display:none"><label>Commission $ (fixed)</label><input type="number" id="cm-dollar" value="0"></div>
        </div>
        <div id="modal-error"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px">
          <button class="btn" onclick="cancelCommissionPopup()">Cancel</button>
          <button class="btn primary" onclick="confirmManualCommission()">Confirm &amp; post closing</button>
        </div>
      </div>
    </div>`);
}
function onCommissionModeChange(){
  const mode = document.querySelector('input[name="cm-mode"]:checked').value;
  document.getElementById('cm-percent-wrap').style.display = mode==='percent' ? 'flex' : 'none';
  document.getElementById('cm-dollar-wrap').style.display = mode==='dollar' ? 'flex' : 'none';
}
function cancelCommissionPopup(){ PENDING_CLOSING = null; closeModal(); }
function confirmManualCommission(){
  if (!PENDING_CLOSING) { closeModal(); return; }
  const mode = document.querySelector('input[name="cm-mode"]:checked').value;
  let commissionPercent;
  if (mode==='percent') { commissionPercent = Number(document.getElementById('cm-percent').value) || 0; }
  else { const dollar = Number(document.getElementById('cm-dollar').value) || 0; commissionPercent = PENDING_CLOSING.amount > 0 ? round2(dollar/PENDING_CLOSING.amount*100) : 0; }
  const gathered = PENDING_CLOSING; PENDING_CLOSING = null;
  closeModal();
  finalizeClosing(gathered, commissionPercent);
}
function finalizeClosing(g, commissionPercent){
  const currentProfile = getCurrentProfile();
  const existingJob = STATE.data.jobs.find(j => j.invoiceNumber === g.invoiceNumber);
  let linkedJobId, wasCreated;
  if (existingJob) {
    existingJob.customerName = g.customerName; existingJob.technician = g.technicianName; existingJob.date = g.date;
    existingJob.jobType = g.jobType; existingJob.commissionPercent = commissionPercent;
    existingJob.amount = g.amount; existingJob.includesGST = g.includesGST; existingJob.paymentStatus = g.paymentStatus;
    existingJob.paymentMethod = g.paymentMethod; existingJob.partsCost = g.partsCost; existingJob.partsPaidBy = g.partsPaidBy;
    existingJob.notes = g.notes;
    if (g.paymentStatus==='Paid' && !existingJob.datePaid) existingJob.datePaid = todayStr();
    if (g.paymentStatus!=='Paid') existingJob.datePaid = '';
    if (g.invoiceFileUrl) existingJob.invoiceFile = g.invoiceFileUrl;
    linkedJobId = existingJob.id; wasCreated = false;
  } else {
    const newJob = {
      id: uid(), customerName: g.customerName, invoiceNumber: g.invoiceNumber, date: g.date, technician: g.technicianName,
      jobType: g.jobType, commissionPercent, amount: g.amount, includesGST: g.includesGST, paymentStatus: g.paymentStatus,
      paymentMethod: g.paymentMethod, partsCost: g.partsCost, partsPaidBy: g.partsPaidBy, partsRefundStatus:'N/A',
      notes: g.notes || 'Created automatically from a Closings post.', datePaid: g.paymentStatus==='Paid'?todayStr():'',
      paidToTechnician:'Not Paid', enteredBy: g.technicianName, cashConfirmed:false,
      invoiceFile: g.invoiceFileUrl||null, transferReceiptFile:null, equipmentRentalFile:null,
    };
    STATE.data.jobs.push(newJob);
    linkedJobId = newJob.id; wasCreated = true;
  }
  STATE.data.closings.push({
    id: uid(), technicianName: g.technicianName, date: g.date, customerName: g.customerName, invoiceNumber: g.invoiceNumber,
    jobType: g.jobType, amount: g.amount, includesGST: g.includesGST, paymentStatus: g.paymentStatus, paymentMethod: g.paymentMethod,
    partsCost: g.partsCost, partsPaidBy: g.partsPaidBy, notes: g.notes, invoiceFileUrl: g.invoiceFileUrl,
    postedBy: currentProfile?.fullName || g.technicianName, createdAt: new Date().toISOString(), linkedJobId,
  });
  CLOSING_FILE = null;
  showToast(wasCreated ? 'Closing posted — new job created' : 'Closing posted — existing job updated');
  render();
}

/* ── tasks ───────────────────────────────────────────────────────────── */
const TASK_STATUSES = ['Not Started','In Progress','Waiting on Response','Stuck','Done'];
const TASK_STATUS_COLOR = { 'Not Started':'neutral', 'In Progress':'warn', 'Waiting on Response':'warn', Stuck:'bad', Done:'good' };
const TASK_PRIORITIES = ['Low','Medium','High','Urgent'];
const TASK_PRIORITY_COLOR = { Low:'neutral', Medium:'warn', High:'bad', Urgent:'bad' };
const TASK_CATEGORIES = ['','Financial','Personal','Operational','Marketing'];
function taskFilterMode(profile){
  // Owner/Manager need oversight, so they default to "All"; technician/VA profiles default to
  // seeing just their own to-dos. Either can flip the toggle — see setTaskFilterMode().
  if (UI.tasks.filterMode) return UI.tasks.filterMode;
  return (profile.role==='technician' || profile.role==='va') ? 'mine' : 'all';
}
function setTaskFilterMode(mode){ UI.tasks.filterMode = mode; render(); }
function renderTasks(profile, data){
  const board = UI.tasks.board;
  const myName = profile.technicianName || profile.fullName;

function renderUpdatesList(){
  if (!MODAL_UPDATES.length) return `<div class="file-hint">No updates yet.</div>`;
  return MODAL_UPDATES.map(u => `<div style="padding:8px 0;border-bottom:1px solid var(--line-soft)">
    <div style="display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-soft);margin-bottom:3px"><b style="color:var(--ink)">${esc(u.author)}</b><span>${new Date(u.createdAt).toLocaleString('en-AU')}</span></div>
    <div style="font-size:13px;white-space:pre-wrap">${esc(u.text)}</div>
  </div>`).join('');
}
function postTaskUpdate(){
  const input = document.getElementById('tm-update-input');
  const text = input.value.trim(); if (!text) return;
  const currentProfile = getCurrentProfile();
  const entry = { id:uid(), author: currentProfile?.fullName || 'Unknown', text, createdAt: new Date().toISOString() };
  MODAL_UPDATES.push(entry);
  // Updates post immediately to the underlying task (like Monday's Updates panel — independent of the
  // item's own fields), so they survive even if the rest of the modal is cancelled instead of saved.
  if (MODAL_TASK_ID) {
    const task = STATE.data.tasks.find(t=>t.id===MODAL_TASK_ID);
    if (task) { if (!task.updates) task.updates = []; task.updates.push({...entry}); }
  }
  input.value = '';
  document.getElementById('tm-updates-list').innerHTML = renderUpdatesList();
}
function renderSubtasksList(){
  return MODAL_SUBTASKS.map((s,i)=>`<div class="subtask-row"><label><input type="checkbox" ${s.done?'checked':''} onchange="toggleSubtask(${i})"><span style="${s.done?'text-decoration:line-through;color:var(--ink-soft)':''}">${esc(s.text)}</span></label><button type="button" class="btn ghost small" onclick="removeSubtask(${i})">✕</button></div>`).join('') || `<div class="file-hint">No checklist items yet.</div>`;
}
function addSubtask(){
  const input = document.getElementById('tm-subtask-input'); const text = input.value.trim(); if (!text) return;
  MODAL_SUBTASKS.push({ id:uid(), text, done:false }); input.value='';
  document.getElementById('tm-subtasks-list').innerHTML = renderSubtasksList();
}
function toggleSubtask(i){ MODAL_SUBTASKS[i].done = !MODAL_SUBTASKS[i].done; document.getElementById('tm-subtasks-list').innerHTML = renderSubtasksList(); }
function removeSubtask(i){ MODAL_SUBTASKS.splice(i,1); document.getElementById('tm-subtasks-list').innerHTML = renderSubtasksList(); }
function saveTaskModal(taskId, createdBy, createdAt){
  const title = document.getElementById('tm-title').value.trim();
  if (!title) { modalError('Please enter a title'); return; }
  const values = {
    board: UI.tasks.board, title, status: document.getElementById('tm-status').value, due: document.getElementById('tm-due').value,
    notes: document.getElementById('tm-notes').value, client: document.getElementById('tm-client').value.trim(),

    technician: document.getElementById('tm-technician').value.trim(), category: document.getElementById('tm-category').value,
    createdBy, createdAt, subtasks: MODAL_SUBTASKS.map(s=>({...s})), updates: MODAL_UPDATES.map(u=>({...u})),
  };
  if (taskId) Object.assign(STATE.data.tasks.find(t=>t.id===taskId), values); else STATE.data.tasks.push({ id: uid(), ...values });
  closeModal(); showToast(taskId?'Task updated':'Task added'); render();
}

function saveEmployeeModal(empId){
  const name = document.getElementById('em-name').value.trim();
  if (!name) { modalError('Please enter a name'); return; }
  const isOwner = document.getElementById('em-owner').checked, isManager = document.getElementById('em-manager').checked, isTech = document.getElementById('em-tech').checked, isVA = document.getElementById('em-va').checked;
  const roles = [...(isOwner?['Owner']:[]), ...(isManager?['Manager']:[]), ...(isTech?['Technician']:[]), ...(isVA?['VA']:[])];
  const prev = empId ? STATE.data.employees.find(e=>e.id===empId) : null;
  const oldName = prev?.name;
  const values = {
    name, roles, status: document.getElementById('em-status').value, employmentType: document.getElementById('em-emptype').value,
    phone: document.getElementById('em-phone').value.trim(), email: document.getElementById('em-email').value.trim(),
    address: document.getElementById('em-address').value.trim(), abn: document.getElementById('em-abn').value.trim(),
    startDate: document.getElementById('em-startdate').value, endDate: document.getElementById('em-enddate').value,
    bankDetails: document.getElementById('em-bank').value.trim(), commissionNotes: document.getElementById('em-commissionnotes').value,
    contractFile: MODAL_FILES['em-contractFile'] ?? job_or_null(prev,'contractFile'),
    passportPhotoFile: MODAL_FILES['em-passportPhotoFile'] ?? job_or_null(prev,'passportPhotoFile'),
    licensePhotoFile: MODAL_FILES['em-licensePhotoFile'] ?? job_or_null(prev,'licensePhotoFile'),
    localLicenseFile: MODAL_FILES['em-localLicenseFile'] ?? job_or_null(prev,'localLicenseFile'),
  };
  if (prev) Object.assign(prev, values); else STATE.data.employees.push({ id: uid(), ...values });
  if (isTech) {
    const rates = { Aircon: document.getElementById('em-aircon').value===''?null:Number(document.getElementById('em-aircon').value), Chimney: document.getElementById('em-chimney').value===''?null:Number(document.getElementById('em-chimney').value), 'Pressure Washing': document.getElementById('em-pw').value===''?null:Number(document.getElementById('em-pw').value), Other: document.getElementById('em-other').value===''?null:Number(document.getElementById('em-other').value) };
    if (oldName && oldName!==name && STATE.data.commissionRates[oldName]) delete STATE.data.commissionRates[oldName];
    STATE.data.commissionRates[name] = rates;
  }
  closeModal(); showToast(empId?'Employee updated':'Employee added'); render();
}
