// Custom confirm dialog, replacing native confirm(). Native confirm() has a real, silent failure mode in
// this app: any browser lets a user check "Prevent this page from creating additional dialogs" after seeing
// a couple of them, which then makes EVERY future confirm() call return false with zero visible feedback —
// so a "Delete" button that used to work can look completely broken with no error anywhere. This dialog is
// just DOM/CSS, so it can't be silenced that way, and it gives a real animated, on-brand confirmation moment.
let CONFIRM_CALLBACK = null;
function confirmAction(message, onConfirm, opts){
  opts = opts || {};
  CONFIRM_CALLBACK = onConfirm;
  const danger = opts.danger !== false;
  const title = opts.title || (danger ? 'Delete this?' : 'Are you sure?');
  const confirmLabel = opts.confirmLabel || (danger ? 'Delete' : 'Confirm');
  document.getElementById('modal-root').insertAdjacentHTML('beforeend', `
    <div class="confirm-back" onclick="if(event.target===this) closeConfirmModal()">
      <div class="confirm-card">
        <div class="confirm-ic${danger?'':' info'}">${danger?'🗑':'?'}</div>
        <div class="confirm-title">${esc(title)}</div>
        <div class="confirm-msg">${esc(message)}</div>
        <div class="confirm-actions">
          <button type="button" class="btn" onclick="closeConfirmModal()">Cancel</button>
          <button type="button" class="btn ${danger?'danger-solid':'primary'}" onclick="runConfirmedAction()">${esc(confirmLabel)}</button>
        </div>
      </div>
    </div>`);
}
function runConfirmedAction(){
  const cb = CONFIRM_CALLBACK;
  closeConfirmModal();
  if (cb) cb();
}
function closeConfirmModal(){
  const el = document.querySelector('.confirm-back');

}
// Collapses a list row out (fade + shrink) before the state mutation actually removes it, instead of the
// row just instantly vanishing on the next render() — makes a delete feel like a real, felt action.
function animateRowRemove(el, then){
  if (!el) { then(); return; }
  const h = el.getBoundingClientRect().height;
  el.style.maxHeight = h + 'px';
  el.style.overflow = 'hidden';
  void el.offsetHeight;
  requestAnimationFrame(()=>{
    el.classList.add('row-removing');
    el.style.maxHeight = '0px';
    el.style.paddingTop = '0px'; el.style.paddingBottom = '0px';
    el.style.marginTop = '0px'; el.style.marginBottom = '0px';

}

/* ── simulated file uploads ──────────────────────────────────────────────
   No backend exists in this preview, so "uploading" a file just reads it
   into memory with FileReader as a data: URI and keeps it on MODAL_FILES
   until Save copies it onto the record. Nothing is written to disk or a
   server, and it is lost on page refresh — that's expected for a preview. */
function fileField(label, fieldId, currentValue){
  MODAL_FILES[fieldId] = currentValue || null;
  return `<div class="field file-field">
    <label>${esc(label)}</label>
    <div class="file-row" id="${fieldId}-row">${fileRowInner(fieldId, currentValue)}</div>
    <input type="file" id="${fieldId}-input" style="display:none" onchange="onFilePicked('${fieldId}', this)">
  </div>`;
}
// Attached files are kept inside the record itself (as an embedded file). Chrome won't open a plain link to one,
// so "View" turns it into a temporary file first and opens that in a new tab.
function openEmbeddedFile(u){
  if (!u) return;
  if (!/^data:/.test(u)) { window.open(u, '_blank', 'noopener'); return; }
  fetch(u).then(r => r.blob()).then(b => { const url = URL.createObjectURL(b); window.open(url, '_blank'); setTimeout(() => URL.revokeObjectURL(url), 60000); })
    .catch(() => showToast('Could not open the file'));
}
function fileRowInner(fieldId, value){
  if (value) {
    return `<a href="#" onclick="event.preventDefault();openEmbeddedFile(MODAL_FILES['${fieldId}'])" class="file-chip">📄 View file</a><button type="button" class="btn ghost small" onclick="clearFileField('${fieldId}')">Remove</button>`;
  }
  return `<button type="button" class="btn small" onclick="document.getElementById('${fieldId}-input').click()">Choose file…</button><span class="file-hint">Saved with this record when you press Save</span>`;
}
function onFilePicked(fieldId, inputEl){
  const file = inputEl.files && inputEl.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    MODAL_FILES[fieldId] = reader.result;
    const row = document.getElementById(fieldId+'-row'); if (row) row.innerHTML = fileRowInner(fieldId, reader.result);
  };
  reader.readAsDataURL(file);
}
function clearFileField(fieldId){
  MODAL_FILES[fieldId] = null;
  const row = document.getElementById(fieldId+'-row'); if (row) row.innerHTML = fileRowInner(fieldId, null);
}

/* ── CRUD actions (ported from mock-backend.ts, operating on STATE.data) ─ */
function onStatusChange(kind, id, value){
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  if (kind==='jobStatus') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.paymentStatus;
    j.paymentStatus = value;
    if (value==='Paid' && !j.datePaid) j.datePaid = todayStr();
    if (value!=='Paid') j.datePaid = '';
    db.jobs.update(j.id, { paymentStatus: j.paymentStatus, datePaid: j.datePaid });
    if (old!==value) logJobActivity(j, actor, `Payment status changed from "${old}" to "${value}"`);
  } else if (kind==='jobPaymentMethod') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.paymentMethod;
    j.paymentMethod = value;
    // Cash jobs are GST-exempt ~99% of the time (Ofek's rule) — default the GST toggle off the moment a
    // job switches to Cash, same as the Jobs/Closings forms. Only fires on an actual switch INTO Cash, so
    // it never silently rewrites a job that was already Cash with GST intentionally left on.
    const patch = { paymentMethod: j.paymentMethod };
    if (value==='Cash' && old!=='Cash' && j.includesGST) { j.includesGST = false; patch.includesGST = false; }
    db.jobs.update(j.id, patch);
    if ((old||'')!==(value||'')) logJobActivity(j, actor, `Payment method changed from "${old||'—'}" to "${value||'—'}"${patch.includesGST===false?' · GST defaulted off for Cash':''}`);
  } else if (kind==='jobPaidTech') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    // A technician is marked paid in ONE place — Payroll's "salary paid" — so it can't be paid twice.
    if (value==='Paid') { showToast('Mark technicians paid in Payroll'); render(); return; }
    const old = j.paidToTechnician;
    j.paidToTechnician = value;
    db.jobs.update(j.id, { paidToTechnician: j.paidToTechnician });
    if (old!==value) logJobActivity(j, actor, `Paid-to-technician changed from "${old}" to "${value}"`);
  } else if (kind==='jobGst') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.includesGST;
    j.includesGST = value==='Yes';
    db.jobs.update(j.id, { includesGST: j.includesGST });
    if (old!==j.includesGST) logJobActivity(j, actor, `GST toggle changed from ${old?'On':'Off'} to ${j.includesGST?'On':'Off'}`);
  } else if (kind==='jobReview') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.reviewTaken;
    j.reviewTaken = value==='Yes';
    db.jobs.update(j.id, { reviewTaken: j.reviewTaken });
    if (old!==j.reviewTaken) logJobActivity(j, actor, `Review ${j.reviewTaken?'marked as taken':'unmarked'}`);
  } else if (kind==='jobType') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.jobType;
    j.jobType = value;
    if (old!==value) logJobActivity(j, actor, `Job type changed from "${old}" to "${value}"`);
    const rate = commissionRateFor(STATE.data.commissionRates, j.technician, value);
    if (rate!==null && rate!==j.commissionPercent) { const oldPct = j.commissionPercent; j.commissionPercent = rate; logJobActivity(j, actor, `Commission % auto-updated from ${oldPct}% to ${rate}% for ${j.technician} · ${value}`); }
    db.jobs.update(j.id, { jobType: j.jobType, commissionPercent: j.commissionPercent });
  } else if (kind==='jobTechnician') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.technician;
    j.technician = value;
    const allowed = jobTypesForTech(value);
    if (!allowed.includes(j.jobType)) { const oldType = j.jobType; j.jobType = allowed[0]; logJobActivity(j, actor, `Job type auto-changed from "${oldType}" to "${j.jobType}" — "${oldType}" isn't done by ${value}`); }
    if (old!==value) logJobActivity(j, actor, `Technician changed from "${old}" to "${value}"`);
    const rate = commissionRateFor(STATE.data.commissionRates, value, j.jobType);
    if (rate!==null && rate!==j.commissionPercent) { const oldPct = j.commissionPercent; j.commissionPercent = rate; logJobActivity(j, actor, `Commission % auto-updated from ${oldPct}% to ${rate}% for ${value} · ${j.jobType}`); }
    db.jobs.update(j.id, { technician: j.technician, jobType: j.jobType, commissionPercent: j.commissionPercent });
  } else if (kind==='jobPartsPaidBy') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.partsPaidBy;
    j.partsPaidBy = value;
    db.jobs.update(j.id, { partsPaidBy: j.partsPaidBy });
    if ((old||'')!==(value||'')) logJobActivity(j, actor, `Parts paid-by changed from "${old||'—'}" to "${value||'—'}"`);
  } else if (kind==='leadStage') {
    setLeadStage(id, value);
    return;
  } else if (kind==='leadDivision') {
    const c = STATE.data.contacts.find(x=>x.id===id);
    const old = c.division;
    c.division = value;
    db.contacts.update(c.id, { division: c.division });
    if (old!==value) logContactActivity(c, actor, `Division changed from "${old}" to "${value}"`);
  } else if (kind==='leadSource') {
    const c = STATE.data.contacts.find(x=>x.id===id);
    const old = c.source;
    c.source = value;
    db.contacts.update(c.id, { source: c.source });
    if (old!==value) logContactActivity(c, actor, `Source changed from "${old}" to "${value}"`);
  } else if (kind==='empStatus') {
    const emp = STATE.data.employees.find(x=>x.id===id);
    const old = emp.status;
    emp.status = value;
    db.employees.update(emp.id, { status: emp.status });
    if (old!==value) logEmployeeActivity(emp, actor, `Status changed from "${old}" to "${value}"`);
  } else if (kind==='equipPaidBy') {
    const e = STATE.data.equipmentSpend.find(x=>x.id===id);
    const old = e.paidBy;
    e.paidBy = value;
    db.equipmentSpend.update(e.id, { paidBy: e.paidBy });
    if (old!==value) logEquipmentActivity(e, actor, `Paid-by changed from "${old}" to "${value}"`);
  } else if (kind==='taskPriority') {
    const t = STATE.data.tasks.find(x=>x.id===id);
    const old = t.priority;
    t.priority = value;
    db.tasks.update(t.id, { priority: t.priority });
    if (old!==value) logTaskActivity(t, actor, `Priority changed from "${old||'—'}" to "${value||'—'}"`);
  } else if (kind==='equipReimbursed') {
    const e = STATE.data.equipmentSpend.find(x=>x.id===id);
    const old = e.reimbursed;
    e.reimbursed = value;
    db.equipmentSpend.update(e.id, { reimbursed: e.reimbursed });
    if (old!==value) logEquipmentActivity(e, actor, `Reimbursement status changed from "${old}" to "${value}"`);
  } else if (kind==='taskStatus') {
    const t = STATE.data.tasks.find(x=>x.id===id);
    t.status = value;
    db.tasks.update(t.id, { status: value });
  }
  render();
}
function deleteJob(id){ confirmAction('Delete this job?', ()=>{ db.jobs.remove(id); showToast('Deleted'); render(); }); }
function deleteTask(id){ confirmAction('Delete this task?', ()=>{ db.tasks.remove(id); showToast('Deleted'); render(); }); }
function deleteRefItem(kind, id){ confirmAction('Delete this item?', ()=>{ db[kind].remove(id); showToast('Deleted'); render(); }); }
function deleteEquipSpend(id){ confirmAction('Delete this purchase?', ()=>{ db.equipmentSpend.remove(id); showToast('Deleted'); render(); }); }
function deleteEmployee(id){ confirmAction('Delete this employee?', ()=>{ db.employees.remove(id); showToast('Deleted'); render(); }); }

function renderLogin(){
  const err = AUTH.error ? `<div class="banner" style="margin-top:14px;border-color:var(--bad);background:var(--bad-soft);color:var(--bad)">${esc(AUTH.error)}</div>` : '';
  return loginCardShell(`
    ${err}
    <p style="font-size:12.5px;color:var(--ink-soft);margin:14px 0 10px">Sign in with your work email:</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="field"><label>Email</label><input id="auth-email" type="email" autocomplete="username" placeholder="you@company.com"></div>
      <div class="field"><label>Password</label><input id="auth-password" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter'){doSignIn()}"></div>
      <button class="btn primary" style="width:100%" onclick="doSignIn()">Sign in</button>
      <button class="btn ghost small" style="align-self:center" onclick="doForgotPassword()">Forgot your password?</button>
    </div>
  `);
}
async function doSignIn(){
  AUTH.error = null;
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!email || !password) { AUTH.error = 'Enter your email and password.'; render(); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { AUTH.error = error.message; render(); }
  // on success, onAuthStateChange fires SIGNED_IN and calls render() itself
}
async function doForgotPassword(){
  const email = (document.getElementById('auth-email')?.value || '').trim();
  if (!email) { AUTH.error = 'Enter your email above first, then click "Forgot your password?" again.'; render(); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  AUTH.error = error ? error.message : null;
  showToast(error ? 'Could not send reset email' : 'Password reset email sent — check your inbox');
  render();
}
function renderSetPassword(){
  const err = AUTH.error ? `<div class="banner" style="margin-top:14px;border-color:var(--bad);background:var(--bad-soft);color:var(--bad)">${esc(AUTH.error)}</div>` : '';
  return loginCardShell(`
    <p style="font-size:12.5px;color:var(--ink-soft);margin:14px 0 10px">Welcome — set a password for your account to finish signing in:</p>
    ${err}
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="field"><label>New password</label><input id="auth-newpass" type="password" autocomplete="new-password"></div>
      <div class="field"><label>Confirm password</label><input id="auth-newpass2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter'){doSetPassword()}"></div>
      <button class="btn primary" style="width:100%" onclick="doSetPassword()">Set password &amp; continue</button>
    </div>
  `);
}
async function doSetPassword(){
  AUTH.error = null;
  const p1 = document.getElementById('auth-newpass').value;
  const p2 = document.getElementById('auth-newpass2').value;
  if (!p1 || p1.length < 8) { AUTH.error = 'Password must be at least 8 characters.'; render(); return; }
  if (p1 !== p2) { AUTH.error = "Passwords don't match."; render(); return; }
  // Clear the #access_token=...&type=invite fragment BEFORE calling updateUser, not after — the
  // onAuthStateChange handler re-checks location.hash on every event (including the USER_UPDATED
  // one this call triggers), and if that check still saw type=invite it would flip us straight
  // back to the set-password screen right after successfully setting it.
  history.replaceState(null, '', location.pathname);
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) { AUTH.error = error.message; render(); return; }
  AUTH.status = 'ready';
  render();
}
async function doLogout(){
  const p = getCurrentProfile();
  if (p && p.role==='va' && !readOnlyReason() && STATE.data && !doLogout.confirmed) { mdEndOfDay(); return; }
  doLogout.confirmed = false;
  if (p && p.role==='va' && !readOnlyReason() && !doLogout.silent) { try { await sb.rpc('mark_logout'); } catch (e) {} }
  doLogout.silent = false;
  if (PRESENT) { try { localStorage.setItem('tgsg_present','0'); } catch(e) {} PRESENT = false; }   // a demo never carries over to the next login
  phoneStop(); renderPhoneWidget();
  await sb.auth.signOut();
  teardownRealtimeSubscriptions();
  STATE.data = null; STATE.dataLoaded = false; STATE.profiles = []; STATE.currentProfileId = null;
  resetUI();
  // onAuthStateChange fires SIGNED_OUT and calls render() itself
}
// Lets anyone signed in replace their own password (e.g. the temporary one Ofek set manually via
// the Supabase dashboard for onboarding) — available in the sidebar for every role, not gated by
// any permission, since everyone needs to be able to do this for themselves.
function openChangePasswordModal(){
  openModal(`
    <div class="modal-back" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:420px">
        <h2>Change Password</h2>
        <div class="field"><label>New password</label><input type="password" id="cp-new1" autocomplete="new-password"></div>
        <div class="field" style="margin-top:11px"><label>Confirm new password</label><input type="password" id="cp-new2" autocomplete="new-password"></div>
        <div id="modal-error"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn primary" onclick="doChangePassword()">Save</button>
        </div>
      </div>
    </div>`);
}
async function doChangePassword(){
  const p1 = document.getElementById('cp-new1').value;
  const p2 = document.getElementById('cp-new2').value;
  if (!p1 || p1.length < 8) { modalError('Password must be at least 8 characters.'); return; }
  if (p1 !== p2) { modalError("Passwords don't match."); return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) { modalError(error.message); return; }
  closeModal();
  showToast('Password updated');
}

/* ── app shell ───────────────────────────────────────────────────────── */
// NAV is data-driven for plain single-target sections. Two spots need special handling because
// they don't map 1:1 to a single UI.tab value: the Tasks section is split into two sidebar links
// ("Ron's Tasks" / "My Tasks") that both render the *same* Tasks page pre-filtered to a board,
// and Equipment/Employees/Suppliers collapse into one "Resources" group that all point at the
// existing Reference page pre-selected to a tab — see goTasks()/goResources() and the custom
// blocks inside renderShell() below. Both stay gated by their original single permission flag
// (`tasks` / `reference`) so the permission model itself is untouched.
// navBlocks below is consumed positionally in renderShell (index 0..3) — keep this array's order and
// length in sync with that template if you add or remove a group.
const NAV = [
  { group:'Sales', items:[ {id:'myDay', label:'My Day', icon:'☀'}, {id:'crm', label:'CRM', icon:'◈'}, {id:'crmOverview', label:'Leads & Marketing', icon:'📊'}, {id:'adsGoogle', label:'Google Ads', icon:'🎯'} ] },
  { group:'Overview', items:[ {id:'dashboard', label:'Dashboard', icon:'🧭'}, {id:'reminders', label:'Reminders', icon:'●'}, {id:'openItems', label:'Open Tasks', icon:'▣'} ] },
  { group:'Finance', items:[ {id:'jobs', label:'Jobs & Commissions', icon:'▤'}, {id:'finance', label:'Financial Summary', icon:'▦'}, {id:'payroll', label:'Payroll', icon:'💵'}, {id:'outstanding', label:'Outstanding', icon:'▧'} ] },
  { group:'System', items:[ {id:'settings', label:'Permissions & Settings', icon:'⚙'} ] },
];
function goTab(id){ const go = () => { UI.tab = id; UI.mobileNavOpen = false; render(); }; if (UI.tab==='crm' && id!=='crm' && UI.crm.view==='inbox' && !leadLeaveGuard(UI.crm.selectedContactId, go)) return; go(); }
function goTasks(board){ UI.tab = 'tasks'; UI.tasks.board = board; UI.mobileNavOpen = false; render(); }
function goResources(tab){ UI.tab = 'reference'; UI.reference.tab = tab; UI.mobileNavOpen = false; render(); }
function toggleMobileNav(){ UI.mobileNavOpen = !UI.mobileNavOpen; render(); }
function toggleResourcesGroup(){ UI.resourcesOpen = !UI.resourcesOpen; render(); }
function toggleTechTasksGroup(){ UI.techTasksOpen = !UI.techTasksOpen; render(); }
// board model: 'ron' and 'mine' are the two fixed boards; any other string is that technician's
// own personal board (their name, e.g. 'Guy'). This function is the single source of truth for labels.
function taskBoardLabel(board){
  if (board==='ron') return "Ron's Tasks";
  if (board==='mine') return 'My Tasks';
  return `${board}'s Tasks`;
}
function activeTechnicianNames(data){ return data.employees.filter(e=>e.roles.includes('Technician') && e.status==='Active').map(e=>e.name); }

function navButtonHtml(id, label, icon, active, onClick, badge){
  return `<button onclick="${onClick}" onmouseover="if(!${active}) this.style.background='var(--sidebar-bg-hover)'" onmouseout="if(!${active}) this.style.background='none'" style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:6px;color:${active?'#fff':'var(--sidebar-ink-soft)'};font-size:13.3px;font-family:'Figtree',sans-serif;font-weight:${active?'700':'500'};border:none;box-shadow:${active?'inset 3px 0 0 var(--sidebar-accent)':'none'};background:${active?'var(--sidebar-bg-active)':'none'};text-align:start;width:100%;transition:background .1s">
    <span style="width:18px;text-align:center;flex:none;font-size:15px;opacity:${active?'1':'.75'};color:${active?'var(--sidebar-accent)':'inherit'}">${icon}</span><span>${esc(label)}</span>${badge||''}
  </button>`;
}

function renderShell(profile, data){
  const reminderCount = remindersFor(profile, data).filter(it=>!it.isRead).length;
  // navBlocks: [Overview group, Finance group, System group], in NAV's declared order — Closings and
  // Management (built separately below, since they need custom per-item logic) are spliced in between.
  const navBlocks = NAV.map(g => {
    // 'adsGoogle' is a standalone page only for people who are not owners/managers (they open it from the Dashboard dropdown).
    const visible = g.items.filter(it => canViewSection(profile, it.id) && !((it.id==='adsGoogle' || it.id==='crmOverview') && (profile.role==='owner' || profile.role==='manager')));
    if (!visible.length) return '';
    const itemsHtml = visible.map(it => {
      const active = UI.tab===it.id;
      const badge = (it.id==='reminders' && reminderCount>0) ? `<span style="margin-inline-start:auto;background:var(--bad);color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:99px;min-width:16px;text-align:center">${reminderCount}</span>` : '';
      return navButtonHtml(it.id, it.label, it.icon, active, `goTab('${it.id}')`, badge);
    }).join('');
    return `<div><div class="nav-group-label">${esc(g.group)}</div>${itemsHtml}</div>`;
  });

  // "Closings" — inserted right after Overview since it's the frontline feed technicians post to.
  const closingsHtml = canViewSection(profile,'closings')
    ? `<div><div class="nav-group-label">Field</div>${navButtonHtml('closings','Closings','🧾', UI.tab==='closings', "goTab('closings')")}</div>`
    : '';

  // "Management" group: task boards (split from one Tasks link, same `tasks` permission) and the
  // collapsible Resources group (Equipment / Employees / Suppliers, same `reference` permission).
  // Task board nav depends on role, not just the `tasks` flag: a technician gets exactly ONE link — their
  // own personal board — never Ron's, never Mine, never another technician's. Owner/Manager/VA instead
  // get Ron's Tasks + My Tasks (the owner's own board) + a collapsible group with every active
  // technician's board listed separately, mirroring the Resources group's pattern.
  const mgmtItems = [];
  if (canViewSection(profile,'tasks')) {
    if (profile.role==='technician') {
      const myBoard = profile.technicianName;
      if (myBoard) mgmtItems.push(navButtonHtml('tasksMineTech', taskBoardLabel(myBoard), '☑', UI.tab==='tasks' && UI.tasks.board===myBoard, `goTasks('${esc(myBoard)}')`));
    } else {
      mgmtItems.push(navButtonHtml('tasksPatrick', "Ron's Tasks", '☐', UI.tab==='tasks' && UI.tasks.board==='ron', "goTasks('ron')"));
      if (profile.role!=='va') mgmtItems.push(navButtonHtml('tasksMine', 'My Tasks', '☑', UI.tab==='tasks' && UI.tasks.board==='mine', "goTasks('mine')"));
      const techs = activeTechnicianNames(data);
      if (techs.length) {
        const techOpen = !!UI.techTasksOpen;
        const techSubItems = techs.map(t => navButtonHtml('tasks-'+t, taskBoardLabel(t), '☑', UI.tab==='tasks' && UI.tasks.board===t, `goTasks('${esc(t)}')`)).join('');
        mgmtItems.push(`<div>
          <button onclick="toggleTechTasksGroup()" style="display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 10px;border-radius:6px;border:none;background:none;color:var(--sidebar-ink-soft);font-size:13.3px;font-family:'Figtree',sans-serif;font-weight:500;text-align:start">
            <span style="display:flex;align-items:center;gap:10px"><span style="width:18px;text-align:center;flex:none;font-size:15px">☑</span><span>Technicians</span></span>
            <span style="font-size:10px;color:var(--sidebar-ink-faint)">${techOpen?'▾':'▸'}</span>
          </button>
          ${techOpen ? `<div style="padding-inline-start:16px">${techSubItems}</div>` : ''}
        </div>`);
      }
    }
  }
  if (canViewSection(profile,'reference')) {
    const open = !!UI.resourcesOpen;
    const subItems = [['equipment','Equipment'],['employees','Employees'],['suppliers','Suppliers']]

/* ── overview: arbitrary date-range aggregation (business-wide, not per-week) ─
   Independent of computeWeek/computeMonth — those stay untouched since Finance
   relies on their week-specific "late payment" semantics, which don't generalize
   to an arbitrary range. This is a simpler, direct range aggregate. */
function resolveOverviewRange(ui, now){
  const today = todayStr(now);
  const mode = ui.range;
  if (mode==='month') {
    const d = parseLocalDate(today);
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const last = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return { start: fmtLocal(first), end: fmtLocal(last), label: `${monthOf(today).label} (month to date)` };
  }
  if (mode==='7d') {
    const end = parseLocalDate(today); const start = new Date(end); start.setDate(end.getDate()-6);
    return { start: fmtLocal(start), end: fmtLocal(end), label: 'Last 7 days' };
  }
  if (mode==='14d') {
    const end = parseLocalDate(today); const start = new Date(end); start.setDate(end.getDate()-13);
    return { start: fmtLocal(start), end: fmtLocal(end), label: 'Last 14 days' };
  }
  if (mode==='30d') {
    const end = parseLocalDate(today); const start = new Date(end); start.setDate(end.getDate()-29);
    return { start: fmtLocal(start), end: fmtLocal(end), label: 'Last 30 days' };
  }
  if (mode==='custom') {
    const start = ui.customFrom || today, end = ui.customTo || today;
    return { start: start<=end?start:end, end: start<=end?end:start, label: 'Custom range' };
  }
  const w = weekOf(today);
  return { start: fmtLocal(w.start), end: fmtLocal(w.end), label: `Week of ${w.label}` };
}
function computeRevenueByWeekInRange(data, startDateStr, endDateStr, technicianFilter){
  const keys = []; const seen = new Set();
  let d = parseLocalDate(startDateStr);
  const endKey = weekOf(endDateStr).key;
  for (let guard=0; guard<60; guard++) {
    const wk = weekOf(fmtLocal(d)).key;
    if (!seen.has(wk)) { seen.add(wk); keys.push(wk); }
    if (wk===endKey) break;
    d.setDate(d.getDate()+7);
  }
  return keys.map(k => ({ label: weekOf(k).label, revenue: round2(computeWeek(data, k, technicianFilter).jobs.reduce((s,j)=>s+j.amount,0)) }));
}
function renderBarGroup(items, opts){
  // opts.fmt lets a caller render plain counts instead of money (the CRM channel chart) — defaults to
  // money so the existing Overview call sites keep working unchanged.
  const fmt = (opts && opts.fmt) || fmtMoney;
  const max = Math.max(...items.map(i=>i.value), 0.0001);
  const bars = items.map(it => {
    const pct = it.value>0 ? Math.max(4, Math.round((it.value/max)*100)) : 2;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0${it.onclick?';cursor:pointer':''}"${it.onclick?` onclick="${it.onclick}" title="Show the list"`:''}>
      <div class="mono${it.onclick?' xlink':''}" style="font-size:12px;font-weight:600;white-space:nowrap">${fmt(it.value)}</div>
      <div style="width:100%;height:64px;display:flex;align-items:flex-end;background:var(--surface-3);border-radius:4px;overflow:hidden">
        <div style="width:100%;height:${pct}%;background:${it.color};transition:height .2s"></div>
      </div>
      <div style="font-size:10.3px;color:var(--ink-soft);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%">${esc(it.label)}</div>
    </div>`;
  }).join('');
  return `<div style="display:flex;gap:10px;align-items:flex-end;margin-top:6px">${bars}</div>`;
}
/* ── lightweight inline charts (no dependency; dependency-free SVG/CSS) ─ */
function renderSparkline(series, opts){
  opts = opts || {};
  const values = series.map(s=>s.revenue);
  const w = 240, h = 46, pad = 3;
  const max = Math.max(...values, 0.0001);
  const n = values.length;
  if (n < 2) return '';
  const stepX = (w - pad*2) / (n-1);
  const pts = values.map((v,i) => [pad + i*stepX, h - pad - (v/max)*(h-pad*2)]);
  const line = pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[n-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const color = opts.color || 'var(--primary)';
  const summary = series.map(s => `${s.label}: ${fmtMoney(s.revenue)}`).join(', ');
  const labelsRow = series.map(s => `<span style="flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.label)}</span>`).join('');
  return `<div style="margin-top:10px">
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Revenue trend — ${esc(summary)}">
      <path d="${area}" fill="${color}" opacity=".14"></path>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div style="display:flex;gap:2px;margin-top:3px;font-size:9.5px;color:var(--ink-faint)">${labelsRow}</div>
  </div>`;
}

/* ── CRM: leads & customers ──────────────────────────────────────────────
   The main sales board. A lead moves New → Follow-up → Won/Lost, and the three
   tag families (source / division / status) are kept as separate fields rather
   than one free-form tag pile, which is what makes the per-channel and per-
   division counts in the stat row actually countable. ── */
// Sources (Ofek, 2026-09-27). The stored value 'Organic' is shown as "Organic web" (every website form without an ad signal);
// 'Unknown' is for leads where nobody knows how they found us. 'Phone Call' is a legacy value on old rows only.
const LEAD_SOURCES = ['Google Ads','Meta Ads','Google Maps','Organic','Unknown'];
const LEAD_SOURCE_LABEL = { Organic:'Organic web', 'Phone Call':'Phone (old)' };
function sourceLabel(s){ return LEAD_SOURCE_LABEL[s] || s || '—'; }
const LEAD_DIVISIONS = ['Aircon','Chimney','Pressure Washing','Other'];
// Pipeline stages (Ofek, 2026-09-27). Stored values keep 'New' and 'Follow-up' so older rows need no rewrite; the legacy
// 'Not Relevant' reads as Lost. Won is never picked by hand: a lead is Won as soon as its customer has a job.
const LEAD_STATUSES = ['New','Chasing','Quoted','Follow-up','Booked','Won','Lost'];
const LEAD_STAGE_PICKABLE = ['New','Chasing','Quoted','Follow-up','Booked','Lost'];
const LEAD_STAGE_LABEL = { New:'New lead', Chasing:'Chasing', Quoted:'Quoted', 'Follow-up':'Follow up', Booked:'Booked', Won:'Won', Lost:'Lost' };
function stageLabel(s){ return LEAD_STAGE_LABEL[s] || s; }
const LEAD_STATUS_COLOR = { New:'var(--primary)', Chasing:'var(--accent)', Quoted:'var(--primary-teal)', 'Follow-up':'var(--warn)', Booked:'var(--good)', Won:'var(--good)', Lost:'var(--ink-faint)', 'Not Relevant':'var(--ink-faint)' };
const LEAD_SOURCE_COLOR = { 'Google Ads':'var(--primary)', 'Meta Ads':'var(--accent)', 'Google Maps':'var(--ink-faint)', Organic:'var(--good)', Unknown:'var(--ink-faint)', 'Phone Call':'var(--warn)' };
// Stages that must always carry a FUTURE follow-up date.
const STAGES_NEED_DATE = ['Quoted','Follow-up'];
// The stage rules (date lock) apply to leads created or moved from this day on; older leads get them when the old data is migrated.
const PIPELINE_RULES_FROM = '2026-09-27';
function leadStage(c){
  if (!c) return 'New';
  if (c.status==='Won' || leadWonByJob(c)) return 'Won';
  if (c.status==='Lost' || c.status==='Not Relevant') return 'Lost';
  return LEAD_STATUSES.includes(c.status) ? c.status : 'New';
}
// Same answer as contactHasJob (job linked by id, else same customer name), but from an index rebuilt once per render,
// because the CRM asks it for every lead many times while sorting and drawing.
const JOB_CACHE = { index:null };
function jobIndex(){
  const jobs = (STATE.data && STATE.data.jobs) || [];
  let ix = JOB_CACHE.index;
  if (!ix || ix.jobs !== jobs || ix.len !== jobs.length) {
    // For each customer id / name: the date of their latest job.
    const ids = new Map(), names = new Map();
    const keep = (m, k, d) => { if (k && (!m.has(k) || String(d||'') > m.get(k))) m.set(k, String(d||'')); };
    jobs.forEach(j => { keep(ids, j.contactId, j.date); keep(names, (j.customerName||'').trim().toLowerCase(), j.date); });
    ix = JOB_CACHE.index = { jobs, len: jobs.length, ids, names };
  }
  return ix;
}
// The latest job date for this customer (linked by id, else same name), or null when they have no job.
function leadLatestJobDate(c){
  const ix = jobIndex();
  const a = c.id && ix.ids.has(c.id) ? ix.ids.get(c.id) : null;
  const n = (c.fullName||'').trim().toLowerCase();
  const b = n && ix.names.has(n) ? ix.names.get(n) : null;
  if (a===null) return b; if (b===null) return a;
  return a > b ? a : b;
}
// A job makes a lead Won — except for a returning customer who enquired again: their old jobs don't count,
// only a job dated on or after the day they came back (Ofek, 28 Sep: "attach to the existing card").
function leadWonByJob(c){
  const d = leadLatestJobDate(c);
  if (d===null) return false;
  return !c.reopenedAt || d >= localDay(c.reopenedAt);
}
// One rule for follow-ups everywhere (CRM cards, "Needs a follow-up today", Open Tasks, Reminders): a lead's
// follow-up is due once its date is today or earlier and the lead is still being worked (not Booked/Won/Lost).
// A follow-up dated in the future shows nowhere and counts nowhere until its day comes.
function followupDue(c, today){ return !!c.nextFollowUp && c.nextFollowUp <= (today || todayStr()) && !['Booked','Won','Lost'].includes(leadStage(c)); }
function leadRulesApply(c){ return !!c && (!!c.stageChangedAt || localDay(c.createdAt) >= PIPELINE_RULES_FROM); }
function leadNeedsFutureDate(c){ return leadRulesApply(c) && STAGES_NEED_DATE.includes(leadStage(c)) && !(c.nextFollowUp && c.nextFollowUp > todayStr()); }
// Finer-grained breakdown tags, layered on top of the division/source rollups above rather than
// replacing them — a lead still counts once toward "Aircon" / "Meta Ads" in every existing report,
// and *additionally* carries one of these (when known) via the existing free-form tags array, so
// "how many were Instagram vs Facebook" is answerable without splitting the totals Ofek budgets
// against. Auto-applied by the intake-lead Edge Function from UTM/landing-page/message-text
// signals; always just a normal tag from here on, editable/removable like any other.
const AIRCON_TYPE_TAGS = ['Split System','Duct System','Ventilation'];
// Why a lead was lost — the fixed list Ofek set on 2026-09-27. Until the Lost stage makes one of these mandatory, older leads
// are classified from their free-form tags (first match wins; price before 'not interested' because GHL wrote 'not interested - price').
const LOST_REASONS = [
  { key:'noAnswer',      label:'No answer',             match:t => t.includes('no answer') || t.includes('not answering') },
  { key:'outsideArea',   label:'Outside service area',  match:t => t.includes('outside service area') || t.includes('outside area') },
  { key:'spam',          label:'Spam',                  match:t => t.includes('spam') },
  { key:'wrongNumber',   label:'Wrong number',          match:t => t.includes('wrong number') },
  { key:'wrongDetails',  label:'Wrong details',         match:t => t.includes('wrong details') || t.includes('incorrect details') },
  { key:'tooExpensive',  label:'Too expensive',         match:t => t.includes('price') || t.includes('expensive') },
  { key:'notInterested', label:'Not interested',        match:t => t.includes('not interested') },
];
function lostReasonOf(c){
  if (c.lostReason && LOST_REASONS.some(r=>r.key===c.lostReason)) return c.lostReason;
  const tags = (c.tags||[]).map(t=>String(t).toLowerCase());
  const order = ['tooExpensive','outsideArea','spam','wrongNumber','wrongDetails','noAnswer','notInterested'];
  for (const k of order) { const r = LOST_REASONS.find(x=>x.key===k); if (tags.some(r.match)) return k; }
  return 'noReason';
}
const META_PLATFORM_TAGS = ['Facebook','Instagram'];
// Read-only — populated once, at creation, by the intake-lead Edge Function (or blank for every
// lead entered directly in the app). Shared between the CRM Inbox details panel and the lead
// modal's Details tab so the two never drift. Renders nothing at all if there's no data, which is

function renderMarketingSourceBlock(c){

    <label>Marketing source</label>
    <div style="font-size:12px;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px;padding-top:2px">
      ${rows.map(([label,v])=>`<div><b style="color:var(--ink)">${esc(label)}:</b> ${esc(v)}</div>`).join('')}
    </div>

// Preset follow-up actions Ron reaches for constantly — one tap instead of typing the same text again.
const FOLLOWUP_PRESETS = [
  { label:'Follow up', text:'Follow up call', kind:'reminder' },
  { label:'Send quote', text:'Send quote', kind:'task' },
  { label:'Send report', text:'Send report', kind:'task' },
];
// The conversation thread — NOT a live connection to real SMS/Facebook/Instagram. Regardless of which
// channel the customer actually used, it all lands in the same one thread here, so there's nothing to pick
// per message. The composer default action is a reply (always outgoing, like a normal messaging app);
// logging something the customer said elsewhere is a deliberate, separate secondary action so it never
// feels like "pretending to be the customer". Wiring this to real channels is a Stage-3+/telephony task
// (needs a server + provider APIs) — see the roadmap.

function setCrmView(v){ UI.crm.view = v; render(); }
function setCrmRange(r){ UI.crmOverview.range = r; render(); }
function resolveCrmRange(){ return resolveOverviewRange(UI.crmOverview); }
function contactById(id){ return STATE.data.contacts.find(c=>c.id===id) || null; }
function lastContactedAt(c){
  // Seed data uses naive local-time strings for `at`, while live-logged messages use full UTC
  // ISO strings (new Date().toISOString()) — comparing those as raw strings can misorder them,
  // so always compare via Date.parse, never string `>`/localeCompare.
  const msgs = [...(c.messages||[]), ...convMessagesFor(c.id)];
  if (!msgs.length) return c.createdAt;
  return msgs.reduce((max,m)=> new Date(m.at).getTime()>new Date(max).getTime()?m.at:max, msgs[0].at);
}
function unreadCountFor(c){
  const sinceMs = c.lastReadAt ? new Date(c.lastReadAt).getTime() : 0;
  return [...(c.messages||[]), ...convMessagesFor(c.id)].filter(m => m.kind==='message' && m.direction==='in' && new Date(m.at).getTime() > sinceMs).length;
}
function unreadBadge(c){
  const n = unreadCountFor(c);
  return n>0 ? `<span class="unread-badge">${n}</span>` : '';
}
function markLeadRead(contactId){
  const c = contactById(contactId); if (!c) return;
  if (unreadCountFor(c)===0) return;
  c.lastReadAt = new Date().toISOString();
  db.contacts.update(c.id, { lastReadAt: c.lastReadAt });
}
// The explicit "Mark as read" action — opening/selecting a conversation no longer marks it read on its
// own (Ofek's call: unread should mean "still needs my action," not "haven't glanced at it").
function markLeadReadManually(contactId, scope){
  markLeadRead(contactId);
  refreshLeadUnreadUI(contactId, scope);
  if (scope==='inbox') refreshCrmInboxList();
}
function refreshLeadUnreadUI(contactId, scope){
  const btn = document.getElementById(scope+'-mark-read-btn');
  if (btn) btn.style.display = unreadCountFor(contactById(contactId))>0 ? '' : 'none';
}
function logLeadEvent(contact, text){
  if (!contact.messages) contact.messages = [];
  contact.messages.push({ id:uid(), kind:'event', text, at:new Date().toISOString() });
  if (contact.id) db.contacts.update(contact.id, { messages: contact.messages });
}
function renderLeadConversation(contactId){
  const c = contactById(contactId); if (!c) return '';
  const msgs = [...(c.messages||[]), ...convMessagesFor(c.id)].sort((a,b)=>new Date(a.at).getTime()-new Date(b.at).getTime());
  if (!msgs.length) return `<div class="empty" style="padding:26px 10px"><b>No conversation yet</b><div>Log what the customer said and what you replied — it all stays in one thread here.</div></div>`;
  return msgs.map(m => {
    if (m.kind==='event') return `<div class="chat-event">${esc(presentText(m.text))} <span class="chat-event-time">${new Date(m.at).toLocaleString('en-AU')}</span></div>`;
    const out = m.direction==='out';
    return `<div class="chat-row ${out?'out':'in'}">
      <div class="chat-bubble ${out?'out':'in'}">
        <div class="chat-bubble-meta">${esc(m.author || (out?'You':'Customer'))}${m.channel ? ` · ${CONV_CHANNEL_LABEL[m.channel] || m.channel}` : ''}${m.auto ? ' · automatic' : ''}${m.status==='failed' || m.status==='undelivered' ? ` · <span style="color:var(--bad)">⚠ not delivered${m.error ? ' (' + esc(m.error) + ')' : ''}</span>` : ''}</div>
        <div class="chat-bubble-text">${esc(m.text)}</div>
        <div class="chat-bubble-time">${new Date(m.at).toLocaleString('en-AU')}</div>
      </div>
    </div>`;
  }).join('');
}
// The same composer markup/logic backs both the lead modal ("modal" scope) and the CRM Inbox's
// inline thread pane ("inbox" scope) — each scope gets its own element ids so the two can never

      <textarea rows="2" id="${scope}-msg-out-text" placeholder="Reply… (Enter to send, Shift+Enter for a new line)" style="flex:1" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendLeadReply('${contactId}','${scope}');}"></textarea>
      <button type="button" class="btn primary small" onclick="sendLeadReply('${contactId}','${scope}')">Send</button>
    </div>

        <div style="display:flex;gap:8px;align-items:flex-start">
          <textarea rows="2" id="${scope}-msg-in-text" placeholder="What did they say, and where? (Enter to log, Shift+Enter for a new line)" style="flex:1" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();logIncomingMessage('${contactId}','${scope}');}"></textarea>
          <button type="button" class="btn small" onclick="logIncomingMessage('${contactId}','${scope}')">Log</button>

function refreshLeadThread(contactId, scope){
  const thread = document.getElementById(scope+'-conversation-thread');
  if (thread) { thread.innerHTML = renderLeadConversation(contactId); thread.scrollTop = thread.scrollHeight; }
}
function refreshCrmInboxList(){
  const host = document.getElementById('crm-inbox-list');

  const data = filterForProfile(STATE.data, getCurrentProfile());

function sendLeadReply(contactId, scope){
  scope = scope || 'modal';
  const c = contactById(contactId); if (!c) return;
  const textEl = document.getElementById(scope+'-msg-out-text');
  const text = textEl.value.trim(); if (!text) return;
  if (convChannel(c) !== 'note') { convSend(c, convChannel(c), text, scope); return; }
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  if (!c.messages) c.messages = [];
  c.messages.push({ id:uid(), kind:'message', direction:'out', text, author:actor, at:new Date().toISOString() });
  db.contacts.update(c.id, { messages: c.messages });
  markLeadContacted(c);
  markLeadRead(contactId); // replying is itself proof the thread was handled — the newest message is now ours
  textEl.value = '';
  refreshLeadThread(contactId, scope);
  refreshLeadUnreadUI(contactId, scope);
  if (scope==='inbox') refreshCrmInboxList();
}
function toggleLogIncoming(scope){
  scope = scope || 'modal';
  const box = document.getElementById(scope+'-log-incoming-box'); if (!box) return;
  const hidden = box.style.display==='none';
  box.style.display = hidden ? '' : 'none';
  if (hidden) { const ta=document.getElementById(scope+'-msg-in-text'); if (ta) ta.focus(); }
}
function logIncomingMessage(contactId, scope){
  scope = scope || 'modal';
  const c = contactById(contactId); if (!c) return;
  const textEl = document.getElementById(scope+'-msg-in-text');
  const text = textEl.value.trim(); if (!text) return;
  if (!c.messages) c.messages = [];
  c.messages.push({ id:uid(), kind:'message', direction:'in', text, author:c.fullName, at:new Date().toISOString() });
  db.contacts.update(c.id, { messages: c.messages });
  markLeadContacted(c);
  textEl.value = '';
  const box = document.getElementById(scope+'-log-incoming-box'); if (box) box.style.display = 'none';
  refreshLeadThread(contactId, scope);
  if (scope==='inbox') refreshCrmInboxList();
}

function computeCrmStats(contacts){
  const stats = { total:contacts.length, byStatus:Object.fromEntries(LEAD_STATUSES.map(s=>[s,0])), bySource:{}, byDivision:{}, byAirconType:{}, byMetaPlatform:{}, wonValue:0 };
  LEAD_SOURCES.forEach(s=>stats.bySource[s]=0);
  LEAD_DIVISIONS.forEach(d=>stats.byDivision[d]={total:0,won:0});
  AIRCON_TYPE_TAGS.forEach(t=>stats.byAirconType[t]=0);
  META_PLATFORM_TAGS.forEach(t=>stats.byMetaPlatform[t]=0);
  contacts.forEach(c => {
    const st = leadStage(c); if (stats.byStatus[st]!==undefined) stats.byStatus[st]++;
    if (stats.bySource[c.source]!==undefined) stats.bySource[c.source]++;
    if (stats.byDivision[c.division]) {
      stats.byDivision[c.division].total++;
      if (contactHasJob(c, (STATE.data && STATE.data.jobs) || [])) stats.byDivision[c.division].won++;
    }
    // Sub-tags only ever refine their parent bucket, never replace it — an Aircon lead tagged
    // "Duct System" still counts under Aircon above; this just additionally answers "which kind".
    if (c.division==='Aircon') (c.tags||[]).forEach(t => { if (stats.byAirconType[t]!==undefined) stats.byAirconType[t]++; });
    if (c.source==='Meta Ads') (c.tags||[]).forEach(t => { if (stats.byMetaPlatform[t]!==undefined) stats.byMetaPlatform[t]++; });
    if (st==='Booked' || st==='Won') stats.wonValue += Number(c.estimatedValue)||0;
  });
  // Won = the lead became a job (same rule as the Dashboard); close rate = won out of every lead in the period.
  stats.won = contacts.filter(c => contactHasJob(c, (STATE.data && STATE.data.jobs) || [])).length;
  stats.closeRate = contacts.length ? Math.round((stats.won/contacts.length)*100) : null;
  return stats;
}
// Inside the Dashboard, Leads & Marketing follows the Dashboard's period picker (one period for the whole
// page); on its own page it keeps its own. A lead counts on its Sydney day (localDay).
function crmOverviewRange(){
  if (UI.tab==='dashboard') { const r = resolveDashboardRange(UI.dashboard, new Date()); return { start: r.start, end: r.effEnd, label: `${fmtDateShort(r.start)} – ${fmtDateShort(r.effEnd)}` }; }
  return resolveCrmRange();
}
function filteredContacts(data){
  const range = crmOverviewRange();
  let list = data.contacts.filter(c => { const d = localDay(c.createdAt); return d >= range.start && d <= range.end; });
  if (UI.crmOverview.source!=='all') list = list.filter(c=>c.source===UI.crmOverview.source);
  if (UI.crmOverview.division!=='all') list = list.filter(c=>c.division===UI.crmOverview.division);
  return list;
}
function crmFilteredContactsUnsorted(data){
  let list = data.contacts.slice();
  if (UI.crm.source!=='all') list = list.filter(c=>c.source===UI.crm.source);
  if (UI.crm.division!=='all') list = list.filter(c=>c.division===UI.crm.division);
  if (UI.crm.status!=='all') list = list.filter(c=>leadStage(c)===UI.crm.status);
  if (UI.crm.tag && UI.crm.tag!=='all') list = list.filter(c=>(c.tags||[]).includes(UI.crm.tag));
  const q = (UI.crm.search||'').trim().toLowerCase();
  if (q) list = list.filter(c => [c.fullName,c.phone,c.email,c.postcode,c.jobDescription].some(v => (v||'').toLowerCase().indexOf(q)!==-1));
  return list;
}
// Inbox is a message-style screen — it always orders by whoever had the last interaction (either
// direction), like WhatsApp/SMS, regardless of any filter that's active. Table/Pipeline use the
// user-selectable sort (Stage/Newest/Oldest/Last contacted) via opsFilteredContacts below instead.
function crmInboxSortedContacts(data){
  return crmFilteredContactsUnsorted(data).sort((a,b)=>new Date(lastContactedAt(b)).getTime()-new Date(lastContactedAt(a)).getTime());
}
function opsFilteredContacts(data){
  let list = crmFilteredContactsUnsorted(data);
  const sortBy = UI.crm.sortBy || 'stage';
  if (sortBy==='oldest') list.sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  else if (sortBy==='lastContacted') list.sort((a,b)=>new Date(lastContactedAt(b)).getTime()-new Date(lastContactedAt(a)).getTime());
  else if (sortBy==='newest') list.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  else list.sort((a,b) => (LEAD_STATUSES.indexOf(leadStage(a))-LEAD_STATUSES.indexOf(leadStage(b))) || (new Date(lastContactedAt(b)).getTime()-new Date(lastContactedAt(a)).getTime()));
  return list;
}
function updateCrmSearch(v){
  UI.crm.search = v;
  const host = document.getElementById('crm-body');
  if (host) host.innerHTML = renderCrmBody(filterForProfile(STATE.data, getCurrentProfile()));
}

function leadTagChip(text, color){
  return `<span class="lead-tag" style="--tag:${color}">${esc(text)}</span>`;
}
/* ── free-form contact tags (like GHL's tags) — add via typing + a suggestion dropdown of every tag
   already used across contacts, remove with a click. Unlike Division/Source/Stage this is multi-value
   and open-vocabulary, so it doesn't fit the statusSelect single-value pattern. ── */
function jsStr(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function allKnownTags(){
  const set = new Set(STATE.data.tagCatalog||[]);
  (STATE.data.contacts||[]).forEach(c => (c.tags||[]).forEach(t=>set.add(t))); // defensive: a tag on a contact always stays selectable even if the catalog somehow drifted
  return [...set].sort();
}
function registerTag(tag){
  if (!STATE.data.tagCatalog) STATE.data.tagCatalog = [];
  if (!STATE.data.tagCatalog.includes(tag)) { STATE.data.tagCatalog.push(tag); db.tagCatalog.add(tag); }
}
function addLeadTag(contactId, rawTag){
  const c = contactById(contactId); if (!c) return;
  const tag = (rawTag||'').trim().toLowerCase(); if (!tag) return;
  if (!c.tags) c.tags = [];
  registerTag(tag);
  if (c.tags.includes(tag)) { refreshLeadTagsUI(contactId); return; }
  c.tags.push(tag);
  db.contacts.update(c.id, { tags: c.tags });
  logContactActivity(c, getCurrentProfile()?.fullName||'Unknown', `Tag added: "${tag}"`);
  refreshLeadTagsUI(contactId);
  render(); // the CRM page's "All tags" filter (and any other tags-block open elsewhere) only
            // rebuilds on a full render — without this it silently goes stale until something
            // else happens to trigger one, even though the tag is really saved.
}
function removeLeadTag(contactId, tag){
  const c = contactById(contactId); if (!c) return;
  c.tags = (c.tags||[]).filter(t=>t!==tag);
  db.contacts.update(c.id, { tags: c.tags });
  logContactActivity(c, getCurrentProfile()?.fullName||'Unknown', `Tag removed: "${tag}"`);
  refreshLeadTagsUI(contactId);
  render();
}
function refreshLeadTagsUI(contactId){
  document.querySelectorAll(`.lead-tags-block[data-contact="${contactId}"]`).forEach(host => { host.outerHTML = renderLeadTags(contactId, host.dataset.scope); });
}
function renderLeadTags(contactId, scope){
  const c = contactById(contactId); if (!c) return '';
  const tags = c.tags||[];
  const inputId = `tag-input-${scope}-${contactId}`;
  return `<div class="lead-tags-block" data-contact="${contactId}" data-scope="${scope}">
    <div class="lead-tags-chips">
      ${tags.length?tags.map(t=>`<span class="lead-tag-chip">${esc(t)}<span class="lead-tag-x" onclick="removeLeadTag('${contactId}','${jsStr(t)}')">×</span></span>`).join(''):'<span class="hint">No tags yet</span>'}
    </div>
    <form class="lead-tags-add" onsubmit="event.preventDefault(); addLeadTag('${contactId}', document.getElementById('${inputId}').value); closeTagSuggestions();">
      <input id="${inputId}" placeholder="Add a tag…" autocomplete="off" oninput="updateTagSuggestions('${inputId}','${contactId}')" onfocus="updateTagSuggestions('${inputId}','${contactId}')">
      <button type="submit" class="btn ghost small">Add</button>
    </form>
    ${getCurrentProfile()?.role==='owner' ? `<button type="button" class="btn ghost small" style="align-self:flex-start" onclick="goToCrmSettings()">Manage all tags…</button>` : ''}
  </div>`;
}
function goToCrmSettings(){ UI.tab = 'settings'; render(); }
/* ── custom tag-suggestion popup — deliberately NOT a native <datalist>: Chrome's own datalist
   dropdown intercepts the Enter keystroke for itself, so "type a tag and press Enter" silently did
   nothing (confirmed live) even though the Add button worked. This dropdown is plain DOM/JS, so
   nothing but our own code ever sees the keystroke — same reasoning as the date-picker popup. ── */
let OPEN_TAG_SUGGEST = null;
function closeTagSuggestions(){
  const el = document.getElementById('tag-suggest-popup');
  if (el) el.remove();
  document.removeEventListener('click', tagSuggestOutsideClick, true);
  OPEN_TAG_SUGGEST = null;
}
function tagSuggestOutsideClick(e){
  const popup = document.getElementById('tag-suggest-popup');
  const input = OPEN_TAG_SUGGEST && document.getElementById(OPEN_TAG_SUGGEST.inputId);
  if (popup && !popup.contains(e.target) && e.target!==input) closeTagSuggestions();
}
function updateTagSuggestions(inputId, contactId){
  const input = document.getElementById(inputId); if (!input) return;
  const q = input.value.trim().toLowerCase();
  const c = contactById(contactId);
  const existing = (c && c.tags) || [];
  const matches = allKnownTags().filter(t => !existing.includes(t) && (!q || t.includes(q))).slice(0,8);
  if (!matches.length) { closeTagSuggestions(); return; }
  let popup = document.getElementById('tag-suggest-popup');
  if (!popup) {
    popup = document.createElement('div');
    popup.id = 'tag-suggest-popup';
    popup.className = 'tag-suggest-popup';
    document.body.appendChild(popup);
    setTimeout(()=>document.addEventListener('click', tagSuggestOutsideClick, true), 0);
  }
  const rect = input.getBoundingClientRect();
  popup.style.top = (rect.bottom+window.scrollY+2)+'px';
  popup.style.left = (rect.left+window.scrollX)+'px';
  popup.style.width = rect.width+'px';
  popup.innerHTML = matches.map(t=>`<div class="tag-suggest-item" onclick="pickTagSuggestion('${contactId}','${jsStr(t)}')">${esc(t)}</div>`).join('');
  OPEN_TAG_SUGGEST = { inputId, contactId };
}
function pickTagSuggestion(contactId, tag){
  addLeadTag(contactId, tag);
  closeTagSuggestions();
}
/* ── manage-tags modal: pre-create a tag with nobody on it yet (so it appears in filters/autocomplete
   right away), or delete one entirely — which strips it off every lead that has it, so a deleted tag
   can never be filtered by again. ── */
function addCatalogTag(){
  const input = document.getElementById('new-tag-input'); if (!input) return;
  const tag = input.value.trim().toLowerCase(); if (!tag) return;
  registerTag(tag);
  input.value = '';
  refreshManageTagsModal();
  render();
}
function deleteTagGlobally(tag){
  const affected = (STATE.data.contacts||[]).filter(c => (c.tags||[]).includes(tag)).length;
  confirmAction(`Delete the tag "${tag}"?${affected?` It will be removed from ${affected} lead${affected===1?'':'s'}.`:''}`, ()=>{
    STATE.data.tagCatalog = (STATE.data.tagCatalog||[]).filter(t=>t!==tag);
    db.tagCatalog.remove(tag);
    (STATE.data.contacts||[]).forEach(c => {
      if (c.tags && c.tags.includes(tag)) { c.tags = c.tags.filter(t=>t!==tag); db.contacts.update(c.id, { tags: c.tags }); }
    });
    if (UI.crm.tag===tag) UI.crm.tag = 'all';
    showToast(`Tag "${tag}" deleted`);
    refreshManageTagsModal();
    render();
  });
}
function refreshManageTagsModal(){
  const host = document.getElementById('manage-tags-list');
  if (host) host.innerHTML = renderManageTagsList();
}
function renderManageTagsList(){
  const tags = allKnownTags();
  if (!tags.length) return emptyState('No tags yet', 'Add one below.');
  return tags.map(t => {
    const count = (STATE.data.contacts||[]).filter(c=>(c.tags||[]).includes(t)).length;
    return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft)">
      <span class="lead-tag-chip">${esc(t)}</span>
      <span style="font-size:11.5px;color:var(--ink-soft);flex:1">${count} lead${count===1?'':'s'}</span>
      <button type="button" class="btn ghost small danger" onclick="deleteTagGlobally('${jsStr(t)}')">Delete</button>
    </div>`;
  }).join('');
}
/* ── Pipeline stage rules (Ofek, 2026-09-27) ────────────────────────────────────────────────────────
   Every way of changing a stage (dropdowns, drag & drop, the lead form) goes through setLeadStage, so the rules hold everywhere:
   Lost needs a reason · Quoted/Follow up need a future follow-up date · Chasing starts the 3-hour call-back alert and the daily
   "called today" counter · Won is automatic (the customer has a job). */
function setLeadStage(id, stage, after){
  const c = contactById(id); if (!c) return;
  const cur = leadStage(c);
  if (stage==='Won') { showToast('Won is set automatically once the customer has a job in Jobs & Commissions'); render(); return; }

function sydneyWall(d){

  const fmt = sydneyWall.fmt || (sydneyWall.fmt = new Intl.DateTimeFormat('en-CA',{ timeZone:'Australia/Sydney', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false, weekday:'short' }));

function workClockDue(sinceIso, minutes){
  const w = sydneyWall(new Date(sinceIso));

  if (!isWorkday(day) || start >= 17*60) { day = shiftDays(day, 1); start = 8*60; } else if (start < 8*60) start = 8*60;

/* ── Business phone (Twilio, 1 Oct 2026) ──────────────────────────────────────────────────────────────────

function chasingLostStats(data, start, end){
  const lost = (data.contacts||[]).filter(c => leadStage(c)==='Lost' && lostReasonOf(c)==='noAnswer' && c.chasingSince && c.stageChangedAt && localDay(c.stageChangedAt) >= start && localDay(c.stageChangedAt) <= end);
  const rows = lost.map(c => { const a = localDay(c.chasingSince), b = localDay(c.stageChangedAt); return { c, days: new Set((c.chaseCalls||[]).filter(d => d >= a && d <= b)).size }; });
  return { total: lost.length, under: rows.filter(r => r.days < 10).sort((x,y) => x.days - y.days) };
}
function dismissNewLeadBubble(id){ const c = contactById(id); if (!c) return; c.lastReadAt = new Date().toISOString(); db.contacts.update(id, { lastReadAt: c.lastReadAt }); renderChaseBubbles(); }
function dismissChaseBubble(id){ const c = contactById(id); if (!c) return; c.chaseAlertDone = true; db.contacts.update(id, { chaseAlertDone: true }); renderChaseBubbles(); }
setInterval(() => { try { renderChaseBubbles(); } catch(e) {} }, 60000);

function renderLeadCard(c){

      ${leadTagChip(sourceLabel(c.source), LEAD_SOURCE_COLOR[c.source]||'var(--ink-faint)')}

    ${chaseTooLong(c) ? `<div class="lead-due overdue" style="margin-top:4px">⚠ Chasing 21+ days — decide</div>` : ''}
    ${leadStage(c)==='Booked' && c.bookedFor ? `<div class="lead-due" style="margin-top:4px">Job ${fmtDateShort(c.bookedFor)}</div>` : ''}
    ${leadStage(c)==='Lost' ? `<div class="hint" style="margin-top:4px">${esc(lostReasonLabel(lostReasonOf(c)))}</div>` : ''}

    ${c.nextFollowUp ? `<div class="lead-due ${overdue?'overdue':(dueToday?'today':'')}">${overdue?'⚠ Overdue':(dueToday?'● Due today':'○ Follow up')} · ${fmtDateShort(c.nextFollowUp)}</div>` : ''}

let DRAGGED_LEAD_ID = null;
function onLeadDragStart(e, id){ DRAGGED_LEAD_ID = id; try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', id); }catch(err){} }
function onLeadDragOver(e, colEl){ e.preventDefault(); try{ e.dataTransfer.dropEffect='move'; }catch(err){} if (colEl) colEl.classList.add('drag-over'); }
function onLeadDragLeave(colEl){ if (colEl) colEl.classList.remove('drag-over'); }
function onLeadDrop(e, status, colEl){
  e.preventDefault();
  if (colEl) colEl.classList.remove('drag-over');
  let id = DRAGGED_LEAD_ID;
  try { id = e.dataTransfer.getData('text/plain') || id; } catch(err){}
  DRAGGED_LEAD_ID = null;
  if (id) moveLead(id, status);
}
function moveLead(id, status){
  const c = contactById(id); if (!c || leadStage(c)===status) return;
  setLeadStage(id, status, () => {
    render();
    const moved = document.querySelector(`.lead-card[data-lead-id="${id}"]`);
    if (moved) { moved.classList.add('just-moved'); setTimeout(()=>moved.classList.remove('just-moved'), 700); }
  });
}

   unified-inbox layout Ofek uses day to day (screenshots he sent), since this screen is where
   Ron spends most of his time and needs to live entirely in conversations, not a modal per lead. */
function setCrmInboxFilter(f){ UI.crm.inboxFilter = f; render(); }
function selectCrmContact(id){ const go = () => { UI.crm.selectedContactId = id; render(); }; if (UI.crm.selectedContactId && UI.crm.selectedContactId!==id && !leadLeaveGuard(UI.crm.selectedContactId, go)) return; go(); }
function clearCrmSelection(){ const go = () => { UI.crm.selectedContactId = null; render(); }; if (!leadLeaveGuard(UI.crm.selectedContactId, go)) return; go(); }
// Clicking a lead's name anywhere (Pipeline card, Table row, the Reminders follow-up banner) jumps
// straight into the live conversation, instead of opening the full edit modal. Explicit action buttons
// ("Follow-up / edit", "Full profile", "Open") still open the modal — only the plain name-click changes.
// Every way of jumping to another lead or page (a reminder, search, the chasing bubble, a customer link) goes
// through the same follow-up lock as the tabs: a Quoted / Follow up lead can't be left without a future date.
function leaveLeadThen(targetId, go){
  const cur = (UI.tab==='crm' && UI.crm.view==='inbox') ? UI.crm.selectedContactId : null;
  if (cur && cur!==targetId && !leadLeaveGuard(cur, go)) return;
  go();
}
function goToLeadConversation(contactId){
  leaveLeadThen(contactId, () => {
    UI.tab = 'crm';
    UI.crm.view = 'inbox';
    UI.crm.selectedContactId = contactId;
    render();
  });
}
// What a lead's active follow-up is actually about — shown next to the name in "Needs a follow-up
// today" and above the conversation, so a click-through doesn't leave Ofek guessing why he's there.
function leadFollowupContextFor(c){
  if (c.followupNote) return c.followupNote;
  const r = (STATE.data.manualReminders||[]).find(x => x.contactId===c.id && !x.done && x.date===c.nextFollowUp);
  if (!r) return '';
  const suffix = ' — '+c.fullName;
  const title = r.title.endsWith(suffix) ? r.title.slice(0, -suffix.length) : r.title;
  return r.note ? title+' — '+r.note : title;
}
// A general note on the customer (Ofek 3/10): anything to remember (gate code, dog, prefers texts…). Shown on the card
// details, on top of the conversation, and in the full profile.
function setLeadNotes(id, value){
  const c = contactById(id); if (!c) return;
  if (readOnlyReason()) { showToast(readOnlyReason()); return; }
  const v = String(value||'').trim();
  if ((c.notes||'') === v) return;
  c.notes = v; db.contacts.update(id, { notes: v });
  logContactActivity(c, getCurrentProfile()?.fullName||'Unknown', v ? 'Customer note updated' : 'Customer note cleared');
  showToast(v ? 'Note saved' : 'Note cleared');
  const b = document.getElementById('inbox-note-banner'); if (b) { b.style.display = v ? '' : 'none'; b.querySelector('span').textContent = v; }
}
function setLeadFollowupNote(id, value){ const c = contactById(id); if (c) { c.followupNote = value; db.contacts.update(id, { followupNote: value }); } }
function toggleLeadStar(id, event){
  if (event) event.stopPropagation();
  const c = contactById(id); if (!c) return;
  c.starred = !c.starred;
  db.contacts.update(id, { starred: c.starred });

function setLeadFollowupDate(id, value){
  const c = contactById(id); if (!c) return;
  if (leadRulesApply(c) && STAGES_NEED_DATE.includes(leadStage(c)) && !(value && value > todayStr())) { showToast(`A lead in ${stageLabel(leadStage(c))} needs a follow-up date after today`); openFollowupDatePrompt(c, leadStage(c)); return; }
  const old = c.nextFollowUp||''; c.nextFollowUp = value;
  db.contacts.update(id, { nextFollowUp: value });
  if (old!==value) logContactActivity(c, getCurrentProfile()?.fullName||'Unknown', `Follow-up date changed from "${old||'—'}" to "${value||'—'}"`);
}
function setLeadEstimatedValue(id, value){
  const c = contactById(id); if (!c) return;
  const num = Number(value)||0;
  if ((c.estimatedValue||0)!==num) { logContactActivity(c, getCurrentProfile()?.fullName||'Unknown', `Estimated value changed from ${fmtMoney(c.estimatedValue||0)} to ${fmtMoney(num)}`); c.estimatedValue = num; db.contacts.update(id, { estimatedValue: num }); }
}
// Sales value: a customer with jobs gets the total of those jobs automatically (excl. GST); only a lead with no
// job yet has a hand-typed value (what was agreed on the phone). One value, never written from two places.
function contactJobsTotal(c){ if (!c) return null; const js = (STATE.data.jobs||[]).filter(j => j.contactId===c.id); return js.length ? round2(js.reduce((s,j)=>s+(Number(j.amount)||0),0)) : null; }
function salesValueField(c, inputHtml){ const t = contactJobsTotal(c); return t===null ? inputHtml : `<span class="mono" title="The total of this customer's jobs — set automatically">${fmtMoney(t)} <span class="hint">from jobs</span></span>`; }
function setLeadSalesValue(id, value){

  const num = Number(value)||0;
  if ((c.salesValue||0)!==num) { logContactActivity(c, getCurrentProfile()?.fullName||'Unknown', `Sales value changed from ${fmtMoney(c.salesValue||0)} to ${fmtMoney(num)}`); c.salesValue = num; db.contacts.update(id, { salesValue: num }); }

function initials(name){
  return (name||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).filter(Boolean).join('').toUpperCase() || '?';
}
function crmInboxRowPreview(c){
  const msgs = (c.messages||[]).filter(m=>m.kind==='message');
  if (!msgs.length) return c.jobDescription || 'No messages yet';
  const last = msgs.slice().sort((a,b)=>new Date(a.at).getTime()-new Date(b.at).getTime()).pop();
  return (last.direction==='out' ? 'You: ' : '') + last.text;
}
function relativeShortTime(iso){
  const d = new Date(iso), now = new Date();
  if (d.toDateString()===now.toDateString()) return d.toLocaleTimeString('en-AU', {hour:'numeric', minute:'2-digit'});
  const diffDays = Math.round((now-d)/86400000);
  if (diffDays===1) return 'Yesterday';
  if (diffDays>=0 && diffDays<7) return d.toLocaleDateString('en-AU', {weekday:'short'});
  return fmtDateShort(String(iso).slice(0,10));
}
function crmInboxFilterList(contacts){
  const f = UI.crm.inboxFilter || 'all';
  if (f==='unread') return contacts.filter(c=>unreadCountFor(c)>0);
  if (f==='starred') return contacts.filter(c=>c.starred);
  if (f==='recent') { const cutoff = Date.now()-7*86400000; return contacts.filter(c=>new Date(lastContactedAt(c)).getTime()>=cutoff); }
  return contacts;
}

    <th>Name</th><th>Phone</th><th>Division</th><th>Source</th><th>Stage</th><th>Tags</th><th>Created</th><th>Last Contact</th><th>Follow-up</th><th>Est. Value</th><th>Sales Value</th><th>Activity</th><th></th>
  </tr></thead><tbody>${rows}</tbody></table>${renderPager(page, totalPages, total, pageSize, 'setCrmPage', 'setCrmPageSize')}</div>`;
}

function renderCrmOverview(profile, data){
  const range = crmOverviewRange();
  const contacts = filteredContacts(data);
  const stats = computeCrmStats(contacts);

  const inDash = UI.tab==='dashboard';
  const rangeChips = inDash
    ? DASH_RANGES.map(([k,l]) => `<button class="week-chip ${UI.dashboard.range===k?'active':''}" onclick="setDashboardRange('${k}')">${l}</button>`).join('')
    : [['week','This week'],['month','This month'],['7d','Last 7 days'],['14d','Last 14 days'],['30d','Last 30 days'],['custom','Custom']]
      .map(([k,l]) => `<button class="week-chip ${UI.crmOverview.range===k?'active':''}" onclick="setCrmRange('${k}')">${l}</button>`).join('');
  const customInputs = inDash ? (UI.dashboard.range==='custom' ? `
    <input type="date" style="width:auto" value="${UI.dashboard.customFrom||''}" onchange="UI.dashboard.customFrom=this.value;render()">
    <span style="color:var(--ink-faint);font-size:12px;align-self:center">to</span>
    <input type="date" style="width:auto" value="${UI.dashboard.customTo||''}" onchange="UI.dashboard.customTo=this.value;render()">` : '') : UI.crmOverview.range==='custom' ? `
    <input type="date" style="width:auto" value="${UI.crmOverview.customFrom||''}" onchange="UI.crmOverview.customFrom=this.value;render()">
    <span style="color:var(--ink-faint);font-size:12px;align-self:center">to</span>
    <input type="date" style="width:auto" value="${UI.crmOverview.customTo||''}" onchange="UI.crmOverview.customTo=this.value;render()">` : '';

  const jobsAll = (STATE.data && STATE.data.jobs) || [];
  const sourceBars = renderBarGroup(LEAD_SOURCES.map(s => ({ label:sourceLabel(s), value:stats.bySource[s], color:LEAD_SOURCE_COLOR[s], onclick: drillJs(`${sourceLabel(s)} — leads`, 'leads', contacts.filter(c => c.source===s)) })), { fmt:(n)=>String(n) });
  const divisionRows = LEAD_DIVISIONS.map(d => {
    const v = stats.byDivision[d];
    const rate = (v.won+0)>0 || v.total>0 ? (v.total ? Math.round((v.won/v.total)*100) : 0) : 0;
    const dl = contacts.filter(c => c.division===d);
    return `<div class="kv"><span>${d}</span><span class="v">${drill(v.total, `${d} — leads`, 'leads', dl)} · ${drill(rate+'% won', `${d} — leads that became a job`, 'leads', dl.filter(c => contactHasJob(c, jobsAll)))}</span></div>`;
  }).join('');
  // Drill-down bars for the two sub-tag families — only rendered when the parent bucket actually
  // has leads this period, so an account with no Aircon/Meta activity yet doesn't show empty charts.
  const airconTypeTotal = AIRCON_TYPE_TAGS.reduce((s,t)=>s+stats.byAirconType[t],0);
  const metaPlatformTotal = META_PLATFORM_TAGS.reduce((s,t)=>s+stats.byMetaPlatform[t],0);
  const airconTypeBars = airconTypeTotal ? renderBarGroup(AIRCON_TYPE_TAGS.map(t => ({ label:t, value:stats.byAirconType[t], color:'var(--primary)', onclick: drillJs(`Aircon — ${t}`, 'leads', contacts.filter(c => c.division==='Aircon' && (c.tags||[]).includes(t))) })), { fmt:(n)=>String(n) }) : '';
  const metaPlatformBars = metaPlatformTotal ? renderBarGroup(META_PLATFORM_TAGS.map(t => ({ label:t, value:stats.byMetaPlatform[t], color:'var(--accent)', onclick: drillJs(`Meta Ads — ${t}`, 'leads', contacts.filter(c => c.source==='Meta Ads' && (c.tags||[]).includes(t))) })), { fmt:(n)=>String(n) }) : '';

  // Sales by technician for this period's leads: each of the customer's jobs counts for the technician who did
  // that job (a customer with jobs by two technicians is split between them). A lead with an agreed sales value
  // but no job yet lands in "Unassigned".
  const salesByTech = {};
  contacts.forEach(c => {
    const cj = (STATE.data.jobs||[]).filter(j => j.contactId===c.id);
    if (cj.length) cj.forEach(j => { salesByTech[j.technician] = round2((salesByTech[j.technician]||0) + (Number(j.amount)||0)); });
    else if (c.salesValue) salesByTech['Unassigned'] = round2((salesByTech['Unassigned']||0) + Number(c.salesValue));
  });
  const salesByTechEntries = Object.entries(salesByTech).sort((a,b)=>b[1]-a[1]);
  const salesByTechTotal = round2(salesByTechEntries.reduce((s,[,v])=>s+v,0));

  return `
    <div class="page-head">
      <div><h1 class="page-title">Leads &amp; Marketing</h1><div class="page-sub">${esc(range.label)} · ${contacts.length} lead${contacts.length===1?'':'s'} · reporting, not day-to-day work</div></div>
      ${UI.tab==='dashboard' ? `<div>${dashViewSelect()}</div>` : ''}
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      ${rangeChips}${customInputs}
      <select style="width:auto" onchange="UI.crmOverview.source=this.value;render()"><option value="all">All sources</option>${LEAD_SOURCES.map(s=>`<option value="${s}" ${UI.crmOverview.source===s?'selected':''}>${esc(sourceLabel(s))}</option>`).join('')}</select>
      <select style="width:auto" onchange="UI.crmOverview.division=this.value;render()"><option value="all">All divisions</option>${LEAD_DIVISIONS.map(d=>`<option value="${d}" ${UI.crmOverview.division===d?'selected':''}>${d}</option>`).join('')}</select>
    </div>

    <div class="grid-4">
      <div class="card stat-card" style="--stat-accent:var(--primary)"><div class="stat-label">Total leads</div><div class="stat-value">${drill(stats.total, 'All leads in this period', 'leads', contacts)}</div><div class="stat-sub">in this period</div></div>
      <div class="card stat-card" style="--stat-accent:var(--warn)"><div class="stat-label">In progress</div><div class="stat-value">${drill(stats.byStatus.Chasing + stats.byStatus.Quoted + stats.byStatus['Follow-up'] + stats.byStatus.Booked, 'In progress (chasing, quoted, follow up, booked)', 'leads', contacts.filter(c => ['Chasing','Quoted','Follow-up','Booked'].includes(leadStage(c))))}</div><div class="stat-sub">${stats.byStatus.New} new · ${stats.byStatus.Chasing} chasing · ${stats.byStatus.Quoted} quoted · ${stats.byStatus['Follow-up']} follow up · ${stats.byStatus.Booked} booked</div></div>
      <div class="card stat-card" style="--stat-accent:var(--good)"><div class="stat-label">Won</div><div class="stat-value">${drill(stats.won, 'Won — became a job', 'leads', contacts.filter(c => contactHasJob(c, jobsAll)))}</div><div class="stat-sub">${stats.closeRate===null?'no leads yet':stats.closeRate+'% of leads became a job'} · ${stats.byStatus.Booked} booked</div></div>
      <div class="card stat-card" style="--stat-accent:var(--bad)"><div class="stat-label">Lost</div><div class="stat-value">${drill(stats.byStatus.Lost, 'Lost leads', 'leads', contacts.filter(c => leadStage(c)==='Lost'))}</div><div class="stat-sub">${fmtMoney(round2(contacts.filter(c => leadStage(c)==='Lost').reduce((s,c)=>s+(Number(c.estimatedValue)||0),0)))} estimated value lost</div></div>
    </div>

    <div class="section-title">Where leads come from</div>
    <div class="grid-2">
      <div class="card stat-card" style="--stat-accent:var(--primary)"><div class="stat-label">By marketing channel</div>${sourceBars}</div>
      <div class="card stat-card" style="--stat-accent:var(--accent)"><div class="stat-label">By division</div><div style="margin-top:6px">${divisionRows}</div></div>
    </div>
    ${(airconTypeBars || metaPlatformBars) ? `<div class="grid-2" style="margin-top:12px">
      ${airconTypeBars ? `<div class="card stat-card" style="--stat-accent:var(--primary)"><div class="stat-label">Aircon — Split / Duct / Ventilation</div>${airconTypeBars}<div class="hint" style="margin-top:6px">Only counts leads where the type is known from the landing page or the customer's message — the rest still count toward Aircon above, just unsplit.</div></div>` : ''}
      ${metaPlatformBars ? `<div class="card stat-card" style="--stat-accent:var(--accent)"><div class="stat-label">Meta Ads — Facebook vs Instagram</div>${metaPlatformBars}<div class="hint" style="margin-top:6px">Depends on each ad's placement tracking being set up in Ads Manager — leads from ads without it still count toward Meta Ads above, just unsplit.</div></div>` : ''}
    </div>` : ''}

    <div class="section-title">Sales value by technician</div>
    <div class="card stat-card" style="--stat-accent:var(--good)">
      <div class="stat-label">Total sales value this period</div>
      <div class="stat-value" style="font-size:22px">${fmtMoney(salesByTechTotal)}</div>
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft)">
        ${salesByTechEntries.length ? salesByTechEntries.map(([t,v])=>`<div class="kv"><span>${esc(t)}</span><span class="v">${fmtMoney(v)}</span></div>`).join('') : emptyState('No sales value recorded yet')}
      </div>
      <div class="hint" style="margin-top:8px">Attributed via the job linked to each customer. Leads with no job yet show under "Unassigned."</div>
    </div>

  `;
}

function applyFollowupPreset(i){
