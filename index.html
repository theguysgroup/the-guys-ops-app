async function saveLeadModal(contactId){
  const fullName = document.getElementById('lm-name').value.trim();
  if (!fullName) { modalError('Please enter a name'); return; }
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const prev = contactId ? contactById(contactId) : null;
  const before = prev ? { status:prev.status, division:prev.division, source:prev.source, nextFollowUp:prev.nextFollowUp, estimatedValue:prev.estimatedValue, bookedFor:prev.bookedFor } : null;
  const stagePicked = document.getElementById('lm-status').value;
  const followPicked = document.getElementById('lm-followup').value;
  const lostPicked = (document.getElementById('lm-lost-reason')||{}).value || '';
  // The stage rules apply to new leads, to leads under the new rules (from 27 Sep), and whenever the stage is
  // being changed — an old lead can still get its phone or email fixed without re-doing its stage.
  const stageChanging = !prev || stagePicked !== leadStage(prev);
  const rulesOn = stageChanging || leadRulesApply(prev);
  if (rulesOn && stagePicked==='Lost' && !lostPicked) { modalError('Choose why the lead was lost'); return; }
  const bookedPicked = (document.getElementById('lm-booked-for')||{}).value || '';
  if (stageChanging && stagePicked==='Booked' && !bookedPicked) { modalError('Pick the day the job is booked for'); return; }
  if (rulesOn && STAGES_NEED_DATE.includes(stagePicked) && !(followPicked && followPicked > todayStr())) { modalError(`A lead in ${stageLabel(stagePicked)} needs a follow-up date after today`); return; }
  const values = {
    fullName,
    phone: document.getElementById('lm-phone').value.trim(),
    email: document.getElementById('lm-email').value.trim(),
    postcode: document.getElementById('lm-postcode').value.trim(),
    division: document.getElementById('lm-division').value,
    source: document.getElementById('lm-source').value,
    status: (prev && leadStage(prev)==='Won') ? prev.status : stagePicked,
    estimatedValue: Number(document.getElementById('lm-value').value)||0,
    salesValue: document.getElementById('lm-sales') ? (Number(document.getElementById('lm-sales').value)||0) : (prev ? prev.salesValue : 0),
    followupNote: (document.getElementById('lm-followup-note')||{}).value ?? (prev ? prev.followupNote : ''),
    nextFollowUp: document.getElementById('lm-followup').value,
    jobDescription: document.getElementById('lm-desc').value,
    notes: ((document.getElementById('lm-notes')||{}).value ?? (prev ? prev.notes : '')).trim(),
  };
  const stageChanged = !prev || leadStage(prev) !== stagePicked;
  if (stageChanged && stagePicked!=='Won') {
    values.stageChangedAt = new Date().toISOString();
    if (stagePicked==='Chasing') { values.chasingSince = values.stageChangedAt; values.chaseAlertDone = false; }
  }
  if (stagePicked==='Lost') { values.lostReason = lostPicked; values.nextFollowUp = ''; if (lostPicked) { const lbl = lostReasonLabel(lostPicked); if (prev && !(prev.tags||[]).includes(lbl)) values.tags = [...(prev.tags||[]), lbl]; } }
  else if (stagePicked!=='Won') values.lostReason = '';
  if (stagePicked==='Booked') { values.nextFollowUp = ''; if (bookedPicked) values.bookedFor = bookedPicked; }
  let c;
  // Update reuses the existing (already-real) id and can fire-and-forget; create has to be
  // awaited first so the real database-assigned id exists before anything below (activity log,
  // "lead created" event) tries to persist against it.
  if (prev) {
    c = prev;
    const patch = {}; for (const k in values) if (JSON.stringify(values[k]) !== JSON.stringify(prev[k])) patch[k] = values[k];
    if (Object.keys(patch).length) db.contacts.update(c.id, patch);
  }
  else {
    try { c = await db.contacts.create({ createdAt:todayStr(), linkedJobId:null, activityLog:[], messages:[], lastReadAt:null, starred:false, tags: values.lostReason ? [lostReasonLabel(values.lostReason)] : [], chaseCalls:[], ...values }); }
    catch (err) { return; }   // db.contacts.create() already showed an error toast; leave the modal open so the user can retry
  }
  if (before) {
    if (stageChanged) { const a = stageLabel(leadStage({ ...prev, ...before })), b2 = stageLabel(stagePicked); logContactActivity(c, actor, `Stage changed from "${a}" to "${b2}"${values.lostReason?` (${lostReasonLabel(values.lostReason)})`:''}`); logLeadEvent(c, `Stage changed from "${a}" to "${b2}"`); }
    if (before.division !== values.division) logContactActivity(c, actor, `Division changed from "${before.division}" to "${values.division}"`);
    if (before.source !== values.source) logContactActivity(c, actor, `Source changed from "${before.source}" to "${values.source}"`);
    if ((before.nextFollowUp||'') !== (values.nextFollowUp||'')) logContactActivity(c, actor, `Follow-up date changed from "${before.nextFollowUp||'—'}" to "${values.nextFollowUp||'—'}"`);
    if (values.bookedFor && (before.bookedFor||'') !== values.bookedFor) logContactActivity(c, actor, `Job date set to ${fmtDateShort(values.bookedFor)}`);
    if (before.estimatedValue !== values.estimatedValue) logContactActivity(c, actor, `Estimated value changed from ${fmtMoney(before.estimatedValue)} to ${fmtMoney(values.estimatedValue)}`);
  } else {
    logContactActivity(c, actor, 'Lead created');
    logLeadEvent(c, values.jobDescription ? `Lead created: ${values.jobDescription}` : 'Lead created');
  }
  LEAD_MODAL_ID = null; closeModal(); showToast(contactId?'Lead updated':'Lead added'); render();
}

function csvCell(v){
  const s = v==null ? '' : String(v);
  const needsQuotes = s.indexOf('"')!==-1 || s.indexOf(',')!==-1 || s.indexOf('\n')!==-1;
  return needsQuotes ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCsv(filename, rows){
  if (typeof PRESENT!=='undefined' && PRESENT) { showToast('Exports are off in presentation mode'); return; }
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// Column order is fixed per spec: Technician, Date, Customer Name, Invoice, Job Type, Amount, GST,
// Status, Method, GST Amount, Parts Cost, Parts Paid By, %, Commission, Tech Paid, Review, Notes.
// "GST" is a yes/no indicator; "GST Amount" is the actual computed dollar figure (jobGst(j)).
const JOB_COLUMNS = [
  {key:'technician', label:'Technician'}, {key:'date', label:'Date'}, {key:'customer', label:'Customer'},
  {key:'invoice', label:'Invoice'}, {key:'type', label:'Type'}, {key:'amount', label:'Amount'},
  {key:'gst', label:'GST'}, {key:'status', label:'Status'}, {key:'method', label:'Method'},
  {key:'gstAmount', label:'GST Amount'}, {key:'partsCost', label:'Parts Cost'}, {key:'partsPaidBy', label:'Parts Paid By'},
  {key:'percent', label:'%'}, {key:'commission', label:'Commission'}, {key:'techPaid', label:'Tech Paid'}, {key:'review', label:'Review'}, {key:'notes', label:'Notes'},
];
function jobColumnText(j, key){
  switch(key){
    case 'technician': return j.technician||'';
    case 'date': return fmtDateShort(j.date);
    case 'customer': return j.customerName||'';
    case 'invoice': return j.invoiceNumber||'';
    case 'type': return j.jobType||'';
    case 'amount': return fmtMoney(j.amount);
    case 'gst': return j.includesGST?'Yes':'No';
    case 'status': return j.paymentStatus||'';
    case 'method': return j.paymentMethod||'';
    case 'gstAmount': return j.includesGST?fmtMoney(jobGst(j)):'';
    case 'partsCost': return j.partsCost?fmtMoney(j.partsCost):'';
    case 'partsPaidBy': return j.partsPaidBy||'';
    case 'percent': return String(j.commissionPercent??'');
    case 'commission': return fmtMoney(jobCommissionAmount(j));
    case 'techPaid': return j.paidToTechnician||'';
    case 'review': return j.reviewTaken?'Yes':'No';
    case 'notes': return j.notes||'';
    default: return '';
  }
}
function computeFilteredJobs(data){
  let jobs = [...data.jobs].sort((a,b)=>b.date.localeCompare(a.date));
  if (UI.jobs.tech!=='all') jobs = jobs.filter(j=>j.technician===UI.jobs.tech);
  if (UI.jobs.status!=='all') jobs = jobs.filter(j=>j.paymentStatus===UI.jobs.status);
  if (UI.jobs.week!=='all') jobs = jobs.filter(j=>weekOf(j.date).key===UI.jobs.week);
  const filters = UI.jobsFilters || {};
  Object.keys(filters).forEach(key => {
    const q = (filters[key]||'').trim().toLowerCase();
    if (q) jobs = jobs.filter(j => jobColumnText(j,key).toLowerCase().indexOf(q)!==-1);
  });
  return jobs;
}

/* ── "Ask for review" (Ofek, 2 Oct): the office sends the Google review request from the job, by hand ──
   Same text and sending as the old automatic request (review-requests function: SMS through GHL now, the email from
   info@ within 15 minutes). The cell shows what the technician wrote in the closing (review taken / don't ask) and
   whether the customer was already asked. */
let REVIEW_REQ = null, REVIEW_REQ_LOADING = false;
const reviewInvoiceKey = inv => String(inv||'').replace(/\D/g,'');
function canAskReview(){ const p = getCurrentProfile(); return !!p && (p.role==='owner' || p.role==='manager' || (p.role==='va' && !!p.permissions.jobs)); }
async function loadReviewRequests(){
  if (REVIEW_REQ_LOADING) return; REVIEW_REQ_LOADING = true;

  REVIEW_REQ_LOADING = false;

function reviewAskCell(j){
  if (REVIEW_REQ===null) { loadReviewRequests(); return '<span class="hint">…</span>'; }
  if (j.reviewDoNotAsk) return pill('bad', "Don't ask");
  if (j.reviewTaken) return pill('good', 'Review taken');
  const r = REVIEW_REQ[reviewInvoiceKey(j.invoiceNumber)];
  if (r && r.status==='sent') return `<span title="${esc(r.requested_by ? 'Asked by '+r.requested_by : 'Asked automatically')}">${pill('good', 'Asked '+fmtDateShort(localDay(r.sent_at)))}</span>`;
  if (r && r.status==='waiting') return pill('warn', 'Goes '+new Date(r.send_after).toLocaleString('en-AU', { timeZone:'Australia/Sydney', weekday:'short', hour:'numeric', minute:'2-digit' }));
  if (!j.invoiceNumber) return '<span class="hint">No invoice #</span>';

const REVIEW_ASK_REASONS = {
  do_not_ask: "This customer is marked \"Don't ask for a review\".",
  review_taken: 'The review for this job is already taken.',
  not_in_servicem8: 'This job number is not in ServiceM8, so there is no phone or email to send to.',
  no_contact: 'There is no mobile or email for this job in ServiceM8.',
  unknown_job_type: 'Unknown job type, so there is no review link for it.',
  no_invoice: 'The job has no invoice number.',
  job_not_found: 'Job not found.',
  unauthorized: 'You need to be signed in with Jobs access.',
};
async function askForReview(jobId, again){
  const j = STATE.data.jobs.find(x => x.id===jobId); if (!j) return;
  if (readOnlyReason()) { showToast(readOnlyReason()); return; }
  const go = async () => {
    const { data } = await sb.auth.getSession();
    const res = await fetch(SUPABASE_URL + '/functions/v1/review-requests', { method:'POST', headers:{ 'Content-Type':'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + (data.session && data.session.access_token) }, body: JSON.stringify({ ask: { job_id: jobId, again: !!again } }) });
    const out = await res.json().catch(() => ({}));
    if (out.ok) {
      logJobActivity(j, getCurrentProfile()?.fullName || 'Unknown', out.status==='sent' ? 'Google review request sent (text now, email from info@ shortly)' : 'Google review request scheduled for the morning');
      showToast(out.status==='sent' ? `Review request sent to ${j.customerName}: text now, email within 15 minutes` : `After hours: the review request goes at 10:00 tomorrow`);
    } else if (out.reason==='already_asked' || out.reason==='asked_recently') {
      const when = out.sent_at ? ` on ${fmtDateShort(localDay(out.sent_at))}` : '';
      confirmAction(out.reason==='already_asked' ? `${j.customerName} was already asked for a review for this job${when}. Ask again?` : `${j.customerName} was already asked for a review in the last 6 months (another job). Ask again anyway?`,
        () => askForReview(jobId, true), { danger:false, title:'Already asked', confirmLabel:'Ask again' });
    } else showToast('Not sent: ' + (REVIEW_ASK_REASONS[out.reason] || out.reason || 'unknown error'));
    REVIEW_REQ = null; loadReviewRequests();
  };
  if (again) { go(); return; }
  confirmAction(`Send ${j.customerName} a Google review request? A text goes now and an email from info@ shortly (same wording as before).`, go, { danger:false, title:'Ask for a Google review', confirmLabel:'Send' });
}
function refreshJobsTable(){
  const profile = getCurrentProfile(); if (!profile) return;

// ⌘K finds leads/customers (name, phone, email, postcode) for anyone who can see the CRM, and jobs
// (customer, invoice #, technician) for anyone who can see jobs — so Ron finds his leads too.
function renderSearchResults(query){
  const profile = getCurrentProfile(); if (!profile) return '';
  const data = filterForProfile(STATE.data, profile);
  const canCrm = canViewSection(profile,'crm'), canJobs = canViewSection(profile,'jobs');
  const q = (query||'').trim().toLowerCase();
  if (!q) return emptyState('Start typing', `Search ${canCrm?'leads by name, phone, email or postcode':''}${canCrm&&canJobs?', and ':''}${canJobs?'jobs by customer, invoice # or technician':''}.`);
  const digits = q.replace(/\D/g,'');
  const leads = !canCrm ? [] : (data.contacts||[]).filter(c =>
    (c.fullName||'').toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q) || (c.postcode||'')===q ||
    (digits.length>=4 && (c.phone||'').replace(/\D/g,'').includes(digits))
  ).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||''))).slice(0,8);
  const jobs = !canJobs ? [] : (data.jobs||[]).filter(j =>
    (j.customerName||'').toLowerCase().includes(q) || (j.invoiceNumber||'').toLowerCase().includes(q) || (j.technician||'').toLowerCase().includes(q)
  ).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  if (!leads.length && !jobs.length) return emptyState('No matches', `Try a different name, phone number, invoice or technician.${canCrm?' Old GHL contacts show below if any match.':''}`);
  const btn = searchResultBtn;
  const leadHtml = leads.map(c => btn(`closeModal();goToLeadConversation('${c.id}')`, esc(c.fullName||'(no name)'), `${esc(c.phone||c.email||'—')} · ${esc(c.division||'')} · ${esc(sourceLabel(c.source))}`, esc(stageLabel(leadStage(c))))).join('');
  const jobHtml = jobs.map(j => btn(`goToJobFromSearch('${j.id}')`, esc(j.customerName), `${esc(j.technician)} · ${fmtDateShort(j.date)} · ${esc(j.invoiceNumber||'—')}`, fmtMoney(j.amount))).join('');
  return (leads.length ? `<div class="modal-section" style="margin-top:0">Leads &amp; customers</div>${leadHtml}` : '') + (jobs.length ? `<div class="modal-section"${leads.length?'':' style="margin-top:0"'}>Jobs</div>${jobHtml}` : '');
}
/* ── GHL archive: old GHL contacts (exported 30 Sep 2026) ──
   About 4,600 old leads/customers from GHL live in their own table (ghl_archive), NOT in contacts, so dashboards,
   close rate, lost reasons, source reports and alerts stay exactly as they were (Ofek: don't ruin the data).
   They show up in ⌘K (only the ones that have no CRM card yet), an existing customer's card shows their GHL history,
   and "Create lead from this" turns an old contact into a new lead today. Fetched on demand, never loaded up front. */
const GHL_ARCHIVE_COLS = 'id,full_name,phone,email,ghl_created_at,ghl_last_activity,tags,division,source,outcome,ops_contact_id';
let ghlSearchTimer = null, ghlSearchSeq = 0;
// Archive dates go back to 2025, so they carry the year.
function ghlDate(ts){ const d = localDay(ts); return d ? `${fmtDateShort(d)} ${d.slice(0,4)}` : '—'; }
function searchGhlArchive(query){
  clearTimeout(ghlSearchTimer);
  const seq = ++ghlSearchSeq;
  const box = document.getElementById('search-ghl'); if (box) box.innerHTML = '';
  const profile = getCurrentProfile(); if (!profile || !canViewSection(profile,'crm')) return;
  const q = (query||'').replace(/[,()%*\\"]/g,' ').trim();
  if (q.length < 2) return;
  const digits = q.replace(/\D/g,'').replace(/^61/,'').replace(/^0/,'');
  ghlSearchTimer = setTimeout(async () => {
    const ors = [`full_name.ilike.%${q}%`, `email.ilike.%${q}%`];
    if (digits.length >= 4) ors.push(`phone_key.like.%${digits.slice(-9)}%`);
    const { data, error } = await sb.from('ghl_archive').select(GHL_ARCHIVE_COLS).is('ops_contact_id', null).or(ors.join(',')).order('ghl_created_at', { ascending:false }).limit(8);
    if (seq !== ghlSearchSeq) return;
    const el = document.getElementById('search-ghl'); if (!el || error || !data || !data.length) return;
    STATE.ghlSeen = STATE.ghlSeen || {};
    data.forEach(r => { STATE.ghlSeen[r.id] = r; });
    el.innerHTML = `<div class="modal-section">Old GHL contacts (archive, not in the CRM)</div>` + data.map(r =>
      searchResultBtn(`openGhlArchiveModal('${r.id}')`, esc(r.full_name||'(no name)'), `${esc(r.phone||r.email||'—')} · ${esc(r.division||'—')} · first contact ${ghlDate(r.ghl_created_at)}`, esc(r.outcome||'GHL'))).join('');
  }, 250);
}
function ghlHistoryRows(r){
  const row = (k, v) => v ? `<div class="kv"><span>${k}</span><span class="v">${v}</span></div>` : '';
  return row('First contact', ghlDate(r.ghl_created_at)) + row('Last activity', r.ghl_last_activity ? ghlDate(r.ghl_last_activity) : '') +
    row('Service', esc(r.division||'')) + row('Source in GHL', esc(r.source||'')) + row('Outcome in GHL', esc(r.outcome||'')) +
    row('GHL tags', esc((r.tags||[]).join(', ')));
}
function openGhlArchiveModal(id){
  const r = (STATE.ghlSeen||{})[id]; if (!r) return;
  openModal(`
    <div class="modal-back" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:480px">
        <h2>${esc(r.full_name||'(no name)')}</h2>
        <div class="modal-sub">Old contact from GHL. Not in the CRM and not counted in any report.</div>
        ${r.phone ? `<div class="kv"><span>Phone</span><span class="v mono">${esc(r.phone)}</span></div>` : ''}
        ${r.email ? `<div class="kv"><span>Email</span><span class="v">${esc(r.email)}</span></div>` : ''}

// A new lead today (source Unknown: whatever brought them back now is not the old GHL source), linked to the archive row.
async function createLeadFromGhl(id){
  const r = (STATE.ghlSeen||{})[id]; if (!r) return;
  if (r.ops_contact_id && contactById(r.ops_contact_id)) { closeModal(); goToLeadConversation(r.ops_contact_id); return; }
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  let c;
  try { c = await db.contacts.create({ fullName: r.full_name||'(no name)', phone: r.phone||'', email: r.email||'', postcode:'', division: LEAD_DIVISIONS.includes(r.division) ? r.division : 'Other', source:'Unknown', status:'New', createdAt: todayStr(), jobDescription:'', linkedJobId:null, activityLog:[], messages:[], lastReadAt:null, starred:false, tags:[], chaseCalls:[] }); }
  catch (err) { return; }   // db.contacts.create() already showed an error toast
  logLeadEvent(c, `Brought back from the GHL archive: first contact ${ghlDate(r.ghl_created_at)}${r.outcome ? `, last outcome in GHL: ${r.outcome}` : ''}`);
  logContactActivity(c, actor, 'Lead created from the GHL archive');
  r.ops_contact_id = c.id;
  STATE.ghlByContact = STATE.ghlByContact || {};
  STATE.ghlByContact[c.id] = r;
  const { error } = await sb.from('ghl_archive').update({ ops_contact_id: c.id }).eq('id', r.id);
  if (error) showToast('Lead created, but the link to the GHL archive was not saved: '+error.message);
  closeModal();
  goToLeadConversation(c.id);
}

async function loadGhlHistory(contactId){

function updateJobCommissionField(){

async function saveJobModal(jobId){
  const pick = resolveCustomerInput('jm-customer');

  const typedPct = document.getElementById('jm-comm').value;
  const commissionPercent = typedPct!=='' ? (Number(typedPct)||0) : (auto ?? 0);
  const paymentStatus = document.getElementById('jm-status').value;
  const prevJob = jobId ? STATE.data.jobs.find(j=>j.id===jobId) : null;
  const actor = getCurrentProfile()?.fullName || 'Unknown';

  if (paymentStatus!=='Paid') datePaid = '';

  if (!contactId && prevJob && prevJob.customerName===customerName) contactId = prevJob.contactId || null;
  const values = {

    date: document.getElementById('jm-date').value, technician: tech, jobType, commissionPercent,
    amount: Number(document.getElementById('jm-amount').value)||0,

    // jobTotalCollected() above — this only fixes the form's default direction/labeling, not the math.
    includesGST: !document.getElementById('jm-nogst').checked,
    paymentStatus, paymentMethod: document.getElementById('jm-method').value,
    enteredBy: document.getElementById('jm-enteredby').value.trim(),

    // whether the technician handed the cash over is tracked per week on the Payroll board instead.
    cashConfirmed: prevJob?.cashConfirmed || false,
    partsCost: Number(document.getElementById('jm-parts').value)||0,
    partsPaidBy: document.getElementById('jm-partsby').value,
    partsRefundStatus: document.getElementById('jm-refund').value,
    notes: document.getElementById('jm-notes').value,
    reviewTaken: document.getElementById('jm-review').checked,

    equipmentRentalFile: MODAL_FILES['jm-equipmentRentalFile'] ?? job_or_null(prevJob,'equipmentRentalFile'),

  else {
    try { job = await db.jobs.create({ activityLog:[], ...values }); }
    catch (err) { return; }   // db.jobs.create() already showed an error toast; leave the modal open so the user can retry
  }
  if (oldSnapshot) {
    if (oldSnapshot.amount !== values.amount) logJobActivity(job, actor, `Amount changed from ${fmtMoney(oldSnapshot.amount)} to ${fmtMoney(values.amount)}`);
    if (oldSnapshot.paymentStatus !== values.paymentStatus) logJobActivity(job, actor, `Payment status changed from "${oldSnapshot.paymentStatus}" to "${values.paymentStatus}"`);
    if ((oldSnapshot.paymentMethod||'') !== (values.paymentMethod||'')) logJobActivity(job, actor, `Payment method changed from "${oldSnapshot.paymentMethod||'—'}" to "${values.paymentMethod||'—'}"`);
    if (oldSnapshot.commissionPercent !== values.commissionPercent) logJobActivity(job, actor, `Commission % changed from ${oldSnapshot.commissionPercent}% to ${values.commissionPercent}%`);
    if (oldSnapshot.partsCost !== values.partsCost) logJobActivity(job, actor, `Parts cost changed from ${fmtMoney(oldSnapshot.partsCost)} to ${fmtMoney(values.partsCost)}`);
    if (oldSnapshot.includesGST !== values.includesGST) logJobActivity(job, actor, `GST toggle changed from ${oldSnapshot.includesGST?'On':'Off'} to ${values.includesGST?'On':'Off'}`);
    if (oldSnapshot.partsRefundStatus !== values.partsRefundStatus) logJobActivity(job, actor, `Parts refund status changed from "${oldSnapshot.partsRefundStatus}" to "${values.partsRefundStatus}"`);
    if (oldSnapshot.reviewTaken !== values.reviewTaken) logJobActivity(job, actor, `Review ${values.reviewTaken?'marked as taken':'unmarked'}`);
    if (oldSnapshot.reviewDoNotAsk !== values.reviewDoNotAsk) logJobActivity(job, actor, values.reviewDoNotAsk ? "Marked: don't ask this customer for a review" : 'Review request allowed again');
  } else {
    logJobActivity(job, actor, 'Job created');
  }
  await ensureContactForJob(job, contactId);
  closeModal(); showToast(jobId?'Job updated':'Job added'); render();
}
function job_or_null(rec, field){ return rec ? (rec[field] ?? null) : null; }

/* ── business performance (decision-making metrics — separate from the day-to-day Overview/Finance
   pages above, which stay unchanged) ──────────────────────────────────────────────────────────── */
function blankPerfBucket(){ return { count:0, revenue:0, commission:0, parts:0, profit:0 }; }
function addToPerfBucket(bucket, job){
  const commission = jobCommissionAmount(job), parts = Number(job.partsCost)||0, revenue = Number(job.amount)||0;
  bucket.count++; bucket.revenue += revenue; bucket.commission += commission; bucket.parts += parts;
  bucket.profit += revenue - commission - parts;
}
function finalizePerfBucket(b){
  return { count:b.count, revenue:round2(b.revenue), commission:round2(b.commission), parts:round2(b.parts), profit:round2(b.profit), avgDeal: b.count?round2(b.revenue/b.count):0, avgProfit: b.count?round2(b.profit/b.count):0, margin: b.revenue?Math.round((b.profit/b.revenue)*100):null };
}
// Same week-bucketing as computeRevenueByWeekInRange, but summing profit (amount − commission − parts)
// instead of raw amount — reuses the {label, revenue} shape renderSparkline already expects (the "revenue"
// key just holds profit here) so the trend chart needs no changes to that shared renderer.
function computeProfitByWeekInRange(data, startDateStr, endDateStr, technicianFilter){
  const keys = []; const seen = new Set();
  let d = parseLocalDate(startDateStr);
  const endKey = weekOf(endDateStr).key;
  for (let guard=0; guard<60; guard++) {
    const wk = weekOf(fmtLocal(d)).key;
    if (!seen.has(wk)) { seen.add(wk); keys.push(wk); }
    if (wk===endKey) break;
    d.setDate(d.getDate()+7);
  }
  return keys.map(k => {
    const jobs = computeWeek(data, k, technicianFilter).jobs;
    const profit = jobs.reduce((s,j) => s + (Number(j.amount)||0) - jobCommissionAmount(j) - (Number(j.partsCost)||0), 0);
    return { label: weekOf(k).label, revenue: round2(profit) };
  });
}
// Profit here = amount (pre-GST, matching every other "revenue" figure in the app) − technician
// commission − parts cost. Deliberately does NOT allocate equipment spend or marketing spend down to
// a division/technician — equipment isn't tracked per-job, and a division draws leads from multiple
// channels, so neither can be split cleanly. Marketing cost/ROAS gets its own honest home below,
// against the channel it actually applies to (byChannel), rather than a fudged per-division number.
function computeBusinessPerformance(data, startDateStr, endDateStr){
  const jobs = data.jobs.filter(j => j.date>=startDateStr && j.date<=endDateStr);
  const contacts = (data.contacts||[]).filter(c => { const d = localDay(c.createdAt); return d>=startDateStr && d<=endDateStr; });

  const byDivision = {}; JOB_TYPES.forEach(t=>byDivision[t]=blankPerfBucket());
  // Same additive pattern as the CRM Overview / Jobs-revenue breakdowns: sub-division numbers are a
  // subset of the parent division's, never a replacement, and only cover jobs whose linked lead
  // carries the tag (see jobAttributionTags) — the rest still count once toward byDivision above.
  const bySubDivision = {}; [...AIRCON_TYPE_TAGS, ...META_PLATFORM_TAGS].forEach(t=>bySubDivision[t]=blankPerfBucket());
  const byTech = {};
  jobs.forEach(j => {
    if (byDivision[j.jobType]) addToPerfBucket(byDivision[j.jobType], j);
    const attr = jobAttributionTags(j);
    if (attr.airconType) addToPerfBucket(bySubDivision[attr.airconType], j);
    if (attr.metaPlatform) addToPerfBucket(bySubDivision[attr.metaPlatform], j);
    if (!byTech[j.technician]) byTech[j.technician] = blankPerfBucket();
    addToPerfBucket(byTech[j.technician], j);
    byTech[j.technician].reviewCount = (byTech[j.technician].reviewCount||0) + (j.reviewTaken?1:0);
  });

  // Channel performance: leads + close rate from contacts created in this period; revenue from jobs
  // in this period whose customer name matches a lead with that source (same lookup as
  // customerNameCell/jobAttributionTags); spend from ad_spend when the ingest-ad-spend sync has data
  // for the channel/period — left as `null` (not 0) when it doesn't, so the UI can say "not available"
  // instead of implying a real $0 spend.
  const byChannel = {};
  LEAD_SOURCES.forEach(s => byChannel[s] = { leads:0, booked:0, won:0, notRelevant:0, revenue:0, jobCount:0 });
  contacts.forEach(c => {
    if (!byChannel[c.source]) return;
    byChannel[c.source].leads++;
    if (leadStage(c)==='Booked') byChannel[c.source].booked++;
    if (leadStage(c)==='Lost') byChannel[c.source].notRelevant++;
    if (contactHasJob(c, data.jobs)) byChannel[c.source].won++;
  });
  jobs.forEach(j => {
    const c = contactForJob(j);
    if (c && byChannel[c.source]) { byChannel[c.source].revenue += Number(j.amount)||0; byChannel[c.source].jobCount++; }
  });
  const spendByChannel = {};
  (data.adSpend||[]).forEach(a => { if (a.date>=startDateStr && a.date<=endDateStr) spendByChannel[a.channel] = round2((spendByChannel[a.channel]||0) + (Number(a.spend)||0)); });
  Object.keys(byChannel).forEach(s => {
    const ch = byChannel[s];
    ch.revenue = round2(ch.revenue);
    // Close rate = leads that became a job (Won) out of ALL leads that came in, not out of the few already decided.
    ch.closeRate = ch.leads ? Math.round((ch.won/ch.leads)*100) : null;
    ch.spend = spendByChannel[s] !== undefined ? spendByChannel[s] : null;
    ch.costPerLead = (ch.spend!==null && ch.leads) ? round2(ch.spend/ch.leads) : null;
    ch.costPerBookedJob = (ch.spend!==null && ch.jobCount) ? round2(ch.spend/ch.jobCount) : null;
    ch.roas = (ch.spend) ? round2(ch.revenue/ch.spend) : null;
  });

  Object.keys(byDivision).forEach(k=>byDivision[k]=finalizePerfBucket(byDivision[k]));
  Object.keys(bySubDivision).forEach(k=>bySubDivision[k]=finalizePerfBucket(bySubDivision[k]));
  const techEntries = Object.entries(byTech).map(([name,b]) => ({ name, ...finalizePerfBucket(b), reviewRate: b.count ? Math.round(((b.reviewCount||0)/b.count)*100) : null })).sort((a,b)=>b.profit-a.profit);

  const totalRevenue = round2(jobs.reduce((s,j)=>s+(Number(j.amount)||0),0));
  const totalProfit = round2(Object.values(byDivision).reduce((s,d)=>s+d.profit,0));
  const totalBooked = contacts.filter(c=>c.status==='Booked').length;
  const totalNotRelevant = contacts.filter(c=>leadStage(c)==='Lost').length;
  const totalDecided = totalBooked+totalNotRelevant;
  const totalReviewTaken = jobs.filter(j=>j.reviewTaken).length;

  // Cash-flow health: how long money actually takes to land once a job is done, not just whether it's
  // marked Paid — and how much is currently sitting unpaid from jobs done in this same window.
  const paidWithDates = jobs.filter(j => j.paymentStatus==='Paid' && j.datePaid);
  const avgDaysToPayment = paidWithDates.length ? Math.round(paidWithDates.reduce((s,j)=>s+daysBetween(parseLocalDate(j.date), parseLocalDate(j.datePaid)), 0) / paidWithDates.length) : null;
  const outstanding = round2(jobs.filter(j=>j.paymentStatus!=='Paid').reduce((s,j)=>s+(Number(j.amount)||0), 0));


  // Lead -> job funnel. "Contacted"/"Quoted"/"Job done" are all proxies from data that already
  // exists rather than new tracked stages, on purpose — no new fields, no new discipline required
  // from Ron for this to start working today:
  //   Contacted    = status has moved past New at all (Follow-up/Booked/Not Relevant)
  //   Price Given  = the lead has an estimated value logged (>0) - the Quotes page is confirmed unused
  //                  (0 rows) since Ofek/Ron give prices verbally over the phone, never through a
  //                  logged Quote record, so estimatedValue is the only existing-data signal that a
  //                  price was actually given
  //   Booked       = status === Booked
  //   Job done     = a job exists for this customer's name, in data.jobs (ALL jobs, same reasoning)
  // Each stage is a strict subset check against the full lead list for this period, not a "moved
  // through in order" pipeline, so a lead that skipped straight to Booked without a logged estimate
  // still counts in Booked even though it shows 0 in Price Given - the funnel shows where the *process*
  // has evidence of happening, not a guess about hidden steps.
  const funnelContacted = contacts.filter(c => c.status !== 'New').length;
  const funnelPriceGiven = contacts.filter(c => Number(c.estimatedValue) > 0).length;
  const funnelJobDone = contacts.filter(c => contactHasJob(c, data.jobs)).length;

  // Loss-reason breakdown for Not Relevant leads, from the same tags already on the contact (most of
  // this data arrived via the GHL import, where "why" was usually captured as a specific tag - see
  // chat: 19 price / 32 outside-area / 7 wrong-number / rest untagged). First match wins, in order of
  // how unambiguous the tag is.
  const notRelevantContacts = contacts.filter(c => leadStage(c)==='Lost');
  const lossReasons = { noReason:0 }; LOST_REASONS.forEach(r => lossReasons[r.key] = 0);
  notRelevantContacts.forEach(c => { lossReasons[lostReasonOf(c)]++; });

  // Speed-to-lead: hours between the lead's own creation and the first non-automatic (kind !== event)
  // message logged against it - i.e. a real reply, not the auto "Lead created" event. Only computable
  // for leads that actually have a message history (contacts.messages) - bulk-imported historical
  // leads (e.g. the GHL import) have none, so sampleSize reflects real coverage honestly instead of
  // silently averaging over mostly-missing data.
  const speedSamples = [];
  contacts.forEach(c => {
    const msgs = (c.messages||[]).slice().sort((a,b)=> new Date(a.at) - new Date(b.at));
    if (!msgs.length) return;
    const firstAt = new Date(msgs[0].at);
    // First contact = the first real reply/logged call (not the website's own "returning customer" message), or the
    // first time someone acted on the lead (contactedAt, from 29 Sep) — whichever came first. A returning customer's

    sampleSize: speedSamples.length,
    avgHours: speedSamples.length ? round2(speedSamples.reduce((s,v)=>s+v,0)/speedSamples.length) : null,
    medianHours: speedSamples.length ? round2(speedSamples[Math.floor(speedSamples.length/2)]) : null,
  };

    startDateStr, endDateStr, jobsCount: jobs.length, byDivision, bySubDivision, byChannel, techEntries,
    totalRevenue, totalProfit, totalLeads: contacts.length,
    profitMargin: totalRevenue ? Math.round((totalProfit/totalRevenue)*100) : null,

    reviewRate: jobs.length ? Math.round((totalReviewTaken/jobs.length)*100) : null,

const ADS_WINS = ['7d','14d','30d','60d','90d'];

function adsAnalyse(idx, win){
  const get = (w,l) => (idx[w] && idx[w][l]) || [];

  const kw = {}, tm = {};

  const th = ADS_MIN[win] || ADS_MIN['30d'];

    if (r.conversions>=th.conv && r.cost/r.conversions<=100) scaleKw.push({ r, dots:dots(kw,key) });

const GCLID_CAPTURE_FROM = '2026-09-10';
function adsKeywordJobs(data){
  const byGclid = new Map((ADS_STATS.attr||[]).map(a => [a.gclid, a]));
  const leadAttr = new Map();
  (data.contacts||[]).forEach(c => { const a = c.gclid && byGclid.get(c.gclid); if (a) leadAttr.set(c.id, a); });
  const groups = new Map();
  const group = a => {

  (data.jobs||[]).forEach(j => { const c = contactForJob(j); const a = c && leadAttr.get(c.id); if (a) { const x = group(a); x.jobs.push(j); x.revenue += Number(j.amount)||0; } });

  const legend = `<div style="font-size:12px;color:var(--ink-faint);margin:0 0 10px">Everything below covers the last ${W}. Dots show 7 · 14 · 30 · 60 · 90 days, left to right: <span style="color:var(--bad)">●</span> spent with no conversion, <span style="color:var(--good)">●</span> converted, <span style="color:var(--line)">●</span> no spend.</div>`;

  const kwHead = ['Keyword',{t:'Spent',num:1},{t:'Clicks',num:1},{t:'Conversions',num:1},{t:'Cost / conv.',num:1},{t:'Quality',num:1},'7·14·30·60·90d'];
  const kwRow = k => adsRow([kwName(k), adsNum(fmtMoney(round2(k.r.cost))), adsNum(k.r.clicks.toLocaleString()), adsNum(cnt(k.r.conversions)), adsNum(k.r.conversions>0?dl(k.r.cost/k.r.conversions):'—'), adsNum((k.r.extra&&k.r.extra.qs)||'—'), adsDots(k.dots)]);

  const campRows = camps.map(c => { const x = c.extra||{}; return adsRow([`<b>${esc(c.campaign)}</b>`, adsNum(fmtMoney(round2(c.cost))), adsNum(c.clicks.toLocaleString()), adsNum(adsPct(adsRatio(c.clicks,c.impressions))), adsNum(cnt(c.conversions)), adsNum(c.conversions>0?dl(c.cost/c.conversions):'—'), adsNum(x.searchImpressionShare!=null?adsPct(x.searchImpressionShare):'—'), adsNum(x.searchBudgetLostImpressionShare!=null?adsPct(x.searchBudgetLostImpressionShare):'—'), adsNum(x.searchRankLostImpressionShare!=null?adsPct(x.searchRankLostImpressionShare):'—')]); });

  const campSec = `<section id="ads-campaigns" style="margin-top:28px;scroll-margin-top:12px;border-radius:var(--radius)"><h3 style="font-size:16px;margin:0 0 4px">Campaigns</h3><div style="color:var(--ink-soft);font-size:12.5px;margin-bottom:10px"><b>Searches won</b> is the share of eligible searches where the ad showed. <b>Missed: budget</b> = would have shown with more money. <b>Missed: ad rank</b> = lost to competitors on bid or quality. Performance Max only reports at campaign level.</div>${campTable}</section>`;
  const adRows = lv('ad').sort((a,b)=>b.cost-a.cost).map(a => adsRow([esc(a.item2||('Ad '+a.item)), where(a), adsNum(fmtMoney(round2(a.cost))), adsNum(a.clicks.toLocaleString()), adsNum(adsPct(adsRatio(a.clicks,a.impressions))), adsNum(cnt(a.conversions)), adsNum(a.conversions>0?dl(a.cost/a.conversions):'—')]));
  const adSec = `<section id="ads-ads" style="margin-top:28px;scroll-margin-top:12px;border-radius:var(--radius)"><h3 style="font-size:16px;margin:0 0 4px">Ads</h3><div style="color:var(--ink-soft);font-size:12.5px;margin-bottom:10px">Which ad wording earns clicks and conversions (first headlines shown).</div>${adsTable(['Ad',"Campaign › ad group",{t:'Spent',num:1},{t:'Clicks',num:1},{t:'Click rate',num:1},{t:'Conversions',num:1},{t:'Cost / conv.',num:1}], adRows, 'No ad data.')}</section>`;
  const seg = (rows, labelFn, orderFn) => { const maxCost = Math.max(0, ...rows.map(r=>r.cost)); return adsTable(['',{t:'Spent',num:1},'',{t:'Conversions',num:1},{t:'Cost / conv.',num:1}], rows.sort(orderFn).map(r => adsRow([labelFn(r), adsNum(fmtMoney(round2(r.cost))), adsBarCell(r.cost, maxCost, r.conversions===0&&r.cost>0?'var(--bad)':'var(--primary)'), adsNum(cnt(r.conversions)), adsNum(r.conversions>0?dl(r.cost/r.conversions):'—')])), 'No data.'); };

}

// ── Meta Ads board (owners/managers only — RLS hides platform='meta' rows from everyone else) ──────────
// Same shape as the Google board. Meta reports very few leads itself, so "CRM leads" (contacts whose ad link carried this
// ad set's id in utm_content) are the number that decides; jobs/revenue come from the job↔customer link.
const META_MIN = { '7d':{ adset:40, ad:25, conv:1 }, '14d':{ adset:60, ad:35, conv:1 }, '30d':{ adset:100, ad:60, conv:2 }, '60d':{ adset:150, ad:90, conv:2 }, '90d':{ adset:200, ad:120, conv:2 } };
// One definition everywhere (Dashboard, Leads & Marketing, this board, the nightly digest): a Meta lead is a lead
// whose source is Meta Ads. An fbclid alone isn't enough — organic Facebook shares carry one too.
function metaIsLead(c){ return c.source==='Meta Ads'; }
function metaAnalyse(data, win){
  const rows = (ADS_STATS.rows||[]).filter(r => r.platform==='meta' && r.win===win && r.level==='ad').map(r => ({ ...r, cost:+r.cost||0, clicks:+r.clicks||0, impressions:+r.impressions||0, conversions:+r.conversions||0 }));
  const end = shiftDays(todayStr(new Date()), -1), start = shiftDays(end, -(parseInt(win)-1));
  const leadsAll = data.contacts.filter(c => { const d = localDay(c.createdAt); return d>=start && d<=end && metaIsLead(c); });
  const byAdset = new Map(), byCamp = new Map();
  const bump = (m, id, base, r) => { let g = m.get(id); if (!g) { g = { id, ...base, cost:0, clicks:0, impressions:0, metaLeads:0, leadEvt:0, hasLeadEvt:false, ads:0, active:false, crmLeads:0, jobs:0, revenue:0 }; m.set(id, g); } g.cost += r.cost; g.clicks += r.clicks; g.impressions += r.impressions; g.metaLeads += r.conversions; if ((r.extra||{}).lead!=null) { g.leadEvt += +r.extra.lead||0; g.hasLeadEvt = true; } g.ads++; if ((r.extra||{}).status==='ACTIVE') g.active = true; return g; };
  rows.forEach(r => { const x = r.extra||{}; bump(byAdset, x.adset_id||r.ad_group, { name:r.ad_group, campaign:r.campaign, campaignId:x.campaign_id }, r); bump(byCamp, x.campaign_id||r.campaign, { name:r.campaign }, r); });
  const leadAdset = new Map(); let tagged = 0;
  leadsAll.forEach(c => { const g = byAdset.get(c.utmContent); if (g) { g.crmLeads++; tagged++; leadAdset.set(c.id, g); const cg = byCamp.get(g.campaignId); if (cg) cg.crmLeads++; } });
  data.jobs.forEach(j => { const c = contactForJob(j); const g = c && leadAdset.get(c.id); if (g) { g.jobs++; g.revenue += Number(j.amount)||0; const cg = byCamp.get(g.campaignId); if (cg) { cg.jobs++; cg.revenue += Number(j.amount)||0; } } });
  const sum = (a,f) => a.reduce((t,x)=>t+f(x),0);
  const adsets = [...byAdset.values()], camps = [...byCamp.values()];
  const th = META_MIN[win];
  const pause = adsets.filter(g => g.active && g.crmLeads===0 && g.cost>=th.adset).sort((a,b)=>b.cost-a.cost);
  const scale = adsets.filter(g => g.crmLeads>=th.conv && g.cost/g.crmLeads<=120).sort((a,b)=>(a.cost/a.crmLeads)-(b.cost/b.crmLeads));
  const totCost = sum(rows,r=>r.cost), totClicks = sum(rows,r=>r.clicks), totImp = sum(rows,r=>r.impressions);
  const avgCtr = totImp ? totClicks/totImp : 0;
  const weak = rows.filter(r => (r.extra||{}).status==='ACTIVE' && r.cost>=th.ad && r.impressions>0 && (r.clicks/r.impressions) < avgCtr*0.75).sort((a,b)=>b.cost-a.cost);
  return { rows, adsets, camps, pause, scale, weak, leadsAll, tagged, totCost, totClicks, totImp, metaLeads:sum(rows,r=>r.conversions), th, start, end, avgCtr };
}

/* ── Payroll board + each worker's own pay page + the owners' Employee Views ─────────────────────
   Pure math lives up top (computePayrollCommission / computePayrollHourly / build*PayMessage);
   everything here is rendering and the two manual statuses (cash collected → salary paid). */
function payrollWeekKeyFromUI(){ return UI.payroll.week || payrollWeekOf(todayStr()).key; }
function setPayrollWeek(k){ UI.payroll.week = k; render(); }
function togglePayrollExpanded(person){ UI.payroll.expanded[person] = !UI.payroll.expanded[person]; render(); }
function payrollActor(){ return getCurrentProfile()?.fullName || 'Unknown'; }
function payrollWeekLabel(wk){ return `${fmtDateShort(wk.start)} – ${fmtDateShort(wk.end)}`; }
function renderPayrollWeekNav(weekKey){
  const thisWeek = payrollWeekOf(todayStr()).key;
  const chips = [];
  for (let i=5; i>=0; i--) {
    const k = shiftPayrollWeek(thisWeek, -i);
    chips.push(`<button class="week-chip ${k===weekKey?'active':''}" onclick="setPayrollWeek('${k}')">${payrollWeekLabel(payrollWeekOf(k))}${k===thisWeek?' · this week':''}</button>`);
  }
  const olderChip = weekKey < shiftPayrollWeek(thisWeek, -5) ? `<button class="week-chip active">${payrollWeekLabel(payrollWeekOf(weekKey))}</button>` : '';
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
    <button class="btn small" onclick="setPayrollWeek('${shiftPayrollWeek(weekKey,-1)}')">◀ Older</button>
    ${olderChip}${chips.join('')}
    ${weekKey<thisWeek ? `<button class="btn small" onclick="setPayrollWeek('${shiftPayrollWeek(weekKey,1)}')">Newer ▶</button>` : ''}
  </div>`;
}
// A status that was marked paid for a smaller amount than the week now adds up to (a late payment landed
// after the salary was sent) gets flagged instead of silently hiding the difference.
function payrollPaidBadge(st, currentTotal){
  if (!st.salaryPaid) return '';
  const paidAmt = Number(st.salaryPaidAmount)||0;
  const diff = round2(currentTotal - paidAmt);
  return pill('good', `Paid ${payMoney(paidAmt)}`) + (Math.abs(diff) > 0.004 ? ' ' + pill('warn', `${diff>0?'+':''}${payMoney(diff)} since`) : '');
}
function payrollJobLinesTable(c){
  const held = (c.onHold||[]).length ? `<div class="section-title" style="margin-top:14px">On hold <span class="tag">${c.onHold.length} · ${payMoney(c.onHoldTotal)} · not in this week's pay</span></div>
    <div class="table-wrap"><table><thead><tr><th>Job date</th><th>Invoice</th><th>Customer</th><th class="num">Amount (ex-GST)</th><th class="num">Commission on hold</th></tr></thead><tbody>
    ${c.onHold.map(l => `<tr><td class="mono">${fmtDateShort(l.job.date)}</td><td class="mono">${invoiceLink(l.job.id, l.job.invoiceNumber)}</td><td>${custLink(l.job.customerName, l.job.contactId, l.job.id)}</td><td class="num">${fmtMoney(l.job.amount)}</td><td class="num">${payMoney(l.commission)}</td></tr>`).join('')}
    </tbody></table></div><div class="hint" style="margin-top:4px">Set back to "Not Paid" in Jobs to release it; it then counts in the week the customer paid.</div>` : '';
  if (!c.lines.length) return `<div class="hint" style="padding:8px 0">No jobs were paid this week.</div>` + held;
  const deducts = commissionDeductsParts(c.person);
  return `<div class="table-wrap"><table><thead><tr><th>Job date</th><th>Invoice</th><th>Customer</th><th class="num">Amount (ex-GST)</th><th class="num">Expenses${deducts?' (deducted)':''}</th><th class="num">%</th><th class="num">Commission</th><th></th></tr></thead><tbody>
    ${c.lines.map(l => `<tr>
      <td class="mono">${fmtDateShort(l.job.date)}</td><td class="mono">${invoiceLink(l.job.id, l.job.invoiceNumber)}</td><td>${custLink(l.job.customerName, l.job.contactId, l.job.id)}</td>
      <td class="num">${fmtMoney(l.job.amount)}</td><td class="num">${l.job.partsCost?fmtMoney(l.job.partsCost):'—'}</td>
      <td class="num">${Number(l.job.commissionPercent)||0}%</td><td class="num" style="font-weight:600">${payMoney(l.commission)}</td>
      <td>${l.late ? pill('warn', `paid late · job from ${fmtDateShort(l.job.date)}`) : ''}${l.job.paymentMethod==='Cash' ? ' '+pill('neutral','cash') : ''}</td>
    </tr>`).join('')}
  </tbody></table></div>` + held;
}
function payrollUnpaidTable(c){
  if (!c.unpaid.length) return '';
  return `<div class="section-title" style="margin-top:14px">Not paid yet <span class="tag">${c.unpaid.length} · expected ${payMoney(c.expected)}</span></div>

function payrollDaysTable(h){

function renderPayroll(profile, data){
  if (profile.role==='owner' || profile.role==='manager') {
    // Owners can open any worker's own pay page from here (what used to be the separate Employee Views page).
    const people = [...payrollCommissionPeople(data), ...payrollHourlyPeople(data)];
    const viewAs = people.includes(UI.payroll.viewAs) ? UI.payroll.viewAs : null;
    const chips = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="week-chip ${viewAs?'':'active'}" onclick="UI.payroll.viewAs=null;render()">Payroll board</button>${people.map(p => `<button class="week-chip ${p===viewAs?'active':''}" onclick="UI.payroll.viewAs='${jsStr(p)}';render()" title="What ${esc(p)} sees on their own pay page">👁 ${esc(p)}'s view</button>`).join('')}</div>`;
    return viewAs
      ? `<div class="page-head"><div><h1 class="page-title">Payroll</h1><div class="page-sub">Viewing as ${esc(viewAs)} — exactly what they see on their own pay page</div></div></div>${chips}${renderMyPay(profile, data, viewAs, true)}`
      : renderPayrollBoard(profile, data, chips);
  }
  return renderMyPay(profile, data, profile.technicianName || profile.fullName, false);
}
function renderPayrollBoard(profile, data, viewChips){
  const weekKey = payrollWeekKeyFromUI(); const wk = payrollWeekOf(weekKey);
  const people = payrollCommissionPeople(data);
  // An inactive technician still shows up for a week in which one of their jobs got paid.
  const eligible = commissionEligibleTechnicianNames(data);
  data.jobs.forEach(j => { if (j.paymentStatus==='Paid' && jobPaidDate(j)>=wk.start && jobPaidDate(j)<=wk.end && eligible.includes(j.technician) && !people.includes(j.technician)) people.push(j.technician); });
  const comm = people.map(p => computePayrollCommission(data, p, weekKey));
  const hourly = payrollHourlyPeople(data).map(p => computePayrollHourly(data, p, weekKey));
  const commTotal = round2(comm.reduce((s,c)=>s+c.total,0));
  const hourlyTotal = round2(hourly.reduce((s,h)=>s+h.total,0));
  const cashOpen = round2(comm.filter(c => !payrollStatus(data, weekKey, c.person).cashCollected).reduce((s,c)=>s+c.cash,0));
  const unpaidPeople = [...comm.filter(c=>c.total>0), ...hourly.filter(h=>h.total>0)].filter(x => !payrollStatus(data, weekKey, x.person).salaryPaid).length;

  const commRows = comm.map(c => {
    const st = payrollStatus(data, weekKey, c.person);
    const p = jsStr(c.person);
    const cashCell = c.cash>0
      ? `${payMoney(c.cash)}<div style="margin-top:4px">${st.cashCollected
          ? `<button class="btn small" onclick="togglePayrollCash('${p}','${weekKey}')" title="Click to undo">✓ Collected</button>`
          : `<button class="btn small primary" onclick="togglePayrollCash('${p}','${weekKey}')">Mark collected</button>`}</div>`
      : '—';
    const cashBlocks = c.cash>0 && !st.cashCollected;
    const salaryCell = st.salaryPaid
      ? `${payrollPaidBadge(st, c.total)}<div style="margin-top:4px"><button class="btn ghost small" onclick="togglePayrollSalary('commission','${p}','${weekKey}')">Undo</button></div>`
      : (c.total>0 ? `<button class="btn small ${cashBlocks?'':'primary'}" ${cashBlocks?'disabled title="Mark the cash as collected first"':''} onclick="togglePayrollSalary('commission','${p}','${weekKey}')">Mark paid</button>${cashBlocks?'<div class="hint">cash first</div>':''}` : '—');
    const open = !!UI.payroll.expanded[c.person];
    return `<tr>
      <td><button class="btn ghost small" onclick="togglePayrollExpanded('${p}')">${open?'▾':'▸'}</button> ${techTag(c.person)}</td>
      <td class="num">${c.lines.length}${c.lines.some(l=>l.late)?` <span class="hint">(${c.lines.filter(l=>l.late).length} late)</span>`:''}</td>
      <td class="num" style="font-weight:700">${payMoney(c.total)}</td>
      <td class="num">${c.unpaid.length ? `${payMoney(c.expected)} <span class="hint">(${c.unpaid.length})</span>` : '—'}</td>
      <td>${cashCell}</td>
      <td>${salaryCell}</td>
      <td><button class="btn small" onclick="copyPayMessage('commission','${p}')">📋 Copy message</button></td>
    </tr>${open ? `<tr><td colspan="7" style="background:var(--bg-soft, transparent)">${payrollJobLinesTable(c)}${payrollUnpaidTable(c)}</td></tr>` : ''}`;
  }).join('');

  const hourlyRows = hourly.map(h => {
    const st = payrollStatus(data, weekKey, h.person);
    const p = jsStr(h.person);
    const salaryCell = st.salaryPaid
      ? `${payrollPaidBadge(st, h.total)}<div style="margin-top:4px"><button class="btn ghost small" onclick="togglePayrollSalary('hourly','${p}','${weekKey}')">Undo</button></div>`
      : (h.total>0 ? `<button class="btn small primary" onclick="togglePayrollSalary('hourly','${p}','${weekKey}')">Mark paid</button>` : '—');
    const open = !!UI.payroll.expanded[h.person];
    return `<tr>
      <td><button class="btn ghost small" onclick="togglePayrollExpanded('${p}')">${open?'▾':'▸'}</button> ${techTag(h.person)}</td>

function setSalesLogDate(v){ if (!v) return; UI.payroll.logDate = v; UI.payroll.week = payrollWeekOf(v).key; render(); }
async function saveSalesLog(person){
  const profile = getCurrentProfile();
  const date = document.getElementById('sl-date').value;
  const today = todayStr();
  if (!date) { showToast('Pick a day first'); return; }
  const canEditAnyDay = profile.role==='owner' || profile.role==='manager';
  if (!canEditAnyDay && (date < payrollWeekOf(today).start || date > today)) { showToast('You can only fill in days from this week, up to today'); return; }
  const num = id => { const v = document.getElementById(id).value; return v==='' ? 0 : Number(v); };
  const hours = num('sl-hours'), a = num('sl-aircon'), c = num('sl-chimney'), pw = num('sl-pw');
  if (!(hours>=0 && hours<=24)) { showToast('Hours must be between 0 and 24'); return; }
  if ([a,c,pw].some(n => !(Number.isInteger(n) && n>=0))) { showToast('Bookings must be whole numbers (0 or more)'); return; }
  const ok = await db.salesLogs.set(person, date, { hours, bookingsAircon:a, bookingsChimney:c, bookingsPw:pw });
  if (ok) showToast(`Saved — ${a+c+pw} bookings, ${hours}h on ${fmtDateShort(date)}`);
  render();
}
function togglePayrollCash(person, weekKey){
  const st = payrollStatus(STATE.data, weekKey, person);
  const c = computePayrollCommission(STATE.data, person, weekKey);
  const range = payrollRangeText(c.week.start, c.week.end);
  if (!st.cashCollected) {
    confirmAction(`${person} handed over ${payMoney(c.cash)} in cash for ${range}?`, () => {
      db.payroll.set(weekKey, person, { cashCollected:true, cashCollectedAt:new Date().toISOString(), cashCollectedBy:payrollActor() });
      showToast('Cash marked as collected'); render();
    }, { danger:false, title:'Mark cash as collected', confirmLabel:'Yes, collected' });
  } else {
    if (st.salaryPaid) { showToast('Undo "salary paid" first'); return; }
    confirmAction(`Mark ${person}'s cash for ${range} as NOT collected?`, () => {
      db.payroll.set(weekKey, person, { cashCollected:false, cashCollectedAt:null, cashCollectedBy:null });
      render();
    }, { danger:false, title:'Undo cash collected', confirmLabel:'Undo' });
  }
}
function togglePayrollSalary(kind, person, weekKey){
  const st = payrollStatus(STATE.data, weekKey, person);
  const actor = payrollActor();
  const wk = payrollWeekOf(weekKey); const range = payrollRangeText(wk.start, wk.end);
  if (kind==='hourly') {
    const h = computePayrollHourly(STATE.data, person, weekKey);
    if (!st.salaryPaid) confirmAction(`Mark ${payMoney(h.total)} paid to ${person} for ${range}?`, () => {
      db.payroll.set(weekKey, person, { salaryPaid:true, salaryPaidAt:new Date().toISOString(), salaryPaidBy:actor, salaryPaidAmount:h.total });
      showToast('Salary marked as paid'); render();
    }, { danger:false, title:'Mark salary as paid', confirmLabel:'Mark paid' });
    else confirmAction(`Mark ${person}'s salary for ${range} as NOT paid?`, () => {
      db.payroll.set(weekKey, person, { salaryPaid:false, salaryPaidAt:null, salaryPaidBy:null, salaryPaidAmount:null });
      render();
    }, { danger:false, title:'Undo salary paid', confirmLabel:'Undo' });
    return;
  }
  const c = computePayrollCommission(STATE.data, person, weekKey);
  if (!st.salaryPaid) {
    if (c.cash>0 && !st.cashCollected) { showToast('Mark the cash as collected first'); return; }
    confirmAction(`Mark ${payMoney(c.total)} paid to ${person} for ${range}? The ${c.lines.length} job${c.lines.length===1?'':'s'} in it will be marked "Paid" to technician.`, () => {
      db.payroll.set(weekKey, person, { salaryPaid:true, salaryPaidAt:new Date().toISOString(), salaryPaidBy:actor, salaryPaidAmount:c.total });
      c.lines.forEach(l => {
        if (l.job.paidToTechnician!=='Paid' && l.job.paidToTechnician!=='Stuck') {
          db.jobs.update(l.job.id, { paidToTechnician:'Paid' });
          logJobActivity(l.job, actor, `Commission ${payMoney(l.commission)} paid to ${person} (Payroll, week ${range})`);
        }
      });
      showToast('Salary marked as paid'); render();
    }, { danger:false, title:'Mark salary as paid', confirmLabel:'Mark paid' });
  } else {
    confirmAction(`Mark ${person}'s salary for ${range} as NOT paid? Its jobs go back to "Not Paid" to technician.`, () => {
      db.payroll.set(weekKey, person, { salaryPaid:false, salaryPaidAt:null, salaryPaidBy:null, salaryPaidAmount:null });
      c.lines.forEach(l => {
        if (l.job.paidToTechnician==='Paid') {
          db.jobs.update(l.job.id, { paidToTechnician:'Not Paid' });
          logJobActivity(l.job, actor, `Commission payment undone (Payroll, week ${range})`);
        }
      });
      render();
    }, { danger:false, title:'Undo salary paid', confirmLabel:'Undo' });
  }
}

// Jobs/Tasks store the customer as a plain typed name — there's no structural link to a CRM contact.
// Most of the time there won't be a match at all (most paid jobs come in through Closings, never
// having been a CRM lead) — when there IS a same-named contact, make the name a live link into that
// conversation instead of leaving it as dead text.
function findContactByName(name){
  if (!name) return null;
  const norm = name.trim().toLowerCase();
  return (STATE.data.contacts||[]).find(c => c.fullName.trim().toLowerCase()===norm) || null;
}
// A job points at its CRM customer through jobs.contact_id (many jobs per customer). The name match is only a
// fallback for old/unlinked rows — it misses most real customers (nicknames, company names, spelling).
function contactForJob(job){
  if (!job) return null;
  if (job.contactId) { const c = (STATE.data.contacts||[]).find(x => x.id===job.contactId); if (c) return c; }
  return findContactByName(job.customerName);
}
function relinkJobByName(job){
  const c = findContactByName(job.customerName), id = c ? c.id : null;
  if ((job.contactId||null) !== id) { job.contactId = id; db.jobs.update(job.id, { contactId:id }); }
}
// Small 💬 button that opens the customer's CRM conversation — only for people who can see the CRM.
function crmLinkButton(contactId){
  if (!contactId) return '';
  const pr = getCurrentProfile();
  if (!pr || !canViewSection(pr, 'crm')) return '';
  return `<button class="btn ghost small" style="padding:0 6px;margin-inline-start:6px" title="Open the conversation with this customer" onclick="event.stopPropagation();goToLeadConversation('${contactId}')">💬</button>`;
}
// Customer picker for the Job modal and the Closings form: typing shows the CRM customers (name · phone) so the
// person choosing picks the real customer instead of retyping a name that later fails to match.
let CUSTOMER_PICK = {};   // datalist option text -> contact id, rebuilt every time a picker renders
function customerPickerInput(id, value, placeholder){
  CUSTOMER_PICK = {};
  const opts = (STATE.data.contacts||[]).map(c => {
    const label = `${c.fullName||'(no name)'} · ${c.phone||c.email||c.postcode||'no phone'}`;
    CUSTOMER_PICK[label] = c.id;
    return `<option value="${esc(label)}"></option>`;
  }).join('');
  return `<input id="${id}" list="dl-crm-customers" autocomplete="off" value="${esc(value||'')}"${placeholder?` placeholder="${esc(placeholder)}"`:''}><datalist id="dl-crm-customers">${opts}</datalist>`;
}
function resolveCustomerInput(id){
  const raw = document.getElementById(id).value.trim();
  const cid = CUSTOMER_PICK[raw];
  if (cid) { const c = contactById(cid); if (c) return { name: c.fullName || c.phone || raw, contactId: c.id }; }
  return { name: raw, contactId: null };
}
function customerNameCell(name, contactId){
  const c = contactId ? ((STATE.data.contacts||[]).find(x => x.id===contactId) || findContactByName(name)) : findContactByName(name);
  if (!c) return esc(name);
  return `<span style="cursor:pointer;color:var(--primary-strong);text-decoration:underline;text-decoration-style:dotted" onclick="event.stopPropagation();goToLeadConversation('${c.id}')" title="Open conversation with ${esc(c.fullName)}">${esc(name)}</span>`;
}
// Every customer name opens that customer: their CRM card when this person can see the CRM and the name
// belongs to a lead, otherwise the job itself. Every invoice number opens its job.
function custLink(name, contactId, jobId){
  const pr = getCurrentProfile();
  const job = jobId ? (STATE.data.jobs||[]).find(j => j.id===jobId) : null;
  const c = contactId ? contactById(contactId) : (job ? contactForJob(job) : findContactByName(name));
  if (c && pr && canViewSection(pr,'crm')) return `<span class="xlink" onclick="event.stopPropagation();closeModal();goToLeadConversation('${c.id}')" title="Open ${esc(c.fullName)}'s card">${esc(name||c.fullName)}</span>`;
  if (jobId && pr && canViewSection(pr,'jobs')) return `<span class="xlink" onclick="event.stopPropagation();goToJobFromSearch('${jobId}')" title="Open the job">${esc(name||'—')}</span>`;
  return esc(name||'—');
}
function invoiceLink(jobId, invoiceNumber){
  const pr = getCurrentProfile();
  if (!jobId || !pr || !canViewSection(pr,'jobs')) return esc(invoiceNumber||'—');
  return `<span class="xlink" onclick="event.stopPropagation();goToJobFromSearch('${jobId}')" title="Open the job">${esc(invoiceNumber||'—')}</span>`;
}
// "The list behind the number": any count or total on the page can open the exact leads or jobs it was
// counted from. The lists are captured while the page is drawn, so the list always matches the number.
let DRILL = [];
function drill(label, title, kind, items){
  const i = DRILL.push({ title, kind, items: items || [] }) - 1;
  return `<span class="xlink" onclick="event.stopPropagation();openDrill(${i})" title="Show the list">${label}</span>`;
}
function drillJs(title, kind, items){ return `openDrill(${DRILL.push({ title, kind, items: items || [] }) - 1})`; }
function openDrill(i){
  const d = DRILL[i]; if (!d) return;
  const items = d.items.slice();
  let head, rows;
  if (d.kind==='leads') {
    items.sort((a,b) => String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
    head = '<th>Lead</th><th>Came in</th><th>Source</th><th>Division</th><th>Stage</th>';
    rows = items.map(c => `<tr><td>${custLink(c.fullName, c.id)}</td><td class="mono">${fmtDateShort(localDay(c.createdAt))}</td><td>${esc(sourceLabel(c.source))}</td><td>${esc(c.division||'—')}</td><td>${esc(stageLabel(leadStage(c)))}</td></tr>`).join('');
  } else {
    items.sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
    head = '<th>Date</th><th>Customer</th><th>Invoice</th><th>Technician</th><th class="num">Amount (incl. GST)</th><th>Status</th>';

async function ensureContactForJob(job, chosenContactId){
  if (!job.customerName) return;
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  // Order: the customer the person picked, then the customer this job is already linked to, then a same-named contact.
  let c = chosenContactId ? contactById(chosenContactId) : null;
  if (!c && job.contactId) c = contactById(job.contactId);
  if (!c) c = findContactByName(job.customerName);
  if (c) {
    if (job.contactId !== c.id) {
      job.contactId = c.id;
      if (isRealId(job.id)) db.jobs.update(job.id, { contactId: c.id });
      logJobActivity(job, actor, `Linked to CRM customer "${c.fullName||c.phone||c.id}"`);
    }
    const patch = {};
    if (!c.linkedJobId && isRealId(job.id)) { c.linkedJobId = job.id; patch.linkedJobId = job.id; logContactActivity(c, actor, `Linked to job ${job.invoiceNumber||job.id}`); }
    // A customer can have many jobs: Sales Value is the total of all of them, not just the latest.
    const total = round2((STATE.data.jobs||[]).filter(j => j.contactId===c.id).reduce((sum,j) => sum + (Number(j.amount)||0), 0)) || job.amount;
    if (total && total!==c.salesValue) { c.salesValue = total; patch.salesValue = total; }
    // A returning customer's card only goes back to Won for a job from their new enquiry on, not an old job being edited.
    if (c.status!=='Won' && (!c.reopenedAt || (job.date||todayStr()) >= localDay(c.reopenedAt))) { c.status = 'Won'; c.nextFollowUp = ''; c.stageChangedAt = new Date().toISOString(); patch.status = 'Won'; patch.nextFollowUp = ''; patch.stageChangedAt = c.stageChangedAt; }
    if (Object.keys(patch).length) db.contacts.update(c.id, patch);
    return;
  }
  const division = LEAD_DIVISIONS.includes(job.jobType) ? job.jobType : LEAD_DIVISIONS[0];
  const values = {
    fullName: job.customerName, phone:'', email:'', postcode:'',
    division, source:'Organic', status:'Booked', createdAt: job.date || todayStr(), nextFollowUp:'',
    estimatedValue: job.amount||0, salesValue: job.amount||0, jobDescription: job.notes||'',
    linkedJobId: isRealId(job.id) ? job.id : null, starred:false, lastReadAt:null, tags:[], followupNote:'', messages:[],
  };
  try {
    c = await db.contacts.create({ activityLog:[], ...values });
  } catch (err) { return; }   // db.contacts.create() already showed an error toast
  if (isRealId(job.id)) { job.contactId = c.id; db.jobs.update(job.id, { contactId: c.id }); }
  logContactActivity(c, actor, 'Lead created automatically from a job');

}

/* ── My Day: Ron's list for today (v1, 28 Sep) ──────────────────────────
   One page that answers "who do I call now?": new leads first, then today's chasing calls, follow-ups due, quotes
   going cold, and whether today's hours/bookings are logged. Everything here is read from the CRM — nothing new is stored. */
const MY_DAY_NEW_DAYS = 7;   // New leads older than this are backlog: counted, not listed
function myDayLists(data, now){
  // Arrivals and chasing run on Sydney days; follow-ups and the daily log use the same "today" as the rest of the app.
  const today = sydneyWall(now || new Date()).day, localToday = todayStr(now);
  const cs = data.contacts || [];
  let prevWorkday = shiftDays(today, -1); while (!isWorkday(prevWorkday)) prevWorkday = shiftDays(prevWorkday, -1);
  const arrivedDay = c => localDay(leadArrivedAt(c) || c.createdAt);
  const allNew = cs.filter(c => leadStage(c)==='New');
  const fresh = allNew.filter(c => arrivedDay(c) >= shiftDays(today, -MY_DAY_NEW_DAYS));
  const late = new Set(fresh.filter(c => newLeadUnhandled(c, now)));
  // Late ones (15+ working minutes, nobody on it) on top, then newest first — the freshest lead is the easiest to win.
  const arrivedMs = c => new Date(leadArrivedAt(c) || c.createdAt).getTime() || 0;
  fresh.sort((a,b) => Number(late.has(b)) - Number(late.has(a)) || arrivedMs(b) - arrivedMs(a));
  const chasing = cs.filter(c => leadStage(c)==='Chasing');
  return {
    today, localToday, prevWorkday,
    sinceYesterday: cs.filter(c => arrivedDay(c) >= prevWorkday),
    fresh, backlog: allNew.filter(c => !fresh.includes(c)),
    unhandled: fresh.filter(c => late.has(c)),
    chaseToCall: chasing.filter(c => !chaseTooLong(c, now) && !chaseCounter(c, now).calledToday),
    chaseDone: chasing.filter(c => !chaseTooLong(c, now) && chaseCounter(c, now).calledToday),
    chaseDecide: chasing.filter(c => chaseTooLong(c, now)),
    // Each stage has its own bubble (Ofek 3/10): Follow-ups due = only leads in Follow-up; quotes are in Quotes due.
    followups: cs.filter(c => leadStage(c)==='Follow-up' && followupDue(c, localToday)).sort((a,b) => a.nextFollowUp.localeCompare(b.nextFollowUp)),
    quotesDue: cs.filter(c => leadStage(c)==='Quoted' && followupDue(c, localToday)).sort((a,b) => a.nextFollowUp.localeCompare(b.nextFollowUp)),
  };
}

}

function setOpenItemsView(view){ UI.openItems.view = view; render(); }
function shiftOpenItemsCal(delta){
  const anchor = parseLocalDate(UI.openItems.calAnchor || todayStr());
  if (UI.openItems.calGranularity==='month') anchor.setMonth(anchor.getMonth()+delta); else anchor.setDate(anchor.getDate()+delta*7);
  UI.openItems.calAnchor = fmtLocal(anchor); render();
}
function setOpenItemsCalGranularity(g){ UI.openItems.calGranularity = g; render(); }
function goToOpenItemsCalToday(){ UI.openItems.calAnchor = null; render(); }
function renderOpenTasksCalendarBlock(data){
  const tasks = data.tasks.filter(t=>t.status!=='Done');

  const tasksByDate = {}; const unscheduled = [];

async function saveClosingEdit(){
  const cl = CLOSING_EDIT && STATE.data.closings.find(x => x.id===CLOSING_EDIT.id);
  if (!cl) { closeClosingEdit(); return; }
  const val = id => document.getElementById(id).value;
  const pick = resolveCustomerInput('ce-customer');
  const v = {
    technicianName: val('ce-tech'), date: val('ce-date') || cl.date, customerName: pick.name, invoiceNumber: val('ce-invoice').trim(),
    jobType: val('ce-jobtype'), amount: Number(val('ce-amount')) || 0, includesGST: !document.getElementById('ce-nogst').checked,
    paymentStatus: val('ce-status'), paymentMethod: val('ce-method'), partsCost: Number(val('ce-partscost')) || 0,
    partsPaidBy: val('ce-partsby'), notes: val('ce-notes'), invoiceFileUrl: CLOSING_EDIT.file,
    reviewTaken: val('ce-review')==='yes', reviewDoNotAsk: document.getElementById('ce-noask').checked,
  };
  if (!v.customerName) { modalError('Please enter a customer name'); return; }
  if (!v.invoiceNumber) { modalError('Please enter an invoice number'); return; }
  const job = cl.linkedJobId ? STATE.data.jobs.find(j => j.id===cl.linkedJobId) : null;
  if (v.invoiceNumber !== cl.invoiceNumber && STATE.data.jobs.some(j => j.invoiceNumber===v.invoiceNumber && (!job || j.id!==job.id))) { modalError(`Invoice #${v.invoiceNumber} already belongs to another job`); return; }
  const same = (k) => (k==='amount' || k==='partsCost') ? Number(v[k]||0)===Number(cl[k]||0) : String(v[k] ?? '')===String(cl[k] ?? '');
  const changed = Object.keys(v).filter(k => !same(k));
  const relink = !!(job && pick.contactId && job.contactId !== pick.contactId);
  if (!changed.length && !relink) { closeClosingEdit(); showToast('Nothing changed'); return; }
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const closingPatch = {}; changed.forEach(k => { closingPatch[k] = v[k]; });
  if (changed.length) await db.closings.update(cl.id, closingPatch);
  let note = '';
  if (job) {
    const toJob = { reviewTaken:'reviewTaken', reviewDoNotAsk:'reviewDoNotAsk', technicianName:'technician', date:'date', customerName:'customerName', invoiceNumber:'invoiceNumber', jobType:'jobType', amount:'amount', includesGST:'includesGST', paymentStatus:'paymentStatus', paymentMethod:'paymentMethod', partsCost:'partsCost', partsPaidBy:'partsPaidBy', notes:'notes', invoiceFileUrl:'invoiceFile' };
    const jp = {}; changed.forEach(k => { if (toJob[k]) jp[toJob[k]] = v[k]; });
    // Marked paid now → paid today (commission counts in the week the customer paid); back to unpaid → no paid date.
    if ('paymentStatus' in jp) { if (jp.paymentStatus==='Paid' && !job.datePaid) jp.datePaid = todayStr(); if (jp.paymentStatus!=='Paid') jp.datePaid = ''; }
    if (changed.includes('technicianName') || changed.includes('jobType')) {
      const auto = commissionRateFor(STATE.data.commissionRates, v.technicianName, v.jobType);
      if (auto !== null) jp.commissionPercent = auto; else note = ` — no automatic rate for ${v.technicianName} / ${v.jobType}, so the job kept its ${job.commissionPercent}% commission`;
    }
    if (relink) jp.contactId = pick.contactId;
    if (Object.keys(jp).length) {
      await db.jobs.update(job.id, jp);
      logJobActivity(job, actor, `Updated from an edited closing: ${Object.keys(jp).join(', ')}`);
      if ('customerName' in jp || 'contactId' in jp) await ensureContactForJob(job, pick.contactId);
    }
  }
  closeClosingEdit();
  showToast((job ? 'Closing and job updated' : 'Closing updated') + note);
  render();
}

function postClosing(){
  const technicianName = document.getElementById('cf-tech').value;
  const date = document.getElementById('cf-date').value || todayStr();
  const pick = resolveCustomerInput('cf-customer');
  const customerName = pick.name;
  const invoiceNumber = document.getElementById('cf-invoice').value.trim();
  if (!customerName) { closingFormError('Please enter a customer name'); return; }
  if (!invoiceNumber) { closingFormError('Please enter an invoice number'); return; }
  closingFormError(null);
  const jobType = document.getElementById('cf-jobtype').value;
  const amount = Number(document.getElementById('cf-amount').value) || 0;
  // "No GST" toggle, default OFF (unpressed) — unpressed means GST applies and is added on top of the
  // pre-GST Amount (includesGST:true); pressing "No GST" means includesGST:false (no GST at all).
  const includesGST = !document.getElementById('cf-nogst').checked;
  const paymentStatus = document.getElementById('cf-status').value;
  const paymentMethod = document.getElementById('cf-method').value;
  const partsCost = Number(document.getElementById('cf-partscost').value) || 0;
  const partsPaidBy = document.getElementById('cf-partsby').value;
  const notes = document.getElementById('cf-notes').value;
  const invoiceFileUrl = CLOSING_FILE;
  const reviewTaken = document.getElementById('cf-review').value === 'yes';
  const reviewDoNotAsk = !!(document.getElementById('cf-noask') && document.getElementById('cf-noask').checked);
  const gathered = { technicianName, date, customerName, contactId: pick.contactId, invoiceNumber, jobType, amount, includesGST, paymentStatus, paymentMethod, partsCost, partsPaidBy, notes, invoiceFileUrl, reviewTaken, reviewDoNotAsk };

  // % commission isn't a field on this form (it's Jobs-table-only) — it's looked up automatically from
  // the commission-rates table. When there's no automatic rate for this technician/job-type combo, don't
  // silently fall back to 0%: interrupt with a one-off popup asking for a percentage or a fixed dollar
  // amount, then finish posting once that's supplied (see openCommissionPopup / confirmManualCommission).
  const auto = commissionRateFor(STATE.data.commissionRates, technicianName, jobType);
  const go = () => { if (auto === null) openCommissionPopup(gathered); else finalizeClosing(gathered, auto); };
  // Same invoice number = this closing UPDATES that job (amount, status, payment method…). Say so and show the
  // difference first, so a second payment on a split invoice doesn't silently replace the first one.
  const existing = STATE.data.jobs.find(j => j.invoiceNumber === invoiceNumber);
  if (!existing) { go(); return; }
  confirmAction(`Invoice #${invoiceNumber} already exists: ${existing.customerName}, ${fmtMoney(existing.amount)} (excl. GST), ${existing.paymentStatus}${existing.paymentMethod?' · '+existing.paymentMethod:''}. Posting this closing will update that job to ${fmtMoney(amount)}, ${paymentStatus}${paymentMethod?' · '+paymentMethod:''}. If this is a second payment on a split invoice, cancel and add it in Jobs & Commissions instead.`,
    go, { danger:false, title:'This invoice is already a job', confirmLabel:'Update the existing job' });
}

function confirmManualCommission(){
  if (!PENDING_CLOSING) { closeModal(); return; }

    commissionPercent = base > 0 ? Math.round(dollar/base*100*10000)/10000 : 0;

async function finalizeClosing(g, commissionPercent){
  const currentProfile = getCurrentProfile();
  const existingJob = STATE.data.jobs.find(j => j.invoiceNumber === g.invoiceNumber);
  let job;
  if (existingJob) {
    const patch = {
      customerName: g.customerName, technician: g.technicianName, date: g.date,
      jobType: g.jobType, commissionPercent, amount: g.amount, includesGST: g.includesGST,
      paymentStatus: g.paymentStatus, paymentMethod: g.paymentMethod, partsCost: g.partsCost,
      partsPaidBy: g.partsPaidBy, notes: g.notes,
    };
    // A later closing on the same invoice (a split payment) only adds review info, never clears "taken" or "don't ask".
    if (g.reviewTaken) patch.reviewTaken = true;
    if (g.reviewDoNotAsk) patch.reviewDoNotAsk = true;
    if (g.paymentStatus==='Paid' && !existingJob.datePaid) patch.datePaid = g.date || todayStr();
    if (g.paymentStatus!=='Paid') patch.datePaid = '';
    if (g.invoiceFileUrl) patch.invoiceFile = g.invoiceFileUrl;
    if (g.contactId) patch.contactId = g.contactId;
    db.jobs.update(existingJob.id, patch);
    job = existingJob;
  } else {
    const values = {
      customerName: g.customerName, contactId: g.contactId || null, invoiceNumber: g.invoiceNumber, date: g.date, technician: g.technicianName,
      jobType: g.jobType, commissionPercent, amount: g.amount, includesGST: g.includesGST, paymentStatus: g.paymentStatus,
      paymentMethod: g.paymentMethod, partsCost: g.partsCost, partsPaidBy: g.partsPaidBy, partsRefundStatus:'N/A',
      notes: g.notes || 'Created automatically from a Closings post.', datePaid: g.paymentStatus==='Paid'?(g.date || todayStr()):'',
      paidToTechnician:'Not Paid', enteredBy: g.technicianName, cashConfirmed:false,
      invoiceFile: g.invoiceFileUrl||null, transferReceiptFile:null, equipmentRentalFile:null,
      reviewTaken: !!g.reviewTaken, reviewDoNotAsk: !!g.reviewDoNotAsk,
    };
    try { job = await db.jobs.create({ activityLog:[], ...values }); }
    catch (err) { return; }   // db.jobs.create() already showed an error toast; leave the closing form as-is so the user can retry
  }
  await ensureContactForJob(job, g.contactId);
  const closingValues = {
    technicianName: g.technicianName, date: g.date, customerName: g.customerName, invoiceNumber: g.invoiceNumber,
    jobType: g.jobType, amount: g.amount, includesGST: g.includesGST, paymentStatus: g.paymentStatus, paymentMethod: g.paymentMethod,
    partsCost: g.partsCost, partsPaidBy: g.partsPaidBy, notes: g.notes, invoiceFileUrl: g.invoiceFileUrl,
    postedBy: currentProfile?.fullName || g.technicianName, createdAt: new Date().toISOString(), linkedJobId: job.id,

function setTasksView(view){ UI.tasks.view = view; render(); }
function setTaskCalGranularity(g){ UI.tasks.calGranularity = g; render(); }
function shiftTaskCal(delta){
  const anchor = parseLocalDate(UI.tasks.calAnchor || todayStr());
  if (UI.tasks.calGranularity==='month') anchor.setMonth(anchor.getMonth()+delta); else anchor.setDate(anchor.getDate()+delta*7);
  UI.tasks.calAnchor = fmtLocal(anchor); render();
}
function goToTaskCalToday(){ UI.tasks.calAnchor = null; render(); }
function computeCalendarDays(granularity, anchorDateStr){
  const anchor = parseLocalDate(anchorDateStr);
  if (granularity==='month') {
    const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    const last = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0);
    const gridStart = new Date(first); gridStart.setDate(first.getDate() - first.getDay());
    const gridEnd = new Date(last); gridEnd.setDate(last.getDate() + (6 - last.getDay()));
    const days = []; let d = new Date(gridStart);
    while (d <= gridEnd) { days.push({ dateStr: fmtLocal(d), inMonth: d.getMonth()===anchor.getMonth() }); d.setDate(d.getDate()+1); }
    return { days, label: monthOf(anchorDateStr).label };
  }
  const w = weekOf(anchorDateStr);
  const days = []; let d = new Date(w.start);
  for (let i=0;i<7;i++) { days.push({ dateStr: fmtLocal(d), inMonth: true }); d.setDate(d.getDate()+1); }
  return { days, label: w.label };
}

function computeRadarItems(tasks){
  const today = todayStr();
  const tomorrow = fmtLocal(new Date(parseLocalDate(today).getTime()+86400000));
  const overdue = [], dueSoon = [], headsUp = [];
  tasks.forEach(t => {
    if (t.status==='Done') return;
    if (t.due && t.due < today) overdue.push(t);
    else if (t.due && (t.due===today || t.due===tomorrow)) dueSoon.push(t);
    else if (t.headsUp && t.headsUp <= today && (!t.due || t.due > tomorrow)) headsUp.push(t);
  });
  return { overdue, dueSoon, headsUp };
}
function renderRadarPanel(profile, data){
  const tasks = visibleTasksForCalendar(profile, data);
  const { overdue, dueSoon, headsUp } = computeRadarItems(tasks);
  if (!overdue.length && !dueSoon.length && !headsUp.length) return '';
  const row = (t, tone) => `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);cursor:pointer" onclick="openTaskModal('${t.id}')">

  return `<div class="card" style="margin-bottom:18px">

function taskClientSearch(q){
  const menu = document.getElementById('tm-client-menu'), hid = document.getElementById('tm-contact-id');
  if (!menu || !hid) return;

  const term = String(q||'').trim().toLowerCase(), digits = term.replace(/\D/g, '');
  const cs = (STATE.data && STATE.data.contacts) || [];
  if (!term || !cs.length) { menu.hidden = true; return; }
  const hits = cs.filter(c => String(c.fullName||'').toLowerCase().includes(term) || (digits.length >= 3 && String(c.phone||'').replace(/\D/g,'').includes(digits)))
