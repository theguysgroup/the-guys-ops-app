/* ── business performance (decision-making metrics — separate from the day-to-day Overview/Finance
   pages above, which stay unchanged) ──────────────────────────────────────────────────────────── */
function blankPerfBucket(){ return { count:0, revenue:0, commission:0, parts:0, profit:0 }; }
function addToPerfBucket(bucket, job){
  const commission = jobCommissionAmount(job), parts = Number(job.partsCost)||0, revenue = Number(job.amount)||0;
  bucket.count++; bucket.revenue += revenue; bucket.commission += commission; bucket.parts += parts;
  bucket.profit += revenue - commission - parts;
}
function finalizePerfBucket(b){
  return { count:b.count, revenue:round2(b.revenue), commission:round2(b.commission), parts:round2(b.parts), profit:round2(b.profit), avgDeal: b.count?round2(b.revenue/b.count):0, avgProfit: b.count?round2(b.profit/b.count):0, margin: b.revenue?Math.round((b.profit/b.revenue)*100):null };
}
// Same week-bucketing as computeRevenueByWeekInRange, but summing profit (amount − commission − parts)
// instead of raw amount — reuses the {label, revenue} shape renderSparkline already expects (the "revenue"
// key just holds profit here) so the trend chart needs no changes to that shared renderer.
function computeProfitByWeekInRange(data, startDateStr, endDateStr, technicianFilter){
  const keys = []; const seen = new Set();
  let d = parseLocalDate(startDateStr);
  const endKey = weekOf(endDateStr).key;
  for (let guard=0; guard<60; guard++) {
    const wk = weekOf(fmtLocal(d)).key;
    if (!seen.has(wk)) { seen.add(wk); keys.push(wk); }
    if (wk===endKey) break;
    d.setDate(d.getDate()+7);
  }
  return keys.map(k => {
    const jobs = computeWeek(data, k, technicianFilter).jobs;
    const profit = jobs.reduce((s,j) => s + (Number(j.amount)||0) - jobCommissionAmount(j) - (Number(j.partsCost)||0), 0);
    return { label: weekOf(k).label, revenue: round2(profit) };
  });
}
// Profit here = amount (pre-GST, matching every other "revenue" figure in the app) − technician
// commission − parts cost. Deliberately does NOT allocate equipment spend or marketing spend down to
// a division/technician — equipment isn't tracked per-job, and a division draws leads from multiple
// channels, so neither can be split cleanly. Marketing cost/ROAS gets its own honest home below,
// against the channel it actually applies to (byChannel), rather than a fudged per-division number.
function computeBusinessPerformance(data, startDateStr, endDateStr){
  const jobs = data.jobs.filter(j => j.date>=startDateStr && j.date<=endDateStr);
  const contacts = (data.contacts||[]).filter(c => c.createdAt>=startDateStr && c.createdAt<=endDateStr);

  const byDivision = {}; JOB_TYPES.forEach(t=>byDivision[t]=blankPerfBucket());
  // Same additive pattern as the CRM Overview / Jobs-revenue breakdowns: sub-division numbers are a
  // subset of the parent division's, never a replacement, and only cover jobs whose linked lead
  // carries the tag (see jobAttributionTags) — the rest still count once toward byDivision above.
  const bySubDivision = {}; [...AIRCON_TYPE_TAGS, ...META_PLATFORM_TAGS].forEach(t=>bySubDivision[t]=blankPerfBucket());
  const byTech = {};
  jobs.forEach(j => {
    if (byDivision[j.jobType]) addToPerfBucket(byDivision[j.jobType], j);
    const attr = jobAttributionTags(j);
    if (attr.airconType) addToPerfBucket(bySubDivision[attr.airconType], j);
    if (attr.metaPlatform) addToPerfBucket(bySubDivision[attr.metaPlatform], j);
    if (!byTech[j.technician]) byTech[j.technician] = blankPerfBucket();
    addToPerfBucket(byTech[j.technician], j);
    byTech[j.technician].reviewCount = (byTech[j.technician].reviewCount||0) + (j.reviewTaken?1:0);
  });

  // Channel performance: leads + close rate from contacts created in this period; revenue from jobs
  // in this period whose customer name matches a lead with that source (same lookup as
  // customerNameCell/jobAttributionTags); spend from ad_spend when the ingest-ad-spend sync has data
  // for the channel/period — left as `null` (not 0) when it doesn't, so the UI can say "not available"
  // instead of implying a real $0 spend.
  const byChannel = {};
  LEAD_SOURCES.forEach(s => byChannel[s] = { leads:0, booked:0, notRelevant:0, revenue:0, jobCount:0 });
  contacts.forEach(c => {
    if (!byChannel[c.source]) return;
    byChannel[c.source].leads++;
    if (c.status==='Booked') byChannel[c.source].booked++;
    if (c.status==='Not Relevant') byChannel[c.source].notRelevant++;
  });
  jobs.forEach(j => {
    const c = findContactByName(j.customerName);
    if (c && byChannel[c.source]) { byChannel[c.source].revenue += Number(j.amount)||0; byChannel[c.source].jobCount++; }
  });
  const spendByChannel = {};
  (data.adSpend||[]).forEach(a => { if (a.date>=startDateStr && a.date<=endDateStr) spendByChannel[a.channel] = round2((spendByChannel[a.channel]||0) + (Number(a.spend)||0)); });
  Object.keys(byChannel).forEach(s => {
    const ch = byChannel[s];
    ch.revenue = round2(ch.revenue);
    const decided = ch.booked + ch.notRelevant;
    ch.closeRate = decided ? Math.round((ch.booked/decided)*100) : null;
    ch.spend = spendByChannel[s] !== undefined ? spendByChannel[s] : null;
    ch.costPerLead = (ch.spend!==null && ch.leads) ? round2(ch.spend/ch.leads) : null;
    ch.costPerBookedJob = (ch.spend!==null && ch.jobCount) ? round2(ch.spend/ch.jobCount) : null;
    ch.roas = (ch.spend) ? round2(ch.revenue/ch.spend) : null;
  });

  Object.keys(byDivision).forEach(k=>byDivision[k]=finalizePerfBucket(byDivision[k]));
  Object.keys(bySubDivision).forEach(k=>bySubDivision[k]=finalizePerfBucket(bySubDivision[k]));
  const techEntries = Object.entries(byTech).map(([name,b]) => ({ name, ...finalizePerfBucket(b), reviewRate: b.count ? Math.round(((b.reviewCount||0)/b.count)*100) : null })).sort((a,b)=>b.profit-a.profit);

  const totalRevenue = round2(jobs.reduce((s,j)=>s+(Number(j.amount)||0),0));
  const totalProfit = round2(Object.values(byDivision).reduce((s,d)=>s+d.profit,0));
  const totalBooked = contacts.filter(c=>c.status==='Booked').length;
  const totalNotRelevant = contacts.filter(c=>c.status==='Not Relevant').length;
  const totalDecided = totalBooked+totalNotRelevant;
  const totalReviewTaken = jobs.filter(j=>j.reviewTaken).length;

  // Cash-flow health: how long money actually takes to land once a job is done, not just whether it's
  // marked Paid — and how much is currently sitting unpaid from jobs done in this same window.
  const paidWithDates = jobs.filter(j => j.paymentStatus==='Paid' && j.datePaid);
  const avgDaysToPayment = paidWithDates.length ? Math.round(paidWithDates.reduce((s,j)=>s+daysBetween(parseLocalDate(j.date), parseLocalDate(j.datePaid)), 0) / paidWithDates.length) : null;
  const outstanding = round2(jobs.filter(j=>j.paymentStatus!=='Paid').reduce((s,j)=>s+(Number(j.amount)||0), 0));

  // Quote → job pipeline: of the quotes decided this period, how many actually turned into a sale
  // (Approved) vs. fell through (Rejected) — "No Response"/still-open quotes aren't a decision yet,
  // same in/out logic as the lead close rate above.
  const quotesInRange = (data.quotes||[]).filter(q => q.date>=startDateStr && q.date<=endDateStr);
  const quotesApproved = quotesInRange.filter(q=>q.status==='Approved').length;
  const quotesRejected = quotesInRange.filter(q=>q.status==='Rejected').length;
  const quoteDecided = quotesApproved + quotesRejected;

  // Lead -> job funnel. "Contacted"/"Quoted"/"Job done" are all proxies from data that already
  // exists rather than new tracked stages, on purpose — no new fields, no new discipline required
  // from Ron for this to start working today:
  //   Contacted    = status has moved past New at all (Follow-up/Booked/Not Relevant)
  //   Price Given  = the lead has an estimated value logged (>0) - the Quotes page is confirmed unused
  //                  (0 rows) since Ofek/Ron give prices verbally over the phone, never through a
  //                  logged Quote record, so estimatedValue is the only existing-data signal that a
  //                  price was actually given
  //   Booked       = status === Booked
  //   Job done     = a job exists for this customer's name, in data.jobs (ALL jobs, same reasoning)
  // Each stage is a strict subset check against the full lead list for this period, not a "moved
  // through in order" pipeline, so a lead that skipped straight to Booked without a logged estimate
  // still counts in Booked even though it shows 0 in Price Given - the funnel shows where the *process*
  // has evidence of happening, not a guess about hidden steps.
  const funnelContacted = contacts.filter(c => c.status !== 'New').length;
  const funnelPriceGiven = contacts.filter(c => Number(c.estimatedValue) > 0).length;
  const funnelJobDone = contacts.filter(c => contactHasJob(c.fullName, data.jobs)).length;

  // Loss-reason breakdown for Not Relevant leads, from the same tags already on the contact (most of
  // this data arrived via the GHL import, where "why" was usually captured as a specific tag - see
  // chat: 19 price / 32 outside-area / 7 wrong-number / rest untagged). First match wins, in order of
  // how unambiguous the tag is.
  const notRelevantContacts = contacts.filter(c => c.status === 'Not Relevant');
  const lossReasons = { price:0, outsideArea:0, wrongNumber:0, noReasonGiven:0 };
  notRelevantContacts.forEach(c => {
    const tags = (c.tags||[]).map(t=>String(t).toLowerCase());
    if (tags.some(t=>t.includes('price'))) lossReasons.price++;
    else if (tags.some(t=>t.includes('outside service area'))) lossReasons.outsideArea++;
    else if (tags.some(t=>t.includes('wrong number'))) lossReasons.wrongNumber++;
    else lossReasons.noReasonGiven++;
  });

  // Speed-to-lead: hours between the lead's own creation and the first non-automatic (kind !== event)
  // message logged against it - i.e. a real reply, not the auto "Lead created" event. Only computable
  // for leads that actually have a message history (contacts.messages) - bulk-imported historical
  // leads (e.g. the GHL import) have none, so sampleSize reflects real coverage honestly instead of
  // silently averaging over mostly-missing data.
  const speedSamples = [];
  contacts.forEach(c => {
    const msgs = (c.messages||[]).slice().sort((a,b)=> new Date(a.at) - new Date(b.at));
    if (msgs.length < 2) return;
    const firstAt = new Date(msgs[0].at);
    const reply = msgs.slice(1).find(m => m.kind !== 'event');
    if (!reply) return;
    const hours = (new Date(reply.at) - firstAt) / 3600000;
    if (hours >= 0) speedSamples.push(hours);
  });
  speedSamples.sort((a,b)=>a-b);
  const speedToLead = {
    sampleSize: speedSamples.length,
    avgHours: speedSamples.length ? round2(speedSamples.reduce((s,v)=>s+v,0)/speedSamples.length) : null,
    medianHours: speedSamples.length ? round2(speedSamples[Math.floor(speedSamples.length/2)]) : null,
  };

  return {
    startDateStr, endDateStr, jobsCount: jobs.length, byDivision, bySubDivision, byChannel, techEntries,
    totalRevenue, totalProfit, totalLeads: contacts.length,
    profitMargin: totalRevenue ? Math.round((totalProfit/totalRevenue)*100) : null,
    overallCloseRate: totalDecided ? Math.round((totalBooked/totalDecided)*100) : null,
    reviewRate: jobs.length ? Math.round((totalReviewTaken/jobs.length)*100) : null,
    avgDaysToPayment, outstanding,
    quoteConversionRate: quoteDecided ? Math.round((quotesApproved/quoteDecided)*100) : null,
    quotesApproved, quotesRejected,
    funnel: { leads: contacts.length, contacted: funnelContacted, priceGiven: funnelPriceGiven, booked: totalBooked, jobDone: funnelJobDone },
    lossReasons, speedToLead,
  };
}
function contactHasJob(fullName, allJobs){
  const norm = (fullName||'').trim().toLowerCase();
  if (!norm || !allJobs) return false;
  return allJobs.some(j => (j.customerName||'').trim().toLowerCase() === norm);
}
function pctDelta(curr, prev){
  if (!prev) return null;
  return round2(((curr-prev)/Math.abs(prev))*100);
}
function deltaBadge(curr, prev){
  const pct = pctDelta(curr, prev);
  if (pct===null || Math.abs(pct)<1) return '';
  const up = pct>0;
  return ` <span style="font-size:11.5px;font-weight:600;color:${up?'var(--good)':'var(--bad)'}">${up?'▲':'▼'} ${Math.abs(pct)}%</span>`;
}
// Rough, deliberately simple health thresholds for the colored pills below — not a claim of industry
// benchmarks, just enough to make "good/meh/bad" jump out at a glance instead of making Ofek do the
// division-by-division comparison in his head every time he opens the page.
function roasTone(roas){ if (roas===null) return 'neutral'; return roas>=3 ? 'good' : (roas>=1.5 ? 'warn' : 'bad'); }
function closeRateTone(rate){ if (rate===null) return 'neutral'; return rate>=50 ? 'good' : (rate>=25 ? 'warn' : 'bad'); }
function marginTone(margin){ if (margin===null) return 'neutral'; return margin>=40 ? 'good' : (margin>=20 ? 'warn' : 'bad'); }
function perfDetailRow(label, b){
  return `<tr><td>${esc(label)}</td><td class="num">${b.count}</td><td class="num">${fmtMoney(b.avgDeal)}</td><td class="num">${b.margin===null?'—':b.margin+'%'}</td><td class="num" style="font-weight:600">${fmtMoney(b.profit)}</td></tr>`;
}
function perfBarSection(title, buckets, colorRevenue, colorProfit){
  const revBars = renderBarGroup(buckets.map(([label,b]) => ({label, value:b.revenue, color:colorRevenue})));
  const profitBars = renderBarGroup(buckets.map(([label,b]) => ({label, value:b.profit, color:colorProfit})));
  const rows = buckets.map(([label,b]) => perfDetailRow(label, b)).join('');
  return `
    <div class="section-title">${esc(title)}</div>
    <div class="grid-2">
      <div class="card stat-card" style="--stat-accent:${colorRevenue}"><div class="stat-label">Revenue</div>${revBars}</div>
      <div class="card stat-card" style="--stat-accent:${colorProfit}"><div class="stat-label">Profit</div>${profitBars}</div>
    </div>
    <div class="table-wrap" style="margin-top:10px"><table><thead><tr><th></th><th>Jobs</th><th>Avg Deal</th><th>Margin</th><th>Profit</th></tr></thead><tbody>${rows}</tbody></table></div>
  `;
}
function channelCard(name, ch){
  const roasBadge = ch.spend===null ? pill('neutral','not synced') : (ch.roas===null ? pill('neutral','no revenue yet') : pill(roasTone(ch.roas), `${ch.roas}× ROAS`));
  return `<div class="card stat-card" style="--stat-accent:${LEAD_SOURCE_COLOR[name]||'var(--ink-faint)'}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div class="stat-label">${esc(name)}</div>
      ${roasBadge}
    </div>
    <div class="stat-value" style="font-size:26px">${ch.leads}<span style="font-size:12.5px;font-weight:500;color:var(--ink-soft)"> leads</span></div>
    <div style="margin-top:4px">${pill(closeRateTone(ch.closeRate), (ch.closeRate===null?'—':ch.closeRate+'%')+' close rate')}</div>
    <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line-soft)">
      <div class="kv"><span>Revenue</span><span class="v">${fmtMoney(ch.revenue)}</span></div>
      <div class="kv"><span>Ad Spend</span><span class="v">${ch.spend===null?'<span class="hint">not synced</span>':fmtMoney(ch.spend)}</span></div>
      ${ch.spend!==null ? `<div class="kv"><span>Cost / Lead</span><span class="v">${ch.costPerLead===null?'—':fmtMoney(ch.costPerLead)}</span></div><div class="kv"><span>Cost / Booked Job</span><span class="v">${ch.costPerBookedJob===null?'—':fmtMoney(ch.costPerBookedJob)}</span></div>` : ''}
    </div>
  </div>`;
}
function techLeaderboard(entries){
  if (!entries.length) return emptyState('No jobs this period');
  const max = Math.max(...entries.map(t=>Math.max(t.profit,0)), 0.0001);
  return entries.map(t => {
    const pct = Math.max(2, Math.round((Math.max(t.profit,0)/max)*100));
    return `<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)">
      <div style="width:100px;flex:none">${techTag(t.name)}</div>
      <div style="flex:1;min-width:60px"><div style="height:18px;border-radius:5px;background:var(--surface-3);overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--good);border-radius:5px;transition:width .2s"></div></div></div>
      <div class="mono" style="width:88px;text-align:end;font-weight:600;flex:none">${fmtMoney(t.profit)}</div>
      <div style="width:56px;text-align:end;color:var(--ink-soft);font-size:11.5px;flex:none">${t.count} jobs</div>
      <div style="width:64px;text-align:end;flex:none">${t.reviewRate===null?'<span class="hint">—</span>':pill(t.reviewRate>=70?'good':(t.reviewRate>=40?'warn':'bad'), t.reviewRate+'%')}</div>
    </div>`;
  }).join('');
}
function funnelStage(label, count, totalForPct, color){
  const pct = totalForPct ? Math.round((count/totalForPct)*100) : 0;
  return `<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
      <span>${esc(label)}</span><span class="mono" style="font-weight:600">${count} <span style="color:var(--ink-soft);font-weight:400">(${pct}%)</span></span>
    </div>
    <div style="height:20px;border-radius:5px;background:var(--surface-3);overflow:hidden">
      <div style="height:100%;width:${count?Math.max(pct,3):0}%;background:${color};border-radius:5px;transition:width .2s"></div>
    </div>
  </div>`;
}
function renderBusinessPerformance(profile, data){
  const range = resolveOverviewRange(UI.bizPerf);
  const perf = computeBusinessPerformance(data, range.start, range.end);
  const prevEnd = fmtLocal(new Date(parseLocalDate(range.start).getTime() - 86400000));
  const prevStartDate = parseLocalDate(range.start); prevStartDate.setDate(prevStartDate.getDate()-dateSpanDays(range.start, range.end));
  const prevPerf = computeBusinessPerformance(data, fmtLocal(prevStartDate), prevEnd);
  const profitTrend = computeProfitByWeekInRange(data, range.start, range.end);

  const rangeChips = [['week','This week'],['month','This month'],['7d','Last 7 days'],['30d','Last 30 days'],['custom','Custom']]
    .map(([key,label]) => `<button class="week-chip ${UI.bizPerf.range===key?'active':''}" onclick="UI.bizPerf.range='${key}';render()">${label}</button>`).join('');
  const customInputs = UI.bizPerf.range==='custom' ? `
    <input type="date" style="width:auto" value="${UI.bizPerf.customFrom||''}" onchange="UI.bizPerf.customFrom=this.value;render()">
    <span style="color:var(--ink-faint);font-size:12px;align-self:center">to</span>
    <input type="date" style="width:auto" value="${UI.bizPerf.customTo||''}" onchange="UI.bizPerf.customTo=this.value;render()">
  ` : '';

  const divisionBuckets = LEAD_DIVISIONS.map(d => [d, perf.byDivision[d]]).concat(perf.byDivision.Other.count ? [['Other', perf.byDivision.Other]] : []);
  const subDivBuckets = [...AIRCON_TYPE_TAGS, ...META_PLATFORM_TAGS].filter(t => perf.bySubDivision[t].count>0).map(t => [t, perf.bySubDivision[t]]);

  const channelCards = LEAD_SOURCES.map(s => channelCard(s, perf.byChannel[s])).join('');
  const anySpendSynced = LEAD_SOURCES.some(s => perf.byChannel[s].spend!==null);
  const avgDealOverall = perf.jobsCount ? round2(perf.totalRevenue/perf.jobsCount) : 0;

  return `
    <div class="page-head">
      <div><h1 class="page-title">Business Performance</h1><div class="page-sub">The numbers that drive decisions — profit, deal size, and marketing effectiveness by division and channel</div></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">${rangeChips}${customInputs}</div>

    <div class="grid-4">
      <div class="card stat-card" style="--stat-accent:var(--good)"><div class="stat-label">Profit</div><div class="stat-value">${fmtMoney(perf.totalProfit)}${deltaBadge(perf.totalProfit, prevPerf.totalProfit)}</div><div class="stat-sub">${perf.profitMargin===null?'—':perf.profitMargin+'% margin'} · before marketing spend</div></div>
      <div class="card stat-card" style="--stat-accent:var(--primary-teal)"><div class="stat-label">Revenue</div><div class="stat-value">${fmtMoney(perf.totalRevenue)}${deltaBadge(perf.totalRevenue, prevPerf.totalRevenue)}</div><div class="stat-sub">${perf.jobsCount} jobs · avg ${fmtMoney(avgDealOverall)}</div></div>
      <div class="card stat-card" style="--stat-accent:var(--primary)"><div class="stat-label">Leads</div><div class="stat-value">${perf.totalLeads}${deltaBadge(perf.totalLeads, prevPerf.totalLeads)}</div><div class="stat-sub">${perf.overallCloseRate===null?'no closed leads yet':perf.overallCloseRate+'% close rate'}</div></div>
      <div class="card stat-card" style="--stat-accent:var(--accent)"><div class="stat-label">Review Taken Rate</div><div class="stat-value">${perf.reviewRate===null?'—':perf.reviewRate+'%'}</div><div class="stat-sub">of jobs this period</div></div>
    </div>
    ${profitTrend.length>1 ? `<div class="card stat-card" style="--stat-accent:var(--good);margin-top:12px"><div class="stat-label">Profit trend</div>${renderSparkline(profitTrend,{color:'var(--good)'})}</div>` : ''}

    <div class="section-title">Cash flow &amp; pipeline health</div>
    <div class="grid-3">
      <div class="card stat-card" style="--stat-accent:${perf.outstanding>0?'var(--warn)':'var(--good)'}"><div class="stat-label">Outstanding (unpaid)</div><div class="stat-value" style="font-size:20px">${fmtMoney(perf.outstanding)}</div><div class="stat-sub">from jobs done this period</div></div>
      <div class="card stat-card" style="--stat-accent:var(--primary)"><div class="stat-label">Avg Days to Payment</div><div class="stat-value" style="font-size:20px">${perf.avgDaysToPayment===null?'—':perf.avgDaysToPayment+' days'}</div><div class="stat-sub">job date → paid date</div></div>
      <div class="card stat-card" style="--stat-accent:var(--accent)"><div class="stat-label">Quote → Job Conversion</div><div class="stat-value" style="font-size:20px">${perf.quoteConversionRate===null?'—':perf.quoteConversionRate+'%'}</div><div class="stat-sub">${perf.quotesApproved} approved / ${perf.quotesRejected} rejected</div></div>
    </div>

    <div class="section-title">Lead pipeline &amp; loss analysis</div>
    <div class="grid-2">
      <div class="card stat-card" style="--stat-accent:var(--primary)">
        <div class="stat-label">Funnel — lead to job</div>
        ${funnelStage('Leads', perf.funnel.leads, perf.funnel.leads, 'var(--primary)')}
        ${funnelStage('Contacted', perf.funnel.contacted, perf.funnel.leads, 'var(--accent)')}
        ${funnelStage('Price Given', perf.funnel.priceGiven, perf.funnel.leads, 'var(--primary-teal)')}
        ${funnelStage('Booked', perf.funnel.booked, perf.funnel.leads, 'var(--good)')}
        ${funnelStage('Job Completed', perf.funnel.jobDone, perf.funnel.leads, 'var(--good)')}
        <div class="hint" style="margin-top:4px">Contacted/Job Completed are inferred from existing data (status, Jobs matched by name) — not a strict step-by-step order, so a lead can reach Booked with 0 in Price Given if no estimate was logged. Price Given uses the lead's Estimated Value as a proxy since quotes are given verbally, not logged in the (unused) Quotes page.</div>
      </div>
      <div class="card stat-card" style="--stat-accent:var(--bad)">
        <div class="stat-label">Why leads are lost (Not Relevant)</div>
        ${(perf.lossReasons.price+perf.lossReasons.outsideArea+perf.lossReasons.wrongNumber+perf.lossReasons.noReasonGiven) ? renderBarGroup([
          {label:'Price', value:perf.lossReasons.price, color:'var(--bad)'},
          {label:'Outside Area', value:perf.lossReasons.outsideArea, color:'var(--warn)'},
          {label:'Wrong Number', value:perf.lossReasons.wrongNumber, color:'var(--ink-faint)'},
          {label:'No Reason Given', value:perf.lossReasons.noReasonGiven, color:'var(--accent)'},
        ], {fmt:(n)=>String(n)}) : emptyState('No lost leads this period')}
        ${perf.lossReasons.noReasonGiven>0 ? `<div class="hint" style="margin-top:6px">${perf.lossReasons.noReasonGiven} lost lead${perf.lossReasons.noReasonGiven===1?'':'s'} marked Not Relevant with no reason tag — worth tagging why going forward (price / outside area / wrong number / etc.) so this stops being the biggest bar by default.</div>` : ''}
      </div>
    </div>
    <div class="card stat-card" style="--stat-accent:var(--accent);margin-top:12px">
      <div class="stat-label">Speed to Lead</div>
      ${perf.speedToLead.sampleSize ? `
        <div class="stat-value" style="font-size:20px">${perf.speedToLead.medianHours<1 ? Math.round(perf.speedToLead.medianHours*60)+' min' : perf.speedToLead.medianHours+' hrs'}</div>
        <div class="stat-sub">median time to first reply · avg ${perf.speedToLead.avgHours<1 ? Math.round(perf.speedToLead.avgHours*60)+' min' : perf.speedToLead.avgHours+' hrs'} · based on ${perf.speedToLead.sampleSize} lead${perf.speedToLead.sampleSize===1?'':'s'} with a logged reply</div>
      ` : `
        <div class="stat-value" style="font-size:16px;color:var(--ink-soft)">Not enough data yet</div>
        <div class="stat-sub">only leads created and replied to through this app have a timestamped message history — bulk-imported leads don't carry this, so it fills in naturally as new leads come in</div>
      `}
    </div>

    ${perfBarSection('Revenue & profit by division', divisionBuckets, 'var(--primary)', 'var(--good)')}
    ${subDivBuckets.length ? perfBarSection('Split vs Duct · Facebook vs Instagram', subDivBuckets, 'var(--primary-teal)', 'var(--accent)') + `<div class="hint" style="margin-top:-6px;margin-bottom:6px">Only jobs whose lead has a known type/placement — a subset of the division numbers above, not a replacement.</div>` : ''}

    <div class="section-title">Marketing channel performance</div>
    <div class="grid-3">${channelCards}</div>
    <div class="hint" style="margin-top:6px">${anySpendSynced ? 'Ad Spend comes from the daily Google Ads / Meta Ads sync — Google Maps, Organic and Phone Call have no ad spend by definition.' : 'Ad Spend / Cost per Lead / ROAS need the ad-spend sync to be deployed — everything else on this page already works without it.'}</div>

    <div class="section-title">Technician profitability</div>
    <div class="card">${techLeaderboard(perf.techEntries)}</div>
  `;
}

// Jobs/Tasks store the customer as a plain typed name — there's no structural link to a CRM contact.
// Most of the time there won't be a match at all (most paid jobs come in through Closings, never
// having been a CRM lead) — when there IS a same-named contact, make the name a live link into that
// conversation instead of leaving it as dead text.
function findContactByName(name){
  if (!name) return null;
  const norm = name.trim().toLowerCase();
  return (STATE.data.contacts||[]).find(c => c.fullName.trim().toLowerCase()===norm) || null;
}
function customerNameCell(name){
  const c = findContactByName(name);
  if (!c) return esc(name);
  return `<span style="cursor:pointer;color:var(--primary-strong);text-decoration:underline;text-decoration-style:dotted" onclick="event.stopPropagation();goToLeadConversation('${c.id}')" title="Open conversation with ${esc(c.fullName)}">${esc(name)}</span>`;
}
// Carries the Split/Duct and Facebook/Instagram tags (see AIRCON_TYPE_TAGS/META_PLATFORM_TAGS) from a
// job's linked lead over to its revenue — same name-match as customerNameCell, so this only knows the
// type for jobs that were (or matched) a CRM lead with that tag; every other job's dollars still land in
// the plain jobType/revenue totals untouched, exactly like the unsplit leads on the CRM Overview.
function jobAttributionTags(job){
  const c = findContactByName(job.customerName);
  if (!c) return { airconType:null, metaPlatform:null };
  const tags = c.tags || [];
  return {
    airconType: job.jobType==='Aircon' ? (AIRCON_TYPE_TAGS.find(t=>tags.includes(t)) || null) : null,
    metaPlatform: c.source==='Meta Ads' ? (META_PLATFORM_TAGS.find(t=>tags.includes(t)) || null) : null,
  };
}
// Ofek's call: every customer, however they arrived, is a lead — so every job (whether it came in
// through the CRM pipeline or was entered directly via Closings/the Job modal) must have a CRM contact
// behind it. If a same-named contact exists, link this job to it (and sync Sales Value + bump the
// stage to Booked, since a real job existing means it's a closed sale); otherwise create one.
// A real Postgres uuid, as opposed to the old client-side uid() format (e.g. "idmtryrkday1kjq4")
// that a still-unwired caller (finalizeClosing, as of this writing) may pass as job.id — sending
// one of those into a `uuid` column throws "invalid input syntax for type uuid", so anything
// derived from job.id must be guarded by this before it's allowed into a persisted patch.
function isRealId(id){ return typeof id==='string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id); }
async function ensureContactForJob(job){
  if (!job.customerName) return;
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  let c = findContactByName(job.customerName);
  if (c) {
    const patch = {};
    if (!c.linkedJobId && isRealId(job.id)) { c.linkedJobId = job.id; patch.linkedJobId = job.id; logContactActivity(c, actor, `Linked to job ${job.invoiceNumber||job.id}`); }
    if (job.amount && job.amount!==c.salesValue) { c.salesValue = job.amount; patch.salesValue = job.amount; }
    if (c.status!=='Booked' && c.status!=='Not Relevant') { c.status = 'Booked'; c.nextFollowUp = ''; patch.status = 'Booked'; patch.nextFollowUp = ''; }
    if (Object.keys(patch).length) db.contacts.update(c.id, patch);
    return;
  }
  const division = LEAD_DIVISIONS.includes(job.jobType) ? job.jobType : LEAD_DIVISIONS[0];
  const values = {
    fullName: job.customerName, phone:'', email:'', postcode:'',
    division, source:'Organic', status:'Booked', createdAt: job.date || todayStr(), nextFollowUp:'',
    estimatedValue: job.amount||0, salesValue: job.amount||0, jobDescription: job.notes||'',
    linkedJobId: isRealId(job.id) ? job.id : null, starred:false, lastReadAt:null, tags:[], followupNote:'', messages:[],
  };
  try {
    c = await db.contacts.create({ activityLog:[], ...values });
  } catch (err) { return; }   // db.contacts.create() already showed an error toast
  logContactActivity(c, actor, 'Lead created automatically from a job');
  logLeadEvent(c, `Lead created automatically from job ${job.invoiceNumber?('#'+job.invoiceNumber):''} — ${job.jobType}, ${fmtMoney(job.amount||0)}`);
}

const REMINDER_ICONS = { unpaid:'💵', commission:'🧾', refund:'♻️', equipment:'🧰', quote:'✎', followup:'📞', 'repeat-service':'🔁' };
function deleteManualReminder(id, rowEl){

// The "Follow up with {name}" reminders that come straight from a lead's own Next-follow-up date
// (not from the separate "Create follow-up" form) aren't a standalone record — there's nothing to
// delete but the date itself, so clearing it is what makes the reminder go away.
function dismissLeadFollowup(contactId, rowEl){
  const c = contactById(contactId); if (!c) return;
  confirmAction(`Clear the follow-up date for ${c.fullName}?`, ()=>{
    animateRowRemove(rowEl, ()=>{
      c.nextFollowUp = '';
      db.contacts.update(c.id, { nextFollowUp: '' });
      logContactActivity(c, getCurrentProfile()?.fullName||'Unknown', 'Follow-up date cleared from Reminders');
      showToast('Follow-up cleared');
      render();
    });
  });
}
// Ofek's call: every reminder gets a delete option, including the ones computed live from jobs/quotes/
// equipment (unpaid invoices, stale quotes, commission owed, pending reimbursements) — there's no
// standalone record for those, so "delete" means permanently dismiss that specific source record's
// reminder, tracked by a stable key (e.g. "unpaid:<jobId>"). It stays dismissed even if the underlying
// condition is still unresolved — that's the trade-off of "delete" rather than "snooze," by request.
function dismissReminder(key, rowEl){
  confirmAction("Delete this reminder? It won't come back for this item.", ()=>{
    animateRowRemove(rowEl, ()=>{
      if (!STATE.data.dismissedReminders) STATE.data.dismissedReminders = [];
      STATE.data.dismissedReminders.push(key);
      db.dismissedReminders.add(key);
      showToast('Reminder deleted');
      render();
    });
  });
}
// Where clicking a reminder should take you — a lead follow-up goes to that live conversation;
// everything else (unpaid invoices, commission owed, parts/equipment refunds, stale quotes) goes to
// the screen that actually owns that record, since there's no per-record page for those yet.
// Clicking a reminder marks it "read" — it stays in the list (Delete is the only way to
// actually remove one, by request), but it stops counting toward the sidebar's unread badge.
function markReminderRead(readKey){
  if (!readKey) return;
  if (!STATE.data.readReminders) STATE.data.readReminders = [];
  if (!STATE.data.readReminders.includes(readKey)) STATE.data.readReminders.push(readKey);
}
// Clicking the reminder's own icon (as opposed to the rest of the row) marks it read WITHOUT
// navigating anywhere — Ofek's ask: the icon is "mark as read, stay here," the row is "take me
// there" (which still marks it read too, as a side effect of actually dealing with it).
function markReminderReadOnly(readKey){
  markReminderRead(readKey);
  render();
}
function goToReminderTarget(type, contactId, readKey){
  markReminderRead(readKey);
  if (type==='followup' && contactId) { goToLeadConversation(contactId); return; }
  if (type==='unpaid' || type==='commission' || type==='refund') { UI.tab='outstanding'; render(); return; }
  if (type==='equipment') { UI.tab='reference'; UI.reference.tab='equipmentSpend'; render(); return; }
  if (type==='quote') { UI.tab='quotes'; render(); return; }
  if (type==='repeat-service') { UI.tab='jobs'; render(); return; }
  render();
}
function renderReminders(profile, data){
  const items = computeReminders(data);
  const list = items.length ? items.map(it => `
    <div class="reminder-item" style="cursor:pointer${it.isRead?';opacity:.55':''}" onclick="goToReminderTarget('${it.type}','${it.contactId||''}','${jsStr(it.readKey||'')}')">
      <div class="reminder-ic" style="background:${it.severity==='bad'?'var(--bad-soft)':'var(--warn-soft)'};cursor:pointer" title="Mark as read" onclick="event.stopPropagation();markReminderReadOnly('${jsStr(it.readKey||'')}')">${REMINDER_ICONS[it.type]}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13.5px">${esc(it.title)}</div><div style="color:var(--ink-soft);font-size:12px;margin-top:2px">${esc(it.meta)}</div></div>
      ${it.isRead ? pill('neutral','Read') : pill(it.severity, it.severity==='bad'?'Urgent':'Attention')}
      ${it.manual ? `<button class="btn ghost small danger" onclick="event.stopPropagation();deleteManualReminder('${it.id}', this.closest('.reminder-item'))">Delete</button>` : (it.contactId ? `<button class="btn ghost small danger" onclick="event.stopPropagation();dismissLeadFollowup('${it.contactId}', this.closest('.reminder-item'))">Delete</button>` : `<button class="btn ghost small danger" onclick="event.stopPropagation();dismissReminder('${it.key}', this.closest('.reminder-item'))">Delete</button>`)}
    </div>`).join('') : emptyState('No reminders right now','All caught up ✓','✓');

  return `<button type="button" class="btn small" onclick="document.getElementById('cf-photo-input').click()">Attach invoice photo…</button><span class="file-hint">Preview only — not saved permanently</span>`;
}
function onClosingFilePicked(inputEl){
  const file = inputEl.files && inputEl.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { CLOSING_FILE = reader.result; const row = document.getElementById('cf-photo-row'); if (row) row.innerHTML = closingFileRow(); };
  reader.readAsDataURL(file);
}
function clearClosingFile(){ CLOSING_FILE = null; const row = document.getElementById('cf-photo-row'); if (row) row.innerHTML = closingFileRow(); }

function postClosing(){
  const technicianName = document.getElementById('cf-tech').value;
  const date = document.getElementById('cf-date').value || todayStr();
  const customerName = document.getElementById('cf-customer').value.trim();
  const invoiceNumber = document.getElementById('cf-invoice').value.trim();
  if (!customerName) { closingFormError('Please enter a customer name'); return; }
  if (!invoiceNumber) { closingFormError('Please enter an invoice number'); return; }
  closingFormError(null);
  const jobType = document.getElementById('cf-jobtype').value;
  const amount = Number(document.getElementById('cf-amount').value) || 0;
  // "No GST" toggle, default OFF (unpressed) — unpressed means GST applies and is added on top of the
  // pre-GST Amount (includesGST:true); pressing "No GST" means includesGST:false (no GST at all).
  const includesGST = !document.getElementById('cf-nogst').checked;
  const paymentStatus = document.getElementById('cf-status').value;
  const paymentMethod = document.getElementById('cf-method').value;
  const partsCost = Number(document.getElementById('cf-partscost').value) || 0;
  const partsPaidBy = document.getElementById('cf-partsby').value;
  const notes = document.getElementById('cf-notes').value;
  const invoiceFileUrl = CLOSING_FILE;
  const gathered = { technicianName, date, customerName, invoiceNumber, jobType, amount, includesGST, paymentStatus, paymentMethod, partsCost, partsPaidBy, notes, invoiceFileUrl };

  // % commission isn't a field on this form (it's Jobs-table-only) — it's looked up automatically from
  // the commission-rates table. When there's no automatic rate for this technician/job-type combo, don't
  // silently fall back to 0%: interrupt with a one-off popup asking for a percentage or a fixed dollar
  // amount, then finish posting once that's supplied (see openCommissionPopup / confirmManualCommission).
  const auto = commissionRateFor(STATE.data.commissionRates, technicianName, jobType);
  if (auto === null) openCommissionPopup(gathered);
  else finalizeClosing(gathered, auto);
}
function openCommissionPopup(gathered){
  PENDING_CLOSING = gathered;
  openModal(`
    <div class="modal-back" onclick="if(event.target===this) cancelCommissionPopup()">
      <div class="modal" style="max-width:440px">
        <h2>Commission for this job</h2>
        <div class="modal-sub">${esc(gathered.technicianName)} has no automatic commission rate set for "${esc(gathered.jobType)}" jobs. Enter one manually to finish posting this closing.</div>
        <div class="field"><label>Set commission as</label>
          <div style="display:flex;gap:16px;padding-top:6px">
            <label class="checkline"><input type="radio" name="cm-mode" value="percent" checked onchange="onCommissionModeChange()"> Percentage</label>
            <label class="checkline"><input type="radio" name="cm-mode" value="dollar" onchange="onCommissionModeChange()"> Fixed dollar amount</label>
          </div>
        </div>
        <div class="grid-2" style="margin-top:11px">
          <div class="field" id="cm-percent-wrap"><label>Commission %</label><input type="number" id="cm-percent" value="0"></div>
          <div class="field" id="cm-dollar-wrap" style="display:none"><label>Commission $ (fixed)</label><input type="number" id="cm-dollar" value="0"></div>
        </div>
        <div id="modal-error"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px">
          <button class="btn" onclick="cancelCommissionPopup()">Cancel</button>
          <button class="btn primary" onclick="confirmManualCommission()">Confirm &amp; post closing</button>
        </div>
      </div>
    </div>`);
}
function onCommissionModeChange(){
  const mode = document.querySelector('input[name="cm-mode"]:checked').value;
  document.getElementById('cm-percent-wrap').style.display = mode==='percent' ? 'flex' : 'none';
  document.getElementById('cm-dollar-wrap').style.display = mode==='dollar' ? 'flex' : 'none';
}
function cancelCommissionPopup(){ PENDING_CLOSING = null; closeModal(); }
function confirmManualCommission(){
  if (!PENDING_CLOSING) { closeModal(); return; }
  const mode = document.querySelector('input[name="cm-mode"]:checked').value;
  let commissionPercent;
  if (mode==='percent') { commissionPercent = Number(document.getElementById('cm-percent').value) || 0; }
  else { const dollar = Number(document.getElementById('cm-dollar').value) || 0; commissionPercent = PENDING_CLOSING.amount > 0 ? round2(dollar/PENDING_CLOSING.amount*100) : 0; }
  const gathered = PENDING_CLOSING; PENDING_CLOSING = null;
  closeModal();
  finalizeClosing(gathered, commissionPercent);
}
async function finalizeClosing(g, commissionPercent){
  const currentProfile = getCurrentProfile();
  const existingJob = STATE.data.jobs.find(j => j.invoiceNumber === g.invoiceNumber);
  let job;
  if (existingJob) {
    const patch = {
      customerName: g.customerName, technician: g.technicianName, date: g.date,
      jobType: g.jobType, commissionPercent, amount: g.amount, includesGST: g.includesGST,
      paymentStatus: g.paymentStatus, paymentMethod: g.paymentMethod, partsCost: g.partsCost,
      partsPaidBy: g.partsPaidBy, notes: g.notes,
    };
    if (g.paymentStatus==='Paid' && !existingJob.datePaid) patch.datePaid = todayStr();
    if (g.paymentStatus!=='Paid') patch.datePaid = '';
    if (g.invoiceFileUrl) patch.invoiceFile = g.invoiceFileUrl;
    db.jobs.update(existingJob.id, patch);
    job = existingJob;
  } else {
    const values = {
      customerName: g.customerName, invoiceNumber: g.invoiceNumber, date: g.date, technician: g.technicianName,
      jobType: g.jobType, commissionPercent, amount: g.amount, includesGST: g.includesGST, paymentStatus: g.paymentStatus,
      paymentMethod: g.paymentMethod, partsCost: g.partsCost, partsPaidBy: g.partsPaidBy, partsRefundStatus:'N/A',
      notes: g.notes || 'Created automatically from a Closings post.', datePaid: g.paymentStatus==='Paid'?todayStr():'',
      paidToTechnician:'Not Paid', enteredBy: g.technicianName, cashConfirmed:false,
      invoiceFile: g.invoiceFileUrl||null, transferReceiptFile:null, equipmentRentalFile:null,
    };
    try { job = await db.jobs.create({ activityLog:[], ...values }); }
    catch (err) { return; }   // db.jobs.create() already showed an error toast; leave the closing form as-is so the user can retry
  }
  await ensureContactForJob(job);
  const closingValues = {
    technicianName: g.technicianName, date: g.date, customerName: g.customerName, invoiceNumber: g.invoiceNumber,
    jobType: g.jobType, amount: g.amount, includesGST: g.includesGST, paymentStatus: g.paymentStatus, paymentMethod: g.paymentMethod,
    partsCost: g.partsCost, partsPaidBy: g.partsPaidBy, notes: g.notes, invoiceFileUrl: g.invoiceFileUrl,
    postedBy: currentProfile?.fullName || g.technicianName, createdAt: new Date().toISOString(), linkedJobId: job.id,
  };
  try { await db.closings.create(closingValues); }
  catch (err) { return; }   // db.closings.create() already showed an error toast
  CLOSING_FILE = null;
  showToast(existingJob ? 'Closing posted — existing job updated' : 'Closing posted — new job created');
  render();
}

const TASK_STATUSES = ['Not Started','In Progress','Waiting on Response','Stuck','Done'];
const TASK_STATUS_COLOR = { 'Not Started':'neutral', 'In Progress':'warn', 'Waiting on Response':'warn', Stuck:'bad', Done:'good' };
const TASK_PRIORITIES = ['Low','Medium','High','Urgent'];
const TASK_PRIORITY_COLOR = { Low:'neutral', Medium:'warn', High:'bad', Urgent:'bad' };
const TASK_CATEGORIES = ['','Financial','Personal','Operational','Marketing'];
function taskFilterMode(profile){
  // Owner/Manager need oversight, so they default to "All"; technician/VA profiles default to
  // seeing just their own to-dos. Either can flip the toggle — see setTaskFilterMode().
  if (UI.tasks.filterMode) return UI.tasks.filterMode;
  return (profile.role==='technician' || profile.role==='va') ? 'mine' : 'all';
}
function setTaskFilterMode(mode){ UI.tasks.filterMode = mode; render(); }
/* ── tasks: unified calendar (merged across boards) + heads-up radar ───── */
function visibleTasksForCalendar(profile, data){
  if (profile.role==='technician') return data.tasks.filter(t=>t.board===profile.technicianName);
  return data.tasks;
}
function setTasksView(view){ UI.tasks.view = view; render(); }
function setTaskCalGranularity(g){ UI.tasks.calGranularity = g; render(); }
function shiftTaskCal(delta){
  const anchor = parseLocalDate(UI.tasks.calAnchor || todayStr());
  if (UI.tasks.calGranularity==='month') anchor.setMonth(anchor.getMonth()+delta); else anchor.setDate(anchor.getDate()+delta*7);
  UI.tasks.calAnchor = fmtLocal(anchor); render();
}
function goToTaskCalToday(){ UI.tasks.calAnchor = null; render(); }
function computeCalendarDays(granularity, anchorDateStr){
  const anchor = parseLocalDate(anchorDateStr);
  if (granularity==='month') {
    const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    const last = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0);
    const gridStart = new Date(first); const startDow = first.getDay(); gridStart.setDate(first.getDate() + (startDow===0?-6:1-startDow));
    const gridEnd = new Date(last); const endDow = last.getDay(); gridEnd.setDate(last.getDate() + (endDow===0?0:7-endDow));
    const days = []; let d = new Date(gridStart);
    while (d <= gridEnd) { days.push({ dateStr: fmtLocal(d), inMonth: d.getMonth()===anchor.getMonth() }); d.setDate(d.getDate()+1); }
    return { days, label: monthOf(anchorDateStr).label };
  }
  const w = weekOf(anchorDateStr);
  const days = []; let d = new Date(w.monday);
  for (let i=0;i<7;i++) { days.push({ dateStr: fmtLocal(d), inMonth: true }); d.setDate(d.getDate()+1); }
  return { days, label: w.label };
}

function renderCalendarDayCell(day, tasksByDate, isToday){
  const dayTasks = tasksByDate[day.dateStr] || [];
  const d = parseLocalDate(day.dateStr);
  return `<div style="min-height:104px;padding:6px;background:${isToday?'var(--primary-soft)':'var(--surface)'};opacity:${day.inMonth?1:.4}">
    <div style="font-size:11px;font-weight:700;color:${isToday?'var(--primary-strong)':'var(--ink-soft)'};margin-bottom:4px">${d.getDate()} ${MONTHS[d.getMonth()]}</div>
    ${dayTasks.map(renderTaskChip).join('')}
  </div>`;
}
function renderTasksCalendar(profile, data){
  const tasks = visibleTasksForCalendar(profile, data);
  const anchor = UI.tasks.calAnchor || todayStr();
  const { days, label } = computeCalendarDays(UI.tasks.calGranularity, anchor);
  const tasksByDate = {}; const unscheduled = [];
  tasks.forEach(t => { if (t.due) (tasksByDate[t.due] = tasksByDate[t.due]||[]).push(t); else unscheduled.push(t); });
  const today = todayStr();
  const dowLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const headerRow = UI.tasks.calGranularity==='month' ? dowLabels.map(d=>`<div style="font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;text-align:center;padding:4px 0">${d}</div>`).join('') : '';
  const cells = days.map(day => renderCalendarDayCell(day, tasksByDate, day.dateStr===today)).join('');
  const unscheduledRows = unscheduled.length ? unscheduled.sort((a,b)=>(a.title||'').localeCompare(b.title||'')).map(t => `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);cursor:pointer" onclick="openTaskModal('${t.id}')">
      <div><div style="font-weight:600;font-size:13px">${esc(t.title)}</div><div style="font-size:11.5px;color:var(--ink-soft)">${esc(assigneeNames(t).join(', ')||'—')} · ${esc(taskBoardLabel(t.board))}</div></div>
      ${t.priority?pill(TASK_PRIORITY_COLOR[t.priority], t.priority):''}
    </div>`).join('') : emptyState('Nothing unscheduled', 'Every task here has a due date.');
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn ghost small" onclick="shiftTaskCal(-1)">←</button>
        <button class="btn ghost small" onclick="goToTaskCalToday()">Today</button>
        <button class="btn ghost small" onclick="shiftTaskCal(1)">→</button>
        <b style="font-size:14px;margin-inline-start:6px">${esc(label)}</b>

function computeRadarItems(tasks){
  const today = todayStr();
  const tomorrow = fmtLocal(new Date(parseLocalDate(today).getTime()+86400000));
  const overdue = [], dueSoon = [], headsUp = [];
  tasks.forEach(t => {
    if (t.status==='Done') return;
    if (t.due && t.due < today) overdue.push(t);
    else if (t.due && (t.due===today || t.due===tomorrow)) dueSoon.push(t);
    else if (t.headsUp && t.headsUp <= today && (!t.due || t.due > tomorrow)) headsUp.push(t);
  });
  return { overdue, dueSoon, headsUp };
}
function renderRadarPanel(profile, data){
  const tasks = visibleTasksForCalendar(profile, data);
  const { overdue, dueSoon, headsUp } = computeRadarItems(tasks);
  if (!overdue.length && !dueSoon.length && !headsUp.length) return '';
  const row = (t, tone) => `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);cursor:pointer" onclick="openTaskModal('${t.id}')">

    <span style="font-size:11px;color:var(--ink-soft);flex:none">${t.due?fmtDateShort(t.due):'heads-up'}</span>
  </div>`;
  return `<div class="card" style="margin-bottom:18px">
    <div class="stat-label" style="margin-bottom:8px">On your radar today</div>
    ${overdue.map(t=>row(t,'bad')).join('')}
    ${dueSoon.map(t=>row(t,'warn')).join('')}
    ${headsUp.map(t=>row(t,'primary')).join('')}
  </div>`;

async function saveTaskModal(taskId, createdBy, createdAt){
  const title = document.getElementById('tm-title').value.trim();
  if (!title) { modalError('Please enter a title'); return; }
  const currentProfile = getCurrentProfile();
  const actor = currentProfile?.fullName || 'Unknown';
  const oldTask = taskId ? STATE.data.tasks.find(t=>t.id===taskId) : null;
  const oldSnapshot = oldTask ? { status:oldTask.status, priority:oldTask.priority, due:oldTask.due, assignees: assigneeNames(oldTask), subtasks: (oldTask.subtasks||[]).map(s=>({id:s.id, status:s.status||(s.done?'Done':'Not Started')})) } : null;
  const assignees = Array.from(document.querySelectorAll('.tm-assignee-cb:checked')).map(cb=>cb.value);
  const newSubtasks = MODAL_SUBTASKS.map(s=>({...s}));
  const values = {
    board: UI.tasks.board, title, status: document.getElementById('tm-status').value, due: document.getElementById('tm-due').value,
    headsUp: document.getElementById('tm-headsup').value,
    notes: document.getElementById('tm-notes').value, client: document.getElementById('tm-client').value.trim(),
    priority: document.getElementById('tm-priority').value, assignees,
    technician: document.getElementById('tm-technician').value, category: document.getElementById('tm-category').value,
    createdBy, createdAt, subtasks: newSubtasks, updates: MODAL_UPDATES.map(u=>({...u})),
  };
  let task;
  if (taskId) { task = oldTask; db.tasks.update(task.id, values); }
  else {
    try { task = await db.tasks.create({ activityLog:[], ...values }); }
    catch (err) { return; }   // db.tasks.create() already showed an error toast; leave the modal open so the user can retry
  }
  // Auto-generated activity log — mirrors Monday's Activity Log: every tracked field change gets its
  // own timestamped, attributed entry, independent of the manual Updates thread above.
  if (oldSnapshot) {
    if (oldSnapshot.status !== values.status) logTaskActivity(task, actor, `Status changed from "${oldSnapshot.status}" to "${values.status}"`);
    if ((oldSnapshot.priority||'') !== (values.priority||'')) logTaskActivity(task, actor, `Priority changed from "${oldSnapshot.priority||'—'}" to "${values.priority||'—'}"`);
    if ((oldSnapshot.due||'') !== (values.due||'')) logTaskActivity(task, actor, `Due date changed from "${oldSnapshot.due||'—'}" to "${values.due||'—'}"`);
    const addedPeople = assignees.filter(a=>!oldSnapshot.assignees.includes(a));
    const removedPeople = oldSnapshot.assignees.filter(a=>!assignees.includes(a));
    addedPeople.forEach(p=>logTaskActivity(task, actor, `${p} was assigned`));
    removedPeople.forEach(p=>logTaskActivity(task, actor, `${p} was unassigned`));
    newSubtasks.forEach(s => {
      const before = oldSnapshot.subtasks.find(b=>b.id===s.id);
      if (before && before.status !== s.status) logTaskActivity(task, actor, `Subtask "${s.text}" status changed to "${s.status}"`);
      else if (!before) logTaskActivity(task, actor, `Subtask "${s.text}" added`);
    });
  } else {
    logTaskActivity(task, actor, 'Task created');
  }
  closeModal(); showToast(taskId?'Task updated':'Task added'); render();
}

function postQuoteUpdate(){
  const input = document.getElementById('qm-update-input');
  const text = input.value.trim(); if (!text) return;
  const currentProfile = getCurrentProfile();
  const entry = { id:uid(), author: currentProfile?.fullName || 'Unknown', text, createdAt: new Date().toISOString() };
  MODAL_QUOTE_UPDATES.push(entry);
  // Posts immediately to the underlying quote record (same pattern as Task Updates), so it survives even
  // if the rest of the modal is cancelled instead of saved.
  if (MODAL_QUOTE_ID) {
    const quote = STATE.data.quotes.find(q=>q.id===MODAL_QUOTE_ID);
    if (quote) { if (!quote.updates) quote.updates = []; quote.updates.push({...entry}); db.quotes.update(quote.id, { updates: quote.updates }); }
  }
  input.value = '';
  document.getElementById('qm-updates-list').innerHTML = renderQuoteUpdatesList();
}
async function saveQuoteModal(quoteId){
  const customer = document.getElementById('qm-customer').value.trim();
  if (!customer) { modalError('Please enter a customer name'); return; }
  const serviceTypes = SERVICE_TYPES.filter((s,i)=>document.getElementById('qm-svc-'+i).checked);
  const values = {
    customer, date: document.getElementById('qm-date').value, amount: Number(document.getElementById('qm-amount').value)||0,
    status: document.getElementById('qm-status').value, notes: document.getElementById('qm-notes').value,
    jobNumber: document.getElementById('qm-jobnumber').value.trim(), clientNumber: document.getElementById('qm-clientnumber').value.trim(),
    email: document.getElementById('qm-email').value.trim(), address: document.getElementById('qm-address').value.trim(),
    serviceTypes, winProbability: document.getElementById('qm-winprob').value, nextAction: document.getElementById('qm-nextaction').value,
    nextActionNotes: document.getElementById('qm-nextactionnotes').value, sent: document.getElementById('qm-sent').value==='yes',
    technicianQuoted: document.getElementById('qm-techquoted').value, followedBy: document.getElementById('qm-followedby').value.trim(),
    updates: MODAL_QUOTE_UPDATES.map(u=>({...u})),
  };
  if (quoteId) { db.quotes.update(quoteId, values); }
  else {
    try { await db.quotes.create(values); }
    catch (err) { return; }   // db.quotes.create() already showed an error toast; leave the modal open so the user can retry
  }
  closeModal(); showToast(quoteId?'Quote updated':'Quote added'); render();
}

async function saveEmployeeModal(empId){
  const name = document.getElementById('em-name').value.trim();
  if (!name) { modalError('Please enter a name'); return; }
  const isOwner = document.getElementById('em-owner').checked, isManager = document.getElementById('em-manager').checked, isTech = document.getElementById('em-tech').checked, isVA = document.getElementById('em-va').checked;
  const roles = [...(isOwner?['Owner']:[]), ...(isManager?['Manager']:[]), ...(isTech?['Technician']:[]), ...(isVA?['VA']:[])];
  const prev = empId ? STATE.data.employees.find(e=>e.id===empId) : null;
  const oldName = prev?.name;
  const oldRates = oldName ? STATE.data.commissionRates[oldName] : null;
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const values = {
    name, roles, status: document.getElementById('em-status').value, employmentType: document.getElementById('em-emptype').value,
    phone: document.getElementById('em-phone').value.trim(), email: document.getElementById('em-email').value.trim(),
    address: document.getElementById('em-address').value.trim(), abn: document.getElementById('em-abn').value.trim(),
    startDate: document.getElementById('em-startdate').value, endDate: document.getElementById('em-enddate').value,
    bankDetails: document.getElementById('em-bank').value.trim(), commissionNotes: document.getElementById('em-commissionnotes').value,
    contractFile: MODAL_FILES['em-contractFile'] ?? job_or_null(prev,'contractFile'),
    passportPhotoFile: MODAL_FILES['em-passportPhotoFile'] ?? job_or_null(prev,'passportPhotoFile'),
    licensePhotoFile: MODAL_FILES['em-licensePhotoFile'] ?? job_or_null(prev,'licensePhotoFile'),
    localLicenseFile: MODAL_FILES['em-localLicenseFile'] ?? job_or_null(prev,'localLicenseFile'),
  };
  let emp;
  if (prev) { emp = prev; db.employees.update(emp.id, values); }
  else {
    try { emp = await db.employees.create({ activityLog:[], ...values }); }
    catch (err) { return; }   // db.employees.create() already showed an error toast; leave the modal open so the user can retry
  }
  if (isTech) {
    const rates = { Aircon: document.getElementById('em-aircon').value===''?null:Number(document.getElementById('em-aircon').value), Chimney: document.getElementById('em-chimney').value===''?null:Number(document.getElementById('em-chimney').value), 'Pressure Washing': document.getElementById('em-pw').value===''?null:Number(document.getElementById('em-pw').value), Other: document.getElementById('em-other').value===''?null:Number(document.getElementById('em-other').value) };
    if (oldName && oldName!==name && STATE.data.commissionRates[oldName]) db.commissionRates.remove(oldName);
    db.commissionRates.set(name, rates);
    if (prev && oldRates) {
      ['Aircon','Chimney','Pressure Washing','Other'].forEach(jt => {
        const before = oldRates[jt] ?? null, after = rates[jt] ?? null;
        if (before !== after) logEmployeeActivity(emp, actor, `${jt} commission rate changed from ${before===null?'—':before+'%'} to ${after===null?'—':after+'%'}`);
      });
    }
  }
  if (!prev) logEmployeeActivity(emp, actor, 'Employee added');
  closeModal(); showToast(empId?'Employee updated':'Employee added'); render();
}

  const values = { date: document.getElementById('es-date').value, item: itemName, technician: document.getElementById('es-tech').value, paidBy: document.getElementById('es-paidby').value, cost: Number(document.getElementById('es-cost').value)||0, reimbursed: document.getElementById('es-reimb').value };

    catch (err) { return; }   // db.equipmentSpend.create() already showed an error toast; leave the modal open so the user can retry
  }
  if (oldSnapshot) {
    if (oldSnapshot.cost !== values.cost) logEquipmentActivity(item, actor, `Cost changed from ${fmtMoney(oldSnapshot.cost)} to ${fmtMoney(values.cost)}`);
    if (oldSnapshot.reimbursed !== values.reimbursed) logEquipmentActivity(item, actor, `Reimbursement status changed from "${oldSnapshot.reimbursed}" to "${values.reimbursed}"`);
    if (oldSnapshot.paidBy !== values.paidBy) logEquipmentActivity(item, actor, `Paid-by changed from "${oldSnapshot.paidBy}" to "${values.paidBy}"`);
  } else {
    logEquipmentActivity(item, actor, 'Equipment purchase logged');
  }
  closeModal(); showToast(itemId?'Purchase updated':'Purchase added'); render();
}

function togglePermission(profileId, section, value){
  const p = STATE.profiles.find(x=>x.id===profileId);
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const permissions = { ...p.permissions, [section]: value };
  db.profiles.update(profileId, { permissions });
  logSettingsActivity(actor, `${value?'Granted':'Revoked'} "${SECTION_LABEL[section]}" access for ${p.fullName}`);
  showToast('Permission updated');
}
function updateBusinessSetting(key, rawValue, label){
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const old = STATE.data.settings[key];
  const value = Number(rawValue);
  if (isNaN(value) || value===old) return;
  db.settings.update({ [key]: value });
  logSettingsActivity(actor, `${label} changed from ${old} to ${value}`);
  render();
}
function updateBusinessProfileField(key, value, label){
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  const old = STATE.data.settings[key];
  if (old === value) return;
  db.settings.update({ [key]: value });
  logSettingsActivity(actor, `${label} updated`);
}
// Owner-only (this whole page already is): each owner's fixed weekly salary — they're on a flat
// wage, not commission, so this lives in Settings rather than the per-technician commission table.
function setOwnerSalary(name, rawValue){
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  if (!STATE.data.settings.ownerSalaries) STATE.data.settings.ownerSalaries = {};
  const old = STATE.data.settings.ownerSalaries[name] || 0;
  const value = Number(rawValue)||0;
  if (old===value) return;
  const ownerSalaries = { ...STATE.data.settings.ownerSalaries, [name]: value };
  db.settings.update({ ownerSalaries });
  logSettingsActivity(actor, `${name}'s weekly salary changed from ${fmtMoney(old)} to ${fmtMoney(value)}`);
  render();
}
function updateCommissionRateFromSettings(techName, jobType, rawValue){
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  if (!STATE.data.commissionRates[techName]) STATE.data.commissionRates[techName] = { Aircon:null, Chimney:null, 'Pressure Washing':null, Other:null };
  const rates = { ...STATE.data.commissionRates[techName] };
  const before = rates[jobType] ?? null;
  const after = rawValue===''? null : Number(rawValue);
  if (before === after) return;
  rates[jobType] = after;
  db.commissionRates.set(techName, rates);
  const emp = STATE.data.employees.find(e=>e.name===techName);
  if (emp) logEmployeeActivity(emp, actor, `${jobType} commission rate changed from ${before===null?'—':before+'%'} to ${after===null?'—':after+'%'} (via Settings)`);
}
function toggleWorkingDay(empId, dow, checked){
  const emp = STATE.data.employees.find(e=>e.id===empId); if (!emp) return;
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  if (!Array.isArray(emp.workingDays)) emp.workingDays = [0,1,2,3,4,5,6];
  const workingDays = checked ? [...new Set([...emp.workingDays, dow])] : emp.workingDays.filter(d=>d!==dow);
  db.employees.update(emp.id, { workingDays });
  logSettingsActivity(actor, `${emp.name}'s working days updated`);
}

function renderNoAccess(profile){
  return `<div class="card" style="max-width:480px;margin:60px auto;padding:30px;text-align:center">
    <div style="font-size:34px;margin-bottom:10px">🔒</div>
    <h1 style="font-family:'Figtree',sans-serif;font-size:20px;font-weight:700;margin-bottom:8px">You don't have access to any section yet</h1>
    <p style="color:var(--ink-soft);font-size:14px;line-height:1.7">Hi ${esc(profile.fullName)}, Noam needs to open at least one section for you (Jobs, Finance, Tasks, Quotes, etc.) on his Settings screen. Once he does, that section will automatically appear in your sidebar.</p>
  </div>`;
}

/* ── main render loop ───────────────────────────────────────────────── */
function render(){
  const app = document.getElementById('app');
  if (AUTH.status === 'loading') { app.innerHTML = renderAuthLoading(); return; }
  if (AUTH.status === 'signedOut') { app.innerHTML = renderLogin(); return; }
  if (AUTH.status === 'needsPassword') { app.innerHTML = renderSetPassword(); return; }
  // AUTH.status === 'ready' from here — a real Supabase session exists.
  if (!STATE.dataLoaded) {
    app.innerHTML = renderAuthLoading('Loading your data…');
    if (!AUTH_DATA_LOADING) {
      AUTH_DATA_LOADING = true;
      loadFromSupabase()
        .then(() => { STATE.dataLoaded = true; AUTH_DATA_LOADING = false; setupRealtimeSubscriptions(); render(); })
        .catch(err => { AUTH_DATA_LOADING = false; AUTH.error = err.message; AUTH.status = 'signedOut'; render(); });
    }
    return;
  }
  if (STATE.noProfile) { app.innerHTML = renderAuthLoading("Your account isn't set up in the system yet — ask Ofek or Noam to finish setting up your access, then reload this page."); return; }
  const profile = getCurrentProfile();
  if (!profile) { app.innerHTML = renderAuthLoading('No profile found.'); return; }

  // route guard — mirrors src/lib/permissions.ts + the (app)/layout.tsx guard:
  // never render a section the current profile isn't permitted to view.
  if (!UI.tab || !canViewSection(profile, UI.tab)) UI.tab = firstAccessibleTab(profile);
  // board guard — a technician may only ever be looking at their OWN personal task board, regardless of
  // what UI.tasks.board was last set to (e.g. left over from another profile in this same browser tab).
  if (profile.role==='technician' && profile.technicianName) UI.tasks.board = profile.technicianName;

  const data = filterForProfile(STATE.data, profile);
  app.innerHTML = renderShell(profile, data);
  const content = document.getElementById('content');
  if (!UI.tab) { content.innerHTML = renderNoAccess(profile); return; }
  if (UI.tab==='crm') content.innerHTML = renderCrm(profile, data);
  else if (UI.tab==='crmOverview') content.innerHTML = renderCrmOverview(profile, data);
  else if (UI.tab==='overview') content.innerHTML = renderOverview(profile, data);
  else if (UI.tab==='closings') content.innerHTML = renderClosings(profile, data);
  else if (UI.tab==='jobs') content.innerHTML = renderJobs(profile, data);
  else if (UI.tab==='finance') content.innerHTML = renderFinance(profile, data);
  else if (UI.tab==='bizPerformance') content.innerHTML = renderBusinessPerformance(profile, data);
  else if (UI.tab==='outstanding') content.innerHTML = renderOutstanding(profile, data);
  else if (UI.tab==='reminders') content.innerHTML = renderReminders(profile, data);
  else if (UI.tab==='openItems') content.innerHTML = renderOpenItems(profile, data);
  else if (UI.tab==='tasks') content.innerHTML = renderTasks(profile, data);
  else if (UI.tab==='quotes') content.innerHTML = renderQuotes(profile, data);
  else if (UI.tab==='reference') content.innerHTML = renderReference(profile, data);
  else if (UI.tab==='settings') content.innerHTML = renderSettings(profile);
}

document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase()==='k') {
    e.preventDefault();
    if (STATE.currentProfileId) openSearchModal();
    return;
  }
  if (e.key==='Escape') {
    const root = document.getElementById('modal-root');
    if (root && root.innerHTML.trim()) closeModal();
  }
});

render();
</script>
