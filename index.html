<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Guys Service Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --ink: #18140f; --ink-soft: #5c534b; --ink-faint: #948a7e;
  --paper: #f2f0eb; --surface: #ffffff; --surface-2: #ece9e2; --surface-3: #ddd8cf;
  --line: #d6d1c6; --line-soft: #e7e3da;
  --primary: #c31f2b; --primary-strong: #8c1620; --primary-soft: #fbe4e2; --primary-teal: #1c1917;
  --accent: #2f5b6e; --accent-soft: #e2edf0;
  --on-primary: #fff8f6;
  --good: #237a52; --good-soft: #dcf0e4; --warn: #96690f; --warn-soft: #f5e8cc; --bad: #b23a22; --bad-soft: #f8ddd2;
  --guy: #c1652e; --dolev: #7a5ca0; --noam: #2f7d6e; --ofek: #3f7f8f;
  --shadow-sm: 0 1px 0 rgba(24,20,15,.06);
  --shadow: 0 1px 0 rgba(24,20,15,.08), 0 1px 2px rgba(24,20,15,.05);
  --shadow-lg: 0 2px 0 rgba(24,20,15,.1), 0 14px 28px rgba(24,20,15,.14);
  --radius: 6px; --radius-sm: 4px; --radius-lg: 10px;
  --focus-ring: 0 0 0 3px rgba(195,31,43,.4);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-7: 32px; --space-8: 40px;
  /* fixed dark chrome for the sidebar — stays constant across light/dark theme, matching the brand mark's own crimson-on-black */
  --sidebar-bg: #17130f; --sidebar-bg-active: #3c1015; --sidebar-bg-hover: #241d19;
  --sidebar-ink: #ece9e2; --sidebar-ink-soft: #a49b8f; --sidebar-ink-faint: #6d655b;
  --sidebar-line: #2c2621; --sidebar-accent: #e2454f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #ece9e2; --ink-soft: #b0a89c; --ink-faint: #756c60;
    --paper: #121010; --surface: #1a1716; --surface-2: #221e1c; --surface-3: #2c2724;
    --line: #363028; --line-soft: #262220;
    --primary: #e2555f; --primary-strong: #f0838a; --primary-soft: #3a1518; --primary-teal: #f3f0ee;
    --accent: #6fa2b8; --accent-soft: #1c2f37;
    --on-primary: #1c0c0d;
    --good: #5fbf8e; --good-soft: #123321; --warn: #d9a94c; --warn-soft: #2e2410; --bad: #e2755a; --bad-soft: #331c14;
    --guy: #e0834a; --dolev: #b092d6; --noam: #5fbfa8; --ofek: #74c3d4;
    --shadow-sm: 0 1px 0 rgba(0,0,0,.35);
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
    --shadow-lg: 0 2px 0 rgba(0,0,0,.45), 0 18px 36px rgba(0,0,0,.5);
    --focus-ring: 0 0 0 3px rgba(226,85,95,.5);
  }
}
::root[data-theme="dark"] {
  --ink: #ece9e2; --ink-soft: #b0a89c; --ink-faint: #756c60;
  --paper: #121010; --surface: #1a1716; --surface-2: #221e1c; --surface-3: #2c2724;
  --line: #363028; --line-soft: #262220;
  --primary: #e2555f; --primary-strong: #f0838a; --primary-soft: #3a1518; --primary-teal: #f3f0ee;
  --accent: #6fa2b8; --accent-soft: #1c2f37;
  --on-primary: #1c0c0d;
  --good: #5fbf8e; --good-soft: #123321; --warn: #d9a94c; --warn-soft: #2e2410; --bad: #e2755a; --bad-soft: #331c14;
  --guy: #e0834a; --dolev: #b092d6; --noam: #5fbfa8; --ofek: #74c3d4;
  --shadow-sm: 0 1px 0 rgba(0,0,0,.35);
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
  --shadow-lg: 0 2px 0 rgba(0,0,0,.45), 0 18px 36px rgba(0,0,0,.5);
  --focus-ring: 0 0 0 3px rgba(226,85,95,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: 'Figtree', system-ui, -apple-system, sans-serif;
  font-size: 14.5px; line-height: 1.5; min-height: 100vh; direction: ltr;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .display { font-family: 'Figtree', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.01em; }
.mono, .num { font-family: 'Figtree', sans-serif; font-variant-numeric: tabular-nums; }
button { font-family: inherit; cursor: pointer; }
a { color: var(--primary-strong); }
::selection { background: var(--primary-soft); }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-5) var(--space-5); box-shadow: var(--shadow); transition: box-shadow .15s, border-color .15s; }
.card.tight { padding: var(--space-4) var(--space-4); }
.card.flat { box-shadow: none; }
.stat-label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; font-family: 'Figtree', sans-serif; }
.stat-value { font-size: 28px; font-weight: 700; margin-top: var(--space-2); font-family: 'Figtree', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; animation: statPop .5s cubic-bezier(.26,1.35,.4,1) .08s both; }
.stat-sub { font-size: 12px; color: var(--ink-soft); margin-top: var(--space-1); }
.stat-card { position: relative; overflow: hidden; padding-inline-start: 22px; transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease; animation: statCardIn .38s cubic-bezier(.2,.85,.25,1) both; }
.stat-card::before { content:''; position:absolute; inset-inline-start:0; top:9px; bottom:9px; width:3px; border-radius: 99px; background: var(--stat-accent, var(--primary-teal)); }
.stat-card::after { content:''; position:absolute; top:-40%; inset-inline-end:-15%; width:110px; height:110px; border-radius:99px; background: var(--stat-accent, var(--primary-teal)); opacity:.05; pointer-events:none; }
.stat-card:hover { border-color: color-mix(in srgb, var(--stat-accent, var(--primary-teal)) 40%, var(--line)); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
@keyframes statCardIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
@keyframes statPop { from { opacity:0; transform: scale(.85); } to { opacity:1; transform: scale(1); } }
.grid-2 > .stat-card:nth-child(2), .grid-3 > .stat-card:nth-child(2), .grid-4 > .stat-card:nth-child(2) { animation-delay: .05s; }
.grid-2 > .stat-card:nth-child(2) .stat-value, .grid-3 > .stat-card:nth-child(2) .stat-value, .grid-4 > .stat-card:nth-child(2) .stat-value { animation-delay: .13s; }
.grid-3 > .stat-card:nth-child(3), .grid-4 > .stat-card:nth-child(3) { animation-delay: .1s; }
.grid-3 > .stat-card:nth-child(3) .stat-value, .grid-4 > .stat-card:nth-child(3) .stat-value { animation-delay: .18s; }
.grid-4 > .stat-card:nth-child(4) { animation-delay: .15s; }
.grid-4 > .stat-card:nth-child(4) .stat-value { animation-delay: .23s; }

.page-head { display:flex; align-items:center; justify-content:space-between; gap: var(--space-4); margin-bottom: var(--space-6); flex-wrap: wrap; }
.page-title { font-size: 28px; margin: 0; font-weight: 700; font-family: 'Oswald', 'Figtree', sans-serif; text-wrap: balance; letter-spacing: -0.005em; text-transform: uppercase; }
.page-sub { color: var(--ink-soft); font-size: 13px; margin-top: var(--space-1); }

.section-title { font-size: 15px; font-weight: 700; margin: var(--space-7) 0 var(--space-3); display: flex; align-items: center; gap: var(--space-2); font-family: 'Figtree', sans-serif; color: var(--ink); text-transform: uppercase; letter-spacing: .03em; }
.section-title .tag { font-size: 11px; font-family: 'Figtree', sans-serif; font-weight: 600; text-transform: none; letter-spacing: normal; color: var(--ink-soft); background: var(--surface-2); padding: 2px 9px; border-radius: 99px; }

table { width: 100%; border-collapse: collapse; font-size: 13.3px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
th { text-align: start; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); padding: 12px 13px; border-bottom: 1px solid var(--line); white-space: nowrap; font-weight: 700; background: var(--surface-2); font-family: 'Figtree', sans-serif; position: sticky; top: 0; z-index: 1; }
td { padding: 11px 13px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background .1s; }
tbody tr:hover { background: var(--surface-2); }
.table-row-avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--avatar-color, var(--primary)); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex: none; }
td.wrap, th.wrap { white-space: normal; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 11.3px; font-weight: 700; white-space: nowrap; border: none; }
.pill::before { content:''; width:6px; height:6px; border-radius:99px; background: currentColor; flex: none; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--surface-3); color: var(--ink-soft); }
.pill.neutral::before { display:none; }
.tech-tag { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 12.6px; }
.tech-dot { width: 21px; height: 21px; border-radius: 99px; flex: none; display: inline-flex; align-items:center; justify-content:center; background: color-mix(in srgb, currentColor 16%, var(--surface)); color: currentColor; font-family:'Figtree',sans-serif; font-size: 9.5px; font-weight: 700; }

select, input, textarea {
  font-family: inherit; font-size: 13px; padding: 8px 11px; border-radius: var(--radius-sm); border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); width: 100%; transition: border-color .12s, box-shadow .12s;
}
select:focus, input:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: var(--focus-ring); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 11.3px; color: var(--ink-soft); font-weight: 600; }
.field .hint { font-size: 11px; color: var(--ink-faint); }
.checkline { display:flex; align-items:center; gap:6px; font-size:12.6px; }
.checkline input[type=checkbox] { width:auto; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600; transition: background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .12s cubic-bezier(.34,1.56,.64,1); white-space: nowrap; }
.btn:hover { background: var(--surface-2); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.96); transition-duration: .07s; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-sm); }
.btn.primary:hover { background: var(--primary-strong); border-color: var(--primary-strong); box-shadow: var(--shadow); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-soft); padding: 6px 9px; }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); transform: translateY(-1px); }
.btn.danger { color: var(--bad); }
.btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-solid:hover { filter: brightness(.92); box-shadow: var(--shadow); }
.btn.small { padding: 5px 11px; font-size: 12px; }

.empty { padding: 44px 20px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
.empty .ic { font-size: 26px; margin-bottom: 9px; opacity: .7; }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 5px; font-family: 'Figtree', sans-serif; font-weight: 700; }

.modal-back { position: fixed; inset: 0; background: rgba(8,18,23,.55); backdrop-filter: blur(2px); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; z-index: 100; overflow-y: auto; animation: fadeIn .12s ease; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-6) var(--space-7); width: 100%; max-width: 680px; box-shadow: var(--shadow-lg); animation: modalIn .28s cubic-bezier(.2,.85,.25,1) both; }
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
@keyframes modalIn { from { opacity:0; transform: translateY(14px) scale(.97);} to { opacity:1; transform:none; } }
.confirm-back { position: fixed; inset: 0; background: rgba(8,18,23,.55); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 300; animation: fadeIn .15s ease; transition: opacity .15s ease; }
.confirm-back.closing { opacity: 0; }
.confirm-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 28px 24px 22px; width: 100%; max-width: 360px; text-align: center; animation: confirmIn .32s cubic-bezier(.2,.9,.2,1.15) both; transition: opacity .12s ease, transform .12s ease; }
.confirm-back.closing .confirm-card { opacity: 0; transform: scale(.94) translateY(4px); }
@keyframes confirmIn { from { opacity:0; transform: scale(.9) translateY(10px); } to { opacity:1; transform: none; } }
.confirm-ic { width: 46px; height: 46px; border-radius: 99px; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 20px; background: var(--bad-soft); color: var(--bad); animation: confirmIcIn .4s cubic-bezier(.34,1.56,.64,1) .05s both; }
.confirm-ic.info { background: var(--accent-soft); color: var(--accent); }
@keyframes confirmIcIn { from { opacity:0; transform: scale(.4); } to { opacity:1; transform: scale(1); } }
.confirm-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; font-family: 'Figtree', sans-serif; }
.confirm-msg { color: var(--ink-soft); font-size: 13px; line-height: 1.5; margin-bottom: 22px; }
.confirm-actions { display: flex; gap: 8px; }
.confirm-actions .btn { flex: 1; }
.modal h2 { margin: 0 0 4px; font-size: 18px; font-family: 'Figtree', sans-serif; }
.modal .modal-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 16px; }
.modal-section { font-size: 11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color: var(--ink-soft); margin: 18px 0 9px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-family: 'Figtree', sans-serif; }
.modal-section:first-of-type { border-top:none; padding-top:0; margin-top:6px; }

.week-chip { flex: none; min-height: 34px; padding: 7px 15px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; transition: background .1s, color .1s, border-color .1s; }
.week-chip.active { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.kv:last-child { border-bottom: none; }
.kv .v { font-family: 'Figtree', sans-serif; font-variant-numeric: tabular-nums; font-weight: 500; }
.kv.total { font-weight: 700; padding-top: 11px; margin-top: 4px; border-top: 1px solid var(--line); border-bottom: none; }
.jobtype-chip { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: var(--radius-sm); background: var(--surface-2); margin-bottom: 6px; font-size: 12.5px; }

.reminder-item { display: flex; gap: 13px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line-soft); transition: max-height .22s ease, opacity .18s ease, transform .18s ease, padding .22s ease, margin .22s ease; }
.reminder-item:last-child { border-bottom: none; }
.reminder-item.row-removing { opacity: 0; transform: translateX(10px); border-color: transparent; }
.reminder-ic { width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex: none; font-size: 14px; }

.grid-2 { display: grid; gap: var(--space-4); grid-template-columns: repeat(2, 1fr); }
.grid-3 { display: grid; gap: var(--space-4); grid-template-columns: repeat(3, 1fr); }
.grid-4 { display: grid; gap: var(--space-4); grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; } .app-grid { grid-template-columns: minmax(0, 1fr) !important; } .sidebar { flex-direction: row !important; overflow-x: auto; border-inline-end:none !important; border-bottom:1px solid var(--line); min-width: 0; } .sidebar nav { display:flex; gap:2px; } .sidebar nav > div { display:flex; align-items:center; } }
@media (max-width: 560px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }
.mobile-nav-toggle { display: none; }
/* true phone widths — collapse the sidebar into a slim top bar with a hamburger toggle instead of the
   cramped horizontal-scrolling nav strip used at tablet widths (900px rule above). */
@media (max-width: 640px) {
  .sidebar { flex-direction: column !important; overflow-x: visible !important; padding: 12px 14px !important; gap: 0 !important; min-width: 0; width: 100%; box-sizing: border-box; }
  .sidebar-topbar { display: flex; align-items: center; gap: 10px; }
  .sidebar-topbar .workspace-card { flex: 1; min-width: 0; margin-bottom: 0; }
  .mobile-nav-toggle { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: var(--radius-sm); border: 1px solid var(--sidebar-line); background: var(--sidebar-bg-hover); color: var(--sidebar-ink); font-size: 16px; flex: none; cursor: pointer; }
  .sidebar-collapsible { display: none; }
  .sidebar.mobile-nav-open .sidebar-collapsible { display: block; margin-top: 12px; }
  .sidebar nav { display: block; }
  .sidebar nav > div { display: block; }
  .app-grid > div:last-child { padding: 16px 14px 40px !important; }
}

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 11px 20px 11px 16px; border-radius: 99px; font-size: 13px; font-weight: 600; z-index: 200; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 9px; animation: toastIn .38s cubic-bezier(.2,.9,.25,1.3) both; transition: opacity .18s ease, transform .18s ease; }
.toast.leaving { opacity: 0; transform: translateX(-50%) translateY(8px) scale(.96); }
.toast::before { content:'✓'; display:flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:99px; background: var(--primary); color: var(--on-primary); font-size:11px; font-weight:800; flex:none; }
@keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(14px) scale(.94); } to { opacity:1; transform: translateX(-50%) translateY(0) scale(1); } }
.banner { background: var(--primary-soft); color: var(--primary-strong); border: 1px solid color-mix(in srgb, var(--primary) 35%, var(--primary-soft)); border-radius: var(--radius-sm); padding: 11px 15px; font-size: 12.5px; margin-bottom: 18px; line-height:1.5; }
.banner.slim { padding: 6px 13px; font-size: 11.3px; margin-bottom: 14px; }

.brand-mark { border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; background: var(--surface); box-shadow: var(--shadow-sm); }
.brand-mark img { width: 100%; height: 100%; object-fit: contain; display:block; }
.login-logo { max-width: 220px; width: 100%; height: auto; display: block; margin: 0 auto 8px; }
@keyframes login-card-in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.login-card { animation: login-card-in .5s cubic-bezier(.2,.7,.2,1) both; }

.subtask-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:13px; }
.subtask-row:last-child { border-bottom:none; }
.subtask-row label { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.subtask-row label input[type=checkbox] { width:auto; flex:none; }
.subtask-row span { overflow-wrap:anywhere; }
.file-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.file-chip { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color: var(--primary-strong); text-decoration:none; background: var(--primary-soft); padding:5px 10px; border-radius: 99px; }
.file-hint { font-size:11px; color: var(--ink-faint); }
.svc-grid { display:grid; grid-template-columns: repeat(2,1fr); gap:6px 14px; }

.cal-grid { display:grid; grid-template-columns: repeat(7,1fr); }
.cal-grid-cells { gap:1px; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:20px; }
.task-chip { position:relative; background:var(--surface-2); border-inline-start:3px solid var(--primary); border-radius:4px; padding:3px 6px; margin-bottom:4px; cursor:pointer; }

<div id="modal-root"></div>

<script>
'use strict';

/* ── calc engine (ported 1:1 from src/lib/calc.ts — math/logic untouched, only display labels are English) ─ */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function pad2(n){ return String(n).padStart(2,'0'); }
function parseLocalDate(s){ const [y,m,d]=s.slice(0,10).split('-').map(Number); return new Date(y,m-1,d); }
function fmtLocal(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayStr(now){ return fmtLocal(now||new Date()); }
function daysBetween(a,b){ return Math.round((b.getTime()-a.getTime())/86400000); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function weekOf(dateStr){
  const d = parseLocalDate(dateStr); const day = d.getDay();
  const diffToMon = day===0 ? -6 : 1-day;
  const monday = new Date(d); monday.setDate(d.getDate()+diffToMon);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const key = fmtLocal(monday);
  const label = `${monday.getDate()} ${MONTHS[monday.getMonth()]} – ${sunday.getDate()} ${MONTHS[sunday.getMonth()]}`;
  return { key, label, monday, sunday };
}
function monthOf(dateStr){
  const d = parseLocalDate(dateStr);
  const key = `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  const label = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return { key, label };
}
function currentWeekKey(now){ return weekOf(todayStr(now)).key; }
function jobGst(job){ return job.includesGST ? round2(job.amount*(STATE.data.settings.gstRatePercent/100)) : 0; }
function jobTotalCollected(job){ return round2(job.amount + jobGst(job)); }
function jobCommissionAmount(job){ return round2(job.amount * (Number(job.commissionPercent)||0) / 100); }
function commissionRateFor(rates, tech, jobType){
  const t = rates[tech]; if (!t) return null;
  const v = t[jobType]; return (v===null||v===undefined) ? null : v;
}
function technicianNames(data){ return data.employees.filter(e=>e.roles.includes('Technician')).map(e=>e.name); }
// Owners who also do jobs (Ofek, Noam) are selectable everywhere a job/equipment/quote needs
// "who did this" — technicianNames() above stays as-is for that. But they're paid a fixed weekly
// salary (Settings → Owner salaries), not commission, so they must NOT also appear in anything
// that computes or edits a per-technician COMMISSION rate/payout — salary replaces commission for
// them entirely, it doesn't sit alongside it. This is that narrower list.
function commissionEligibleTechnicianNames(data){ return data.employees.filter(e=>e.roles.includes('Technician') && !e.roles.includes('Owner')).map(e=>e.name); }
function activeEmployeeNames(data){ return data.employees.filter(e=>e.status==='Active').map(e=>e.name); }
// A task's people used to be one `assignedTo` string; new tasks store `assignees` (an array) instead.
// This reads either shape so every render site keeps working regardless of which one a task has.
function assigneeNames(t){
  if (Array.isArray(t.assignees)) return t.assignees;
  if (t.assignedTo) return [t.assignedTo];
  return [];
}
function logActivity(task, actor, text){
  if (!task.activityLog) task.activityLog = [];
  task.activityLog.push({ id: uid(), at: new Date().toISOString(), actor: actor||'Unknown', text });
}

function computeWeek(data, weekKey, technicianFilter){
  const jobs = data.jobs.filter(j => weekOf(j.date).key === weekKey);
  const equip = data.equipmentSpend.filter(e => weekOf(e.date).key === weekKey);
  const latePayments = data.jobs.filter(j => j.datePaid && j.paymentStatus==='Paid' && weekOf(j.datePaid).key===weekKey && weekOf(j.date).key!==weekKey);
  const overview = { cash:0, bankTransfer:0, creditCard:0, gstCash:0, gstOther:0, paidCount:0, unpaidCount:0, paidTotal:0, unpaidTotal:0, partsTotal:0, equipmentTotal:0, commissionOwedTotal:0, paidToTechTotal:0 };
  jobs.forEach(j => {
    const total = jobTotalCollected(j); const gst = jobGst(j);
    if (j.paymentMethod==='Cash') { overview.cash += total; overview.gstCash += gst; }
    else if (j.paymentMethod==='Bank Transfer') { overview.bankTransfer += total; overview.gstOther += gst; }
    else if (j.paymentMethod==='Credit Card') { overview.creditCard += total; overview.gstOther += gst; }
    if (j.paymentStatus==='Paid') { overview.paidCount++; overview.paidTotal += j.amount; } else { overview.unpaidCount++; overview.unpaidTotal += j.amount; }
    overview.partsTotal += Number(j.partsCost)||0;
    overview.commissionOwedTotal += jobCommissionAmount(j);
  });
  equip.forEach(e => { overview.equipmentTotal += Number(e.cost)||0; });
  const names = technicianFilter ? [technicianFilter] : commissionEligibleTechnicianNames(data);
  const perTech = {};
  names.forEach(t => {
    const tJobs = jobs.filter(j => j.technician===t);
    const tEquip = equip.filter(e => e.technician===t);
    const tLate = latePayments.filter(j => j.technician===t);
    let owed=0, paidThisWeek=0, paidCount=0, unpaidCount=0, netIncome=0;
    const jobTypeBreak = { Aircon:{count:0,total:0}, Chimney:{count:0,total:0}, 'Pressure Washing':{count:0,total:0}, Other:{count:0,total:0} };
    const distinctDays = new Set();
    tJobs.forEach(j => {
      const comm = jobCommissionAmount(j); owed += comm;
      if (j.paidToTechnician==='Paid') paidThisWeek += comm;
      if (j.paymentStatus==='Paid') paidCount++; else unpaidCount++;
      jobTypeBreak[j.jobType].count++; jobTypeBreak[j.jobType].total += j.amount;
      distinctDays.add(j.date);
      netIncome += (Number(j.amount)||0) - (Number(j.partsCost)||0);
    });
    tEquip.forEach(e => { owed += Number(e.cost)||0; if (e.reimbursed==='Reimbursed') paidThisWeek += Number(e.cost)||0; });
    let latePaymentTotal = 0;
    tLate.forEach(j => { const comm=jobCommissionAmount(j); owed += comm; if (j.paidToTechnician==='Paid') { paidThisWeek += comm; latePaymentTotal += comm; } });
    perTech[t] = {
      owed: round2(owed), paidThisWeek: round2(paidThisWeek), balanceDue: round2(owed-paidThisWeek),
      jobTypeBreak, paidCount, unpaidCount, totalJobs: tJobs.length,
      dailyAvg: distinctDays.size ? round2(netIncome/distinctDays.size) : null,
      daysWorked: distinctDays.size, latePaymentTotal: round2(latePaymentTotal), lateJobs: tLate,
    };
    overview.paidToTechTotal += perTech[t].paidThisWeek;
  });
  const remainingAfterTech = jobs.reduce((s,j)=>s+(Number(j.amount)||0),0) - overview.commissionOwedTotal - overview.partsTotal - overview.equipmentTotal;
  return { weekKey, jobs, equip, overview, perTech, remainingAfterTech };
}

function computeMonth(data, monthKey, technicianFilter){
  const jobs = data.jobs.filter(j => monthOf(j.date).key===monthKey);
  const equip = data.equipmentSpend.filter(e => monthOf(e.date).key===monthKey);
  let revenue=0, commission=0, parts=0, equipment=0, paidTotal=0, unpaidTotal=0, paidCount=0, unpaidCount=0;
  const names = technicianFilter ? [technicianFilter] : commissionEligibleTechnicianNames(data);
  const perTech = {}; names.forEach(t => perTech[t] = { jobs:0, commission:0 });
  // Additive revenue breakdown, layered on top of `revenue` above rather than replacing it — see
  // jobAttributionTags(): only jobs whose linked lead carries a known Split/Duct or Facebook/Instagram
  // tag land here, everything else still counts once toward the plain `revenue` total, unsplit.
  const airconTypeRevenue = {}; AIRCON_TYPE_TAGS.forEach(t=>airconTypeRevenue[t]=0);
  const metaPlatformRevenue = {}; META_PLATFORM_TAGS.forEach(t=>metaPlatformRevenue[t]=0);
  jobs.forEach(j => {
    revenue += Number(j.amount)||0; commission += jobCommissionAmount(j); parts += Number(j.partsCost)||0;
    if (j.paymentStatus==='Paid') { paidTotal += j.amount; paidCount++; } else { unpaidTotal += j.amount; unpaidCount++; }
    if (perTech[j.technician]) { perTech[j.technician].jobs++; perTech[j.technician].commission += jobCommissionAmount(j); }
    const attr = jobAttributionTags(j);
    if (attr.airconType) airconTypeRevenue[attr.airconType] += Number(j.amount)||0;
    if (attr.metaPlatform) metaPlatformRevenue[attr.metaPlatform] += Number(j.amount)||0;
  });
  equip.forEach(e => equipment += Number(e.cost)||0);
  Object.keys(airconTypeRevenue).forEach(t=>airconTypeRevenue[t]=round2(airconTypeRevenue[t]));
  Object.keys(metaPlatformRevenue).forEach(t=>metaPlatformRevenue[t]=round2(metaPlatformRevenue[t]));
  return { monthKey, jobs, revenue: round2(revenue), commission: round2(commission), parts: round2(parts), equipment: round2(equipment), paidTotal: round2(paidTotal), unpaidTotal: round2(unpaidTotal), paidCount, unpaidCount, perTech, net: round2(revenue-commission-parts-equipment), airconTypeRevenue, metaPlatformRevenue };
}

function allWeekKeys(data, now){
  const keys = new Set();
  data.jobs.forEach(j => keys.add(weekOf(j.date).key));
  data.equipmentSpend.forEach(e => keys.add(weekOf(e.date).key));
  keys.add(currentWeekKey(now));
  return Array.from(keys).sort().reverse();
}
function allMonthKeys(data, now){
  const keys = new Set();
  data.jobs.forEach(j => keys.add(monthOf(j.date).key));
  keys.add(monthOf(todayStr(now)).key);
  return Array.from(keys).sort().reverse();
}

function computeReminders(data, now){
  const items = []; const today = parseLocalDate(todayStr(now));
  const unpaidReminderDays = data.settings?.unpaidReminderDays ?? 7;
  const quoteStaleDays = data.settings?.quoteStaleDays ?? 5;
  const dismissed = new Set(data.dismissedReminders||[]);
  data.jobs.forEach(j => {
    if (j.paymentStatus !== 'Paid') {
      const age = daysBetween(parseLocalDate(j.date), today);
      const key = `unpaid:${j.id}`;
      if (age >= unpaidReminderDays && !dismissed.has(key)) items.push({ key, readKey:key, type:'unpaid', severity: age>=14?'bad':'warn', date:j.date, title:`${j.customerName} — invoice #${j.invoiceNumber||'—'} still unpaid`, meta:`${j.technician} · ${age} days overdue (past the ${unpaidReminderDays}-day term)` });
    } else if (j.paidToTechnician !== 'Paid' && j.paidToTechnician !== 'Stuck') {
      const comm = jobCommissionAmount(j);
      const key = `commission:${j.id}`;
      if (comm > 0 && !dismissed.has(key)) items.push({ key, readKey:key, type:'commission', severity:'warn', date:j.date, title:`Commission owed to ${j.technician}`, meta:`${j.customerName} · invoice #${j.invoiceNumber||'—'}` });
    }
    const refundKey = `refund:${j.id}`;
    if (j.partsCost > 0 && j.partsRefundStatus === 'Pending Refund' && !dismissed.has(refundKey)) items.push({ key:refundKey, readKey:refundKey, type:'refund', severity:'warn', date:j.date, title:`Parts refund pending for ${j.partsPaidBy||j.technician}`, meta:j.customerName });
  });
  data.equipmentSpend.forEach(e => { const key = `equipment:${e.id}`; if (e.reimbursed==='Pending' && !dismissed.has(key)) items.push({ key, readKey:key, type:'equipment', severity:'warn', date:e.date, title:`Equipment reimbursement pending for ${e.technician}`, meta:e.item }); });
  // Repeat-service reminder: fires exactly once, 358 days after a job (365 minus a 7-day lead time),
  // so Ron can call ahead of the 1-year mark to re-offer the service. Computed fresh every render off
  // today's date rather than stored/expired — the day after, the same job's age is 359 and it simply
  // stops matching, giving the "shows for 24h then disappears on its own" behaviour Ofek asked for.
  data.jobs.forEach(j => {
    const jobAge = daysBetween(parseLocalDate(j.date), today);
    const key = `repeat-service:${j.id}`;
    if (jobAge === 358 && !dismissed.has(key)) {
      items.push({ key, readKey:key, type:'repeat-service', severity:'warn', date:todayStr(now), title:`${j.customerName} — re-offer ${j.jobType} service`, meta:`1 year ago this week: ${j.jobType} job done on ${fmtDateShort(j.date)} · call to check if it's time again` });
    }
  });
  const activeQuoteStates = ['In Discussion','Waiting for Reply'];
  data.quotes.forEach(q => {
    if (activeQuoteStates.includes(q.status)) {
      const age = daysBetween(parseLocalDate(q.date), today);
      const key = `quote:${q.id}`;
      if (age >= quoteStaleDays && !dismissed.has(key)) items.push({ key, readKey:key, type:'quote', severity: age>=10?'bad':'warn', date:q.date, title:`Quote for ${q.customer} still open`, meta:`${q.status} · ${age} days` });
    }
  });
  // Manually-created reminders (from the CRM follow-up flow) sit alongside the derived ones, so Ron sees
  // one reminder list rather than two competing ones.
  (data.manualReminders||[]).forEach(r => {
    if (r.done) return;
    const age = daysBetween(parseLocalDate(r.date), today);
    items.push({ id:r.id, contactId:r.contactId, manual:true, readKey:`manual:${r.id}`, type:'followup', severity: age>=0?'bad':'warn', date:r.date, title:r.title, meta:`${r.contactName||''}${age>0?` · ${age} days overdue`:(age===0?' · due today':` · due ${fmtDateShort(r.date)}`)}${r.note?` · "${r.note}"`:''}` });
  });
  // A lead's own "Next follow-up" date (set directly on the Details tab or the CRM Inbox panel, not
  // through the "Create follow-up" form) needs to show up here too — otherwise picking a date there
  // silently goes nowhere, which is exactly the kind of dead-end Ofek asked to be caught. Skipped when
  // an explicit reminder or task already tracks that same lead + date, so the two paths never double up.
  (data.contacts||[]).forEach(c => {
    if (!c.nextFollowUp || c.status==='Booked' || c.status==='Not Relevant') return;
    const hasReminder = (data.manualReminders||[]).some(r => r.contactId===c.id && !r.done && r.date===c.nextFollowUp);
    const hasTask = (data.tasks||[]).some(t => t.client===c.fullName && t.due===c.nextFollowUp && t.status!=='Done');
    if (hasReminder || hasTask) return;
    const age = daysBetween(parseLocalDate(c.nextFollowUp), today);
    items.push({ contactId:c.id, type:'followup', readKey:`followup:${c.id}`, severity: age>=0?'bad':'warn', date:c.nextFollowUp, title:`Follow up with ${c.fullName}`, meta:`${c.division}${age>0?` · ${age} days overdue`:(age===0?' · due today':` · due ${fmtDateShort(c.nextFollowUp)}`)}` });
  });
  const read = new Set(data.readReminders||[]);
  items.forEach(it => { it.isRead = read.has(it.readKey); });
  items.sort((a,b) => Number(b.severity==='bad') - Number(a.severity==='bad') || a.date.localeCompare(b.date));
  return items;
}

const ALL_SECTIONS = ['crm','crmOverview','overview','jobs','finance','outstanding','reminders','openItems','tasks','quotes','reference','closings','settings'];
const SECTION_ORDER = ['crm','crmOverview','overview','closings','jobs','finance','bizPerformance','outstanding','reminders','openItems','tasks','quotes','reference'];
const SECTION_LABEL = { crm:'CRM', crmOverview:'Leads & Marketing', overview:'Overview', jobs:'Jobs & Commissions', finance:'Financial Summary', bizPerformance:'Business Performance', outstanding:'Outstanding', reminders:'Reminders', openItems:'Open Tasks', tasks:'Tasks', quotes:'Quotes', reference:'Equipment & Suppliers', closings:'Closings', settings:'Permissions & Settings' };
const ROLE_LABEL = { owner:'Owner', manager:'Manager', technician:'Technician', va:'Virtual Assistant' };
function roleLabel(role){ return ROLE_LABEL[role] || role; }
function defaultPermissionsFor(role){
  const none = { crm:false, crmOverview:false, overview:false, jobs:false, finance:false, outstanding:false, reminders:false, openItems:false, tasks:false, quotes:false, reference:false, closings:false, settings:false };
  if (role==='owner') return { ...none, crm:true, crmOverview:true, overview:true, jobs:true, finance:true, outstanding:true, reminders:true, openItems:true, tasks:true, quotes:true, reference:true, closings:true, settings:true };
  // Manager: everything an owner sees except Settings (permissions/system administration stays owner-only).
  if (role==='manager') return { ...none, crm:true, crmOverview:true, overview:true, jobs:true, finance:true, outstanding:true, reminders:true, openItems:true, tasks:true, quotes:true, reference:true, closings:true, settings:false };
  // Technician: Closings stays OFF by default — posting closings is office-staff/owner work, not something
  // a technician gets automatically (owner can still grant it manually in Settings). CRM is off too:
  // leads/sales are not a technician's job.
  if (role==='technician') return { ...none, overview:true, jobs:true, finance:true, reminders:true, tasks:true };
  // VA (Ron): Closings AND CRM (the operational board) are ON by default — Ron is the salesperson who works
  // leads all day, so the CRM board is his primary screen. Leads & Marketing (crmOverview) stays OFF —
  // that's reporting/analytics for the owner, not something Ron needs to run his board. Everything else
  // stays off until the owner grants it in Settings.
  if (role==='va') return { ...none, crm:true, closings:true, tasks:true, reminders:true };
  return none;
}
function canViewSection(profile, section){
  if (section==='settings') return profile.role==='owner';
  if (profile.role==='owner' || profile.role==='manager') return true;
  return !!profile.permissions[section];
}
function firstAccessibleTab(profile){ return SECTION_ORDER.find(s => canViewSection(profile,s)) || null; }

/* ── db: the write layer (Stage 3, part 2) ───────────────────────────────
   First slice: CRM/contacts + the shared activity_log + the tag catalog +
   dismissed-reminders tables — the rest (jobs, tasks, quotes, closings,
   employees, reference data) are still in-memory-only and come next.
   Every method does an OPTIMISTIC local patch to STATE.data first (so the
   UI feels exactly as instant as it always has), then fires the real
   Supabase write in the background; a failed write shows a toast rather
   than silently losing the change, but does NOT roll back the optimistic
   UI update — simplest correct behavior for a single-user-at-a-time save,
   revisited if this turns out to matter once everyone's really on it. */
function contactPatchToRow(patch){
  const map = {
    fullName:'full_name', phone:'phone', email:'email', postcode:'postcode', division:'division',
    source:'source', status:'status', createdAt:'created_at', nextFollowUp:'next_follow_up',
    followupNote:'followup_note', estimatedValue:'estimated_value', salesValue:'sales_value',
    jobDescription:'job_description', linkedJobId:'linked_job_id', starred:'starred',
    lastReadAt:'last_read_at', tags:'tags', messages:'messages',
  };
  // date/timestamptz/uuid columns reject '' outright ("invalid input syntax for type date")
  // where the in-memory shape has always used '' to mean "unset" — null is the real "unset".
  const nullIfEmpty = new Set(['created_at','next_follow_up','last_read_at','linked_job_id']);
  const row = {};
  for (const k in patch) {
    if (!map[k]) continue;
    const col = map[k];
    row[col] = (nullIfEmpty.has(col) && patch[k]==='') ? null : patch[k];
  }
  return row;
}
function jobPatchToRow(patch){
  const map = {
    customerName:'customer_name', invoiceNumber:'invoice_number', date:'date', technician:'technician',
    jobType:'job_type', commissionPercent:'commission_percent', amount:'amount', includesGST:'includes_gst',
    paymentStatus:'payment_status', paymentMethod:'payment_method', partsCost:'parts_cost',
    partsPaidBy:'parts_paid_by', partsRefundStatus:'parts_refund_status', notes:'notes',
    datePaid:'date_paid', paidToTechnician:'paid_to_technician', enteredBy:'entered_by',
    cashConfirmed:'cash_confirmed', invoiceFile:'invoice_file', transferReceiptFile:'transfer_receipt_file',
    equipmentRentalFile:'equipment_rental_file', reviewTaken:'review_taken',
  };
  const nullIfEmpty = new Set(['date_paid']);
  const row = {};
  for (const k in patch) {
    if (!map[k]) continue;
    const col = map[k];
    let v = patch[k];
    if (col==='date' && !v) v = todayStr();   // jobs.date is NOT NULL — the form should always fill it, but never send '' if it somehow doesn't
    if (nullIfEmpty.has(col) && v==='') v = null;
    row[col] = v;

  return row;
}

function filterForProfile(data, profile){
  if (profile.role==='owner' || profile.role==='manager') return data;
  const canSeeJobs = profile.permissions.jobs || profile.permissions.finance;
  // equipmentSpend also feeds the Equipment & Suppliers quick-entry feed on the Closings page (item 7),
  // so it needs to be visible under the `closings` permission too, not just jobs/finance.
  const canSeeEquipmentSpend = canSeeJobs || profile.permissions.closings;
  const jobVisible = (name) => { if (!canSeeJobs) return false; if (profile.role==='technician') return name===profile.technicianName; return true; };
  const equipVisible = (name) => { if (!canSeeEquipmentSpend) return false; if (profile.role==='technician') return name===profile.technicianName; return true; };
  return {
    ...data,
    jobs: data.jobs.filter(j => jobVisible(j.technician)),
    equipmentSpend: data.equipmentSpend.filter(e => equipVisible(e.technician)),
    // Both the "Ron's Tasks" and "My Tasks" boards are gated by the same `tasks` permission flag —
    // which board is showing, and whether it's filtered to just this person, is a rendering concern
    // (see UI.tasks.board / UI.tasks.filterMode), not a data-visibility one.
    tasks: profile.permissions.tasks ? data.tasks : [],
    contacts: (profile.permissions.crm || profile.permissions.crmOverview) ? data.contacts : [],
    quotes: profile.permissions.quotes ? data.quotes : [],
    equipmentCatalog: profile.permissions.reference ? data.equipmentCatalog : [],
    suppliers: profile.permissions.reference ? data.suppliers : [],
    closings: profile.permissions.closings ? data.closings : [],
  };
}

function handleContactRealtimeChange(payload){
  if (!STATE.data) return; // not loaded yet, or already signed out
  if (payload.eventType === 'DELETE') {
    STATE.data.contacts = STATE.data.contacts.filter(c => c.id !== payload.old.id);
    render();
    return;
  }
  const idx = STATE.data.contacts.findIndex(c => c.id === payload.new.id);
  if (idx === -1) {
    // Brand-new lead — it has no activity_log rows yet in the overwhelming majority of
    // cases (nothing has happened to it), so an empty log is the correct starting state.
    STATE.data.contacts.push({ ...mapContactRow(payload.new), activityLog: [] });
  } else {
    // Preserve the existing activityLog — it isn't part of the contacts row itself
    // (comes from the separate activity_log table, joined only at initial load).
    STATE.data.contacts[idx] = { ...mapContactRow(payload.new), activityLog: STATE.data.contacts[idx].activityLog };
  }
  render();
}

    .subscribe();

const TECH_COLORS = { Noam:'var(--noam)', Guy:'var(--guy)', Dolev:'var(--dolev)', Ofek:'var(--ofek)' };
function techColor(name){
  if (TECH_COLORS[name]) return TECH_COLORS[name];
  let h=0; for (let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return `hsl(${h%360},45%,45%)`;
}
function techTag(name){ return `<span class="tech-tag"><span class="tech-dot" style="color:${techColor(name)}">${esc((name||'?').slice(0,1).toUpperCase())}</span>${esc(name)}</span>`; }
function statusSelect(kind, id, value, options, colorOf, labelOf, disabled){
  if (disabled) return pill(colorOf(value), labelOf(value));
  const full = options.includes(value) ? options : [value, ...options];
  const opts = full.map(o => `<option value="${esc(o)}" ${o===value?'selected':''}>${esc(labelOf(o))}</option>`).join('');
  return `<select style="min-width:130px" onchange="onStatusChange('${kind}','${id}',this.value)">${opts}</select>`;
}
/* ── date cell: click opens a small calendar popup, double-click swaps to a typeable date input —
   same "always has a manual override" principle as statusSelect/jobEditableCell, applied to dates. ── */
let OPEN_DATE_PICKER = null;
function closeDatePicker(){
  const el = document.getElementById('date-picker-popup');
  if (el) el.remove();
  document.removeEventListener('click', datePickerOutsideClick, true);
  OPEN_DATE_PICKER = null;
}
function datePickerOutsideClick(e){
  const popup = document.getElementById('date-picker-popup');
  if (popup && !popup.contains(e.target)) closeDatePicker();
}
function renderDatePickerPopup(anchorEl, year, month, currentValue, onSelect){
  const existing = document.getElementById('date-picker-popup'); if (existing) existing.remove();
  const rect = anchorEl.getBoundingClientRect();
  const first = new Date(year, month, 1);
  const startDow = (first.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-AU', {month:'long', year:'numeric'});
  let cells = '';
  for (let i=0;i<startDow;i++) cells += `<div></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const dateStr = fmtLocal(new Date(year, month, d));
    cells += `<div class="date-picker-day ${dateStr===currentValue?'sel':''} ${dateStr===todayStr()?'today':''}" onclick="selectDatePickerDay('${dateStr}')">${d}</div>`;
  }
  const popup = document.createElement('div');
  popup.id = 'date-picker-popup';
  popup.className = 'date-picker-popup';
  popup.style.top = (rect.bottom+window.scrollY+4)+'px';
  popup.style.left = (rect.left+window.scrollX)+'px';
  popup.innerHTML = `
    <div class="date-picker-head">
      <button type="button" onclick="shiftDatePickerMonth(-1)">‹</button>
      <span>${monthLabel}</span>
      <button type="button" onclick="shiftDatePickerMonth(1)">›</button>
    </div>
    <div class="date-picker-grid">${['M','T','W','T','F','S','S'].map(d=>`<div class="date-picker-dow">${d}</div>`).join('')}${cells}</div>
    <div class="date-picker-foot"><button type="button" class="btn ghost small" onclick="selectDatePickerDay('')">Clear</button></div>`;
  document.body.appendChild(popup);
  OPEN_DATE_PICKER = { anchorEl, year, month, currentValue, onSelect };
  setTimeout(()=>document.addEventListener('click', datePickerOutsideClick, true), 0);
}
function shiftDatePickerMonth(delta){
  if (!OPEN_DATE_PICKER) return;
  let { year, month } = OPEN_DATE_PICKER;
  month += delta;
  if (month<0){ month=11; year--; } if (month>11){ month=0; year++; }
  renderDatePickerPopup(OPEN_DATE_PICKER.anchorEl, year, month, OPEN_DATE_PICKER.currentValue, OPEN_DATE_PICKER.onSelect);
}
function selectDatePickerDay(dateStr){
  const cb = OPEN_DATE_PICKER && OPEN_DATE_PICKER.onSelect;
  closeDatePicker();
  if (cb) cb(dateStr);
}
function openDatePickerCell(cellId, onSelect){
  const el = document.getElementById(cellId); if (!el) return;
  const currentValue = el.dataset.value || '';
  const base = currentValue ? parseLocalDate(currentValue) : new Date();
  renderDatePickerPopup(el, base.getFullYear(), base.getMonth(), currentValue, (newVal) => {
    onSelect(newVal);
    el.textContent = newVal ? fmtDateShort(newVal) : 'Pick a date…';
    el.classList.toggle('empty', !newVal);
    el.dataset.value = newVal;
  });
}
function startDateCellEdit(cellId, onSelect){
  const el = document.getElementById(cellId); if (!el || el.querySelector('input')) return;
  const currentValue = el.dataset.value || '';
  closeDatePicker();
  const input = document.createElement('input');
  input.type = 'date'; input.value = currentValue || ''; input.className = 'cell-edit-input';
  input.onblur = () => { const v = input.value; onSelect(v); el.textContent = v?fmtDateShort(v):'Pick a date…'; el.classList.toggle('empty', !v); el.dataset.value = v; };
  input.onkeydown = (e) => { if (e.key==='Enter'){ e.preventDefault(); input.blur(); } if (e.key==='Escape'){ e.preventDefault(); el.textContent = currentValue?fmtDateShort(currentValue):'Pick a date…'; } };
  el.textContent = ''; el.appendChild(input); input.focus();
}
function renderDateCell(cellId, value, onSelectJs){
  const label = value ? fmtDateShort(value) : 'Pick a date…';
  return `<span class="date-cell${value?'':' empty'}" id="${cellId}" data-value="${esc(value||'')}" tabindex="0"
    onclick="if(event.target.tagName!=='INPUT') openDatePickerCell('${cellId}', function(v){ ${onSelectJs} })"
    ondblclick="event.stopPropagation(); startDateCellEdit('${cellId}', function(v){ ${onSelectJs} })"
  >${label}</span>`;
}
// Drop-in replacement for a plain `<input type="date" id="...">` that other code (e.g. saveLeadModal,
// createFollowup) already reads via document.getElementById(id).value — the hidden input keeps that
// contract working while the visible date-cell handles the click-for-calendar / dblclick-to-type UX.
function dateCellField(hiddenInputId, value, extraOnSelectJs){
  const onSelectJs = `document.getElementById('${hiddenInputId}').value = v;${extraOnSelectJs?(' '+extraOnSelectJs):''}`;
  return `${renderDateCell(hiddenInputId+'-cell', value, onSelectJs)}<input type="hidden" id="${hiddenInputId}" value="${value||''}">`;
}

// Custom confirm dialog, replacing native confirm(). Native confirm() has a real, silent failure mode in
// this app: any browser lets a user check "Prevent this page from creating additional dialogs" after seeing
// a couple of them, which then makes EVERY future confirm() call return false with zero visible feedback —
// so a "Delete" button that used to work can look completely broken with no error anywhere. This dialog is
// just DOM/CSS, so it can't be silenced that way, and it gives a real animated, on-brand confirmation moment.
let CONFIRM_CALLBACK = null;
function confirmAction(message, onConfirm, opts){
  opts = opts || {};
  CONFIRM_CALLBACK = onConfirm;
  const danger = opts.danger !== false;
  const title = opts.title || (danger ? 'Delete this?' : 'Are you sure?');
  const confirmLabel = opts.confirmLabel || (danger ? 'Delete' : 'Confirm');
  document.getElementById('modal-root').insertAdjacentHTML('beforeend', `
    <div class="confirm-back" onclick="if(event.target===this) closeConfirmModal()">
      <div class="confirm-card">
        <div class="confirm-ic${danger?'':' info'}">${danger?'🗑':'?'}</div>
        <div class="confirm-title">${esc(title)}</div>
        <div class="confirm-msg">${esc(message)}</div>
        <div class="confirm-actions">
          <button type="button" class="btn" onclick="closeConfirmModal()">Cancel</button>
          <button type="button" class="btn ${danger?'danger-solid':'primary'}" onclick="runConfirmedAction()">${esc(confirmLabel)}</button>
        </div>
      </div>
    </div>`);
}
function runConfirmedAction(){
  const cb = CONFIRM_CALLBACK;
  closeConfirmModal();
  if (cb) cb();
}
function closeConfirmModal(){
  const el = document.querySelector('.confirm-back');
  CONFIRM_CALLBACK = null;
  if (!el) return;
  el.classList.add('closing');
  setTimeout(()=>{ if (el.isConnected) el.remove(); }, 150);
}
// Collapses a list row out (fade + shrink) before the state mutation actually removes it, instead of the
// row just instantly vanishing on the next render() — makes a delete feel like a real, felt action.
function animateRowRemove(el, then){
  if (!el) { then(); return; }
  const h = el.getBoundingClientRect().height;
  el.style.maxHeight = h + 'px';
  el.style.overflow = 'hidden';
  void el.offsetHeight;
  requestAnimationFrame(()=>{
    el.classList.add('row-removing');
    el.style.maxHeight = '0px';
    el.style.paddingTop = '0px'; el.style.paddingBottom = '0px';
    el.style.marginTop = '0px'; el.style.marginBottom = '0px';
  });
  setTimeout(then, 230);
}

/* ── simulated file uploads ──────────────────────────────────────────────
   No backend exists in this preview, so "uploading" a file just reads it
   into memory with FileReader as a data: URI and keeps it on MODAL_FILES
   until Save copies it onto the record. Nothing is written to disk or a
   server, and it is lost on page refresh — that's expected for a preview. */
function fileField(label, fieldId, currentValue){
  MODAL_FILES[fieldId] = currentValue || null;
  return `<div class="field file-field">
    <label>${esc(label)}</label>
    <div class="file-row" id="${fieldId}-row">${fileRowInner(fieldId, currentValue)}</div>
    <input type="file" id="${fieldId}-input" style="display:none" onchange="onFilePicked('${fieldId}', this)">
  </div>`;
}
function fileRowInner(fieldId, value){
  if (value) {
    return `<a href="${value}" target="_blank" rel="noopener" class="file-chip">📄 View file</a><button type="button" class="btn ghost small" onclick="clearFileField('${fieldId}')">Remove</button>`;
  }
  return `<button type="button" class="btn small" onclick="document.getElementById('${fieldId}-input').click()">Choose file…</button><span class="file-hint">Preview only — not saved permanently</span>`;
}
function onFilePicked(fieldId, inputEl){
  const file = inputEl.files && inputEl.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    MODAL_FILES[fieldId] = reader.result;
    const row = document.getElementById(fieldId+'-row'); if (row) row.innerHTML = fileRowInner(fieldId, reader.result);
  };
  reader.readAsDataURL(file);
}
function clearFileField(fieldId){
  MODAL_FILES[fieldId] = null;
  const row = document.getElementById(fieldId+'-row'); if (row) row.innerHTML = fileRowInner(fieldId, null);
}

/* ── CRUD actions (ported from mock-backend.ts, operating on STATE.data) ─ */
function onStatusChange(kind, id, value){
  const actor = getCurrentProfile()?.fullName || 'Unknown';
  if (kind==='jobStatus') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.paymentStatus;
    j.paymentStatus = value;
    if (value==='Paid' && !j.datePaid) j.datePaid = todayStr();
    if (value!=='Paid') j.datePaid = '';
    db.jobs.update(j.id, { paymentStatus: j.paymentStatus, datePaid: j.datePaid });
    if (old!==value) logJobActivity(j, actor, `Payment status changed from "${old}" to "${value}"`);
  } else if (kind==='jobPaymentMethod') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.paymentMethod;
    j.paymentMethod = value;
    // Cash jobs are GST-exempt ~99% of the time (Ofek's rule) — default the GST toggle off the moment a
    // job switches to Cash, same as the Jobs/Closings forms. Only fires on an actual switch INTO Cash, so
    // it never silently rewrites a job that was already Cash with GST intentionally left on.
    const patch = { paymentMethod: j.paymentMethod };
    if (value==='Cash' && old!=='Cash' && j.includesGST) { j.includesGST = false; patch.includesGST = false; }
    db.jobs.update(j.id, patch);
    if ((old||'')!==(value||'')) logJobActivity(j, actor, `Payment method changed from "${old||'—'}" to "${value||'—'}"${patch.includesGST===false?' · GST defaulted off for Cash':''}`);
  } else if (kind==='jobPaidTech') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.paidToTechnician;
    j.paidToTechnician = value;
    db.jobs.update(j.id, { paidToTechnician: j.paidToTechnician });
    if (old!==value) logJobActivity(j, actor, `Paid-to-technician changed from "${old}" to "${value}"`);
  } else if (kind==='jobGst') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.includesGST;
    j.includesGST = value==='Yes';
    db.jobs.update(j.id, { includesGST: j.includesGST });
    if (old!==j.includesGST) logJobActivity(j, actor, `GST toggle changed from ${old?'On':'Off'} to ${j.includesGST?'On':'Off'}`);
  } else if (kind==='jobReview') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.reviewTaken;
    j.reviewTaken = value==='Yes';
    db.jobs.update(j.id, { reviewTaken: j.reviewTaken });
    if (old!==j.reviewTaken) logJobActivity(j, actor, `Review ${j.reviewTaken?'marked as taken':'unmarked'}`);
  } else if (kind==='jobType') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.jobType;
    j.jobType = value;
    if (old!==value) logJobActivity(j, actor, `Job type changed from "${old}" to "${value}"`);
    const rate = commissionRateFor(STATE.data.commissionRates, j.technician, value);
    if (rate!==null && rate!==j.commissionPercent) { const oldPct = j.commissionPercent; j.commissionPercent = rate; logJobActivity(j, actor, `Commission % auto-updated from ${oldPct}% to ${rate}% for ${j.technician} · ${value}`); }
    db.jobs.update(j.id, { jobType: j.jobType, commissionPercent: j.commissionPercent });
  } else if (kind==='jobTechnician') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.technician;
    j.technician = value;
    const allowed = jobTypesForTech(value);
    if (!allowed.includes(j.jobType)) { const oldType = j.jobType; j.jobType = allowed[0]; logJobActivity(j, actor, `Job type auto-changed from "${oldType}" to "${j.jobType}" — "${oldType}" isn't done by ${value}`); }
    if (old!==value) logJobActivity(j, actor, `Technician changed from "${old}" to "${value}"`);
    const rate = commissionRateFor(STATE.data.commissionRates, value, j.jobType);
    if (rate!==null && rate!==j.commissionPercent) { const oldPct = j.commissionPercent; j.commissionPercent = rate; logJobActivity(j, actor, `Commission % auto-updated from ${oldPct}% to ${rate}% for ${value} · ${j.jobType}`); }
    db.jobs.update(j.id, { technician: j.technician, jobType: j.jobType, commissionPercent: j.commissionPercent });
  } else if (kind==='jobPartsPaidBy') {
    const j = STATE.data.jobs.find(x=>x.id===id);
    const old = j.partsPaidBy;
    j.partsPaidBy = value;
    db.jobs.update(j.id, { partsPaidBy: j.partsPaidBy });
    if ((old||'')!==(value||'')) logJobActivity(j, actor, `Parts paid-by changed from "${old||'—'}" to "${value||'—'}"`);
  } else if (kind==='leadStage') {
    const c = STATE.data.contacts.find(x=>x.id===id);
    const old = c.status;
    c.status = value;
    if (value==='Booked' || value==='Not Relevant') c.nextFollowUp = '';
    db.contacts.update(c.id, { status: c.status, nextFollowUp: c.nextFollowUp });
    if (old!==value) logContactActivity(c, actor, `Stage changed from "${old}" to "${value}"`);
  } else if (kind==='leadDivision') {
    const c = STATE.data.contacts.find(x=>x.id===id);
    const old = c.division;
    c.division = value;
    db.contacts.update(c.id, { division: c.division });
    if (old!==value) logContactActivity(c, actor, `Division changed from "${old}" to "${value}"`);
  } else if (kind==='leadSource') {
    const c = STATE.data.contacts.find(x=>x.id===id);
    const old = c.source;
    c.source = value;
    db.contacts.update(c.id, { source: c.source });
    if (old!==value) logContactActivity(c, actor, `Source changed from "${old}" to "${value}"`);
  } else if (kind==='empStatus') {
    const emp = STATE.data.employees.find(x=>x.id===id);
    const old = emp.status;
    emp.status = value;
    db.employees.update(emp.id, { status: emp.status });
    if (old!==value) logEmployeeActivity(emp, actor, `Status changed from "${old}" to "${value}"`);
  } else if (kind==='equipPaidBy') {
    const e = STATE.data.equipmentSpend.find(x=>x.id===id);
    const old = e.paidBy;
    e.paidBy = value;
    db.equipmentSpend.update(e.id, { paidBy: e.paidBy });
    if (old!==value) logEquipmentActivity(e, actor, `Paid-by changed from "${old}" to "${value}"`);
  } else if (kind==='taskPriority') {
    const t = STATE.data.tasks.find(x=>x.id===id);
    const old = t.priority;
    t.priority = value;
    db.tasks.update(t.id, { priority: t.priority });
    if (old!==value) logTaskActivity(t, actor, `Priority changed from "${old||'—'}" to "${value||'—'}"`);
  } else if (kind==='equipReimbursed') {
    const e = STATE.data.equipmentSpend.find(x=>x.id===id);
    const old = e.reimbursed;
    e.reimbursed = value;
    db.equipmentSpend.update(e.id, { reimbursed: e.reimbursed });
    if (old!==value) logEquipmentActivity(e, actor, `Reimbursement status changed from "${old}" to "${value}"`);
  } else if (kind==='taskStatus') {
    const t = STATE.data.tasks.find(x=>x.id===id);
    t.status = value;
    db.tasks.update(t.id, { status: value });
  } else if (kind==='quoteStatus') {
    const q = STATE.data.quotes.find(x=>x.id===id);
    q.status = value;
    db.quotes.update(q.id, { status: value });
  }
  render();
}

function renderLogin(){
  const err = AUTH.error ? `<div class="banner" style="margin-top:14px;border-color:var(--bad);background:var(--bad-soft);color:var(--bad)">${esc(AUTH.error)}</div>` : '';
  return loginCardShell(`
    ${err}
    <p style="font-size:12.5px;color:var(--ink-soft);margin:14px 0 10px">Sign in with your work email:</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="field"><label>Email</label><input id="auth-email" type="email" autocomplete="username" placeholder="you@company.com"></div>
      <div class="field"><label>Password</label><input id="auth-password" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter'){doSignIn()}"></div>
      <button class="btn primary" style="width:100%" onclick="doSignIn()">Sign in</button>
      <button class="btn ghost small" style="align-self:center" onclick="doForgotPassword()">Forgot your password?</button>
    </div>
  `);
}
async function doSignIn(){
  AUTH.error = null;
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!email || !password) { AUTH.error = 'Enter your email and password.'; render(); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { AUTH.error = error.message; render(); }
  // on success, onAuthStateChange fires SIGNED_IN and calls render() itself
}
async function doForgotPassword(){
  const email = (document.getElementById('auth-email')?.value || '').trim();
  if (!email) { AUTH.error = 'Enter your email above first, then click "Forgot your password?" again.'; render(); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  AUTH.error = error ? error.message : null;
  showToast(error ? 'Could not send reset email' : 'Password reset email sent — check your inbox');
  render();
}
function renderSetPassword(){
  const err = AUTH.error ? `<div class="banner" style="margin-top:14px;border-color:var(--bad);background:var(--bad-soft);color:var(--bad)">${esc(AUTH.error)}</div>` : '';
  return loginCardShell(`
    <p style="font-size:12.5px;color:var(--ink-soft);margin:14px 0 10px">Welcome — set a password for your account to finish signing in:</p>
    ${err}
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="field"><label>New password</label><input id="auth-newpass" type="password" autocomplete="new-password"></div>
      <div class="field"><label>Confirm password</label><input id="auth-newpass2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter'){doSetPassword()}"></div>
      <button class="btn primary" style="width:100%" onclick="doSetPassword()">Set password &amp; continue</button>
    </div>
  `);
}
async function doSetPassword(){
  AUTH.error = null;
  const p1 = document.getElementById('auth-newpass').value;
  const p2 = document.getElementById('auth-newpass2').value;
  if (!p1 || p1.length < 8) { AUTH.error = 'Password must be at least 8 characters.'; render(); return; }
  if (p1 !== p2) { AUTH.error = "Passwords don't match."; render(); return; }
  // Clear the #access_token=...&type=invite fragment BEFORE calling updateUser, not after — the
  // onAuthStateChange handler re-checks location.hash on every event (including the USER_UPDATED
  // one this call triggers), and if that check still saw type=invite it would flip us straight
  // back to the set-password screen right after successfully setting it.
  history.replaceState(null, '', location.pathname);
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) { AUTH.error = error.message; render(); return; }
  AUTH.status = 'ready';
  render();
}
async function doLogout(){
  await sb.auth.signOut();
  teardownRealtimeSubscriptions();
  STATE.data = null; STATE.dataLoaded = false; STATE.profiles = []; STATE.currentProfileId = null;
  resetUI();
  // onAuthStateChange fires SIGNED_OUT and calls render() itself
}
// Lets anyone signed in replace their own password (e.g. the temporary one Ofek set manually via
// the Supabase dashboard for onboarding) — available in the sidebar for every role, not gated by
// any permission, since everyone needs to be able to do this for themselves.
function openChangePasswordModal(){
  openModal(`
    <div class="modal-back" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:420px">
        <h2>Change Password</h2>
        <div class="field"><label>New password</label><input type="password" id="cp-new1" autocomplete="new-password"></div>
        <div class="field" style="margin-top:11px"><label>Confirm new password</label><input type="password" id="cp-new2" autocomplete="new-password"></div>
        <div id="modal-error"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn primary" onclick="doChangePassword()">Save</button>
        </div>
      </div>
    </div>`);
}
async function doChangePassword(){
  const p1 = document.getElementById('cp-new1').value;
  const p2 = document.getElementById('cp-new2').value;
  if (!p1 || p1.length < 8) { modalError('Password must be at least 8 characters.'); return; }
  if (p1 !== p2) { modalError("Passwords don't match."); return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) { modalError(error.message); return; }
  closeModal();
  showToast('Password updated');
}

/* ── app shell ───────────────────────────────────────────────────────── */
// NAV is data-driven for plain single-target sections. Two spots need special handling because
// they don't map 1:1 to a single UI.tab value: the Tasks section is split into two sidebar links
// ("Ron's Tasks" / "My Tasks") that both render the *same* Tasks page pre-filtered to a board,
// and Equipment/Employees/Suppliers collapse into one "Resources" group that all point at the
// existing Reference page pre-selected to a tab — see goTasks()/goResources() and the custom
// blocks inside renderShell() below. Both stay gated by their original single permission flag
// (`tasks` / `reference`) so the permission model itself is untouched.
// navBlocks below is consumed positionally in renderShell (index 0..3) — keep this array's order and
// length in sync with that template if you add or remove a group.
const NAV = [
  { group:'Sales', items:[ {id:'crm', label:'CRM', icon:'◈'}, {id:'crmOverview', label:'Leads & Marketing', icon:'📊'} ] },
  { group:'Overview', items:[ {id:'overview', label:'Overview', icon:'◆'}, {id:'reminders', label:'Reminders', icon:'●'}, {id:'openItems', label:'Open Tasks', icon:'▣'} ] },
  { group:'Finance', items:[ {id:'jobs', label:'Jobs & Commissions', icon:'▤'}, {id:'finance', label:'Financial Summary', icon:'▦'}, {id:'bizPerformance', label:'Business Performance', icon:'📈'}, {id:'outstanding', label:'Outstanding', icon:'▧'} ] },
  { group:'System', items:[ {id:'settings', label:'Permissions & Settings', icon:'⚙'} ] },
];
function goTab(id){ UI.tab = id; UI.mobileNavOpen = false; render(); }
function goTasks(board){ UI.tab = 'tasks'; UI.tasks.board = board; UI.mobileNavOpen = false; render(); }
function goResources(tab){ UI.tab = 'reference'; UI.reference.tab = tab; UI.mobileNavOpen = false; render(); }
function toggleMobileNav(){ UI.mobileNavOpen = !UI.mobileNavOpen; render(); }
function toggleResourcesGroup(){ UI.resourcesOpen = !UI.resourcesOpen; render(); }
function toggleTechTasksGroup(){ UI.techTasksOpen = !UI.techTasksOpen; render(); }
// board model: 'ron' and 'mine' are the two fixed boards; any other string is that technician's
// own personal board (their name, e.g. 'Guy'). This function is the single source of truth for labels.
function taskBoardLabel(board){
  if (board==='ron') return "Ron's Tasks";
  if (board==='mine') return 'My Tasks';
  return `${board}'s Tasks`;
}
function activeTechnicianNames(data){ return data.employees.filter(e=>e.roles.includes('Technician') && e.status==='Active').map(e=>e.name); }

function navButtonHtml(id, label, icon, active, onClick, badge){
  return `<button onclick="${onClick}" onmouseover="if(!${active}) this.style.background='var(--sidebar-bg-hover)'" onmouseout="if(!${active}) this.style.background='none'" style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:6px;color:${active?'#fff':'var(--sidebar-ink-soft)'};font-size:13.3px;font-family:'Figtree',sans-serif;font-weight:${active?'700':'500'};border:none;box-shadow:${active?'inset 3px 0 0 var(--sidebar-accent)':'none'};background:${active?'var(--sidebar-bg-active)':'none'};text-align:start;width:100%;transition:background .1s">
    <span style="width:18px;text-align:center;flex:none;font-size:15px;opacity:${active?'1':'.75'};color:${active?'var(--sidebar-accent)':'inherit'}">${icon}</span><span>${esc(label)}</span>${badge||''}
  </button>`;
}

function renderShell(profile, data){
  const reminderCount = computeReminders(data).filter(it=>!it.isRead).length;
  // navBlocks: [Overview group, Finance group, System group], in NAV's declared order — Closings and
  // Management (built separately below, since they need custom per-item logic) are spliced in between.
  const navBlocks = NAV.map(g => {
    const visible = g.items.filter(it => canViewSection(profile, it.id));
    if (!visible.length) return '';
    const itemsHtml = visible.map(it => {
      const active = UI.tab===it.id;
      const badge = (it.id==='reminders' && reminderCount>0) ? `<span style="margin-inline-start:auto;background:var(--bad);color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:99px;min-width:16px;text-align:center">${reminderCount}</span>` : '';
      return navButtonHtml(it.id, it.label, it.icon, active, `goTab('${it.id}')`, badge);
    }).join('');
    return `<div><div class="nav-group-label">${esc(g.group)}</div>${itemsHtml}</div>`;
  });

  // "Closings" — inserted right after Overview since it's the frontline feed technicians post to.
  const closingsHtml = canViewSection(profile,'closings')
    ? `<div><div class="nav-group-label">Field</div>${navButtonHtml('closings','Closings','🧾', UI.tab==='closings', "goTab('closings')")}</div>`
    : '';

  // "Management" group: task boards (split from one Tasks link, same `tasks` permission), Quotes, and the
  // collapsible Resources group (Equipment / Employees / Suppliers, same `reference` permission).
  // Task board nav depends on role, not just the `tasks` flag: a technician gets exactly ONE link — their
  // own personal board — never Ron's, never Mine, never another technician's. Owner/Manager/VA instead
  // get Ron's Tasks + My Tasks (the owner's own board) + a collapsible group with every active
  // technician's board listed separately, mirroring the Resources group's pattern.
  const mgmtItems = [];

    if (profile.role==='technician') {

  if (canViewSection(profile,'quotes')) mgmtItems.push(navButtonHtml('quotes', 'Quotes', '✎', UI.tab==='quotes', "goTab('quotes')"));
  if (canViewSection(profile,'reference')) {

        <span style="display:flex;align-items:center;gap:10px"><span style="width:18px;text-align:center;flex:none;font-size:15px">▥</span><span>Resources</span></span>
        <span style="font-size:10px;color:var(--sidebar-ink-faint)">${open?'▾':'▸'}</span>
      </button>
      ${open ? `<div style="padding-inline-start:16px">${subItems}</div>` : ''}
    </div>`);
